<title>Proctor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap">
<style>
/* Proctor -----------------------------------------------------------------
   Committed dark instrument bench. One palette, painted explicitly, so the
   page holds on either host ground.
   Chivo = chrome (operating) / Literata = stems (reading) / Plex Mono = data
   ------------------------------------------------------------------------ */
:root{
  --ground:#12141A; --panel:#191C24; --raised:#20242E; --sunken:#0E1015;
  --line:#2B303B; --line-2:#3A4152;
  --ink:#E9EAEE; --ink-2:#B7BDC9; --muted:#8B929F; --faint:#646B79;
  --brass:#E3A94F; --brass-2:#F0C079; --brass-dim:#7E5C22; --brass-wash:#241D10;
  --jade:#5DBE96; --jade-wash:#122A20; --jade-line:#255744;
  --clay:#E0706A; --clay-wash:#2B1716; --clay-line:#5C2C29;
  --flag:#84AADB; --flag-wash:#151F2C; --flag-line:#2C425E;
  --r:4px; --r-lg:8px;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 28px rgba(0,0,0,.38);
  --ui:"Chivo","Helvetica Neue",Arial,sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif;
  --data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--ui); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:600; text-wrap:balance; letter-spacing:-.01em}
p{margin:0}
a{color:var(--brass); text-decoration:none; border-bottom:1px solid var(--brass-dim)}
a:hover{color:var(--brass-2); border-bottom-color:var(--brass)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px; border-radius:2px}
::selection{background:var(--brass-dim); color:#fff}
[hidden]{display:none !important}

/* typographic roles */
.mono{font-family:var(--data); font-variant-numeric:tabular-nums}
.read{font-family:var(--read); line-height:1.62}
.eyebrow{font-family:var(--data); font-size:10.5px; font-weight:500;
  letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}
.muted{color:var(--muted)}
.dim{color:var(--faint)}
.nowrap{white-space:nowrap}

/* shell */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:20px;
  padding:0 22px; height:56px;
  background:rgba(18,20,26,.93); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; flex:none}
.brand .mark{
  width:22px; height:22px; border-radius:3px; flex:none; position:relative;
  background:linear-gradient(150deg,var(--brass-2),var(--brass-dim));
  box-shadow:0 0 0 1px rgba(227,169,79,.35), 0 0 14px rgba(227,169,79,.22);
}
.brand .mark::after{
  content:""; position:absolute; inset:6px 6px auto 6px; height:2px;
  background:var(--sunken); box-shadow:0 5px 0 var(--sunken);
}
.brand b{font-size:16px; font-weight:700; letter-spacing:.02em}
.nav{display:flex; gap:2px; flex:1 1 auto; min-width:0; overflow-x:auto; scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  background:none; border:0; padding:7px 12px; border-radius:var(--r);
  color:var(--muted); font-size:13.5px; font-weight:500; cursor:pointer; white-space:nowrap;
}
.nav button:hover{color:var(--ink); background:var(--raised)}
.nav button[aria-current="true"]{color:var(--brass); background:var(--brass-wash)}
.topbar .right{display:flex; align-items:center; gap:10px; flex:none}

.wrap{max-width:1180px; margin:0 auto; padding:30px 22px 90px}
.wrap.narrow{max-width:940px}
.stack{display:flex; flex-direction:column; gap:26px}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{flex:1 1 auto}

.pagehead{display:flex; flex-direction:column; gap:7px}
.pagehead h1{font-size:27px}
.pagehead p{max-width:66ch; color:var(--ink-2); font-size:14.5px}

/* surfaces */
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px}
.card.flush{padding:0; overflow:hidden}
.sect{display:flex; flex-direction:column; gap:14px}
.sect > h2{font-size:15px; display:flex; align-items:center; gap:10px}
.sect > h2::after{content:""; flex:1 1 auto; height:1px; background:var(--line)}
hr.rule{border:0; border-top:1px solid var(--line); margin:0}

/* controls */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:9px 16px; border-radius:var(--r); cursor:pointer;
  background:var(--raised); border:1px solid var(--line-2); color:var(--ink);
  font-size:13.5px; font-weight:500; white-space:nowrap;
  transition:background .12s ease, border-color .12s ease, color .12s ease;
}
.btn:hover:not(:disabled){background:#2A2F3B; border-color:#4A5265}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.primary{
  background:linear-gradient(180deg,var(--brass-2),var(--brass));
  border-color:var(--brass-dim); color:#20180A; font-weight:600;
}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#F6CE8E,var(--brass-2))}
.btn.ghost{background:transparent; border-color:var(--line)}
.btn.ghost:hover:not(:disabled){background:var(--raised)}
.btn.danger{color:var(--clay); border-color:var(--clay-line)}
.btn.danger:hover:not(:disabled){background:var(--clay-wash); border-color:var(--clay)}
.btn.sm{padding:5px 10px; font-size:12.5px}
.btn.lg{padding:12px 24px; font-size:15px}

.field{display:flex; flex-direction:column; gap:7px}
.field > label{font-family:var(--data); font-size:10.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--faint)}
input[type=text],input[type=number],select,textarea{
  background:var(--sunken); border:1px solid var(--line-2); border-radius:var(--r);
  padding:9px 11px; width:100%; font-size:14px;
}
input[type=number]{font-family:var(--data)}
input[type=range]{width:100%; accent-color:var(--brass)}
select{cursor:pointer}

.seg{display:inline-flex; background:var(--sunken); border:1px solid var(--line-2);
  border-radius:var(--r); padding:2px; gap:2px}
.seg button{background:none; border:0; padding:7px 14px; border-radius:3px; cursor:pointer;
  color:var(--muted); font-size:13px; font-weight:500}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--brass-wash); color:var(--brass);
  box-shadow:inset 0 0 0 1px var(--brass-dim)}

.check{
  display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
  padding:6px 11px; border:1px solid var(--line-2); border-radius:var(--r);
  background:var(--sunken); font-size:13px; color:var(--ink-2);
}
.check:hover{border-color:#4A5265; color:var(--ink)}
.check input{accent-color:var(--brass); margin:0; width:14px; height:14px}
.check.on{border-color:var(--brass-dim); background:var(--brass-wash); color:var(--brass-2)}
.check .n{font-family:var(--data); font-size:11px; color:var(--faint)}
.check.on .n{color:var(--brass-dim)}

/* chips */
.chip{
  font-family:var(--data); font-size:10.5px; font-weight:500; letter-spacing:.06em;
  padding:3px 7px; border-radius:3px; background:var(--raised);
  border:1px solid var(--line-2); color:var(--ink-2); white-space:nowrap;
}
.chip.brass{background:var(--brass-wash); border-color:var(--brass-dim); color:var(--brass)}
.chip.jade{background:var(--jade-wash); border-color:var(--jade-line); color:var(--jade)}
.chip.clay{background:var(--clay-wash); border-color:var(--clay-line); color:var(--clay)}
.chip.flagc{background:var(--flag-wash); border-color:var(--flag-line); color:var(--flag)}
.diff{display:inline-flex; align-items:center; gap:5px; font-family:var(--data);
  font-size:10.5px; color:var(--muted)}
.diff i{display:block; width:4px; height:10px; background:var(--line-2); border-radius:1px}
.diff i.on{background:var(--brass)}

/* library */
.packs{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:16px}
.pack{display:flex; flex-direction:column; gap:13px; padding:18px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg)}
.pack[data-on="0"]{opacity:.5}
.pack h3{font-size:16px}
.pack .desc{font-size:13px; color:var(--muted); line-height:1.55}
.pack .nums{display:flex; gap:18px; padding-top:2px; flex-wrap:wrap}
.pack .nums div{display:flex; flex-direction:column; gap:1px}
.pack .nums b{font-family:var(--data); font-size:19px; font-weight:600; color:var(--ink)}
.pack .nums span{font-family:var(--data); font-size:9.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint)}
.note{
  font-size:12.5px; line-height:1.5; color:var(--brass-2);
  background:var(--brass-wash); border-left:2px solid var(--brass-dim);
  padding:9px 11px; border-radius:0 var(--r) var(--r) 0;
}
.dz{border:1px dashed var(--line-2); border-radius:var(--r-lg); padding:26px;
  text-align:center; background:var(--panel); transition:border-color .15s, background .15s}
.dz.hot{border-color:var(--brass); background:var(--brass-wash)}
.dz h3{font-size:15px; margin-bottom:6px}

/* setup */
.grid2{display:grid; grid-template-columns:1fr 336px; gap:22px; align-items:start}
.sticky{position:sticky; top:80px}
.mixline{display:flex; height:8px; border-radius:99px; overflow:hidden;
  background:var(--sunken); border:1px solid var(--line)}
.mixline i{display:block; height:100%}

/* exam runner */
.runner{display:grid; grid-template-columns:236px 1fr; gap:26px; align-items:start}
.rail{position:sticky; top:78px; display:flex; flex-direction:column; gap:16px}
.clock{display:flex; flex-direction:column; gap:3px; padding:13px 15px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg)}
.clock b{font-family:var(--data); font-size:29px; font-weight:600; line-height:1.1}
.clock.warn b{color:var(--brass)}
.clock.crit b{color:var(--clay)}
.meter{height:3px; background:var(--sunken); border-radius:99px; overflow:hidden; margin-top:8px}
.meter i{display:block; height:100%; background:var(--brass); transition:width .4s ease}
.sheet{display:grid; grid-template-columns:repeat(6,1fr); gap:5px}
.sheet button{
  aspect-ratio:1; border-radius:3px; cursor:pointer; position:relative;
  background:var(--sunken); border:1px solid var(--line);
  color:var(--faint); font-family:var(--data); font-size:11px; font-weight:500;
}
.sheet button:hover{border-color:var(--line-2); color:var(--ink-2)}
.sheet button[data-s="answered"]{background:var(--raised); border-color:var(--line-2); color:var(--ink)}
.sheet button[data-s="correct"]{background:var(--jade-wash); border-color:var(--jade-line); color:var(--jade)}
.sheet button[data-s="wrong"]{background:var(--clay-wash); border-color:var(--clay-line); color:var(--clay)}
.sheet button[data-f="1"]::after{
  content:""; position:absolute; top:-1px; right:-1px; width:0; height:0;
  border-top:7px solid var(--flag); border-left:7px solid transparent; border-radius:0 3px 0 0;
}
.sheet button[aria-current="true"]{box-shadow:0 0 0 2px var(--brass); border-color:var(--brass)}
.legend{display:flex; flex-direction:column; gap:5px}
.legend span{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--faint)}
.legend i{width:9px; height:9px; border-radius:2px; border:1px solid var(--line-2);
  background:var(--sunken); flex:none}

.qcard{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden}
.qhead{display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  padding:13px 20px; background:var(--raised); border-bottom:1px solid var(--line)}
.qhead .idx{font-family:var(--data); font-size:12px; font-weight:600; color:var(--brass)}
.qbody{padding:22px 24px; display:flex; flex-direction:column; gap:18px}
.stem{font-family:var(--read); font-size:16.5px; line-height:1.62; max-width:70ch; color:var(--ink)}
.instr{font-family:var(--data); font-size:11px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--brass); margin-top:-8px}
.opts{display:flex; flex-direction:column; gap:9px}
.opt{
  display:flex; gap:13px; align-items:flex-start; width:100%; text-align:left;
  padding:13px 15px; border-radius:var(--r); cursor:pointer;
  background:var(--sunken); border:1px solid var(--line);
  transition:border-color .12s ease, background .12s ease;
}
.opt:hover:not(:disabled){border-color:var(--line-2); background:#171A21}
.opt .k{flex:none; width:23px; height:23px; border-radius:3px; display:grid; place-items:center;
  border:1px solid var(--line-2); background:var(--panel);
  font-family:var(--data); font-size:11.5px; font-weight:600; color:var(--muted)}
.opt .t{font-family:var(--read); font-size:14.5px; line-height:1.55; color:var(--ink-2); padding-top:1px}
.opt[data-sel="1"]{border-color:var(--brass-dim); background:var(--brass-wash)}
.opt[data-sel="1"] .k{background:var(--brass); border-color:var(--brass); color:#20180A}
.opt[data-sel="1"] .t{color:var(--ink)}
.opt[data-v="key"]{border-color:var(--jade-line); background:var(--jade-wash)}
.opt[data-v="key"] .k{background:var(--jade); border-color:var(--jade); color:#0C1F17}
.opt[data-v="key"] .t{color:var(--ink)}
.opt[data-v="miss"]{border-color:var(--clay-line); background:var(--clay-wash)}
.opt[data-v="miss"] .k{background:var(--clay); border-color:var(--clay); color:#2B0F0E}
.opt[data-v="miss"] .t{color:var(--ink)}
.opt:disabled{cursor:default}
.opt .why{font-family:var(--read); font-size:13px; line-height:1.55; color:var(--muted);
  margin-top:7px; padding-left:11px; border-left:1px solid var(--line-2)}

/* feedback */
.fb{display:flex; flex-direction:column; gap:14px; padding:18px 20px;
  border-radius:var(--r); border:1px solid var(--line); background:var(--sunken)}
.fb.ok{border-color:var(--jade-line)}
.fb.no{border-color:var(--clay-line)}
.fb .verdict{display:flex; align-items:center; gap:9px; font-size:14px; font-weight:600}
.fb.ok .verdict{color:var(--jade)}
.fb.no .verdict{color:var(--clay)}
.fb .body{font-family:var(--read); font-size:14px; line-height:1.65; color:var(--ink-2); max-width:72ch}
.srcs{display:flex; flex-direction:column; gap:6px}
.srcs a{font-size:12.5px; border:0; color:var(--ink-2); display:flex; gap:8px; align-items:baseline}
.srcs a:hover{color:var(--brass)}
.srcs a .d{font-family:var(--data); font-size:10.5px; color:var(--faint); flex:none}

.qfoot{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:14px 20px; background:var(--raised); border-top:1px solid var(--line)}

/* results */
.scorewrap{display:grid; grid-template-columns:308px 1fr; gap:34px; align-items:center}
.dial{width:308px; height:196px; display:block}
.dial .track{fill:none; stroke:var(--sunken); stroke-width:15; stroke-linecap:round}
.dial .fill{fill:none; stroke-width:15; stroke-linecap:round;
  transition:stroke-dashoffset 1.1s cubic-bezier(.22,.7,.25,1)}
.dial .notch{stroke:var(--ink); stroke-width:2}
.dial .tick{stroke:var(--line-2); stroke-width:1}
.dial text{font-family:var(--data); fill:var(--faint); font-size:9px; letter-spacing:.08em}
.verdictbox{display:flex; flex-direction:column; gap:13px}
.verdictbox .big{font-family:var(--data); font-size:50px; font-weight:600; line-height:1; letter-spacing:-.02em}
.verdictbox .stamp{align-self:flex-start; font-family:var(--data); font-size:12px; font-weight:600;
  letter-spacing:.18em; text-transform:uppercase; padding:6px 14px; border-radius:3px}
.stamp.pass{color:var(--jade); border:1px solid var(--jade-line); background:var(--jade-wash)}
.stamp.fail{color:var(--clay); border:1px solid var(--clay-line); background:var(--clay-wash)}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(126px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden}
.kpi{background:var(--panel); padding:14px 16px; display:flex; flex-direction:column; gap:3px}
.kpi b{font-family:var(--data); font-size:22px; font-weight:600}
.kpi span{font-family:var(--data); font-size:9.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint)}

.bars{display:flex; flex-direction:column; gap:12px}
.bar{display:grid; grid-template-columns:1fr 66px; gap:13px; align-items:center}
.bar .lab{display:flex; flex-direction:column; gap:6px; min-width:0}
.bar .lab .t{display:flex; align-items:center; gap:8px; font-size:13px; min-width:0}
.bar .lab .t em{font-style:normal; color:var(--ink-2); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.bar .track{height:7px; background:var(--sunken); border-radius:99px; overflow:hidden;
  position:relative; border:1px solid var(--line)}
.bar .track i{display:block; height:100%; border-radius:99px;
  transition:width .8s cubic-bezier(.22,.7,.25,1)}
.bar .cut{position:absolute; top:0; bottom:0; width:1px; background:var(--line-2)}
.bar .val{font-family:var(--data); font-size:13px; text-align:right; color:var(--ink-2)}

.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
.tbl th{text-align:left; padding:9px 14px; font-family:var(--data); font-size:10px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--faint);
  border-bottom:1px solid var(--line); font-weight:500; white-space:nowrap}
.tbl td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--raised)}
.tbl td.num{font-family:var(--data); text-align:right; white-space:nowrap}
.scroll{overflow-x:auto}

.trend{width:100%; height:136px; display:block}
.trend .gl{stroke:var(--line); stroke-width:1}
.trend .cutline{stroke:var(--brass-dim); stroke-width:1; stroke-dasharray:3 3}
.trend .ln{fill:none; stroke:var(--brass); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.trend .ar{fill:url(#tg); stroke:none}
.trend .dot{fill:var(--ground); stroke:var(--brass); stroke-width:2}
.trend .dot.last{fill:var(--brass)}
.trend text{font-family:var(--data); fill:var(--faint); font-size:9px}

.empty{padding:46px 22px; text-align:center; color:var(--muted);
  display:flex; flex-direction:column; gap:9px; align-items:center}
.empty b{color:var(--ink-2); font-size:15px}

.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  background:var(--raised); border:1px solid var(--line-2); border-radius:var(--r);
  padding:11px 18px; font-size:13.5px; box-shadow:var(--shadow); z-index:80;
  max-width:min(560px,90vw)}
.toast.bad{border-color:var(--clay-line); color:var(--clay)}
.toast.good{border-color:var(--jade-line); color:var(--jade)}

.modal{position:fixed; inset:0; z-index:70; display:grid; place-items:center;
  background:rgba(8,9,12,.74); padding:22px}
.modal .box{background:var(--panel); border:1px solid var(--line-2); border-radius:var(--r-lg);
  padding:24px; max-width:470px; width:100%; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:15px}

kbd{font-family:var(--data); font-size:10.5px; padding:1px 5px; border-radius:3px;
  background:var(--sunken); border:1px solid var(--line-2); border-bottom-width:2px; color:var(--muted)}

.revitem{border:1px solid var(--line); border-radius:var(--r-lg); background:var(--panel); overflow:hidden}
.revitem > summary{
  display:flex; align-items:center; gap:10px; padding:12px 16px; cursor:pointer;
  list-style:none; background:var(--raised); flex-wrap:wrap;
}
.revitem > summary::-webkit-details-marker{display:none}
.revitem > summary:hover{background:#252A35}
.revitem[open] > summary{border-bottom:1px solid var(--line)}
.revitem .stemline{font-family:var(--read); font-size:13.5px; color:var(--ink-2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1 1 220px; min-width:0}

@media (max-width:900px){
  .grid2,.runner,.scorewrap{grid-template-columns:1fr}
  .rail,.sticky{position:static}
  .sheet{grid-template-columns:repeat(10,1fr)}
  .dial{width:100%; max-width:308px; margin:0 auto}
  .wrap{padding:22px 16px 80px}
  .qbody{padding:18px 16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important}

var BUNDLED = [{"format":"exam-pack","version":1,"id":"ccao-f-core","name":"CCAO-F Core Bank","vendor":"Anthropic","examCode":"CCAO-F","description":"210 blueprint-weighted items written against the published CCAO-F exam guide and public Anthropic documentation. Item counts match the blueprint weights to within 0.2 points; all 30 objectives covered.","config":{"examLength":60,"timeLimitMinutes":120,"passPercent":72,"scaleMin":100,"scaleMax":1000,"scalePass":720,"blueprintWeighted":true},"domains":[{"id":"D1","name":"Prompting & Task Execution","weight":14},{"id":"D2","name":"Output Evaluation & Validation","weight":21},{"id":"D3","name":"Product & Model Selection","weight":12},{"id":"D4","name":"Workflow Integration & Solution Design","weight":16},{"id":"D5","name":"Configuration & Knowledge Management","weight":12},{"id":"D6","name":"Governance, Risk & Responsible Use","weight":15},{"id":"D7","name":"Troubleshooting & Optimization","weight":10}],"items":[{"id":"D1-001","domain":"D1","objective":"Create effective prompts for business and technical tasks","type":"single","difficulty":"easy","scenario":false,"stem":"Anthropic's prompting guidance states a \"golden rule of clear prompting\" that candidates can apply to any business prompt. What is it?","options":[{"key":"A","text":"Keep every prompt under 200 words, on the basis that a shorter instruction is easier for the model to hold in focus."},{"key":"B","text":"State every constraint as a prohibition, so that the model has an explicit list of the behaviours it must avoid."},{"key":"C","text":"Show the prompt to a colleague with minimal context on the task; if they would be confused, Claude will be too."},{"key":"D","text":"Include at least ten worked examples, so that the model can infer the pattern without being given any instructions."}],"correct":["C"],"explanation":"Anthropic's prompting best practices state the golden rule as showing the prompt to a colleague with minimal context and asking them to follow it: if they would be confused, Claude will be too. The same page frames Claude as a brilliant but new employee who lacks context on your norms and workflows, which is why the colleague test works.","rationales":{"A":"No word ceiling is prescribed. The guidance is to be as precise as the task needs, not to hit an arbitrary length limit.","B":"The documented lever is the opposite: tell Claude what to do rather than what not to do. Prohibition-only phrasing is listed as a weaker way to control output.","D":"The documented count for examples is 3-5, and the quality criteria matter more than volume. Ten-plus examples is a stated near-miss, not the golden rule."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["golden-rule","clarity","prompt-structure"]},{"id":"D1-002","domain":"D1","objective":"Create effective prompts for business and technical tasks","type":"single","difficulty":"easy","scenario":true,"stem":"A recruiter wants Claude to draft candidate feedback notes in a consistent in-house format, and plans to paste in some worked examples alongside the instruction. How should she assemble those examples?","options":[{"key":"A","text":"Include a single flawless example, on the assumption that any further examples would only dilute the pattern."},{"key":"B","text":"Include at least ten near-identical examples, so that the pattern she wants cannot possibly be misread."},{"key":"C","text":"Include the examples only after the question, and never before the instructions themselves."},{"key":"D","text":"Include 3-5 examples that are relevant, diverse, and wrapped in example tags."}],"correct":["D"],"explanation":"Anthropic prescribes a specific count and three quality criteria: include 3-5 examples for best results, and make each one relevant (it mirrors the actual use case), diverse (it covers edge cases and varies enough that Claude does not pick up unintended patterns), and structured (wrapped in example tags, with multiple examples inside an examples tag).","rationales":{"A":"One example under-specifies the task and cannot cover edge cases. The documented range starts at three.","B":"This fails both the count and the diversity criterion. Near-identical examples are exactly what causes Claude to pick up unintended patterns.","C":"Ordering guidance concerns long documents (data near the top, query at the end), not examples. No rule forbids examples before instructions."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["few-shot","multishot","examples","xml-tags"]},{"id":"D1-003","domain":"D1","objective":"Create effective prompts for business and technical tasks","type":"single","difficulty":"medium","scenario":true,"stem":"A procurement officer at a housing association pastes three vendor contracts totalling roughly 40,000 tokens into a single prompt and asks Claude to compare their termination clauses. The answers keep drifting to irrelevant sections. How should the prompt be restructured?","options":[{"key":"A","text":"Place the comparison question first, so that Claude knows what to look for before it starts reading the contracts."},{"key":"B","text":"Place all three contracts near the top of the prompt and put the comparison question at the end."},{"key":"C","text":"Split the contracts across 20 small chats, so that no single prompt ever exceeds a few thousand tokens."},{"key":"D","text":"Wrap the entire prompt in one instructions tag, so that Claude treats the whole thing as a single unit."}],"correct":["B"],"explanation":"For inputs of roughly 20,000 tokens or more, Anthropic's documented ordering is long documents and data near the top of the prompt, above the query, instructions and examples. Anthropic notes that queries placed at the end can improve response quality by up to 30 percent in tests, especially with complex, multidocument inputs.","rationales":{"A":"This is the exact inversion of the documented rule and is a named exam trap. Question-first ordering is what the up-to-30-percent finding argues against at this input size.","C":"Fragmenting the corpus destroys the cross-document comparison the analyst needs and is not the documented remedy for drift in long-context prompts.","D":"Anthropic's XML guidance is to wrap each type of content in its own descriptive tag, nesting each document inside its own document tag. Collapsing everything into one tag removes those distinctions and does nothing about ordering."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["long-context","query-at-the-end","document-ordering","analysis"]},{"id":"D1-004","domain":"D1","objective":"Adapt prompting strategies based on task type (analysis, research, drafting, brainstorming)","type":"single","difficulty":"medium","scenario":true,"stem":"An HR partner drafting policy notices keeps receiving bulleted markdown when the house standard for these notices is continuous prose. Their current instruction reads: \"Do not use markdown. Never use bullet points. Avoid headings.\" Which revision is most likely to fix it?","options":[{"key":"A","text":"\"Do not use markdown under any circumstances, and never use bullet points or headings anywhere in the notice.\""},{"key":"B","text":"\"Convert your bulleted draft into continuous prose before you show any of it to me.\""},{"key":"C","text":"\"Compose your response as smoothly flowing prose paragraphs.\""},{"key":"D","text":"\"Follow the house style guide for policy notices, which is published on our intranet.\""}],"correct":["C"],"explanation":"Anthropic lists four output-format levers in order of effectiveness, and the first is to tell Claude what to do instead of what not to do, using precisely this prose-paragraph example. The same show-do-not-forbid principle is repeated in the Claude Opus 5 guidance, which notes that positive examples of the communication style you want tend to be more effective than instructions about what not to do.","rationales":{"A":"This only intensifies the prohibition framing that is already failing. Restating a negative more forcefully is the documented weaker lever.","B":"A post-hoc conversion step treats each output individually and still leaves the model generating the wrong format first. The documented lever steers the format from the outset.","D":"Claude is described as a brilliant but new employee who lacks context on your norms; it cannot read an intranet page it has not been given, so the format still has to be stated in the prompt."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"},{"title":"Prompting Claude Opus 5 - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5","date":"2026-08-19","basis":"verified-live"}],"tags":["output-format","positive-framing","drafting","task-type"]},{"id":"D1-005","domain":"D1","objective":"Create effective prompts for business and technical tasks","type":"single","difficulty":"easy","scenario":false,"stem":"Anthropic recommends supplying motivation alongside an instruction, for example writing \"Your response will be read aloud by a text-to-speech engine, so never use ellipses since the engine will not know how to pronounce them\" rather than simply \"NEVER use ellipses.\" What is the stated rationale?","options":[{"key":"A","text":"Longer instructions consume more of the context window, which makes the constraint harder for the model to lose track of."},{"key":"B","text":"Claude generalises from the explanation to related situations the instruction did not name."},{"key":"C","text":"Explanations satisfy a policy requirement that every constraint given to the model be justified in writing."},{"key":"D","text":"The explanation removes any need to state success criteria for the task, since the intent has already been conveyed."}],"correct":["B"],"explanation":"Anthropic's stated rationale for explaining the why behind an instruction is that Claude is smart enough to generalize from the explanation, applying the underlying intent to cases the literal rule did not enumerate. This is presented as a general prompting practice, not a formatting-only trick.","rationales":{"A":"Length is not the mechanism. Padding a prompt does not improve adherence; the explanation works because it conveys intent.","C":"There is no such policy requirement. The recommendation is a quality technique, not a compliance rule.","D":"Success criteria remain a documented prerequisite for prompt engineering. Explaining a constraint does not substitute for defining what a good output looks like."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["motivation","instruction-design","generalisation"]},{"id":"D1-006","domain":"D1","objective":"Create effective prompts for business and technical tasks","type":"multi","difficulty":"medium","scenario":true,"stem":"A programme officer at an education charity is using Claude Opus 5 and sends a prompt that reads in full: \"Summarise this and make it good.\" The summary is generic and misses the funder's priorities. Which TWO revisions are most likely to fix it? (Select TWO.)","options":[{"key":"A","text":"Append \"double-check your work and include a final verification step\" to the end of the prompt."},{"key":"B","text":"Wrap the source material in XML tags and change nothing else at all about the request."},{"key":"C","text":"Supply the background as though instructing someone with no prior knowledge of the funder or the deliverable."},{"key":"D","text":"Repeat the phrase \"make it good\" three times, so as to reinforce the quality expectation."},{"key":"E","text":"State positively what the summary should contain and how it should be structured for the audience."},{"key":"F","text":"Cut the prompt down to a single short sentence, so that Claude is not distracted by any detail."}],"correct":["C","E"],"explanation":"Anthropic's help centre lists including as much context as possible, pretending you are instructing someone with no background knowledge, as a primary remedy for a weak answer, and the best-practices page makes stating what to do (rather than a vague quality wish) the leading output-control lever. Together these turn an under-specified request into a directed one.","rationales":{"A":"Claude Opus 5 verifies its own work without being told to. Anthropic documents that explicit verification instructions cause over-verification on this model and should be removed rather than added.","B":"XML tags help Claude parse a prompt that mixes instructions, context, examples and inputs, but tagging alone supplies none of the missing background and defines none of the criteria.","D":"Repetition adds no information. The problem is missing context and undefined criteria, not insufficient emphasis.","F":"The documented remedy for a weak answer is more context, not less: the help centre tells you to include as much context as possible."},"sources":[{"title":"My prompt isn't giving me a helpful answer | Claude Help Center","url":"https://support.claude.com/en/articles/7996857-my-prompt-isn-t-giving-me-a-helpful-answer","date":"2026-03-16","basis":"published"},{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"},{"title":"Prompting Claude Opus 5 - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5","date":"2026-08-19","basis":"verified-live"}],"tags":["context","specificity","vague-prompts","multiple-response"]},{"id":"D1-007","domain":"D1","objective":"Create effective prompts for business and technical tasks","type":"single","difficulty":"medium","scenario":true,"stem":"A bid writer's prompt runs background notes, three sample paragraphs, the actual request and a block of pasted client requirements together as continuous text. Claude keeps treating the sample paragraphs as instructions. What should the bid writer change?","options":[{"key":"A","text":"Delete the sample paragraphs, on the basis that mixing examples with instructions is unsupported in a single prompt."},{"key":"B","text":"Convert the whole prompt into a single numbered list, so that every element becomes an explicit step to perform."},{"key":"C","text":"Move the request to the very start of the prompt, so that it is read before any of the other material."},{"key":"D","text":"Wrap each kind of content in its own descriptive XML tag, nesting tags where the content has a natural hierarchy."}],"correct":["D"],"explanation":"Anthropic documents that XML tags help Claude parse complex prompts unambiguously, especially when a prompt mixes instructions, context, examples and variable inputs, and that wrapping each type of content in its own tag reduces misinterpretation. The stated best practices are consistent, descriptive tag names and nesting when content has a natural hierarchy. Examples specifically belong in example tags, with multiple examples inside an examples tag.","rationales":{"A":"Examples are one of the most reliable ways to steer output format, tone and structure. The documented fix is to mark them as examples, not to remove them.","B":"Numbered sequential steps are documented for when the order or completeness of steps matters. They do not tell Claude which block is background, which is an example and which is the request.","C":"For inputs of about 20,000 tokens or more the documented ordering is the opposite, long data first and the query last, and in any case ordering alone does not label the content types."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["xml-tags","prompt-structure","mixed-content"]},{"id":"D1-008","domain":"D1","objective":"Create effective prompts for business and technical tasks","type":"single","difficulty":"medium","scenario":true,"stem":"A freelance copywriter supports two clients with conflicting terminology and tone rules. She wants Claude to apply one client's glossary and voice when she is working on that client's deliverables, and not on the other's. Which personalisation layer fits the requirement?","options":[{"key":"A","text":"Account-wide instructions for Claude, which apply across every conversation on her account."},{"key":"B","text":"A one-off note pasted at the top of each conversation, added as and when she remembers to do it."},{"key":"C","text":"Project instructions attached to a project created for that client engagement."},{"key":"D","text":"A skill enabled during those chats, on the assumption that a skill carries the client's glossary."}],"correct":["C"],"explanation":"Claude's personalisation layers differ by scope: instructions set at account level are described as account-wide settings that apply to all of your conversations, while project instructions apply only to chats within that project. Scoping a client glossary and voice to a single engagement is exactly what project instructions are for.","rationales":{"A":"Account-level instructions apply to all of her conversations, so the first client's rules would leak into the second client's work. This is the classic scope near-miss.","B":"Manual re-pasting is not a personalisation feature at all, and it fails on any conversation she forgets.","D":"The help centre describes skills as behaviours or expertise you activate on demand, not as a boundary tied to one engagement; project instructions are the layer documented as applying only to chats within that project."},"sources":[{"title":"Understanding Claude's personalization features | Claude Help Center","url":"https://support.claude.com/en/articles/10185728-understanding-claude-s-personalization-features","date":"2026-08-19","basis":"published"}],"tags":["projects","account-instructions","scope","personalisation"]},{"id":"D1-009","domain":"D1","objective":"Create effective prompts for business and technical tasks","type":"single","difficulty":"easy","scenario":true,"stem":"A membership officer types \"Create a campaign dashboard\" and gets a bare, minimal result. What should he change to get a more ambitious one?","options":[{"key":"A","text":"Explicitly request the above-and-beyond behaviour, for example asking for as many relevant features and interactions as possible."},{"key":"B","text":"Rely on the model to infer the level of ambition from context, since current models no longer need such modifiers."},{"key":"C","text":"Send the same request again in a second message, repeating it until the output grows in scope."},{"key":"D","text":"Ask for a minimal version first and then build it up over several turns, on the basis that a fully featured result cannot come from a single pass."}],"correct":["A"],"explanation":"Anthropic states that if you want above-and-beyond behaviour you should explicitly request it rather than relying on the model to infer it from vague prompts, and gives exactly this worked example: instead of \"Create an analytics dashboard\", use \"Create an analytics dashboard. Include as many relevant features and interactions as possible. Go beyond the basics to create a fully-featured implementation.\" Framing instructions with such modifiers is also listed under migration considerations.","rationales":{"B":"The documented position is the opposite: ambition still has to be stated, and adding modifiers that encourage higher quality and detail is a named technique.","C":"Repetition supplies no new information about what a fuller result should contain.","D":"Anthropic's own example asks for a fully featured implementation in a single prompt, so no minimal-first ceiling is documented."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["clarity","modifiers","above-and-beyond"]},{"id":"D1-010","domain":"D1","objective":"Apply task decomposition techniques to structure complex requests","type":"single","difficulty":"medium","scenario":true,"stem":"An information governance officer at an NHS trust asks Claude to identify data-retention obligations across a 200-page regulatory bundle. The answers mix in unrelated sections and she cannot tell which passages drove each conclusion. Which decomposition step should she add?","options":[{"key":"A","text":"Ask Claude to summarise the whole bundle to one page first, and then answer the question from that summary."},{"key":"B","text":"Ask Claude to wrap each document in document and document_content tags, then ask exactly the same question again."},{"key":"C","text":"Ask Claude to re-read the bundle twice and report only the obligations that appear in both of its passes."},{"key":"D","text":"Ask Claude to first extract every relevant passage into quote tags, then perform the analysis on those quotes."}],"correct":["D"],"explanation":"Anthropic recommends grounding responses in quotes for long-document tasks: ask Claude to quote the relevant parts of the documents first, before carrying out its task, which helps it focus on the relevant content and ignore the rest of the document. It also gives the analyst a traceable link from conclusion back to source text.","rationales":{"A":"Summarising first discards the specific clause language the analysis depends on and adds a lossy step before the real task.","B":"Document and metadata tagging is documented for multidocument inputs, but on its own it neither focuses Claude on the relevant passages nor produces the traceable link she needs. Quote grounding is the step that does.","C":"Repeat passes are not a documented technique and simply consume more tokens without focusing the model on the relevant content."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["quote-grounding","long-document","decomposition"]},{"id":"D1-011","domain":"D1","objective":"Apply task decomposition techniques to structure complex requests","type":"multi","difficulty":"easy","scenario":false,"stem":"Anthropic notes that with adaptive thinking and subagent orchestration Claude handles most multistep reasoning internally, so splitting a task into explicitly chained steps that you run one after another is no longer required for every complex request. In which TWO situations does Anthropic still document explicit chaining as useful? (Select TWO.)","options":[{"key":"A","text":"When the request runs to more than one sentence."},{"key":"B","text":"When you need to inspect the intermediate output of each step."},{"key":"C","text":"When the desired output must be formatted as prose."},{"key":"D","text":"When you need to enforce a specific pipeline structure."},{"key":"E","text":"When the response would otherwise run longer than a page."}],"correct":["B","D"],"explanation":"Anthropic states that with adaptive thinking and subagent orchestration Claude handles most multistep reasoning internally, and that explicit prompt chaining is still useful when you need to inspect intermediate outputs or enforce a specific pipeline structure. Those two conditions are the documented justification for splitting the work into separate steps.","rationales":{"A":"Sentence count is not a decomposition trigger. Multi-sentence requests are routinely handled in a single turn.","C":"Prose formatting is an output-format lever, not a reason to split a task into separate steps.","E":"Response length is controlled by prompting for it explicitly, not by chaining separate steps."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["prompt-chaining","adaptive-thinking","decomposition","multiple-response"]},{"id":"D1-012","domain":"D1","objective":"Adapt prompting strategies based on task type (analysis, research, drafting, brainstorming)","type":"single","difficulty":"medium","scenario":true,"stem":"A visitor experience team at a museum seeds an ideation session by pasting three sample concepts, all of which happen to be ticket-discount offers, and asks Claude for twenty more ideas. Every idea it returns is another ticket discount. What best explains the narrowing, and what should the team change?","options":[{"key":"A","text":"The seed examples were not diverse, so Claude picked up an unintended pattern; vary them across the shapes of concept wanted."},{"key":"B","text":"Twenty ideas exceeds what one response can reasonably cover, so the request should be split into four separate prompts asking for five concepts each."},{"key":"C","text":"Three examples sits below the documented range, so the team should paste seven further discount offers before asking for any new concepts."},{"key":"D","text":"The model needs a higher effort setting before it will produce variety, so the team should raise effort and reissue the identical prompt unchanged."}],"correct":["A"],"explanation":"Examples are documented as one of the most reliable ways to steer Claude's output format, tone and structure, which is why an unrepresentative example set steers so strongly. The diversity criterion states that examples should cover edge cases and vary enough that Claude does not pick up unintended patterns. Three all-alike seeds are precisely that unintended pattern, so the fix is to vary the seeds across the kinds of idea wanted rather than to add more of the same.","rationales":{"B":"Breadth is not limited by response capacity here. The ideas are narrow rather than truncated, and splitting the same seed set across four prompts would simply reproduce the same pattern four times over.","C":"Three examples already sits inside the documented 3-5 range, and adding seven more of the same kind would reinforce the very pattern that is narrowing the output.","D":"Effort governs how much the model thinks rather than what it draws on, so raising it leaves the unintended pattern in the seed examples entirely untouched."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["brainstorming","ideation","diverse-examples","task-type"]},{"id":"D1-013","domain":"D1","objective":"Apply task decomposition techniques to structure complex requests","type":"single","difficulty":"hard","scenario":true,"stem":"A service desk manager at a utilities provider is preparing a quarterly service review. Task 1 is to rewrite a single escalation policy document section by section, each edit depending on the previous one. Task 2 is to profile four regional queues independently, one report per region, with no shared state. Which allocation of the two tasks is most appropriate?","options":[{"key":"A","text":"Delegate Task 1 to parallel subagents, and handle Task 2 directly in a single working thread."},{"key":"B","text":"Delegate both tasks to subagents, on the basis that delegation reduces effort in every case."},{"key":"C","text":"Handle Task 1 directly in one working thread; delegate Task 2 to parallel subagents."},{"key":"D","text":"Handle both tasks directly, since subagents cannot produce separate written reports at all."}],"correct":["C"],"explanation":"The documented sample guidance is to use subagents when tasks can run in parallel, require isolated context, or involve independent workstreams that do not need to share state, and to work directly for simple tasks, sequential operations, single-file edits, or tasks where you need to maintain context across steps. The sequential dependent rewrite is direct work; the four independent regional reports are the parallel, isolated-context case.","rationales":{"A":"This inverts the rule. Parallelising a sequence of dependent edits breaks the context continuity each edit relies on.","B":"Delegation is not universally beneficial; the documentation names specific cases where working directly is preferred, and warns that Claude may already over-delegate.","D":"Independent parallel workstreams producing separate outputs are precisely the documented subagent use case, so refusing to delegate Task 2 ignores the guidance."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["subagents","delegation-boundary","parallel-work","most-appropriate"]},{"id":"D1-014","domain":"D1","objective":"Apply task decomposition techniques to structure complex requests","type":"multi","difficulty":"hard","scenario":false,"stem":"Anthropic's sample guidance on subagent usage also lists the conditions under which Claude should work directly rather than delegating. Which TWO of the following appear on that work-directly list? (Select TWO.)","options":[{"key":"A","text":"The work is a wide investigation spanning many independent areas."},{"key":"B","text":"The subtasks can run in parallel."},{"key":"C","text":"The subtasks require isolated context from one another."},{"key":"D","text":"The operations have to run in sequence."},{"key":"E","text":"The workstreams are independent and do not need to share state."},{"key":"F","text":"Context has to be maintained across the steps."}],"correct":["D","F"],"explanation":"The documented sample instruction has two halves. Delegate when tasks can run in parallel, require isolated context, or involve independent workstreams that do not need to share state. Work directly for simple tasks, sequential operations, single-file edits, or tasks where you need to maintain context across steps. Sequential operations and maintaining context across steps are on the work-directly half.","rationales":{"A":"A wide, genuinely independent investigation is the canonical delegation case, not a reason to work directly.","B":"Parallelism is the first condition on the delegate half of the guidance.","C":"Isolated context is the second condition on the delegate half of the guidance.","E":"Independent workstreams that do not need to share state are the third condition on the delegate half of the guidance."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["subagents","work-directly","decomposition","multiple-response"]},{"id":"D1-015","domain":"D1","objective":"Apply task decomposition techniques to structure complex requests","type":"single","difficulty":"easy","scenario":false,"stem":"Claude's help centre article on unhelpful answers lists four ordered remedies. Which of the following is one of them, and is the one that corresponds directly to task decomposition?","options":[{"key":"A","text":"Switch to a model with a larger context window."},{"key":"B","text":"Break down complex requests into substeps."},{"key":"C","text":"Add three worked examples of the output you want."},{"key":"D","text":"Wrap the request in XML tags so Claude can parse it."}],"correct":["B"],"explanation":"The four ordered remedies in the help centre article are: explain your ask simply and clearly; include as much context as possible; break down complex requests into substeps; and give Claude feedback through follow-up instructions, clarifications, or a request to rewrite an answer. The third of these is the decomposition remedy.","rationales":{"A":"Model or context-window selection is not one of the four listed remedies for a weak answer.","C":"Worked examples are a best-practices technique for steering format, tone and structure. They are not one of the four remedies in this article.","D":"XML structuring is a best-practices technique for prompts that mix content types. It is not one of the four remedies in this article."},"sources":[{"title":"My prompt isn't giving me a helpful answer | Claude Help Center","url":"https://support.claude.com/en/articles/7996857-my-prompt-isn-t-giving-me-a-helpful-answer","date":"2026-03-16","basis":"published"}],"tags":["substeps","help-centre-remedies","decomposition"]},{"id":"D1-016","domain":"D1","objective":"Apply task decomposition techniques to structure complex requests","type":"single","difficulty":"hard","scenario":true,"stem":"A quality assurance lead at a rail operator is reviewing incident write-ups with Claude Opus 5 and instructs it to \"only report high-severity issues and be conservative.\" The reviews come back very thin, and she later finds real medium-severity issues that were never surfaced. What should she change?","options":[{"key":"A","text":"Restate the severity threshold more forcefully, so that the model applies it with greater care on each write-up."},{"key":"B","text":"Add a final verification step instructing the model to double-check that nothing has been missed before it replies."},{"key":"C","text":"Lower the effort setting, so that the model spends less of its budget filtering down its own findings."},{"key":"D","text":"Have it surface every finding first, then apply the threshold as a separate filtering pass."}],"correct":["D"],"explanation":"Anthropic documents that on Claude Opus 5 a review prompt saying \"only report high-severity issues\" or \"be conservative\" may be followed literally, so the model reports less. The stated remedy is to ask it to report everything and filter in a separate pass, which decomposes generation from filtering.","rationales":{"A":"Strengthening the same restrictive instruction makes the literal suppression worse rather than better.","B":"Claude Opus 5 verifies its own work without being told to, and explicit verification instructions cause over-verification with no quality gain; the documented advice is to remove them.","C":"Anthropic notes that Claude Opus 5's review accuracy holds at lower effort settings, so lowering effort would not recover findings that a restrictive instruction had suppressed."},"sources":[{"title":"Prompting Claude Opus 5 - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5","date":"2026-08-19","basis":"verified-live"}],"tags":["literal-instruction","generate-then-filter","decomposition","analysis"]},{"id":"D1-017","domain":"D1","objective":"Apply task decomposition techniques to structure complex requests","type":"single","difficulty":"medium","scenario":true,"stem":"A supply chain coordinator asks Claude to run a supplier onboarding checklist. The work comes back in a different order each time and one check is occasionally skipped. What should she change about the prompt?","options":[{"key":"A","text":"Provide the instructions as a numbered list of sequential steps, since the order and completeness of the steps matter here."},{"key":"B","text":"Describe the whole task in one flowing paragraph, so that Claude is not constrained by an artificial structure imposed on it."},{"key":"C","text":"Repeat the most important check at the start of the prompt and again at the end, so that it cannot be overlooked."},{"key":"D","text":"Ask Claude to plan the work itself first and then follow whatever order of checks it decides on."}],"correct":["A"],"explanation":"Under \"Be clear and direct\", Anthropic instructs you to provide instructions as sequential steps using numbered lists or bullet points when the order or completeness of steps matters. That is exactly the failure here: a variable order and an intermittently missing step.","rationales":{"B":"Flowing prose is an output-format preference for the response. It is the opposite of the documented remedy when the order and completeness of the steps matter.","C":"Repetition adds emphasis but not structure, and it still leaves the order of the remaining checks unstated.","D":"Leaving the ordering to Claude is what is producing the variation. The documented lever is to state the sequence when the order matters."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["sequential-steps","numbered-lists","decomposition"]},{"id":"D1-018","domain":"D1","objective":"Iterate prompts to improve output quality","type":"multi","difficulty":"easy","scenario":false,"stem":"Anthropic's prompt engineering overview names three things you should have in place before you begin engineering a prompt. Which THREE are they? (Select THREE.)","options":[{"key":"A","text":"A minimum of five worked examples of the desired output."},{"key":"B","text":"A clear definition of the success criteria for your use case."},{"key":"C","text":"A chosen model that already meets your latency and cost targets."},{"key":"D","text":"Some way to empirically test performance against those criteria."},{"key":"E","text":"A record of every prompt version you have tried so far."},{"key":"F","text":"A first draft prompt that you want to improve."}],"correct":["B","D","F"],"explanation":"The prompt engineering overview lists exactly three prerequisites: a clear definition of the success criteria for your use case, some ways to empirically test against those criteria, and a first draft prompt you want to improve. The same page warns that not every success criterion or failing eval is best solved by prompt engineering, giving latency and cost as things sometimes improved more easily by selecting a different model.","rationales":{"A":"Examples are a technique, not a prerequisite, and the documented count is 3-5 rather than a minimum of five.","C":"The page mentions model selection only as an alternative to prompt engineering for latency and cost. It is not one of the three listed prerequisites.","E":"Version history is sensible practice but is not listed. The overview names exactly three prerequisites."},"sources":[{"title":"Prompt engineering overview - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview","date":"2026-08-19","basis":"verified-live"}],"tags":["success-criteria","evals","prerequisites","multiple-response"]},{"id":"D1-019","domain":"D1","objective":"Iterate prompts to improve output quality","type":"single","difficulty":"medium","scenario":true,"stem":"A finance business partner pastes Claude's explanation of a pricing formula into a plain-text internal wiki and finds it full of backslash and dollar-sign notation the wiki does not render. She will be running this request every week. What is the durable fix?","options":[{"key":"A","text":"Ask Claude to strip the notation out afterwards in a follow-up message, and repeat that clean-up step on each weekly run."},{"key":"B","text":"Switch to a model that does not support mathematical notation, so that the symbols cannot be produced at all."},{"key":"C","text":"Add an instruction telling Claude to format the response in plain text only, with no LaTeX or markup notation."},{"key":"D","text":"Wrap the formula in XML tags, so that the wiki can strip the notation out automatically when it imports the text."}],"correct":["C"],"explanation":"Anthropic documents that Claude's latest models default to LaTeX for mathematical expressions, equations and technical explanations, and that if you prefer plain text you should add an instruction to the prompt: format the response in plain text only, using no LaTeX, MathJax or markup notation, and writing math with standard text characters. Changing the prompt fixes every future run rather than one output.","rationales":{"A":"Post-hoc clean-up treats each output individually and has to be repeated every week. The documented fix changes the prompt so every response comes back in the required form.","B":"Model choice is not the documented lever. LaTeX is a formatting default across current models and is changed by instruction.","D":"XML tags separate content types inside the prompt. They do not change the notation Claude chooses inside its response."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["latex","plain-text-output","iteration"]},{"id":"D1-020","domain":"D1","objective":"Iterate prompts to improve output quality","type":"single","difficulty":"medium","scenario":true,"stem":"A grants administrator at a university has a Claude Opus 5 prompt template that ends with \"Always double-check your answer and include a final verification step for any non-trivial task.\" Runs are slow and verbose, but the substantive quality is no better than before the line was added. What should he do with those instructions?","options":[{"key":"A","text":"Keep them, and add a subagent whose sole job is to verify the primary answer before it is returned to the user."},{"key":"B","text":"Remove the verification instructions, because they cause over-verification on Opus 5 without a quality gain."},{"key":"C","text":"Keep them but raise the effort setting to max, so that the verification completes more quickly on each run."},{"key":"D","text":"Keep them and add \"if in doubt, verify again\", so that the check becomes unconditional on every single run."}],"correct":["B"],"explanation":"Anthropic documents that Claude Opus 5 verifies its own work without being told to, and that explicit verification instructions such as \"include a final verification step for any non-trivial task\" or \"use a subagent to verify\" cause over-verification. Removing them reduces wasted tokens with no loss in quality.","rationales":{"A":"\"Use a subagent to verify\" is named in the same list of instructions to remove, so this compounds the problem, and the Opus 5 guidance separately says not to use subagents to double-check the model's own work.","C":"Raising effort increases thinking volume. It does not remove the redundant verification behaviour and will make runs slower still.","D":"Phrasing of the \"if in doubt\" form is separately documented as over-prompting that now causes overtriggering."},"sources":[{"title":"Prompting Claude Opus 5 - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5","date":"2026-08-19","basis":"verified-live"},{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["over-verification","opus-5","iteration"]},{"id":"D1-021","domain":"D1","objective":"Iterate prompts to improve output quality","type":"single","difficulty":"hard","scenario":true,"stem":"A duty manager at a city council contact centre finds Claude Opus 5's replies far too long for a channel that allows about 120 words. A colleague suggests lowering the effort setting to shorten them. What should the manager do instead, and why?","options":[{"key":"A","text":"Lower the effort setting as the colleague suggests, because effort is the documented control for the length of the visible response."},{"key":"B","text":"Turn extended thinking off in the Claude apps, on the basis that switching thinking off reliably truncates the visible reply."},{"key":"C","text":"Ask Claude to re-send each reply trimmed to 120 words, because a second pass reliably enforces the word budget."},{"key":"D","text":"State the length requirement explicitly in the prompt, because effort controls how much the model thinks, not how much it says."}],"correct":["D"],"explanation":"Anthropic documents that Claude Opus 5's default user-facing responses run longer than prior Opus models', that the effort parameter controls how much the model thinks rather than how much it says, and that lowering effort can reduce thinking volume without reliably shortening the visible response. To control response length, prompt for it explicitly; a short conciseness instruction is effective.","rationales":{"A":"This is the named trap. Effort governs thinking volume, not visible output length.","B":"The help centre states that extended thinking cannot be turned off in Claude when using Claude Opus 5, and disabling thinking is not a length control in any case.","C":"A trimming round trip doubles the work on every message. The documented instruction is to prompt for the length you want in the first place."},"sources":[{"title":"Prompting Claude Opus 5 - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5","date":"2026-08-19","basis":"verified-live"},{"title":"Change the model, effort, and thinking settings | Claude Help Center","url":"https://support.claude.com/en/articles/8664678-change-the-model-effort-and-thinking-settings","date":"2026-08-19","basis":"verified-live"}],"tags":["effort","response-length","opus-5","iteration"]},{"id":"D1-022","domain":"D1","objective":"Iterate prompts to improve output quality","type":"single","difficulty":"medium","scenario":true,"stem":"A payroll supervisor has Claude run a multi-step reconciliation that uses tools. The result is correct, but Claude moves straight from one tool call to the next and she cannot tell what it actually did without opening every result. Which prompt change addresses this?","options":[{"key":"A","text":"Add an instruction asking Claude to give a quick summary of the work it has done after completing a task that involves tool use."},{"key":"B","text":"Ask Claude to run the tools strictly one at a time, so that each result appears separately in the transcript for her to review."},{"key":"C","text":"Add \"if in doubt, use the tool\" to the prompt, so that every instance of tool use becomes more visible."},{"key":"D","text":"Reduce the number of tools available to Claude, so that there is less activity for her to have to account for."}],"correct":["A"],"explanation":"Anthropic documents that current models are less verbose and may skip verbal summaries after tool calls, jumping directly to the next action. The stated remedy when you prefer more visibility is the sample instruction \"After completing a task that involves tool use, provide a quick summary of the work you've done.\" This is a specific output gap fixed by a specific added instruction.","rationales":{"B":"Serialising tool calls is documented as a way to reduce parallel execution for stability, not as a way to get visibility into what was done, and it makes the run slower.","C":"\"If in doubt\" phrasing is documented as over-prompting that causes overtriggering. It produces more tool calls, not clearer reporting.","D":"Removing capability does not create the summary she wants; the documented lever is an explicit instruction about what to report."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["verbosity","tool-use-summaries","diagnose-then-fix","iteration"]},{"id":"D1-023","domain":"D1","objective":"Iterate prompts to improve output quality","type":"multi","difficulty":"hard","scenario":true,"stem":"A management accountant's variance-commentary prompt produces commentary that is accurate but omits the year-on-year comparison the board expects, and buries the headline in the third paragraph. Which TWO iteration steps best reflect a diagnose-then-fix approach? (Select TWO.)","options":[{"key":"A","text":"Reissue the same prompt with the added note \"please make this better for the board.\""},{"key":"B","text":"Move the variance data below the question in the prompt so Claude reads the instruction first."},{"key":"C","text":"Add an explicit instruction that the commentary must include a year-on-year comparison for each variance."},{"key":"D","text":"Re-prompt for a more formal tone so the commentary sounds board-appropriate."},{"key":"E","text":"Specify positively that the response should open with the single most material variance."},{"key":"F","text":"Replace the prompt with a numbered list of every technique in the documentation."}],"correct":["C","E"],"explanation":"Effective iteration means naming the specific gap and changing a specific instruction, then reissuing. The two identified gaps are a missing year-on-year comparison and a buried headline, and the two fixes state positively what the output must contain and how it must open, which is the leading documented output-control lever.","rationales":{"A":"Vague feedback such as \"make it better\" names no gap and gives Claude nothing new to act on.","B":"For large data-rich inputs the documented ordering is the opposite, long data at the top and the query at the end, and in any case ordering adds neither the missing comparison nor the headline.","D":"Tone is not the defect. Re-toning addresses neither the missing comparison nor the ordering problem.","F":"Bundling many unrelated changes into one revision makes it impossible to tell which change fixed which gap, and each of the two defects here has a specific instruction that addresses it."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["diagnose-then-fix","specific-feedback","iteration","multiple-response"]},{"id":"D1-024","domain":"D1","objective":"Iterate prompts to improve output quality","type":"single","difficulty":"hard","scenario":false,"stem":"Claude Opus 5 sometimes widens a narrow task, adding steps that were not requested. Which prompt change addresses that behaviour without also disrupting the self-correction the model already performs?","options":[{"key":"A","text":"Add an instruction to double-check the answer before responding, so that any steps added beyond the request are caught on review."},{"key":"B","text":"Constrain scope explicitly: deliver what was asked at the scope intended, and flag a better approach in a sentence rather than quietly transforming the task."},{"key":"C","text":"Instruct the model to delegate the work to a subagent, so that a second agent decides which steps fall inside the task."},{"key":"D","text":"Lower the effort setting until the extra steps stop appearing, on the basis that effort determines how much work the model actually performs."}],"correct":["B"],"explanation":"Two documented facts about Claude Opus 5 have to be combined. First, the model can expand the scope of a task, adding steps that were not requested, and the documented remedy for narrow tasks is to constrain scope explicitly: deliver what was asked at the scope intended, and if the request seems mistaken or a better approach exists, say so in a sentence and continue with the task as asked rather than quietly narrowing, widening or transforming it. Second, the model catches and fixes its own mistakes well without prompting, so instructions to re-check compound with behaviour it already performs.","rationales":{"A":"Claude Opus 5 catches and fixes its own mistakes without being asked, and instructions such as \"double-check your answer\" compound with that behaviour, adding cost without improving results.","C":"Delegation is documented as paying off on genuinely independent, sizeable tracks of work, and as multiplying cost and time on small ones; handing scope policing to a subagent leaves the request itself unbounded.","D":"Effort controls how much the model thinks rather than what it decides the task is, so lowering it trades away reasoning quality while the scope of the request stays unstated."},"sources":[{"title":"Prompting Claude Opus 5 - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5","date":"2026-08-19","basis":"verified-live"},{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["task-scope","scope-expansion","opus-5","iteration"]},{"id":"D1-025","domain":"D1","objective":"Adapt prompting strategies based on task type (analysis, research, drafting, brainstorming)","type":"single","difficulty":"easy","scenario":false,"stem":"Anthropic's help centre distinguishes web search, extended thinking and Research largely by tool-call volume. Which pairing is correct?","options":[{"key":"A","text":"Extended thinking is the right choice when the answer depends on today's news."},{"key":"B","text":"Research is the right choice for looking up a single company's headquarters city."},{"key":"C","text":"Web search suits straightforward factual queries that need only one or two tool calls."},{"key":"D","text":"Research and extended thinking cannot be used together in the same request."}],"correct":["C"],"explanation":"The help centre defines web search as the option for straightforward factual queries that need one or two tool calls, such as the weather, a company, or recent headlines. Extended thinking is for complex reasoning that does not require recent information, and Research is for comprehensive information gathering requiring five or more tool calls over one to three minutes.","rationales":{"A":"Extended thinking is documented for reasoning that does not require recent information, so it must be paired with a search-based mode when freshness matters.","B":"A single-fact lookup is a web-search task. Research is defined by five or more tool calls producing a multi-source synthesis.","D":"The article states that Research and extended thinking can be combined, so Claude both plans its approach thoughtfully and gathers comprehensively."},"sources":[{"title":"When should I use web search, extended thinking, and research? | Claude Help Center","url":"https://support.claude.com/en/articles/11095361-when-should-i-use-web-search-extended-thinking-and-research","date":"2026-06-02","basis":"published"}],"tags":["web-search","extended-thinking","research","task-type"]},{"id":"D1-026","domain":"D1","objective":"Adapt prompting strategies based on task type (analysis, research, drafting, brainstorming)","type":"single","difficulty":"easy","scenario":true,"stem":"A pricing manager needs a cited landscape review of four competitors' pricing changes over the past quarter, drawing on multiple independent sources with contradictions reconciled. Which approach fits?","options":[{"key":"A","text":"Use Research, which gathers comprehensively across many sources over one to three minutes."},{"key":"B","text":"Use extended thinking on its own, which reasons deeply enough to reconstruct the current pricing picture."},{"key":"C","text":"Use a single web search, since one or two lookups per competitor should be entirely sufficient."},{"key":"D","text":"Raise effort to max in a normal chat, which produces the same breadth of multi-source coverage."}],"correct":["A"],"explanation":"Research is documented for comprehensive information gathering requiring five or more tool calls over one to three minutes, synthesising multiple sources. A cited four-competitor landscape review with contradictions reconciled is exactly that shape of task, and the help centre notes Research can be combined with extended thinking so Claude plans thoughtfully as well.","rationales":{"B":"Extended thinking is documented for complex reasoning that does not require recent information, so it cannot supply last quarter's pricing changes.","C":"A one-or-two-call web search cannot cover four competitors across multiple independent sources or reconcile contradictions.","D":"Effort governs thinking volume, not source gathering. Raising it does not cause multi-source retrieval or citations."},"sources":[{"title":"When should I use web search, extended thinking, and research? | Claude Help Center","url":"https://support.claude.com/en/articles/11095361-when-should-i-use-web-search-extended-thinking-and-research","date":"2026-06-02","basis":"published"}],"tags":["research-mode","task-type","multi-source"]},{"id":"D1-027","domain":"D1","objective":"Adapt prompting strategies based on task type (analysis, research, drafting, brainstorming)","type":"single","difficulty":"medium","scenario":true,"stem":"A policy adviser needs Claude to work through a knotty logical argument about a regulation that changed last week. She turns on extended t
