xt":"No exceptions process exists at all; the Usage Policy applies identically to every customer, in every sector and every region, without variation."}],"correct":["A"],"explanation":"Anthropic's published position is that the Usage Policy applies uniformly, with one narrow exception: it may tailor use restrictions for select government entities whose mission and legal authorities support responsible deployment, with foreign intelligence analysis conducted in accordance with applicable law given as the example. Even for those entities the core prohibitions are untouched, including disinformation campaigns, weapons development, censorship, domestic surveillance and malicious cyber operations, and the arrangement currently reaches only models classified at AI Safety Level 2 under the Responsible Scaling Policy. Eligibility turns on the entity's legal authorities, its safeguards against misuse and error, and independent democratic oversight. A commercial contractor cannot supply those, whatever its customer is.","rationales":{"B":"Plan tier does not open the door. The exception is defined by the character of the entity and the oversight it sits under, not by what the customer has purchased or how large the contract is.","C":"A lawful purpose and credible safeguards are part of the eligibility test, but they are not sufficient on their own. The process is confined to vetted government entities before those factors are ever weighed.","D":"An overcorrection in the other direction. A narrow published exceptions process does exist; it is simply not open to commercial customers, which is a different thing from not existing."},"sources":[{"title":"Exceptions to our Usage Policy - Claude Support","url":"https://support.claude.com/en/articles/9528712-exceptions-to-our-usage-policy","date":"2026-03-16","basis":"published"}],"tags":["usage-policy","exceptions","government","appropriate-use","trap-item"],"notes":{"signal":"Practice material tells candidates the Usage Policy is one flat rule set that admits of no variation, which is close but not right, and never mentions the published exceptions process. Bank #1 keys the policy's three-tier structure and its enforcement route but has no item on whether and for whom the restrictions can be varied."}},{"id":"D6-C011","domain":"D6","objective":"Identify appropriate and inappropriate use cases","type":"single","difficulty":"hard","scenario":true,"stem":"A housing association drafts tenancy application outcome letters with Claude. One letter went out quoting the wrong rent figure. The team proposes moving the work to the most capable model available and, on the strength of that, treating the housing officer's review of each letter as optional. What is the correct assessment?","options":[{"key":"A","text":"Model choice does not affect the need for a qualified person to review the decision before issue."},{"key":"B","text":"The proposal is sound, because Opus is the most capable model and its accuracy removes the need for review."},{"key":"C","text":"The proposal is acceptable provided every letter carries a clear notice that AI helped produce it."},{"key":"D","text":"Tenancy decisions sit outside the high-risk categories, so no review step was required in the first place."}],"correct":["A"],"explanation":"Housing is inside the high-risk categories Anthropic's Usage Policy update introduced, and the human-in-the-loop requirement attaches to the decision, not to the model. A qualified professional in the field must review the content or decision before it is disseminated. No model upgrade discharges that obligation, and treating a capability improvement as a substitute for review is exactly the reasoning the requirement exists to prevent. The same point runs through Anthropic's guidance for regulated professional work, where supervision and verification of the output remain the practitioner's duty however the tooling is configured.","rationales":{"B":"This treats a capability improvement as a substitute for a governance control. The review requirement attaches to the decision that reaches the applicant, not to the model that drafted the letter, so no change of model discharges it.","C":"Disclosure is a separate requirement that runs alongside qualified review, not in place of it.","D":"Housing decisions of this kind sit inside the high-risk category the Usage Policy update introduced, where AI helping to produce a decision that reaches an individual attracts additional requirements rather than none."},"sources":[{"title":"Updates to our Acceptable Use Policy (now Usage Policy), Consumer Terms of Service, and Privacy Policy - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/9301722-updates-to-our-acceptable-use-policy-now-usage-policy-consumer-terms-of-service-and-privacy-policy","date":"2026-03-16","basis":"published"},{"title":"Using Claude for Legal Work: Privilege, Confidentiality, and How to Think About Configuration - Claude Support","url":"https://support.claude.com/en/articles/15707726-using-claude-for-legal-work-privilege-confidentiality-and-how-to-think-about-configuration","date":"2026-06-30","basis":"published"}],"tags":["trap-item","community-myth","model-choice","human-review","housing","high-risk-use-cases"],"notes":{"caveat":"The volatile model-capability fact flagged for removal was relocated rather than removed. Distractor rationale B was cleaned as claimed, but option B's own text still reads \"The proposal is sound, bec","signal":"Vendors teach move to a more powerful model as a classic wrong answer in governance scenarios. This item keys the governance fact and puts the capability-as-substitute belief in the most attractive distractor. Bank #1 tests housing as a high-risk category but never tests a model swap offered in place of the review step."}},{"id":"D6-C012","domain":"D6","objective":"Understand the ethical implications of AI usage","type":"multi","difficulty":"medium","scenario":true,"stem":"A publisher's editorial director wants the firm's public archive kept out of AI model training, while its help pages stay retrievable when a reader asks Claude a question. She asks what Anthropic's crawlers make possible. Which TWO statements are accurate? (Select TWO.)","options":[{"key":"A","text":"Anthropic runs separate crawlers for separate purposes, so blocking the training crawler does not stop pages being fetched for a user's request."},{"key":"B","text":"Opting out reaches back into the models Anthropic has already trained, so the archive is removed from those as well as from anything trained later."},{"key":"C","text":"Anthropic's crawlers honour standard robots.txt directives, and the rules have to be applied to each subdomain separately."},{"key":"D","text":"Blocking by IP address is the method Anthropic recommends, because it stops all of the company's crawler traffic in one step and needs no site changes."},{"key":"E","text":"Crawler control is a setting inside the organisation's Claude workspace rather than something published on the publisher's own web server."},{"key":"F","text":"One directive covers every Anthropic crawler at once, because all of them present the same user agent name when they request a page."}],"correct":["A","C"],"explanation":"Anthropic documents three crawlers with different jobs: ClaudeBot collects web content for model training and development, Claude-User retrieves pages when a Claude user's request calls for them, and Claude-SearchBot indexes content to improve search results. Each has a different consequence when blocked, so an editorial policy that wants one outcome and not the other has to name the right agent rather than reaching for a blanket block. The crawlers respect standard robots.txt directives, and those rules apply per subdomain, so each subdomain to be restricted needs its own. Blocking by IP is expressly not recommended, because a bot blocked at the network layer may never read the robots.txt file that carries the instruction.","rationales":{"B":"Opting out excludes future content from training datasets. It is a forward-looking control and not a mechanism for reaching into work already completed.","D":"Anthropic advises against blocking by IP address for exactly this reason: a bot that cannot reach the site may not be able to read the robots.txt file that would have told it what to avoid.","E":"This control lives on the publisher's own web server and is exercised by whoever administers the site. It is not a Claude workspace setting, and it applies to everyone's crawling, not only to the publisher's own staff.","F":"The crawlers carry distinct user agent names precisely because they do distinct jobs, so a directive naming one of them leaves the other two entirely unaffected."},"sources":[{"title":"Does Anthropic crawl data from the web, and how can site owners block the crawler? - Claude Support","url":"https://support.claude.com/en/articles/8896518-does-anthropic-crawl-data-from-the-web-and-how-can-site-owners-block-the-crawler","date":"2026-04-07","basis":"published"}],"tags":["training-data","crawlers","content-owner-consent","ethics","opt-out"],"notes":{"signal":"Community guides read the ethics objective as being about the output side of Claude - bias, disclosure, attribution - and skip the question of consent to training material altogether. Bank #1 is the same: its ethics items cover bias, evaluations, watermarking, disclosure and the EU transparency code, and none of them touches what a content owner can actually control."}},{"id":"D6-C013","domain":"D6","objective":"Apply data sensitivity, regulatory, and privacy considerations","type":"single","difficulty":"hard","scenario":true,"stem":"An HR analyst is preparing a pay gap analysis for a nine-person team. She removes the employee names from the file but leaves job title, office location, start date, gender and salary in place, and considers the file anonymised. Which assessment is correct?","options":[{"key":"A","text":"Removing the names is sufficient, because no direct identifier remains anywhere in the file."},{"key":"B","text":"It is acceptable because pay gap analysis is a legitimate internal purpose that the business has approved."},{"key":"C","text":"It is acceptable provided the conversation is deleted as soon as the analysis has been completed."},{"key":"D","text":"The remaining fields still single out individuals in a team this small, so they need coarsening first."}],"correct":["D"],"explanation":"Identifiability comes from combinations, not only from direct identifiers. In a nine-person team, job title plus office plus start date plus gender will usually resolve to one person, so the salary beside it is effectively attributed. The fix is to reduce granularity before upload, for example by banding start dates and grouping job families, or by aggregating to the level the analysis actually requires. Anthropic's Privacy Policy makes the submitter responsible for the personal data in their inputs, and notes that such data can be reproduced in outputs.","rationales":{"A":"This is the common misreading of anonymisation. Direct identifiers are only one route to identifying someone; a small population plus several quasi-identifiers is another.","B":"A legitimate purpose justifies doing the analysis; it does not justify submitting more identifying detail than the analysis needs.","C":"Deletion shortens retention. It does not change the fact that identifiable pay data about named individuals was submitted in the first place."},"sources":[{"title":"Privacy Policy - Anthropic","url":"https://www.anthropic.com/legal/privacy","date":"2026-07-08","basis":"published"}],"tags":["anonymisation","identifying-combinations","quasi-identifiers","hr-data"],"notes":{"caveat":"The originally-flagged within-file redundancy (D6-C002/D6-C014, with D6-C016's option E named as a third encoding) is only partly closed. D6-C014 was replaced, but the repeated distractor archetypes r","signal":"One vendor's hands-on lab drills identifying combinations specifically, teaching that stripping names is not anonymisation when the population is small. Bank #1 has no item on quasi-identifiers."}},{"id":"D6-C014","domain":"D6","objective":"Apply data sensitivity, regulatory, and privacy considerations","type":"single","difficulty":"medium","scenario":true,"stem":"A general counsel is drafting the firm's response plan for the possibility that a government authority asks Anthropic for material the firm's staff have put into Claude. Which description of Anthropic's published policy should the plan be built on?","options":[{"key":"A","text":"Anthropic declines all governmental requests as a matter of policy, so any authority seeking the material has to come to the firm instead."},{"key":"B","text":"Anthropic complies with any request from a recognised law enforcement agency and is prohibited from telling the affected customer about it."},{"key":"C","text":"Anthropic requires valid legal process, excepting only an emergency involving imminent physical harm or death, and generally notifies affected users."},{"key":"D","text":"Anthropic passes such requests to the data protection supervisory authority for the customer's region, which decides whether the material is released."}],"correct":["C"],"explanation":"Anthropic's published policy is that it does not disclose customer or end user information in response to a governmental request unless there is valid legal process, such as a subpoena or a warrant. The one narrow exception is a belief that there is an emergency that may result in imminent physical harm or death and that providing the information without delay may avert it. Requests are reviewed for legal validity and may be rejected as overly broad or vague, and Anthropic generally notifies affected users unless it is legally prohibited from doing so or in rare circumstances such as risk of harm to a child. Where the account belongs to an organisation rather than an individual, Anthropic will typically ask the requester to approach that organisation directly first, which is the part of the sequence the firm's own plan has to be ready to receive.","rationales":{"A":"Too absolute in the firm's favour. Anthropic will route a requester to the customer where it can, but it does respond to valid legal process rather than refusing outright, so a plan built on blanket refusal would be built on sand.","B":"Both halves are wrong. Valid legal process is required rather than a request from a recognised agency, and notification of the affected user is the default rather than something Anthropic is barred from giving.","D":"Supervisory authorities oversee data protection compliance. They are not an intermediary standing between a law enforcement request and a provider, and no such referral step exists in the policy."},"sources":[{"title":"What is Anthropic's policy for handling governmental requests for user information? - Claude Support","url":"https://support.claude.com/en/articles/9519291-what-is-anthropic-s-policy-for-handling-governmental-requests-for-user-information","date":"2026-03-16","basis":"published"}],"tags":["law-enforcement","legal-process","notification","data-sensitivity","response-planning"],"notes":{"signal":"Study guides cover the privacy objective as data in and retention out, and stop there. Bank #1 does the same, with items on retention windows, training-data defaults, GDPR controllership and certifications; neither bank has anything on what happens when a third party asks Anthropic for the material, which is the question a governance owner is asked first."}},{"id":"D6-C015","domain":"D6","objective":"Follow organizational AI policies and governance standards","type":"single","difficulty":"hard","scenario":true,"stem":"A consultancy's internal AI policy states that any file on the company shared drive may be used with Claude. An analyst finds a client's technical drawings there, supplied under a non-disclosure agreement that forbids disclosure to third-party service providers without the client's written consent. Which statement is correct?","options":[{"key":"A","text":"The internal policy is authoritative for company systems, so the drawings may be used as it permits."},{"key":"B","text":"The drawings may be used, because Anthropic acts as a processor and does not train on commercial data by default."},{"key":"C","text":"The client's non-disclosure agreement binds the firm regardless of what the internal policy allows."},{"key":"D","text":"The drawings may be used once the file names and the client's company name have been removed from every page."}],"correct":["C"],"explanation":"An internal policy cannot release the firm from a commitment it made to someone else. The non-disclosure agreement binds the consultancy to the client independently of what the consultancy tells its own staff, and a blanket internal permission simply means the policy has not been drafted against the firm's contractual commitments. The correct handling is to stop, escalate the conflict, and either obtain the client's consent or have the policy corrected.","rationales":{"A":"Internal policy governs internal conduct. It has no power to waive an obligation owed to a third party under a contract.","B":"Anthropic's processor role and its default of not training on commercial inputs are relevant assurances, but the non-disclosure agreement restricts disclosure to service providers, not only training on the material.","D":"Removing the client's name does not make the drawings not the client's confidential information, and the technical content is itself the material the agreement protects."},"sources":[{"title":"Who owns and manages the data of my team? - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/9265372-who-owns-and-manages-the-data-of-my-team","date":"2026-03-16","basis":"published"},{"title":"Is my data used for model training? (Commercial) - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/7996868-is-my-data-used-for-model-training","date":"2026-08-20","basis":"verified-live"},{"title":"Privacy Policy - Anthropic","url":"https://www.anthropic.com/legal/privacy","date":"2026-07-08","basis":"published"}],"tags":["employer-policy","policy-conflict","nda","third-party-obligations"],"notes":{"caveat":"Within-file keyed-proposition duplication that the repair did not touch. Both items key the same governance rule - a stricter external obligation prevails over a more permissive one - and use the same","signal":"Study guides teach that D6 candidates must reconcile three layers - Anthropic's policy, the employer's policy and any client or regulatory obligation - and that the strictest applicable rule wins. Bank #1 tests only the first layer."}},{"id":"D6-C016","domain":"D6","objective":"Apply data sensitivity, regulatory, and privacy considerations","type":"multi","difficulty":"medium","scenario":true,"stem":"An executive assistant is about to use Claude to condense a board paper into a one-page summary. The paper names an unannounced acquisition target and several individuals. Which TWO steps genuinely reduce the risk, rather than only appearing to? (Select TWO.)","options":[{"key":"A","text":"Adding an instruction at the top of the prompt telling Claude not to retain or learn from the document."},{"key":"B","text":"Working in the organisation's approved Claude workspace rather than in a personal account."},{"key":"C","text":"Deleting the conversation as soon as the summary has been produced."},{"key":"D","text":"Choosing a model with a larger context window so that the whole paper fits into one message."},{"key":"E","text":"Removing the acquisition target and the named individuals, which the one-page summary does not need."}],"correct":["B","E"],"explanation":"Only two of these change the exposure. Using the organisation's approved workspace puts the material under the commercial agreement the employer holds, where the organisation manages the data and commercial inputs are not used for model training by default. Removing the content the task does not need is the redaction step itself, and it is the only measure that reduces what is submitted. The rest are comfort measures taken after or beside the decision that matters.","rationales":{"A":"An instruction in a prompt is a request to the model, not a data control. Retention and training behaviour are determined by the plan, the agreement and the account settings.","C":"Deletion limits how long the material is held, but it happens after the submission and does nothing about whether the material should have been sent.","D":"Context window size is a capability consideration. It has no bearing on confidentiality or on what is appropriate to upload."},"sources":[{"title":"Who owns and manages the data of my team? - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/9265372-who-owns-and-manages-the-data-of-my-team","date":"2026-03-16","basis":"published"},{"title":"Is my data used for model training? (Commercial) - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/7996868-is-my-data-used-for-model-training","date":"2026-08-20","basis":"verified-live"},{"title":"Is my data used for model training? (Consumer) - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/10023580-is-my-data-used-for-model-training","date":"2026-03-16","basis":"published"}],"tags":["redaction","plan-choice","trap-item","board-material","data-minimisation"],"notes":{"caveat":"The originally-flagged within-file redundancy (D6-C002/D6-C014, with D6-C016's option E named as a third encoding) is only partly closed. D6-C014 was replaced, but the repeated distractor archetypes r","signal":"Practice materials warn that governance distractors cluster around measures that feel protective but are not - prompt-level instructions, after-the-fact deletion and model swaps - and that the real levers are the account and what is sent."}},{"id":"D7-C001","domain":"D7","objective":"Identify, diagnose, and resolve issues with underperforming prompts or poor outputs","type":"single","difficulty":"medium","scenario":true,"stem":"An office administrator asks Claude in a plain chat to tidy up a supplier list and send the finished version to her manager. Claude replies that the file has been prepared and emailed, and supplies a link to it. The manager received nothing and the link opens nothing. No connector or integration is set up on the account. What has happened?","options":[{"key":"A","text":"The message was queued and will be delivered once the conversation is closed, which is why nothing has arrived."},{"key":"B","text":"The send failed quietly because the manager sits outside the account's organisation, so the message was dropped."},{"key":"C","text":"Claude has claimed a capability it lacks; it cannot reach email or file transfer unless that is integrated."},{"key":"D","text":"The link has expired, because file links that Claude generates stay valid only for the session that created them."}],"correct":["C"],"explanation":"Anthropic's help centre states that in an attempt to be a helpful assistant Claude can sometimes hallucinate its capabilities, and that even if it claims otherwise Claude does not have access to other tools or software that are not explicitly integrated, including email, word processors, or file transfers. The claim to have sent the file and the link that opens nothing are the same failure: a fabricated account of an action that never took place. The diagnostic rule is that Claude's own report of what it has done outside the conversation is not evidence that anything happened outside the conversation.","rationales":{"A":"Nothing in the documentation describes queued or deferred delivery. With no integration in place there is no mechanism that could deliver a message later.","B":"Organisation boundaries govern who can be invited to a workspace. They cannot explain a silent send, because no send was ever attempted.","D":"Link expiry is not documented for links produced inside an answer, and a link to a file that was never created has nothing to expire."},"sources":[{"title":"Claude is producing links that don't work and falsely claiming that it has sent emails or produced external documents. What's going on?","url":"https://support.claude.com/en/articles/8241188-claude-is-producing-links-that-don-t-work-and-falsely-claiming-that-it-has-sent-emails-or-produced-external-documents-what-s-going-on","date":"2026-03-16","basis":"published"},{"title":"Claude is providing incorrect or misleading responses. What's going on?","url":"https://support.claude.com/en/articles/8525154-claude-is-providing-incorrect-or-misleading-responses-what-s-going-on","date":"2026-03-16","basis":"published"}],"tags":["hallucinated-capability","false-action-claim","broken-links","no-integration","diagnosis"],"notes":{"caveat":"Repaired but independent confirmation did not complete; verified one pass less than other domains.","signal":"Community D7 material covers hallucinated facts at length and drills candidates on checking claims against sources. It does not cover the separate case of Claude hallucinating its own capabilities, where the false statement is about an action rather than a fact. No item in bank #1 keys the documented rule that Claude cannot reach email, word processors or file transfers unless they are explicitly integrated."}},{"id":"D7-C002","domain":"D7","objective":"Identify, diagnose, and resolve issues with underperforming prompts or poor outputs","type":"multi","difficulty":"hard","scenario":true,"stem":"An operations manager reports that a prompt she has used unchanged for months now produces weaker analyses. She has confirmed that the prompt text itself has not been edited since February. Select TWO things Anthropic documents as able to change the answers a prompt produces even when its wording is untouched.","options":[{"key":"A","text":"The remaining plan allowance, which Anthropic documents as lowering answer quality before any limit message appears."},{"key":"B","text":"The model that answered, since the model can be changed at any point in a conversation, from the next response on."},{"key":"C","text":"A system incident, which Anthropic documents as the cause whenever unchanged input starts producing changed output."},{"key":"D","text":"The project instructions and project knowledge behind the prompt, which tailor the responses given inside that project."},{"key":"E","text":"The age of the saved prompt, which Anthropic documents as degrading the wording of any prompt reused for months."}],"correct":["B","D"],"explanation":"Two things can move underneath a prompt whose wording is fixed. Anthropic documents that the model, effort level and thinking setting can be changed at any point in a conversation, with the change applying from Claude's next response, so the model that answered in July need not be the model that answered in February. It also documents project knowledge as material Claude uses to understand the context and background of chats inside that project, and project instructions as a way to tailor its responses there, so an edit or an upload by a colleague changes the conditions the prompt runs under without touching the prompt. Naming the variable that actually moved is what makes the next test informative. The item asserts no triage order: the only ordering Anthropic publishes for an unhelpful answer is the four help centre remedies, which begin with the prompt itself.","rationales":{"A":"Usage limits are signalled by explicit banners and by blocked responses. Anthropic documents no link between remaining allowance and the quality of an answer.","C":"The status page carries system-wide incidents, and Anthropic documents user-visible conditions such as capacity constraints that never appear there. One person's changed experience is not evidence of an incident.","E":"Prompts are stored text and do not decay. Nothing in Anthropic's documentation describes a saved prompt changing on its own over time."},"sources":[{"title":"Change the model, effort, and thinking settings","url":"https://support.claude.com/en/articles/8664678-change-the-model-effort-and-thinking-settings","date":"2026-08-20","basis":"verified-live"},{"title":"What are projects?","url":"https://support.claude.com/en/articles/9517075-what-are-projects","date":"2026-08-20","basis":"verified-live"},{"title":"My prompt isn't giving me a helpful answer","url":"https://support.claude.com/en/articles/7996857-my-prompt-isn-t-giving-me-a-helpful-answer","date":"2026-03-16","basis":"published"}],"tags":["change-diagnosis","isolate-the-variable","model-setting","project-configuration","unchanged-prompt"],"notes":{"caveat":"Repaired but independent confirmation did not complete; verified one pass less than other domains.","signal":"Community guides frame D7 as isolating what changed, but their checklists stay inside the prompt. Bank #1's items on an unhelpful answer work on the prompt itself and on usage and context; none of them names the model that answered or the surrounding project configuration as a variable that can move underneath an unchanged prompt. This item tests that invariance point and deliberately asserts no triage order."}},{"id":"D7-C004","domain":"D7","objective":"Identify, diagnose, and resolve issues with underperforming prompts or poor outputs","type":"single","difficulty":"medium","scenario":true,"stem":"A security analyst on a Team plan notices that partway through one conversation the answers started coming from a model other than the one she chose, and a notice to that effect appeared in the thread. She did not touch the model picker. She wants to know whether she has hit a fault. What does Anthropic document about this?","options":[{"key":"A","text":"A defect in the model picker; clearing the browser cache restores her selected model for the rest of the conversation."},{"key":"B","text":"A billing safeguard; as the five-hour usage limit approaches, conversations are moved onto a smaller model automatically."},{"key":"C","text":"A regional routing behaviour; the model she selected returns on its own as soon as capacity in her region recovers."},{"key":"D","text":"Expected behaviour; flagged requests can fall back to another model, and automatic switching can be turned off."}],"correct":["D"],"explanation":"Anthropic documents that Claude Opus 5 falls back automatically to Opus 4.8, its next-most-capable model, when automated safety classifiers flag a higher-risk offensive cybersecurity request such as exploit generation, binary-based vulnerability scanning or penetration testing. The checks review everything the model reads, including memory, content from connectors, web search results and files, not just the latest message. The blocked request is re-run on the less capable model in the same conversation, a notice explains the switch, the response is labelled with the model that answered, and the model picker then stays on the less capable model for the rest of the conversation, although the user can switch back from the picker at any time. Automatic switching can be turned off under Settings and Capabilities, in which case the conversation pauses instead.","rationales":{"A":"The notice in the thread is the product telling the user what it did. Cache clearing is documented for login problems, not for model selection.","B":"Approaching the five-hour limit produces explicit usage banners. Anthropic documents no downgrade to a smaller model as an allowance runs down.","C":"Capacity pressure is documented separately, and it surfaces as a capacity constraints message with a retry, not as a silent change of model."},"sources":[{"title":"Why Claude switched models in your conversation with Opus 5","url":"https://support.claude.com/en/articles/16049681-why-claude-switched-models-in-your-conversation-with-opus-5","date":"2026-08-20","basis":"verified-live"},{"title":"Troubleshoot Claude error messages","url":"https://support.claude.com/en/articles/12466728-troubleshoot-claude-error-messages","date":"2026-05-18","basis":"published"}],"tags":["model-switch","fallback","fault-vs-expected-behaviour","change-diagnosis","settings"],"notes":{"caveat":"Repaired but independent confirmation did not complete; verified one pass less than other domains.","signal":"Community guides list a changed model as one of the things to check when behaviour shifts, but assume the user changed it. Anthropic documents a case where the product changes it, which is exactly the situation a practitioner would otherwise misdiagnose as a service fault. Bank #1 has no item on automatic model fallback."}},{"id":"D7-C005","domain":"D7","objective":"Adjust approach based on feedback and results","type":"single","difficulty":"medium","scenario":true,"stem":"A project manager has rewritten the prompt that produces her client status summaries and believes the new version is better. Her director asks how she knows. She has ten real past cases, the original prompt and the new one, and an afternoon; there is no time to build a large automatically graded set. What is the strongest way to answer the question?","options":[{"key":"A","text":"Run both prompts over the same ten cases and score every output against criteria written down before the run."},{"key":"B","text":"Ask Claude to read the two prompts side by side and report which of them it judges to be the better written."},{"key":"C","text":"Use the new prompt for a fortnight, then ask the team afterwards whether the summaries felt more useful to them."},{"key":"D","text":"Run the new prompt over ten fresh cases and confirm that none of the resulting outputs contains an obvious error."}],"correct":["A"],"explanation":"Anthropic's guidance on success criteria calls for criteria that are measurable and specific rather than a judgement that the model performs well, and lists A/B testing, comparing performance against a baseline model or earlier version, among its quantitative methods. Its evaluation guidance adds that tests should mirror the real task distribution and be graded consistently. That guidance prefers volume and automated grading wherever they are available, and ten outputs scored on the author's unaided impression would settle nothing. What turns this afternoon's work into evidence is that the old prompt is run as the baseline over the same ten cases and the criteria are fixed before anyone sees the outputs, so the prompt is the only thing that changed.","rationales":{"B":"This grades the prompt rather than the output, and it uses the same system whose behaviour is in question. Nothing is measured against the old version on real cases.","C":"Two weeks of recollection is exactly the impression the director is questioning, and by then several other things will also have changed.","D":"Absence of an obvious error is not a comparison. Without running the old prompt on the same cases there is no baseline to show improvement against."},"sources":[{"title":"Define your success criteria - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/define-success","date":"2026-08-20","basis":"verified-live"},{"title":"Create strong empirical evaluations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests","date":"2026-08-20","basis":"verified-live"}],"tags":["confirm-the-fix","baseline-comparison","same-test-cases","success-criteria","evidence-over-impression"],"notes":{"caveat":"Repaired but independent confirmation did not complete; verified one pass less than other domains.","signal":"Vendor courses stress that candidates must be able to show a change worked rather than assert it, and several describe items about defending an improvement to a manager. Bank #1's evaluation item asks which design best matches the published guidance when there is time to build one evaluation set, and keys the large automatically graded option. This item covers the case the same guidance names but bank #1 does not test: a small comparison run against a baseline, where the discipline is holding the cases and the criteria constant rather than the size of the set."}},{"id":"D7-C006","domain":"D7","objective":"Adjust approach based on feedback and results","type":"multi","difficulty":"medium","scenario":true,"stem":"A colleague tells a team lead that Claude gave him a rubbish answer yesterday. Before changing anything, the team lead wants a failing case she can reproduce on demand. Select THREE things that turn the colleague's anecdote into a reproducible case.","options":[{"key":"A","text":"The exact prompt text he used, together with any files or documents that were attached to it."},{"key":"B","text":"A screenshot of the status page taken at roughly the time the colleague was doing the work."},{"key":"C","text":"Which model answered, and whether the work happened inside a project or in a plain chat."},{"key":"D","text":"The colleague's plan tier and how much of his five-hour allowance was left at the time."},{"key":"E","text":"An attempt to reproduce the failure in a fresh conversation before any change is made."}],"correct":["A","C","E"],"explanation":"A reproducible case needs the same inputs, the same configuration and a confirmed repeat. Anthropic's own guidance on adapting to new models is built on side-by-side comparison of the prompts that matter, which is only possible when the prompt and its attachments are captured exactly. The answering model matters because models differ in training cutoff and because Claude can fall back to another model, and a project matters because project instructions and project knowledge shape every response inside it. Reproducing before changing anything separates a one-off from a real failing case, and evaluation guidance is explicit that tests should mirror the real task.","rationales":{"B":"Most user-visible conditions are deliberately absent from the status page, and a single poor answer is not a system-wide incident. The screenshot would not identify the cause.","D":"Usage limits stop work with explicit banners rather than quietly lowering quality, so remaining allowance does not explain a poor answer or help reproduce it."},"sources":[{"title":"Adapt to new model personas after deprecations","url":"https://support.claude.com/en/articles/12738598-adapt-to-new-model-personas-after-deprecations","date":"2026-07-10","basis":"published"},{"title":"Create strong empirical evaluations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests","date":"2026-08-20","basis":"verified-live"},{"title":"Troubleshoot Claude error messages","url":"https://support.claude.com/en/articles/12466728-troubleshoot-claude-error-messages","date":"2026-05-18","basis":"published"}],"tags":["colleague-feedback","reproducible-case","diagnosis-inputs","model-identity","project-context"],"notes":{"caveat":"INTERNAL OVERLAP WITH D7-C002 IN THE SAME FILE. D7-C002 keys exactly two variables - 'The model that answered, since the model can be changed at any point in a conversation' and 'The project instructi","signal":"Study guides describe D7 items in which a manager acts on second-hand complaints about output quality, and frame the skill as turning anecdote into something testable. Bank #1's feedback items route complaints to Anthropic via thumbs-down; none asks the candidate to construct the failing case first."}},{"id":"D7-C007","domain":"D7","objective":"Optimize workflows for efficiency and effectiveness","type":"single","difficulty":"medium","scenario":true,"stem":"A consultant runs a recurring client update in Claude. Every Monday she opens a new conversation and pastes in last week's summary, the decisions taken and the outstanding actions, so that Claude has the background. She is on a Pro plan and reaches her weekly limit by Thursday. Which documented practice addresses the repetition?","options":[{"key":"A","text":"Keep one conversation running for the whole engagement, so the background never has to be sent to Claude again."},{"key":"B","text":"Ask Claude to find and refer back to the earlier conversations rather than pasting their content in again."},{"key":"C","text":"Buy a usage bundle, so that background repeated from an earlier chat stops counting against the weekly limit."},{"key":"D","text":"Paste the background as the first message every Monday, since material sent first is charged at a lower rate."}],"correct":["B"],"explanation":"Anthropic's usage limit best practices tell users to use Claude's chat search and memory capabilities to refer back to previous information instead of repeating it. The help centre describes asking for that in ordinary language, for example by asking what was discussed about a topic or asking Claude to find the earlier conversation on a subject, and notes that the search runs as a tool call in the chat. Chat search covers chats outside projects and, inside a project, that project's own conversations, and it is available on paid plans including Pro. The material the consultant re-sends every week is already held in her account, so retrieving it costs far less than sending it again.","rationales":{"A":"Anthropic documents longer conversations as consuming more of the allowance, particularly once automatic context management starts summarising earlier turns, so one endless thread makes the problem worse.","C":"A usage bundle is pre-purchased credit drawn on after the plan's included usage is exhausted. It pays for the repetition rather than removing it.","D":"Guidance about placing long material early concerns the quality of the answer, not what it costs. Anthropic documents no cheaper rate for the first message in a conversation."},"sources":[{"title":"Usage limit best practices","url":"https://support.claude.com/en/articles/9797557-usage-limit-best-practices","date":"2026-06-02","basis":"published"},{"title":"Use Claude's chat search and memory to build on previous context","url":"https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context","date":"2026-08-20","basis":"verified-live"},{"title":"How do usage and length limits work?","url":"https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work","date":"2026-07-13","basis":"published"}],"tags":["usage-optimisation","chat-search","memory","stop-repeating-context","recurring-workflow"],"notes":{"caveat":"STEM IS A CLOSE RE-SKIN OF BANK #1 D7-015. D7-015: 'A client-services consultant pastes the same 40-page delivery methodology into every new chat so Claude follows the house approach. She is hitting u","signal":"Guides that cover repeated context point candidates at Projects, which fits a stable reference document but not the record of a previous conversation. Anthropic names chat search and memory as the documented way to refer back to earlier chats without re-sending them, and bank #1 keys Projects, batching and providing material up front while treating restated context only as a wrong option."}},{"id":"D7-C008","domain":"D7","objective":"Adjust approach based on feedback and results","type":"single","difficulty":"medium","scenario":true,"stem":"A communications team built its house voice around a Claude model that Anthropic has now given a retirement date. On the replacement model the team's usual prompts come back in a noticeably different voice. The team wants to know what Anthropic advises, rather than waiting to see whether the old voice comes back. What does the help centre recommend?","options":[{"key":"A","text":"Wait for the retirement date, after which the replacement model takes on the voice of the model it succeeded."},{"key":"B","text":"Ask support to keep the retiring model on the account until the team has matched the voice on the new one."},{"key":"C","text":"Name the retiring model inside each prompt, so that the replacement reproduces the voice the team is used to."},{"key":"D","text":"Describe the tone and verbosity wanted in the conversation or project, and compare the models side by side."}],"correct":["D"],"explanation":"Anthropic's help centre article on adapting to new model personas recognises that the character of a particular model matters to people, and sets out what to do about it. It recommends experimenting with newer models as soon as possible and running side-by-side comparisons using your own preferred prompts, shaping behaviour by describing the qualities you want, such as tone and verbosity, within conversations or projects, and using memory, chat search and project instructions to carry those preferences across. It also notes that Anthropic has historically deprecated most models around a year after release, which makes this a recurring piece of workflow maintenance rather than a one-off.","rationales":{"A":"Retirement removes a model from service. Anthropic documents no mechanism by which a replacement inherits a retired model's voice on that date.","B":"Retirement dates apply to the model rather than to an account. The published advice is to move to the replacement early, not to seek an extension on the old one.","C":"Naming a model inside a prompt changes neither which model answers nor how it writes. The documented lever is describing the qualities wanted."},"sources":[{"title":"Adapt to new model personas after deprecations","url":"https://support.claude.com/en/articles/12738598-adapt-to-new-model-personas-after-deprecations","date":"2026-07-10","basis":"published"},{"title":"Use Claude's chat search and memory to build on previous context","url":"https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context","date":"2026-08-20","basis":"verified-live"}],"tags":["model-deprecation","persona-change","adapt-the-workflow","side-by-side-comparison","tone-instructions"],"notes":{"caveat":"Repaired but independent confirmation did not complete; verified one pass less than other domains.","signal":"Community material treats model change as a selection decision and stops at which model to pick. Bank #1 keys the lifecycle vocabulary and the notice period, but no item in any bank keys what Anthropic actually tells users to do when the replacement model writes differently from the one their workflow was built around."}},{"id":"D7-C009","domain":"D7","objective":"Identify, diagnose, and resolve issues with underperforming prompts or poor outputs","type":"single","difficulty":"medium","scenario":true,"stem":"On Monday morning several people across a Team plan report that Claude's answers have suddenly become noticeably more formal and follow a house format nobody asked for. It shows up in every project and in plain chats. Nobody has edited a prompt. What is the most likely explanation and the right next step?","options":[{"key":"A","text":"Each person's individual preferences were reset by a product update, so everyone should set their preferences again."},{"key":"B","text":"Memory has accumulated a formal tone from earlier chats, so each person should reset their own memory to clear it."},{"key":"C","text":"An admin has set or changed organization instructions, which apply to every conversation; raise it with an admin."},{"key":"D","text":"A new model version was rolled out to the plan overnight, so the fix is to select the previous model in the picker."}],"correct":["C"],"explanation":"Anthropic documents organization instructions as custom guidelines that admins, owners and primary owners on Team and Enterprise plans set for Claude to follow in every conversation across the organisation, typically covering communication standards and formatting. They take precedence over an individual user's preferences where the two conflict, ordinary users cannot view or edit them, and a change can take up to an hour to propagate. A change affecting many people at once, across projects and plain chats, with no prompt edited, matches this and can only be resolved by an admin.","rationales":{"A":"Individual preferences are per-account settings. They would not reset simultaneously for many people, and organization instructions override them regardless.","B":"Memory is built from an individual's own chats. It would not produce the same new house format across many separate accounts on the same morning.","D":"A model change would not impose a specific house format, and users cannot pin an organisation to a previous model from the picker."},"sources":[{"title":"Set organization instructions","url":"https://support.claude.com/en/articles/14546867-set-organization-instructions","date":"2026-08-20","basis":"verified-live"},{"title":"Use Claude's chat search and memory to build on previous context","url":"https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context","date":"2026-08-20","basis":"verified-live"}],"tags":["change-diagnosis","organization-instructions","instruction-precedence","escalate-to-admin","team-wide-symptom"],"notes":{"caveat":"Repaired but independent confirmation did not complete; verified one pass less than other domains.","signal":"Community guides list instructions edited by someone else as one of the changes to isolate in a D7 diagnosis, but only ever at project level. Organization instructions are the case where the practitioner cannot see or fix the change at all, and bank #1 has no item on them."}},{"id":"D7-C010","domain":"D7","objective":"Adjust approach based on feedback and results","type":"single","difficulty":"hard","scenario":true,"stem":"A team lead cannot reproduce a colleague's poor output. She pastes his prompt into her own long-running chat and gets a good answer back. Both are on the same plan with the same model selected. What best explains the difference, and what is the cleanest way to test the prompt on its own?","options":[{"key":"A","text":"Memory and earlier chats give the two accounts different context; test the prompt in an incognito chat, which uses no memory."},{"key":"B","text":"Prompts behave differently per account by design, so the colleague should raise a support ticket rather than test any further."},{"key":"C","text":"Pasting a prompt strips its formatting, so she should retype it by hand inside a project before drawing any conclusion at all."},{"key":"D","text":"Answers vary with load through the day, so she should repeat the test at exactly the hour her colleague originally ran it."}],"correct":["A"],"explanation":"Anthropic documents memory and chat search as enabled by default for eligible users, with Claude generating memory from a user's chats and building understanding of their role, projects and preferences over time. Two accounts running the same prompt are therefore not running the same context, and a long-running chat adds its own accumulated context on top. Incognito chats are documented as not accessing existing memory and not contributing to it, which makes them the clean surface for testing a prompt in isolation. Note that incognito is available only for standalone chats, not inside a project.","rationales":{"B":"The difference has a documented cause that the team lead can test herself. Escalating without isolating the variable hands over a case nobody can reproduce.","C":"Nothing in the documentation describes pasting as lossy, and moving the test into a project would add project instructions and knowledge as further variables.","D":"Load is documented as producing an explicit capacity constraints message with a retry, not as quietly changing the quality of an answer."},"sources":[{"title":"Use Claude's chat search and memory to build on previous context","url":"https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context","date":"2026-08-20","basis":"verified-live"},{"title":"Use incognito chats","url":"https://support.claude.com/en/articles/12260368-use-incognito-chats","date":"2026-07-16","basis":"published"}],"tags":["reproducibility","memory","incognito-chat","clean-test","colleague-feedback"],"notes":{"caveat":"EXPLANATION OVERSTATES THE SOURCE ON DEFAULT-ON MEMORY. The explanation asserts 'Anthropic documents memory and chat search as enabled by default for eligible users'. Fetched live, support.claude.com/","signal":"Guides that cover the colleague-complaint scenario stop at asking for the prompt, and none explains why the same prompt legitimately behaves differently for two people. Memory being on by default, and incognito being the memory-free surface, is the documented mechanism behind the failure to reproduce."}},{"id":"D7-C011","domain":"D7","objective":"Optimize workflows for efficiency and effectiveness","type":"single","difficulty":"medium","scenario":true,"stem":"A team lead has lowered the effort setting for her team's routine drafting work to make the plan go further, and assumes that also stops Claude thinking at length about trivial tasks. Every routine answer still arrives with an expandable Thinking section above it. What does Anthropic document about these two settings?","options":[{"key":"A","text":"Effort and thinking are one control under two names, so the lower effort setting has already switched thinking off."},{"key":"B","text":"They are separate settings, and turning extended thinking off where it is not needed is a documented usage lever."},{"key":"C","text":"Thinking cannot be changed once a conversation has started, so the team must open a new conversation for each task."},{"key":"D","text":"The Thinking section is only a display preference, so collapsing it removes the work it represents from the answer."}],"correct":["B"],"explanation":"Anthropic's settings article states that thinking and effort are separate settings and that any combination of the two can be used, that the effort level controls how much thinking Claude applies to a response, and that an expandable Thinking section appears above the response when thinking is on. The usage article lists disabling extended thinking when it is unnecessary and lowering effort levels for routine tasks as two separate ways to slow consumption of the allowance. Lowering effort alone therefore leaves one of the two documented levers untouched.","rationales":{"A":"The settings article is explicit that thinking and effort are separate settings and that any combination of the two can be used, so one does not switch the other off.","C":"The same article states that the model, effort level and thinking setting can each be changed at any point in a conversation, with the change applying from Claude's next response.","D":"The section is expandable so that the reasoning can be read. Collapsing it hides work that has already been done, so visibility is not the lever."},"sources":[{"title":"Change the model, effort, and thinking settings","url":"https://support.claude.com/en/articles/8664678-change-the-model-effort-and-thinking-settings","date":"2026-08-20","basis":"verified-live"},{"title":"How do usage and length limits work?","url":"https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work","date":"2026-07-13","basis":"published"}],"tags":["usage-optimisation","effort-vs-thinking","separate-settings","routine-tasks","allowance"],"notes":{"caveat":"Repaired but independent confirmation did not complete; verified one pass less than other domains.","signal":"Community usage advice treats effort as the single dial for how hard Claude works and therefore for how fast an allowance goes. Anthropic documents thinking as a separate setting with its own usage cost, and no item in bank #1 or in the other community files keys extended thinking as a lever distinct from effort."}}],"caution":"Supplementary bank. 28 items carry a caveat noting a minor unresolved defect, shown with the answer. Use the core bank as the primary study asset."}];

/* ---------- tiny helpers ---------- */

var MEM = {};

var K = { packs: 'proctor.packs', hist: 'proctor.history', sess: 'proctor.session', prefs: 'proctor.prefs' };

/* ---------- dataset normalisation ------------------------------------- *
 * Accepts: native exam-pack JSON, a bank object with an `items` array,
 * a bare array of items, JSONL, or CSV. Field names are sniffed, so most
 * question banks import without being reshaped first.
 * ---------------------------------------------------------------------- */
var KEYS = 'ABCDEFGHIJ'.split('');

function firstOf(o) {
  for (var i = 1; i < arguments.length; i++) {
    var k = arguments[i];
    if (o[k] !== undefined && o[k] !== null && o[k] !== '') return o[k];
  }
  return undefined;
}

function normOptions(raw) {
  var out = [], i;
  var opts = firstOf(raw, 'options', 'choices', 'answers', 'opts');
  if (Array.isArray(opts)) {
    for (i = 0; i < opts.length; i++) {
      var o = opts[i];
      if (o == null) continue;
      if (typeof o === 'string') out.push({ key: KEYS[i], text: o });
      else out.push({ key: String(firstOf(o, 'key', 'label', 'id') || KEYS[i]).trim().toUpperCase(), text: String(firstOf(o, 'text', 'value', 'option', 'body') || '') });
    }
  } else if (opts && typeof opts === 'object') {
    Object.keys(opts).forEach(function (k) { out.push({ key: k.trim().toUpperCase(), text: String(opts[k]) }); });
  } else {
    for (i = 0; i < KEYS.length; i++) {
      var L = KEYS[i], v = firstOf(raw, 'option_' + L.toLowerCase(), 'option_' + L, 'opt_' + L.toLowerCase(), L, L.toLowerCase(), 'choice_' + L.toLowerCase(), 'answer_' + L.toLowerCase());
      if (v !== undefined) out.push({ key: L, text: String(v) });
    }
  }
  return out.filter(function (o) { return o.text && String(o.text).trim(); });
}

function normCorrect(raw, options) {
  var c = firstOf(raw, 'correct', 'answer', 'correct_answer', 'correctAnswers', 'key', 'solution');
  if (c === undefined) return [];
  var list = Array.isArray(c) ? c : String(c).split(/[,;|\s]+/);
  var valid = {}; options.forEach(function (o) { valid[o.key] = 1; });
  var out = [];
  list.forEach(function (v) {
    if (v === null || v === '') return;
    var s = String(v).trim().toUpperCase();
    if (valid[s]) { out.push(s); return; }
    if (/^\d+$/.test(s)) {                       // 0- or 1-based index
      var n = parseInt(s, 10);
      if (options[n]) { out.push(options[n].key); return; }
      if (options[n - 1]) { out.push(options[n - 1].key); return; }
    }
    var m = options.filter(function (o) { return o.text.trim().toUpperCase() === s; })[0];
    if (m) out.push(m.key);
  });
  return out.filter(function (v, i, a) { return a.indexOf(v) === i; });
}

function normItem(raw, i) {
  if (!raw || typeof raw !== 'object') return null;
  var options = normOptions(raw);
  var stem = firstOf(raw, 'stem', 'question', 'prompt', 'q', 'text', 'body');
  if (!stem || options.length < 2) return null;
  var correct = normCorrect(raw, options);
  if (!correct.length) return null;

  var t = String(firstOf(raw, 'type', 'question_type') || '').toLowerCase();
  var multi = /multi(ple)?[_ -]?(response|select|answer)|checkbox|msq/.test(t) || (!t && correct.length > 1) || t === 'multi';
  var diff = String(firstOf(raw, 'difficulty', 'level') || 'medium').toLowerCase();
  if (['easy', 'medium', 'hard'].indexOf(diff) < 0) diff = /1|beginner|basic/.test(diff) ? 'easy' : (/3|advanced|expert/.test(diff) ? 'hard' : 'medium');

  var tags = firstOf(raw, 'tags', 'topics', 'keywords') || [];
  if (typeof tags === 'string') tags = tags.split(/[,;|]/).map(function (s) { return s.trim(); }).filter(Boolean);

  var srcs = firstOf(raw, 'sources', 'references', 'citations') || [];
  if (!Array.isArray(srcs)) srcs = [];
  srcs = srcs.map(function (s) {
    if (typeof s === 'string') return { title: s, url: /^https?:/.test(s) ? s : '', date: '', basis: '' };
    return { title: firstOf(s, 'title', 'name', 'source') || '', url: firstOf(s, 'url', 'link', 'href') || '',
             date: firstOf(s, 'date', 'published') || '', basis: firstOf(s, 'basis', 'date_basis') || '' };
  });

  var notes = raw.notes && typeof raw.notes === 'object' ? raw.notes : {};
  if (raw.known_issue) notes.caveat = raw.known_issue;
  if (raw.community_signal) notes.signal = raw.community_signal;

  return {
    id: String(firstOf(raw, 'id', 'qid', 'ref') || ('Q' + (i + 1))),
    domain: String(firstOf(raw, 'domain', 'domain_id', 'category', 'section', 'topic') || ''),
    domainName: String(firstOf(raw, 'domainName', 'domain_name') || ''),
    objective: String(firstOf(raw, 'objective', 'skill', 'learning_objective') || ''),
    type: multi ? 'multi' : 'single',
    difficulty: diff,
    scenario: !!firstOf(raw, 'scenario', 'scenario_based'),
    stem: String(stem),
    options: options,
    correct: correct,
    explanation: String(firstOf(raw, 'explanation', 'rationale', 'why', 'feedback') || ''),
    rationales: firstOf(raw, 'rationales', 'distractor_rationales', 'option_rationales') || {},
    sources: srcs,
    tags: tags,
    notes: notes
  };
}

function parseCSV(text) {
  var rows = [], row = [], cur = '', q = false, i, c;
  text = text.replace(/^﻿/, '');
  for (i = 0; i < text.length; i++) {
    c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c === '\r') { /* skip */ }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  if (!rows.length) return [];
  var head = rows.shift().map(function (h) { return h.trim(); });
  return rows.filter(function (r) { return r.some(function (v) { return v !== ''; }); })
    .map(function (r) {
      var o = {};
      head.forEach(function (h, n) {
        var v = r[n] === undefined ? '' : r[n];
        if (v === 'True') v = true; else if (v === 'False') v = false;
        o[h] = v;
      });
      return o;
    });
}

function parseText(text, filename) {
  var trimmed = text.trim();
  if (!trimmed) throw new Error('The file is empty.');
  if (trimmed[0] === '{' || trimmed[0] === '[') {
    try { return JSON.parse(trimmed); } catch (e) { /* fall through to JSONL */ }
  }
  if (/\.jsonl$|\.ndjson$/i.test(filename) || /^\s*\{/.test(trimmed)) {
    var rows = [], bad = 0;
    trimmed.split(/\r?\n/).forEach(function (l) {
      l = l.trim(); if (!l) return;
      try { rows.push(JSON.parse(l)); } catch (e) { bad++; }
    });
    if (rows.length) return rows;
    if (bad) throw new Error('Could not read this as JSON or JSONL.');
  }
  return parseCSV(text);
}

function packFromRaw(raw, filename) {
  var base = filename.replace(/\.[a-z0-9]+$/i, '').replace(/[-_]+/g, ' ').trim();
  var meta = {}, rawItems;
  if (Array.isArray(raw)) rawItems = raw;
  else if (raw && Array.isArray(raw.items)) { meta = raw; rawItems = raw.items; }
  else if (raw && Array.isArray(raw.questions)) { meta = raw; rawItems = raw.questions; }
  else throw new Error('No question list found. Expected an array of questions, or an object with an "items" array.');

  var items = [], skipped = 0;
  rawItems.forEach(function (r, i) {
    var it = normItem(r, i);
    if (it) items.push(it); else skipped++;
  });
  if (!items.length) throw new Error('No usable questions found. Each needs a question, at least two options, and a correct answer.');

  var m = meta.metadata || meta;
  var domains = Array.isArray(meta.domains) ? meta.domains.map(function (d) {
    return { id: String(d.id || d.code || ''), name: String(d.name || d.title || d.id || ''), weight: Number(d.weight) || 0 };
  }) : [];
  if (!domains.length) {
    var seen = {};
    items.forEach(function (it) {
      if (!it.domain) return;
      if (!seen[it.domain]) seen[it.domain] = { id: it.domain, name: it.domainName || it.domain, weight: 0 };
    });
    domains = Object.keys(seen).map(function (k) { return seen[k]; }).sort(function (a, b) { return a.id < b.id ? -1 : 1; });
  }
  var cfg = meta.config || {};
  return {
    format: 'exam-pack', version: 1,
    id: String(meta.id || ('pack-' + uid())),
    name: String(meta.name || m.exam_name || m.dataset || base || 'Imported dataset'),
    vendor: String(meta.vendor || m.vendor || ''),
    examCode: String(meta.examCode || m.exam_code || ''),
    description: String(meta.description || m.provenance || ''),
    caution: meta.caution || '',
    config: {
      examLength: Number(cfg.examLength) || Math.min(60, items.length),
      timeLimitMinutes: Number(cfg.timeLimitMinutes) || Math.max(10, Math.round(Math.min(60, items.length) * 2)),
      passPercent: Number(cfg.passPercent) || 70,
      scaleMin: Number(cfg.scaleMin) || 0,
      scaleMax: Number(cfg.scaleMax) || 100,
      scalePass: cfg.scalePass !== undefined ? Number(cfg.scalePass) : (Number(cfg.passPercent) || 70),
      blueprintWeighted: cfg.blueprintWeighted !== false && domains.some(function (d) { return d.weight > 0; })
    },
    domains: domains,
    items: items,
    _skipped: skipped
  };
}

<script>
"use strict";

/* ===================== application state ===================== */
var APP = {
  view: 'library',
  packs: [],
  session: null,
  result: null,
  history: [],
  prefs: { disabled: {}, setup: null }
};

function allDomains() {
  var out = [], seen = {};
  enabledPacks().forEach(function (p) {
    p.domains.forEach(function (d) {
      if (!d.id) return;
      if (!seen[d.id]) { seen[d.id] = { id: d.id, name: d.name, weight: d.weight }; out.push(seen[d.id]); }
      else if (d.weight > seen[d.id].weight) seen[d.id].weight = d.weight;
    });
  });
  out.sort(function (a, b) { return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; });
  return out;
}
function domainName(id) {
  var d = allDomains().filter(function (x) { return x.id === id; })[0];
  return d ? d.name : (id || 'Unclassified');
}
function enabledPacks() {
  return APP.packs.filter(function (p) { return !APP.prefs.disabled[p.id]; });
}
function packById(id) { return APP.packs.filter(function (p) { return p.id === id; })[0]; }
function findItem(id) {
  for (var i = 0; i < APP.packs.length; i++) {
    var m = APP.packs[i].items.filter(function (x) { return x.id === id; })[0];
    if (m) return m;
  }
  return null;
}
function activeConfig() {
  var p = enabledPacks()[0];
  return p ? p.config : { examLength: 20, timeLimitMinutes: 40, passPercent: 70, scaleMin: 0, scaleMax: 100, scalePass: 70 };
}

/* attempt history -> per-item record */
function itemRecord() {
  var rec = {};
  APP.history.forEach(function (a) {
    (a.results || []).forEach(function (r) {
      var e = rec[r.i] || (rec[r.i] = { seen: 0, wrong: 0, lastOk: null, lastTs: 0 });
      e.seen++; if (!r.ok) e.wrong++;
      if (a.ts > e.lastTs) { e.lastTs = a.ts; e.lastOk = !!r.ok; }
    });
  });
  return rec;
}

/* ===================== load / persist ===================== */
function loadAll() {
  var imported = STORE.get(K.packs, []);
  APP.prefs = Object.assign({ disabled: {}, setup: null }, STORE.get(K.prefs, {}));
  APP.history = STORE.get(K.hist, []);
  APP.packs = BUNDLED.map(function (p) { return Object.assign({}, p, { _src: 'bundled' }); })
    .concat(imported.map(function (p) { return Object.assign({}, p, { _src: 'imported' }); }));
  APP.session = STORE.get(K.sess, null);
}
function saveImported() {
  STORE.set(K.packs, APP.packs.filter(function (p) { return p._src === 'imported'; })
    .map(function (p) { var c = Object.assign({}, p); delete c._src; return c; }));
}
function savePrefs() { STORE.set(K.prefs, APP.prefs); }
function saveHistory() { STORE.set(K.hist, APP.history.slice(-80)); }
function saveSession() { if (APP.session) STORE.set(K.sess, APP.session); else STORE.del(K.sess); }

/* ===================== chrome ===================== */
function toast(msg, kind) {
  var host = $('#toast-host');
  host.innerHTML = '<div class="toast ' + (kind || '') + '">' + esc(msg) + '</div>';
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { host.innerHTML = ''; }, 4200);
}
function modal(html) {
  $('#modal-host').innerHTML = '<div class="modal" data-act="modal-bg"><div class="box">' + html + '</div></div>';
}
function closeModal() { $('#modal-host').innerHTML = ''; }

var NAV = [
  { id: 'library', label: 'Library' },
  { id: 'setup', label: 'New exam' },
  { id: 'exam', label: 'In progress' },
  { id: 'results', label: 'Results' },
  { id: 'history', label: 'History' }
];
function renderNav() {
  $('#nav').innerHTML = NAV.filter(function (n) {
    if (n.id === 'exam') return !!APP.session && !APP.session.finishedAt;
    if (n.id === 'results') return !!APP.result;
    return true;
  }).map(function (n) {
    return '<button data-act="go" data-view="' + n.id + '" aria-current="' + (APP.view === n.id) + '">' + esc(n.label) + '</button>';
  }).join('');

  var right = '';
  if (APP.session && !APP.session.finishedAt && APP.view !== 'exam') {
    right = '<button class="btn sm primary" data-act="go" data-view="exam">Resume exam</button>';
  } else if (APP.view === 'library' || APP.view === 'history') {
    var n = enabledPacks().reduce(function (a, p) { return a + p.items.length; }, 0);
    right = '<span class="eyebrow">' + n + ' questions active</span>';
  }
  $('#topright').innerHTML = right;
}

function go(view) {
  if (view === 'exam' && (!APP.session || APP.session.finishedAt)) view = 'setup';
  if (view === 'results' && !APP.result) view = 'history';
  APP.view = view;
  render();
  window.scrollTo(0, 0);
}
function render() {
  stopTimer();

  $('#main').innerHTML = v ? v() : '';
  renderNav();
  if (APP.view === 'exam') afterExam();
  if (APP.view === 'results') afterResults();
  if (APP.view === 'history') afterHistory();
  if (APP.view === 'library') afterLibrary();
  if (APP.view === 'setup') afterSetup();
}

/* ===================== view: library ===================== */
function viewLibrary() {
  var packs = APP.packs.map(function (p) {
    var on = !APP.prefs.disabled[p.id];
    var mc = p.items.filter(function (i) { return i.type === 'single'; }).length;
    var doms = {}; p.items.forEach(function (i) { if (i.domain) doms[i.domain] = 1; });
    return '' +
      '<article class="pack" data-on="' + (on ? 1 : 0) + '">' +
        '<div class="row between" style="align-items:flex-start">' +
          '<div style="display:flex;flex-direction:column;gap:6px;min-width:0">' +
            '<h3>' + esc(p.name) + '</h3>' +
            '<div class="row" style="gap:6px">' +
              (p.examCode ? '<span class="chip brass">' + esc(p.examCode) + '</span>' : '') +
              (p.vendor ? '<span class="chip">' + esc(p.vendor) + '</span>' : '') +
              '<span class="chip">' + (p._src === 'bundled' ? 'Built in' : 'Imported') + '</span>' +
            '</div>' +
          '</div>' +
          '<label class="check' + (on ? ' on' : '') + '" title="Include in exams">' +
            '<input type="checkbox" data-act="toggle-pack" data-id="' + esc(p.id) + '"' + (on ? ' checked' : '') + '>' +
            (on ? 'Active' : 'Off') +
          '</label>' +
        '</div>' +
        (p.description ? '<p class="desc">' + esc(p.description) + '</p>' : '') +
        '<div class="nums">' +
          '<div><b>' + p.items.length + '</b><span>Questions</span></div>' +
          '<div><b>' + Object.keys(doms).length + '</b><span>Domains</span></div>' +
          '<div><b>' + mc + '<span style="font-size:13px;color:var(--faint)"> / </span>' + (p.items.length - mc) + '</b><span>Single / Multi</span></div>' +
        '</div>' +
        (p.caution ? '<p class="note">' + esc(p.caution) + '</p>' : '') +
        '<div class="row" style="gap:8px;margin-top:auto;padding-top:4px">' +
          '<button class="btn sm ghost" data-act="pack-detail" data-id="' + esc(p.id) + '">Breakdown</button>' +
          '<button class="btn sm ghost" data-act="pack-copy" data-id="' + esc(p.id) + '">Copy as JSON</button>' +
          (p._src === 'imported' ? '<button class="btn sm danger" data-act="pack-remove" data-id="' + esc(p.id) + '">Remove</button>' : '') +
        '</div>' +
      '</article>';
  }).join('');

  var total = enabledPacks().reduce(function (a, p) { return a + p.items.length; }, 0);

  return '<div class="wrap stack">' +
    '<div class="row between" style="align-items:flex-end;gap:20px">' +
      '<div class="pagehead">' +
        '<span class="eyebrow">Question library</span>' +
        '<h1>Datasets</h1>' +
        '<p>Every active dataset feeds the question pool. Turn one off to sit an exam drawn only from the others, or add your own bank in JSON, JSONL or CSV.</p>' +
      '</div>' +
      '<button class="btn primary lg" data-act="go" data-view="setup"' + (total ? '' : ' disabled') + '>Build an exam</button>' +
    '</div>' +
    '<div class="packs">' + packs + '</div>' +
    '<div class="sect">' +
      '<h2>Add a dataset</h2>' +
      '<div class="dz" id="dz">' +
        '<h3>Drop a question bank here</h3>' +
        '<p class="muted" style="font-size:13px;max-width:56ch;margin:0 auto 14px">' +
          'JSON, JSONL or CSV. Field names are sniffed on the way in, so most banks import unchanged. ' +
          'Questions missing a stem, two options or an answer key are skipped and counted.</p>' +
        '<div class="row" style="justify-content:center">' +
          '<button class="btn" data-act="pick-file">Choose a file</button>' +
          '<button class="btn ghost" data-act="paste-json">Paste JSON</button>' +
          '<button class="btn ghost" data-act="format-help">Expected format</button>' +
        '</div>' +
        '<input type="file" id="file" accept=".json,.jsonl,.ndjson,.csv,.txt" multiple hidden>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function afterLibrary() {
  var dz = $('#dz'), fi = $('#file');
  if (!dz) return;
  fi.addEventListener('change', function () {
    Array.prototype.forEach.call(fi.files, readFile);
    fi.value = '';
  });
  ['dragenter', 'dragover'].forEach(function (e) {
    dz.addEventListener(e, function (ev) { ev.preventDefault(); dz.classList.add('hot'); });
  });
  ['dragleave', 'drop'].forEach(function (e) {
    dz.addEventListener(e, function (ev) { ev.preventDefault(); dz.classList.remove('hot'); });
  });
  dz.addEventListener('drop', function (ev) {
    if (ev.dataTransfer && ev.dataTransfer.files) Array.prototype.forEach.call(ev.dataTransfer.files, readFile);
  });
}

function readFile(file) {
  var r = new FileReader();
  r.onload = function () { importText(String(r.result), file.name); };
  r.onerror = function () { toast('Could not read ' + file.name + '.', 'bad'); };
  r.readAsText(file);
}

function importText(text, filename) {
  var pack;
  try { pack = packFromRaw(parseText(text, filename), filename || 'pasted.json'); }
  catch (e) { toast(e.message || 'Import failed.', 'bad'); return; }
  if (packById(pack.id)) pack.id = pack.id + '-' + uid().slice(0, 4);
  pack._src = 'imported';
  APP.packs.push(pack);
  saveImported();
  APP.setup = null;                    /* new domains need a fresh filter map */
  toast('Added ' + pack.name + ' - ' + plural(pack.items.length, 'question') +
    (pack._skipped ? ', ' + pack._skipped + ' skipped' : ''), 'good');
  render();
}

function packDetail(id) {
  var p = packById(id); if (!p) return;
  var byDom = {}, byDiff = { easy: 0, medium: 0, hard: 0 };
  p.items.forEach(function (i) {
    byDom[i.domain || '-'] = (byDom[i.domain || '-'] || 0) + 1;
    byDiff[i.difficulty] = (byDiff[i.difficulty] || 0) + 1;
  });
  var rows = Object.keys(byDom).sort().map(function (d) {
    var dm = p.domains.filter(function (x) { return x.id === d; })[0];
    return '<tr><td class="mono">' + esc(d) + '</td><td>' + esc(dm ? dm.name : '') + '</td>' +
      '<td class="num">' + byDom[d] + '</td>' +
      '<td class="num dim">' + (dm && dm.weight ? dm.weight + '%' : '-') + '</td></tr>';
  }).join('');
  modal('<h2 style="font-size:17px">' + esc(p.name) + '</h2>' +
    '<div class="scroll"><table class="tbl"><thead><tr><th>Code</th><th>Domain</th><th style="text-align:right">Items</th><th style="text-align:right">Blueprint</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<p class="muted" style="font-size:13px">Difficulty mix: ' + byDiff.easy + ' easy, ' + byDiff.medium + ' medium, ' + byDiff.hard + ' hard. ' +
    'Pass mark ' + p.config.passPercent + '%.</p>' +
    '<div class="row" style="justify-content:flex-end"><button class="btn" data-act="close-modal">Close</button></div>');
}

function formatHelp() {
  var sample = '{\n' +
    '  "name": "My exam",\n' +
    '  "config": { "examLength": 60, "timeLimitMinutes": 120, "passPercent": 72 },\n' +
    '  "domains": [{ "id": "D1", "name": "Fundamentals", "weight": 40 }],\n' +
    '  "items": [{\n' +
    '    "id": "D1-001",\n' +
    '    "domain": "D1",\n' +
    '    "objective": "State the golden rule",\n' +
    '    "type": "single",\n' +
    '    "difficulty": "easy",\n' +
    '    "stem": "Which statement is correct?",\n' +
    '    "options": [{ "key": "A", "text": "..." }, { "key": "B", "text": "..." }],\n' +
    '    "correct": ["B"],\n' +
    '    "explanation": "Shown after the answer.",\n' +
    '    "rationales": { "A": "Why A is wrong." },\n' +
    '    "sources": [{ "title": "Docs", "url": "https://...", "date": "2026-08-01" }],\n' +
    '    "tags": ["clarity"]\n' +
    '  }]\n}';
  modal('<h2 style="font-size:17px">Expected format</h2>' +
    '<p class="muted" style="font-size:13.5px;line-height:1.6">This is the native shape. Anything close to it works: ' +
    '<code class="mono">question</code>/<code class="mono">prompt</code> stand in for <code class="mono">stem</code>, ' +
    '<code class="mono">answer</code> for <code class="mono">correct</code>, and CSV columns ' +
    '<code class="mono">option_a</code>&hellip;<code class="mono">option_f</code> become options. ' +
    'A bare array of questions is fine too - the file name becomes the dataset name.</p>' +
    '<pre class="mono" style="background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:14px;overflow:auto;font-size:11.5px;line-height:1.6;max-height:46vh">' + esc(sample) + '</pre>' +
    '<div class="row" style="justify-content:flex-end"><button class="btn" data-act="close-modal">Close</button></div>');
}

function pasteJson() {
  modal('<h2 style="font-size:17px">Paste a question bank</h2>' +
    '<textarea id="paste" rows="10" placeholder="Paste JSON, JSONL or CSV" style="font-family:var(--data);font-size:12px;resize:vertical"></textarea>' +
    '<div class="row" style="justify-content:flex-end">' +
      '<button class="btn ghost" data-act="close-modal">Cancel</button>' +
      '<button class="btn primary" data-act="paste-go">Import</button>' +
    '</div>');
  setTimeout(function () { var t = $('#paste'); if (t) t.focus(); }, 30);
}

function copyText(text, label) {
  var done = function () { toast((label || 'Copied') + ' to the clipboard.', 'good'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { fallback(); });
  } else fallback();
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); }
    catch (e) { toast('Copying is blocked here.', 'bad'); }
    document.body.removeChild(ta);
  }
}
