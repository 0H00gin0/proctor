lty":"easy","scenario":true,"stem":"A practitioner reviews a Claude-drafted competitor analysis and judges two of its conclusions to be off target. What is the MOST productive next step?","options":[{"key":"A","text":"Treat the evaluation as the final step and either accept or discard the analysis as it stands."},{"key":"B","text":"Log the two conclusions as defects and move the whole task to a different model."},{"key":"C","text":"Feed the draft back to Claude as input and ask it to verify or expand on those two conclusions."},{"key":"D","text":"Escalate the draft to a second human reviewer, because evaluation ends her involvement."}],"correct":["C"],"explanation":"Iterative refinement is documented as using Claude's outputs as inputs for follow-up prompts, asking it to verify or expand on previous statements, which can catch and correct inconsistencies. Evaluation therefore feeds the next prompt rather than terminating the work.","rationales":{"A":"Treating evaluation as a terminal accept-or-discard gate throws away the documented route to a corrected draft.","B":"Switching models is a model selection decision and does not address conclusions that were poorly grounded in the first place.","D":"Escalation is warranted by the risk class of the output, not by every off-target draft, and it is not the technique being described."},"sources":[{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"}],"tags":["iterative-refinement","evaluation-feeds-back","verify-or-expand"]},{"id":"D2-037","domain":"D2","objective":"Determine when human review or additional verification is required","type":"single","difficulty":"hard","scenario":true,"stem":"Two Claude outputs are ready to send. The first is a summary of internal meeting notes for a team channel, and Claude added no caveats. The second is a draft response to a regulator's information request, and Claude added a note that the details should be confirmed. Which statement best describes when human review is triggered?","options":[{"key":"A","text":"Neither output needs review at this stage because both are still drafts."},{"key":"B","text":"Review is driven by whether Claude flagged uncertainty, so only the second output needs review because of the caveat it carries."},{"key":"C","text":"Review is driven by the risk and audience of the output, so the regulator response always needs qualified review."},{"key":"D","text":"Both outputs need identical review, because all AI-generated content carries the same level of risk."}],"correct":["C"],"explanation":"A practitioner is expected to recognise when human expertise, validation or escalation is required, and that judgement turns on the risk class and audience of the output. A regulatory submission is high-stakes and externally consequential whether or not the model volunteered a caveat.","rationales":{"A":"Draft status is not a defence. The point of review is to catch problems before the draft becomes an external submission.","B":"This is the named trap: treating the model's own caveat as the trigger. The caveat here happens to coincide with the higher-risk item, but relying on it would leave an uncaveated high-risk output unreviewed.","D":"Applying the same review depth to internal meeting notes and a regulatory submission wastes reviewer capacity and misreads the risk-based principle."},"sources":[{"title":"Claude Certified Associate - Foundations Exam Guide, Version 1.0, Section 3 Intended Audience","url":"https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542847/Claude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf","date":"2026-07-08","basis":"published"},{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"}],"tags":["risk-based-review","audience","caveat-is-not-a-trigger"]},{"id":"D2-038","domain":"D2","objective":"Determine when human review or additional verification is required","type":"single","difficulty":"medium","scenario":true,"stem":"A marketing manager receives a Claude-drafted note explaining the VAT treatment of a new cross-border service. Nothing in it looks wrong to her, but she has no tax background and the note will be sent to a customer. What is the MOST appropriate action?","options":[{"key":"A","text":"Route the note to the organisation's tax specialist to validate before it is relied on."},{"key":"B","text":"Search the web for one page that agrees with the note and treat that as confirmation of it."},{"key":"C","text":"Ask Claude to explain the reasoning again, and rely on the note if the explanation is consistent."},{"key":"D","text":"Rely on the note, because nothing in it appeared incorrect on a careful read by the manager herself."}],"correct":["A"],"explanation":"Recognising when human expertise, validation or escalation is required is part of the capability this credential describes. A reader without domain expertise cannot detect a subtly wrong tax treatment by reading carefully, so the correct move is to route the output to someone qualified to judge it before a customer relies on it.","rationales":{"B":"A single agreeing page found by search is confirmation bias, not validation, and it does not establish that the page applies to this service.","C":"A consistent re-explanation is another model output. Repetition demonstrates stability, not correctness.","D":"Nothing looking wrong to a non-specialist is exactly the condition under which a plausible, confident error passes through unchallenged."},"sources":[{"title":"Claude Certified Associate - Foundations Exam Guide, Version 1.0, Section 3 Intended Audience","url":"https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542847/Claude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf","date":"2026-07-08","basis":"published"},{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"}],"tags":["domain-expertise","escalation","external-audience"]},{"id":"D2-039","domain":"D2","objective":"Evaluate Claude-generated outputs for accuracy and completeness","type":"single","difficulty":"medium","scenario":true,"stem":"A policy officer asks Claude to summarise a 40-page consultation response. Every statement in the summary checks out against the source, but the summary omits the section on transitional arrangements, which is material for her readers. How should she characterise the output?","options":[{"key":"A","text":"It is accurate but incomplete, and incompleteness is always a defect in its own right."},{"key":"B","text":"It is inaccurate, because leaving out a material section makes the summary itself misleading."},{"key":"C","text":"It is acceptable, because a summary is expected to omit material and accuracy is what matters here."},{"key":"D","text":"It is a formatting problem, and asking for a longer summary will resolve it without further checks."}],"correct":["A"],"explanation":"Outputs are evaluated for accuracy and completeness, and the two properties fail independently. Here nothing stated is wrong, so the defect is coverage: a material section is missing. Naming it correctly matters, because the remedy is a coverage check of the summary against the source rather than a re-check of the statements already present.","rationales":{"B":"Calling a true statement inaccurate misdiagnoses the defect. The summary is misleading by omission, which is a completeness failure, not an accuracy one.","C":"Summaries omit detail, but a section material to the readers is not detail. Accepting the gap on accuracy grounds is the trap.","D":"Length is not the issue. A longer summary produced without a coverage check can miss exactly the same section."},"sources":[{"title":"Claude Certified Associate - Foundations Exam Guide, Version 1.0, Section 6 Domain 2 objectives","url":"https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542847/Claude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf","date":"2026-07-08","basis":"published"},{"title":"Define your success criteria - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/define-success","date":"2026-08-19","basis":"verified-live"}],"tags":["completeness","omission","accuracy-is-not-completeness"]},{"id":"D2-040","domain":"D2","objective":"Organize and curate information and select appropriate output formats (artifacts, inline, structured data)","type":"multi","difficulty":"hard","scenario":true,"stem":"A business analyst has finished a six-page competitor review with Claude that two colleagues will edit and the team will reuse next quarter. She also wants a one-line answer to a follow-up question about one competitor's list price. Which TWO format choices are appropriate? Select TWO.","options":[{"key":"A","text":"Deliver the one-line price answer inline in the conversation."},{"key":"B","text":"Deliver the one-line price answer as its own artifact so it can be tracked separately."},{"key":"C","text":"Deliver the six-page review inline so colleagues do not have to open anything."},{"key":"D","text":"Deliver both the review and the price answer as structured data so everything is machine-readable."},{"key":"E","text":"Deliver the six-page review as an artifact, because it is significant, self-contained and will be edited and reused."}],"correct":["A","E"],"explanation":"The documented artifact trigger is significant, self-contained content, typically over 15 lines, likely to be edited, iterated on or reused outside the conversation, which the six-page review meets. Short conversational answers stay inline, which is where the one-line price answer belongs.","rationales":{"B":"A single line is neither significant nor self-contained in the documented sense; making it an artifact is the over-application trap.","C":"A six-page document delivered inline cannot easily be edited or reused outside the conversation, which is the whole reason artifacts exist.","D":"Structured data is a distinct third format category suited to machine consumption, not to a narrative review a human will edit."},"sources":[{"title":"What are Artifacts and how do I use them? - Claude Help Center","url":"https://support.claude.com/en/articles/9487310-what-are-artifacts-and-how-do-i-use-them","date":"2026-08-19","basis":"verified-live"},{"title":"Claude Certified Associate - Foundations Exam Guide, Version 1.0, Section 6 Domain 2 objectives","url":"https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542847/Claude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf","date":"2026-07-08","basis":"published"}],"tags":["artifact-vs-inline","structured-data","format-selection"]},{"id":"D2-041","domain":"D2","objective":"Edit, adapt, refine, and compare outputs for the intended audience","type":"single","difficulty":"medium","scenario":true,"stem":"A consultant has a technically accurate Claude-drafted analysis written for the client's engineering team. She now needs a version for a non-technical steering group that reaches the same conclusions. What is the MOST appropriate next step?","options":[{"key":"A","text":"Circulate the engineering version unchanged, with a covering note explaining each of the technical terms."},{"key":"B","text":"Ask Claude to adapt the draft for the steering group, then check the conclusions were preserved."},{"key":"C","text":"Ask Claude to cut the draft in half without specifying who will read it."},{"key":"D","text":"Start a fresh conversation and regenerate the analysis from the original source data."}],"correct":["B"],"explanation":"Adapting outputs for the intended audience is one of the named Domain 2 objectives. Adapting the approved draft preserves the verified analysis, and the follow-up check that the conclusions survived the rewrite is the evaluation half of the task.","rationales":{"A":"A glossary does not change structure, emphasis or level of detail, so the document still asks a non-technical audience to read an engineering paper.","C":"Length reduction without an audience specification is not adaptation; it can remove the very findings the steering group needs.","D":"Regenerating from source discards work already verified and reintroduces the risk of a different, unchecked analysis."},"sources":[{"title":"Claude Certified Associate - Foundations Exam Guide, Version 1.0, Section 6 Domain 2 objectives","url":"https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542847/Claude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf","date":"2026-07-08","basis":"published"},{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["adapt-for-audience","preserve-conclusions","refinement"]},{"id":"D2-042","domain":"D2","objective":"Identify hallucinations, inconsistencies, and biases in responses","type":"single","difficulty":"medium","scenario":true,"stem":"An HR partner uses Claude to draft candidate summaries from interview notes. Which check most directly addresses bias in those summaries, as opposed to accuracy?","options":[{"key":"A","text":"Check that Claude states how confident it is in each summary before the summary is filed."},{"key":"B","text":"Check whether the summaries apply consistent language and evaluative criteria across all candidates."},{"key":"C","text":"Check that each summary runs to roughly the same length, so that no one candidate receives more coverage than another."},{"key":"D","text":"Check that the summaries are delivered as artifacts so that they can be archived consistently."}],"correct":["B"],"explanation":"Accuracy asks whether each statement is true; bias asks whether comparable cases are described in comparable terms. Consistency of language and evaluative criteria across candidates is the check that speaks to bias, and differential wording across otherwise comparable candidates is the observable signal a practitioner can act on.","rationales":{"A":"Self-reported confidence is not a reliable signal for accuracy, and it says nothing at all about differential treatment.","C":"Equal length is a superficial proxy. Two summaries of identical length can still describe comparable candidates in systematically different terms.","D":"Archiving format is a records management concern and is unrelated to whether the content is even-handed."},"sources":[{"title":"Claude Certified Associate - Foundations Exam Guide, Version 1.0, Section 6 Domain 2 objectives","url":"https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542847/Claude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf","date":"2026-07-08","basis":"published"}],"tags":["bias-evaluation","consistency-across-cases","hr-use-case"]},{"id":"D2-043","domain":"D2","objective":"Determine when human review or additional verification is required","type":"multi","difficulty":"hard","scenario":true,"stem":"A governance group is deciding which Claude-assisted outputs must be seen by a qualified human before release. Which TWO factors should drive that decision? Select TWO.","options":[{"key":"A","text":"Whether Claude volunteered a caveat about its own uncertainty in the response."},{"key":"B","text":"Whether the output was returned in a structured, machine-readable format."},{"key":"C","text":"Whether the output will inform a high-stakes decision in a legal, medical or financial context."},{"key":"D","text":"Whether the output will reach an external audience who will act on it."},{"key":"E","text":"Whether the output was produced by the newest Claude model available to the team at the time."}],"correct":["C","D"],"explanation":"The documented driver is the risk class and audience of the output. Anthropic's guidance is that critical information must always be validated, especially for high-stakes decisions, and a practitioner is expected to recognise when human expertise, validation or escalation is required.","rationales":{"A":"Making review conditional on a model-volunteered caveat is a named trap; a confident, uncaveated answer in a high-risk area is exactly the case that needs review most.","B":"A machine-readable format guarantees shape, not correctness, so it has no bearing on whether a human needs to look at the content.","E":"Model selection is a separate decision and does not change the verification obligation, however well a model scores on alignment audits."},"sources":[{"title":"Claude Certified Associate - Foundations Exam Guide, Version 1.0, Section 3 Intended Audience","url":"https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542847/Claude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf","date":"2026-07-08","basis":"published"},{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"}],"tags":["escalation-triggers","risk-class","external-audience"]},{"id":"D2-044","domain":"D2","objective":"Apply fact-checking and validation techniques","type":"single","difficulty":"easy","scenario":true,"stem":"A pricing team wants Claude to answer questions using only the three internal rate cards they have supplied, so that any drift into general knowledge becomes obvious. Which documented technique does this?","options":[{"key":"A","text":"External knowledge restriction: use only the provided documents, not general knowledge."},{"key":"B","text":"Chain-of-thought verification: reason through the problem step by step before giving the final answer."},{"key":"C","text":"Best-of-N verification: run the prompt repeatedly and compare the answers."},{"key":"D","text":"Iterative refinement: feed the answer back in as input to verify and expand it."}],"correct":["A"],"explanation":"External knowledge restriction is one of the four documented advanced techniques and is defined as explicitly instructing Claude to use only information from provided documents and not its general knowledge. It makes any claim that is not in the rate cards visible as out of scope.","rationales":{"B":"Chain-of-thought verification exposes faulty logic in the reasoning path but does not bound which knowledge the model may draw on.","C":"Best-of-N detects instability across repeated runs. It would not stop the model reaching outside the supplied rate cards, only reveal disagreement.","D":"Iterative refinement reworks an existing output and says nothing about restricting the sources used to produce it."},"sources":[{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"}],"tags":["external-knowledge-restriction","grounding","advanced-techniques"]},{"id":"D3-001","domain":"D3","objective":"Select appropriate Claude product features (Projects, research mode, chat, artifacts)","type":"single","difficulty":"easy","scenario":true,"stem":"A marketing manager has two pieces of work this week. The first is drafting a short blog post through a conversational back-and-forth with Claude. The second is a multi-step knowledge task that spans several connected apps: pull last quarter's campaign results, reconcile them against the budget sheet, and assemble a summary deck. Which pairing of surfaces is the better fit?","options":[{"key":"A","text":"Claude Code for the blog draft, and ordinary Claude chat for the multi-step cross-app task"},{"key":"B","text":"Claude Cowork for the blog draft, and Claude Code for the multi-step cross-app deck assembly"},{"key":"C","text":"Claude chat for the blog draft, and Claude Cowork for the multi-step cross-app task"},{"key":"D","text":"Claude chat for both pieces of work, since Cowork is only a different interface onto the same chat experience"}],"correct":["C"],"explanation":"Ordinary chat suits simpler tasks that do not need file access or extended execution, which is what a conversational blog draft is. Cowork is positioned for complex, multi-step work that needs file access and longer running execution, and it bridges knowledge work and agentic capability without requiring coding expertise, which fits the cross-app reconciliation and deck assembly. Claude Code is the development-focused surface with terminal access.","rationales":{"A":"Claude Code is the development surface rather than a prose-drafting tool, and plain chat is not the surface positioned for multi-step work that reaches across connected apps.","B":"This inverts the fit. Cowork exists for the multi-step cross-app job, and Claude Code is aimed at development work rather than assembling a summary deck.","D":"Cowork is not a reskinned chat. It is a paid-plans surface for complex multi-step work with file access and extended execution, which ordinary chat does not provide."},"sources":[{"title":"Get started with Claude Cowork - Anthropic Help Center","url":"https://support.claude.com/en/articles/13345190-get-started-with-claude-cowork","date":"2026-08-18","basis":"published"}],"tags":["cowork","chat","claude-code","surface-selection"]},{"id":"D3-002","domain":"D3","objective":"Select appropriate Claude product features (Projects, research mode, chat, artifacts)","type":"single","difficulty":"easy","scenario":true,"stem":"A market analyst on a Free Claude account wants to use Research to produce a cited briefing on a regulatory change. A colleague tells her she just needs to switch it on from the plus button. What is the accurate position?","options":[{"key":"A","text":"Research is available on every plan including Free, but on Free it can only be started from inside the Claude Desktop app"},{"key":"B","text":"Research requires a paid plan (Pro, Max, Team or Enterprise), and web search must be turned on for it to work"},{"key":"C","text":"Research is available on the Free plan as well, provided extended thinking is turned on in place of web search"},{"key":"D","text":"Research is available on Free with a reduced source limit, and it carries no dependency on web search being enabled"}],"correct":["B"],"explanation":"Research is available for users with paid Claude plans (Pro, Max, Team or Enterprise) on Claude web, Claude Desktop and Claude Mobile, and is started from the plus button in the chat interface. The help centre also states that web search must be turned on for Research to function. The analyst therefore needs both a plan upgrade and web search enabled.","rationales":{"A":"Research is not a Free-plan feature at all, and it is supported on web, Desktop and Mobile rather than being restricted to the desktop app.","C":"Extended thinking is a separate feature for complex reasoning that does not need recent web information. It is not a substitute for the web search dependency, and it does not unlock Research on Free.","D":"There is no documented Free tier of Research, and the dependency on web search is stated explicitly rather than being optional."},"sources":[{"title":"Use research on Claude - Anthropic Help Center","url":"https://support.claude.com/en/articles/11088861-use-research-on-claude","date":"2026-06-02","basis":"published"}],"tags":["research","plan-availability","web-search"]},{"id":"D3-003","domain":"D3","objective":"Select appropriate Claude product features (Projects, research mode, chat, artifacts)","type":"single","difficulty":"medium","scenario":true,"stem":"A strategy lead on a Max plan has two jobs. Job one is an in-depth, cited briefing on a competitor landscape, where she expects Claude to consult many sources over a couple of minutes and synthesise them. Job two is untangling a complicated internal pricing calculation that involves no recent external information at all. Which pairing should she use?","options":[{"key":"A","text":"Extended thinking for the competitor briefing, and Research for the internal pricing calculation"},{"key":"B","text":"Web search for both jobs, because each one benefits from external validation of the underlying numbers"},{"key":"C","text":"Research for both jobs, because Research always runs extended thinking as part of the same pass"},{"key":"D","text":"Research for the competitor briefing, extended thinking for the pricing calculation"}],"correct":["D"],"explanation":"The published decision rule is web search for straightforward factual queries needing one or two tool calls, extended thinking for complex reasoning that does not require recent web information, and Research for comprehensive gathering needing five or more tool calls over one to three minutes, synthesised into a cited report. The competitor briefing matches Research, and the self-contained calculation matches extended thinking.","rationales":{"A":"This inverts the rule. Extended thinking is for reasoning that does not need recent web information, and Research is the tool for wide multi-source gathering.","B":"Web search is aimed at straightforward factual queries needing one or two tool calls. A multi-source cited briefing exceeds that, and the pricing calculation needs no external sources at all.","C":"Research is the wrong tool for a self-contained calculation. Extended thinking and Research can be combined so Claude plans first and then gathers, but that does not make Research correct for work needing no retrieval."},"sources":[{"title":"When should I use web search, extended thinking, and research? - Anthropic Help Center","url":"https://support.claude.com/en/articles/11095361-when-should-i-use-web-search-extended-thinking-and-research","date":"2026-06-02","basis":"published"}],"tags":["research","extended-thinking","web-search","feature-selection"]},{"id":"D3-004","domain":"D3","objective":"Select appropriate Claude product features (Projects, research mode, chat, artifacts)","type":"multi","difficulty":"medium","scenario":true,"stem":"An enablement manager on a company Enterprise account has built an interactive onboarding artifact and wants to distribute it beyond her immediate team. Select TWO accurate statements about publishing and sharing artifacts.","options":[{"key":"A","text":"Viewers must supply their own Anthropic API key before a shared artifact will open for them at all"},{"key":"B","text":"Publishing an artifact publicly is permanent, so the shared link cannot be withdrawn once it has been created"},{"key":"C","text":"Artifacts created on a Team or Enterprise account can be shared only within the organisation and cannot be published publicly"},{"key":"D","text":"Artifacts are a Claude web feature only, so a colleague who works in the Claude Desktop app would not be able to open a shared one"},{"key":"E","text":"Once an artifact has been unpublished, that same artifact cannot be published again"},{"key":"F","text":"Artifacts are a paid-plan capability and are therefore not available to anyone on a Free account"}],"correct":["C","E"],"explanation":"The help centre states that artifacts created on Team or Enterprise accounts can only be shared within your organization and cannot be published publicly, and that public publishing is available on Free, Pro and Max plans. It also states that once you unpublish an artifact, you cannot publish that same artifact again, so withdrawing a link is a one-way step. The enablement manager's Enterprise account therefore limits her to internal sharing.","rationales":{"A":"No API key is involved in opening a shared artifact. People without a Claude account are prompted to sign up only for advanced features such as AI-powered capabilities.","B":"An artifact can be unpublished, so the link can be withdrawn. What cannot be undone is the unpublishing itself, since the same artifact cannot then be published again.","D":"Artifacts are available on Claude web, Claude Desktop and Claude Code, so a desktop colleague is not excluded.","F":"Artifacts are available on Free, Pro, Max, Team and Enterprise plans, so they are not a paid-only capability."},"sources":[{"title":"Publish and share artifacts - Anthropic Help Center","url":"https://support.claude.com/en/articles/9547008-publish-and-share-artifacts","date":"2026-07-01","basis":"published"},{"title":"What are artifacts and how do I use them? - Anthropic Help Center","url":"https://support.claude.com/en/articles/9487310-what-are-artifacts-and-how-do-i-use-them","date":"2026-07-01","basis":"published"}],"tags":["artifacts","sharing","plan-availability"]},{"id":"D3-005","domain":"D3","objective":"Select appropriate Claude product features (Projects, research mode, chat, artifacts)","type":"single","difficulty":"hard","scenario":true,"stem":"A consultant starts a Claude Cowork session in the browser on her Pro plan. The session is working through a folder of client files on her laptop, connected via the Claude Desktop app. She then quits the desktop app and shuts the laptop lid before travelling. What should she expect?","options":[{"key":"A","text":"The session keeps running, but it loses access to the local files once the desktop app is closed"},{"key":"B","text":"The session ends immediately and any work it has produced so far is discarded without warning"},{"key":"C","text":"The session continues with full local file access, because the files were copied into the cloud sandbox at session start"},{"key":"D","text":"The session pauses, then resumes with local access as soon as any browser tab is reopened on another device"}],"correct":["A"],"explanation":"Cowork on web and mobile reaches local files, local connectors, browser use and computer use through the Claude Desktop app. A cloud session can read and write files in folders you have connected on your computer only while the desktop app is open on that computer; if the app is closed, the session keeps running but cannot reach your local files.","rationales":{"B":"The session is not terminated. It continues running in the cloud, and only the bridge to local files is lost.","C":"Local files are reached live through the desktop app rather than copied into the cloud, so closing the app breaks the link to them.","D":"Local access depends on the Claude Desktop app being open on the machine that holds the files, not on a browser tab, and certainly not on a different device."},"sources":[{"title":"Use Claude Cowork on web, desktop, and mobile - Anthropic Help Center","url":"https://support.claude.com/en/articles/15520349-use-claude-cowork-on-web-desktop-and-mobile","date":"2026-08-18","basis":"published"},{"title":"Get started with Claude Cowork - Anthropic Help Center","url":"https://support.claude.com/en/articles/13345190-get-started-with-claude-cowork","date":"2026-08-18","basis":"published"}],"tags":["cowork","cloud-session","local-files"]},{"id":"D3-006","domain":"D3","objective":"Select appropriate Claude product features (Projects, research mode, chat, artifacts)","type":"single","difficulty":"medium","scenario":true,"stem":"An operations lead needs Claude to work with a records application that runs only on the office network and has no cloud version. A colleague who works entirely from a phone needs Claude to reach the team's cloud ticketing service. Which connector approach fits both needs?","options":[{"key":"A","text":"Remote connectors for both the local records application and for the cloud ticketing service"},{"key":"B","text":"A desktop extension for the local records application and a remote connector for the cloud ticketing service"},{"key":"C","text":"Desktop extensions for both the local records application and the cloud ticketing service, installed on every machine"},{"key":"D","text":"A desktop extension for the cloud ticketing service and a remote connector for the local records application"}],"correct":["B"],"explanation":"Desktop extensions run on your computer, are the choice when the tool needs OS-level access or there is no cloud version to connect to, and are available only in Claude Desktop and Claude Code. Remote connectors run in the cloud, are the choice for a cloud service you sign into, and work across every surface including mobile, which is what the phone-only colleague needs.","rationales":{"A":"Remote connectors are for cloud services you sign into. They are not the mechanism for reaching a local application that has no cloud version at all.","C":"Desktop extensions are unavailable on web and mobile, so they cannot serve the colleague working from a phone.","D":"This reverses both roles: the cloud service is the natural fit for a remote connector, and the local application is what requires a desktop extension."},"sources":[{"title":"When to use desktop and web connectors - Anthropic Help Center","url":"https://support.claude.com/en/articles/11725091-when-to-use-desktop-and-web-connectors","date":"2026-08-12","basis":"published"}],"tags":["connectors","desktop-extension","mcp"]},{"id":"D3-007","domain":"D3","objective":"Select appropriate Claude product features (Projects, research mode, chat, artifacts)","type":"multi","difficulty":"medium","scenario":true,"stem":"An IT governance partner is assessing Claude in Chrome before rolling it out to a client-facing team. Select TWO statements that accurately reflect Anthropic's documentation of the extension.","options":[{"key":"A","text":"Anthropic describes the extension as fully safe once its safety classifiers are active"},{"key":"B","text":"It is available on all paid Claude plans (Pro, Max, Team and Enterprise)"},{"key":"C","text":"It is available on the Free plan as well, capped at a limited number of browser actions each day"},{"key":"D","text":"Team and Enterprise admins have no way to restrict which sites the extension is allowed to act on"},{"key":"E","text":"It runs entirely in the cloud and therefore requires no browser permissions to be granted at install time"},{"key":"F","text":"The Chrome debugger permission is what actually allows Claude to control the browser"}],"correct":["B","F"],"explanation":"Claude in Chrome is a locally installed browser extension available for all paid plans (Pro, Max, Team and Enterprise). It requests a set of Chrome permissions, and the discriminating one is the debugger permission, which the help centre describes as what allows Claude to actually control your browser by clicking buttons, typing text and taking screenshots.","rationales":{"A":"Anthropic states that the extension has safety classifiers but is still risky, and asks users to review the safety guidance before use. It is presented as a residual-risk feature needing human oversight.","C":"The extension requires a paid plan; there is no Free-plan version with a daily action cap.","D":"Team and Enterprise admins control extension availability and site access through allowlists and blocklists.","E":"It is a locally installed browser extension that explicitly requires Chrome permissions, including debugger, in order to act on pages."},"sources":[{"title":"Get started with Claude in Chrome - Anthropic Help Center","url":"https://support.claude.com/en/articles/12012173-get-started-with-claude-in-chrome","date":"2026-08-19","basis":"published"}],"tags":["claude-in-chrome","browser-extension","permissions","risk"]},{"id":"D3-008","domain":"D3","objective":"Differentiate between Claude model types (Haiku, Sonnet, Opus)","type":"single","difficulty":"easy","scenario":true,"stem":"A contractor using a Free claude.ai account has been asked to run a demanding analysis with Claude Fable 5, but cannot find it in her model picker. A colleague on a Pro plan can see it. What is the accurate explanation?","options":[{"key":"A","text":"Fable 5 is offered on every plan, but on Free it appears only once the daily usage allowance resets"},{"key":"B","text":"Fable 5 is offered on Free with a reduced context window rather than being withheld altogether"},{"key":"C","text":"Fable 5 is offered on Free and Pro but not on Team or Enterprise, which are steered to Opus 5 instead"},{"key":"D","text":"Fable 5 is not available on the Free plan; it requires a Pro, Max, Team or Enterprise plan"}],"correct":["D"],"explanation":"The plan article for Claude Fable 5 sets out how the model is provided on Pro, Max, Team and Enterprise plans, and the Free plan is not among them. Availability here is a plan entitlement rather than a context-window reduction or something a usage reset unlocks. Claude Sonnet 5, by contrast, is available across all plans and is the default model for Free and Pro.","rationales":{"A":"Availability is a plan entitlement rather than something a usage reset unlocks, so Fable 5 does not appear on Free at any point in the usage cycle.","B":"There is no reduced-context Free version of Fable 5, and the model's 1M-token context window is the same wherever it is offered.","C":"This inverts the entitlement. Fable 5 is provided on Pro, Max, Team and Enterprise plans, and it is the Free plan that is excluded."},"sources":[{"title":"Claude Fable 5 on your plan - Anthropic Help Center","url":"https://support.claude.com/en/articles/15424964-claude-fable-5-on-your-plan","date":"2026-07-20","basis":"published"},{"title":"Introducing Claude Sonnet 5 - Anthropic","url":"https://www.anthropic.com/news/claude-sonnet-5","date":"2026-06-30","basis":"published"}],"tags":["plan-availability","model-tiers","free-plan","fable"]},{"id":"D3-009","domain":"D3","objective":"Differentiate between Claude model types (Haiku, Sonnet, Opus)","type":"single","difficulty":"easy","scenario":false,"stem":"Which model does Anthropic describe as its most capable widely released model, built for the most demanding reasoning and long-horizon agentic work?","options":[{"key":"A","text":"Claude Opus 5"},{"key":"B","text":"Claude Sonnet 5"},{"key":"C","text":"Claude Fable 5"},{"key":"D","text":"Claude Mythos 5"}],"correct":["C"],"explanation":"Claude Fable 5 became generally available on 9 June 2026 and is described as Anthropic's most capable widely released model, built for the most demanding reasoning and long-horizon agentic work. It sits above Opus in the current tier ordering.","rationales":{"A":"Opus 5 sits one tier below Fable 5. It is described as the model for complex agentic coding and enterprise work, and is the recommended starting point for most agent workloads.","B":"Sonnet 5 is the mid tier, described as the best combination of speed and intelligence at a lower price than the Opus tier.","D":"Mythos 5 is not a widely released model. It is offered only in limited availability to approved customers."},"sources":[{"title":"Introducing Claude Fable 5 and Claude Mythos 5 - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/introducing-claude-fable-5-and-claude-mythos-5","date":"2026-08-19","basis":"verified-live"},{"title":"Models overview - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/overview","date":"2026-08-19","basis":"verified-live"}],"tags":["model-tiers","fable","recall"]},{"id":"D3-010","domain":"D3","objective":"Differentiate between Claude model types (Haiku, Sonnet, Opus)","type":"single","difficulty":"medium","scenario":true,"stem":"A client services team on Pro plans has been told that picking Claude Fable 5 works just like switching between Sonnet and Opus, with usage simply drawing on the plan as normal. According to Anthropic's plan documentation for Fable 5, what should they expect on Pro?","options":[{"key":"A","text":"Fable 5 is not included in the Pro plan's usage limits, and is used with usage credits instead"},{"key":"B","text":"Fable 5 is included in the Pro plan's usage limits, capped at 50 percent of the weekly allowance"},{"key":"C","text":"Fable 5 is included in the Pro plan's usage limits with no cap at all, exactly as Sonnet 5 is"},{"key":"D","text":"Fable 5 usage on the Pro plan is billed at standard API rates through the Claude Console"}],"correct":["A"],"explanation":"The Fable 5 plan article documents different mechanics per plan. On Max plans and on premium seats for Team and Enterprise, Fable 5 is included as a standard part of the plan and up to 50 percent of weekly usage limits can go to Fable 5 at no extra cost. On Pro plans and on Team standard seats, Fable 5 is not included in the plan's usage limits and is used with usage credits, which pay for usage beyond what the plan includes. Usage-based Enterprise access is billed at standard API rates. This is a high-churn entitlement fact and should be re-verified against the live article on each refresh.","rationales":{"B":"The 50 percent weekly-limit allowance is the arrangement for Max plans and for premium Team and Enterprise seats, rather than the Pro arrangement.","C":"Pro does not include Fable 5 in its usage limits at all, capped or uncapped, which is exactly what distinguishes it from the plan's ordinary models.","D":"Standard API rate billing applies to usage-based Enterprise access and to the Claude API, not to a Pro consumer subscription."},"sources":[{"title":"Claude Fable 5 on your plan - Anthropic Help Center","url":"https://support.claude.com/en/articles/15424964-claude-fable-5-on-your-plan","date":"2026-07-20","basis":"published"}],"tags":["fable","plan-availability","usage-credits","model-tiers","high-churn"]},{"id":"D3-011","domain":"D3","objective":"Differentiate between Claude model types (Haiku, Sonnet, Opus)","type":"single","difficulty":"easy","scenario":false,"stem":"In Anthropic's Models overview, which of the following appears under Legacy models rather than in the current line-up?","options":[{"key":"A","text":"Claude Sonnet 5, the mid-tier model that is the default on Free and Pro plans"},{"key":"B","text":"Claude Opus 4.8, the Opus generation that preceded Claude Opus 5"},{"key":"C","text":"Claude Haiku 4.5, the fastest model in the current line-up"},{"key":"D","text":"Claude Fable 5, the most capable widely released model"}],"correct":["B"],"explanation":"The current, non-legacy line-up in the Models overview table is exactly four models: Claude Fable 5, Claude Opus 5, Claude Sonnet 5 and Claude Haiku 4.5. Opus 4.8, 4.7, 4.6 and 4.5, together with Sonnet 4.6 and 4.5, sit in the Legacy models table.","rationales":{"A":"Claude Sonnet 5 is current. It was released on 30 June 2026 and is the default model for Free and Pro users.","C":"Claude Haiku 4.5 is current despite its 4.x version number, and is the fastest model in the line-up.","D":"Claude Fable 5 is current and sits at the top of the widely released line-up."},"sources":[{"title":"Models overview - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/overview","date":"2026-08-19","basis":"verified-live"}],"tags":["model-generations","legacy-models","recall"]},{"id":"D3-012","domain":"D3","objective":"Differentiate between Claude model types (Haiku, Sonnet, Opus)","type":"single","difficulty":"medium","scenario":true,"stem":"A cost-conscious client services team wants a short, accurate briefing note on Claude Sonnet 5 before standardising on it. Which statement should go in the note?","options":[{"key":"A","text":"Sonnet 5 is listed at the same price as Opus 5, at $5 input and $25 output per million tokens"},{"key":"B","text":"Sonnet 5 is the default on Max plans, while Free and Pro users default to Haiku 4.5 for capacity reasons"},{"key":"C","text":"Sonnet 5 launched with introductory pricing that expired in August 2026, after which list prices rose to match the Opus tier"},{"key":"D","text":"Sonnet 5 is the default model for Free and Pro users and is listed at $2 input and $10 output per million tokens"}],"correct":["D"],"explanation":"Claude Sonnet 5 was released on 30 June 2026 at $2 per million input tokens and $10 per million output tokens, and an update dated 10 August 2026 states that this introductory pricing is now permanent. It supersedes the previously scheduled $3 and $15 standard rate, which was cancelled on 10 August 2026, so a future refresh should not correct these figures back to the older values. Sonnet 5 is available across all plans and is the default model for Free and Pro. This is the most volatile fact in the domain and should be re-verified live on every refresh.","rationales":{"A":"$5 input and $25 output per million tokens is Claude Opus 5's listed pricing, whereas Sonnet 5 is listed at $2 and $10 in the Models overview table.","B":"This inverts the documented default. Sonnet 5 is the default model for Free and Pro plans, and Haiku 4.5 is not the default anywhere on claude.ai.","C":"The introductory pricing was made permanent in the 10 August 2026 update rather than expiring, and Sonnet 5's list price did not rise to the Opus tier."},"sources":[{"title":"Introducing Claude Sonnet 5 - Anthropic","url":"https://www.anthropic.com/news/claude-sonnet-5","date":"2026-06-30","basis":"published"},{"title":"Models overview - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/overview","date":"2026-08-19","basis":"verified-live"}],"tags":["sonnet-5","pricing","defaults","model-generations","high-churn"]},{"id":"D3-013","domain":"D3","objective":"Differentiate between Claude model types (Haiku, Sonnet, Opus)","type":"single","difficulty":"hard","scenario":false,"stem":"Anthropic publishes a four-term model lifecycle alongside a commitment on how much warning customers receive. Which statement is accurate on both counts?","options":[{"key":"A","text":"A legacy model is one that has already been assigned a retirement date, and affected customers receive at least 30 days of notice before that date arrives"},{"key":"B","text":"A deprecated model stops accepting requests on the day it is deprecated, and its retirement date governs only how long billing records are kept"},{"key":"C","text":"A legacy model works but gets no updates, while a deprecated model has a replacement and a retirement date, with 60 days of notice as the minimum"},{"key":"D","text":"A retired model still answers requests but at reduced reliability, and Anthropic commits to giving at least 90 days of notice before any model is retired"}],"correct":["C"],"explanation":"The four lifecycle terms are Active (fully supported and recommended), Legacy (still available but no longer receiving updates, and may be deprecated in future), Deprecated (still functional but no longer recommended, with a recommended replacement and an assigned retirement date) and Retired (no longer available, so requests fail). Anthropic notifies customers with active deployments and provides at least 60 days of notice before retirement for publicly released models.","rationales":{"A":"A retirement date is assigned at deprecation, not at the legacy stage, and the published notice commitment is at least 60 days rather than 30.","B":"A deprecated model is still functional; it is retirement, not deprecation, that stops requests from being served.","D":"Requests to a retired model fail rather than being served at reduced reliability, and the notice commitment is at least 60 days."},"sources":[{"title":"Model deprecations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/model-deprecations","date":"2026-08-19","basis":"verified-live"},{"title":"Models overview - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/overview","date":"2026-08-19","basis":"verified-live"}],"tags":["model-lifecycle","deprecation","model-generations","migration"]},{"id":"D3-014","domain":"D3","objective":"Differentiate between Claude model types (Haiku, Sonnet, Opus)","type":"single","difficulty":"easy","scenario":true,"stem":"An operations lead has read about Claude Mythos 5 and asks the account owner to enable it for the team, assuming it is a settings toggle. What is the accurate response?","options":[{"key":"A","text":"It is limited-availability through the invitation-only Project Glasswing, with no self-serve sign-up"},{"key":"B","text":"Mythos 5 can be switched on by any Max subscriber from the model settings panel in account settings"},{"key":"C","text":"Mythos 5 is simply the Enterprise-account name for Fable 5, and is enabled by an organisation administrator"},{"key":"D","text":"Mythos 5 is a legacy model that was retired at the point when Fable 5 became generally available"}],"correct":["A"],"explanation":"Claude Mythos 5 shares Claude Fable 5's specs and pricing but is not generally available: it is offered in limited availability to approved customers in Project Glasswing, access is invitation-only, and there is no self-serve sign-up. It therefore cannot be enabled from account settings.","rationales":{"B":"Max subscribers cannot self-serve Mythos 5, because access runs through Project Glasswing rather than through any account setting.","C":"Mythos 5 is a distinct model rather than an Enterprise rebadge of Fable 5, and it differs in that it does not include Fable 5's safety classifiers.","D":"Mythos 5 is a current limited-availability model introduced alongside Fable 5 on 9 June 2026, not a retired legacy model."},"sources":[{"title":"Introducing Claude Fable 5 and Claude Mythos 5 - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/introducing-claude-fable-5-and-claude-mythos-5","date":"2026-08-19","basis":"verified-live"},{"title":"Models overview - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/overview","date":"2026-08-19","basis":"verified-live"}],"tags":["mythos","availability","model-tiers"]},{"id":"D3-015","domain":"D3","objective":"Align model selection with task requirements (cost, speed, quality)","type":"single","difficulty":"hard","scenario":true,"stem":"An analytics lead proposes cutting spend by moving every workflow, including a difficult multi-step data reconciliation, to the lowest-priced model available. Which line of reasoning is the strongest objection?","options":[{"key":"A","text":"Batch processing discounts are by far the single largest cost lever, so the choice of model can safely be deferred"},{"key":"B","text":"Per-token price is not the same as cost per completed task; a more capable model can cost less per task"},{"key":"C","text":"Route every request through the cheapest available model and escalate only when a user complains about quality"},{"key":"D","text":"Standardise on one mid-tier model at maximum effort, so that no per-model evaluation work is needed anywhere"}],"correct":["B"],"explanation":"Price lists are written per token, but you pay for completed tasks, so models should be compared on cost per completed task. A more capable model finishes a task with fewer turns, less searching and less backtracking, and the per-token premium is routinely overwhelmed by doing less of everything. On the DeepResearch Bench II measurements the frontier model at low effort was both more accurate and about 10 percent cheaper per task than the mid-tier model. The published advice is also to price the hardest tenth of tasks rather than the median, because a failed task bills its tokens, then the retry, then the downstream cost of the failure.","rationales":{"A":"Prompt caching, not batch processing, was measured as the largest lever by a wide margin. Batch processing is a 50 percent discount for work that can wait up to 24 hours, and it does not change which model completes a task efficiently.","C":"User complaints are not an evaluation method. The documented sequence is to build benchmark tests for the use case, test with real prompts and data, and compare on accuracy, quality and edge cases before weighing cost.","D":"Maximum effort works against the finding that lower effort often matches accuracy at a fraction of the cost, and skipping evaluation removes the only reliable way to tell whether one model suits every workload."},"sources":[{"title":"Optimizing for cost and intelligence - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence","date":"2026-08-19","basis":"verified-live"},{"title":"Choosing the right model - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/choosing-a-model","date":"2026-08-19","basis":"verified-live"}],"tags":["cost-per-task","cost-optimisation","evaluation","high-churn"]},{"id":"D3-016","domain":"D3","objective":"Align model selection with task requirements (cost, speed, quality)","type":"single","difficulty":"medium","scenario":true,"stem":"A support manager is prototyping an assistant that will classify thousands of inbound messages a day into a handful of simple categories. Latency matters to agents on the phone, and the budget is tight. Which starting strategy fits best?","options":[{"key":"A","text":"Start with Claude Opus 5, tune prompts for it, then lower effort or step down models once the workflow is proven"},{"key":"B","text":"Start with Claude Fable 5, on the basis that classification accuracy is the only thing that matters at volume"},{"key":"C","text":"Rotate between tiers request by request so that average cost and average quality both settle in the middle"},{"key":"D","text":"Start with Claude Haiku 4.5, test thoroughly, evaluate, and upgrade only if a specific capability gap appears"}],"correct":["D"],"explanation":"The efficiency-first option is to begin implementation with Claude Haiku 4.5, test the use case thoroughly, evaluate whether performance meets requirements, and upgrade only if necessary for specific capability gaps. It is described as best for initial prototyping, applications with tight latency requirements, cost-sensitive implementations and high-volume straightforward tasks, which is exactly this profile.","rationales":{"A":"This is the capability-first option, which is aimed at complex reasoning, scientific or mathematical applications, and cases where accuracy outweighs cost. It does not fit simple high-volume classification under latency pressure.","B":"Fable 5 is the highest-capability and slowest tier, which conflicts with both the latency and the cost constraint; it is aimed at long-running agents and advanced research.","C":"Random rotation is not a documented strategy, and it undermines evaluation because results would no longer be attributable to a specific model."},"sources":[{"title":"Choosing the right model - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/choosing-a-model","date":"2026-08-19","basis":"verified-live"},{"title":"Models overview - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/overview","date":"2026-08-19","basis":"verified-live"}],"tags":["efficiency-first","haiku","latency","high-volume"]},{"id":"D3-017","domain":"D3","objective":"Align model selection with task requirements (cost, speed, quality)","type":"single","difficulty":"medium","scenario":true,"stem":"A programme manager is deciding whether to move a working Sonnet-based workflow up to Opus. Following Anthropic's documented sequence for deciding whether to change models, what should the team do FIRST?","options":[{"key":"A","text":"Move the whole workflow to the higher tier and watch for a drop in the number of user complaints"},{"key":"B","text":"Run a handful of prompts side by side in chat and pick whichever set of answers reads better on the day"},{"key":"C","text":"Create benchmark tests specific to the use case, which the docs call the most important step"},{"key":"D","text":"Compare the published per-token prices of the two models and simply choose the cheaper of them"}],"correct":["C"],"explanation":"The documented order is: create benchmark tests specific to your use case, test with your actual prompts and data, compare performance across models on accuracy, response quality and handling of edge cases, then weigh performance and cost tradeoffs. Building the evaluation set comes first, and the docs state that having a good evaluation set is the most important step in the process.","rationales":{"A":"Rolling out first and monitoring complaints substitutes production users for an evaluation set and gives no controlled comparison at all.","B":"Informal side-by-side impressions come before any structured comparison and cannot cover edge cases; step two is testing with actual prompts and data.","D":"Weighing performance against cost is the final step rather than the first, and per-token price alone is a poor proxy for cost per completed task."},"sources":[{"title":"Choosing the right model - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/choosing-a-model","date":"2026-08-19","basis":"verified-live"}],"tags":["evaluation","model-upgrade","process"]},{"id":"D3-018","domain":"D3","objective":"Align model selection with task requirements (cost, speed, quality)","type":"single","difficulty":"hard","scenario":true,"stem":"A client-facing analyst runs a report-drafting workflow on Claude Opus 5. Output quality is exactly right, but responses are slightly slower and more expensive than the team would like. What is the MOST appropriate first move?","options":[{"key":"A","text":"Lower the effort level on the current model before considering a change of model"},{"key":"B","text":"Switch straight to Claude Haiku 4.5, on the basis that it is the fastest and cheapest current model"},{"key":"C","text":"Turn on fast mode, which raises output speed while also reducing the per-token cost of each response"},{"key":"D","text":"Move up to Claude Fable 5, since a more capable model will finish the same work in fewer, shorter responses"}],"correct":["A"],"explanation":"The model-choice criteria are capabilities, speed, cost and effort, and the effort entry states that recent Opus and Sonnet models trade intelligence for latency and cost within a single model, so tuning effort is often a better lever than switching models. With quality already correct, adjusting effort preserves it while addressing both speed and cost.","rationales":{"B":"Dropping two tiers puts at risk the quality that is currently correct, and the effort lever should be tried before a model switch is considered.","C":"Fast mode is a research preview on Claude Opus 5 and Opus 4.8 that delivers up to 2.5 times higher output speed at premium pricing, so it raises cost rather than reducing it.","D":"Fable 5 has slower comparative latency and is priced at $10 input and $50 output per million tokens, so it worsens both of the constraints in play."},"sources":[{"title":"Choosing the right model - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/choosing-a-model","date":"2026-08-19","basis":"verified-live"},{"title":"Models overview - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/overview","date":"2026-08-19","basis":"verified-live"}],"tags":["effort-parameter","fast-mode","latency","cost"]},{"id":"D3-019","domain":"D3","objective":"Align model selection with task requirements (cost, speed, quality)","type":"multi","difficulty":"medium","scenario":true,"stem":"A risk partner is scoping a project that would use Claude Fable 5 on commercially sensitive client material, and that also needs awareness of events from the past few months. Select TWO considerations she should raise.","options":[{"key":"A","text":"Claude Fable 5 becomes eligible for zero data retention when it is used inside a Project"},{"key":"B","text":"Claude Fable 5's safety classifiers can be switched off by an organisation administrator for approved internal projects"},{"key":"C","text":"Claude Fable 5 has the latest knowledge cutoff of the current models, at May 2026, so no retrieval is needed"},{"key":"D","text":"Claude Fable 5 carries 30-day data retention and is not available under zero data retention"},{"key":"E","text":"Claude Fable 5's context window is capped at 200K tokens, so long client files have to be split before upload"},{"key":"F","text":"Claude Fable 5's reliable knowledge cutoff is January 2026, so recent-events work needs web search or Research"}],"correct":["D","F"],"explanation":"Claude Fable 5 carries 30-day data retention, is not available under zero data retention, and is designated a Covered Model, which is a material constraint for sensitive workloads. Separately, reliable knowledge cutoffs differ by model: Fable 5 and Sonnet 5 are January 2026, Opus 5 is May 2026 and Haiku 4.5 is February 2025, so work on recent events should be paired with web search or Research rather than relying on model memory.","rationales":{"A":"Nothing makes a Covered Model eligible for zero data retention through Projects. The 30-day retention designation attaches to the model itself.","B":"There is no administrator setting that turns Fable 5's safety classifiers off. A declined request comes back as a normal successful response reporting the decline, and the work can be retried on a different Claude model.","C":"May 2026 is Claude Opus 5's reliable knowledge cutoff, not Fable 5's. Fable 5 and Sonnet 5 are January 2026, and Haiku 4.5 is February 2025.","E":"Claude Fable 5 has a 1M-token context window by default. The 200K figure belongs to Claude Haiku 4.5, the one current model without a 1M-token window."},"sources":[{"title":"Introducing Claude Fable 5 and Claude Mythos 5 - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/introducing-claude-fable-5-and-claude-mythos-5","date":"2026-08-19","basis":"verified-live"},{"title":"Models overview - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/overview","date":"2026-08-19","basis":"verified-live"}],"tags":["covered-model","data-retention","knowledge-cutoff","risk"]},{"id":"D3-020","domain":"D3","objective":"Understand and manage context limitations and memory considerations (when to restart, summarize, or persist)","type":"single","difficulty":"hard","scenario":false,"stem":"A 1M-token context window is documented at two levels: per model, and per claude.ai plan. Which statement is accurate on both counts?","options":[{"key":"A","text":"All four current Claude models offer a 1M-token context window, and every claude.ai plan can use the full 1M tokens in one conversation"},{"key":"B","text":"Claude Haiku 4.5 offers a 1M-token context window, while Claude Fable 5 is held at 200K tokens to keep its cost per task down"},{"key":"C","text":"Claude Haiku 4.5 is the one current model without 1M tokens, at 200K, and on claude.ai only paid plans reach the 1M tier"},{"key":"D","text":"Claude Fable 5, Opus 5 and Sonnet 5 each need a beta header before their 1M-token window becomes available on any plan"}],"correct":["C"],"explanation":"Claude Fable 5, Claude Opus 5 and Claude Sonnet 5 each have a 1M-token context window, and for every model with a 1M-token window that size is the default, with no beta header needed and standard pricing. Claude Haiku 4.5 has a 200K-token context window, making it the one current model without 1M tokens. Separately, on claude.ai the newest models support up to a 1M token context window on paid plans, while others support 500K or 200K tokens.","rationales":{"A":"Claude Haiku 4.5 is at 200K rather than 1M, and on claude.ai the 1M tier is reached only on paid plans, with others at 500K or 200K tokens.","B":"This inverts the two models. Haiku 4.5 is the 200K model, and Fable 5 has a 1M-token context window like Opus 5 and Sonnet 5.","D":"For every model with a 1M-token context window, 1M is the default: no beta header is required and long-context requests are billed at standard pricing."},"sources":[{"title":"Context windows - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/context-windows","date":"2026-08-19","basis":"verified-live"},{"title":"How do usage and length limits work? - Anthropic Help Center","url":"https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work","date":"2026-07-13","basis":"published"}],"tags":["context-window","haiku","plan-limits","length-limits"]},{"id":"D3-021","domain":"D3","objective":"Understand and manage context limitations and memory considerations (when to restart, summarize, or persist)","type":"single","difficulty":"medium","scenario":true,"stem":"A research assistant uploads forty long documents into a single conversation, reasoning that a large context window means Claude may as well have everything just in case. Answers become vaguer and start missing details she knows are in the files. What is the most likely explanation?","options":[{"key":"A","text":"Filling the window reliably improves recall, so the vagueness must come from the model tier rather than the volume of material"},{"key":"B","text":"Uploaded documents are stored outside the context window, so they cannot be the cause of any degradation at all"},{"key":"C","text":"Claude automatically discards documents it judges irrelevant, so the weak answers show that the wrong files were kept"},{"key":"D","text":"More context is not automatically better; accuracy and recall degrade as token count grows, so context needs curating"}],"correct":["D"],"explanation":"A larger context window allows more complex and lengthy prompts, but more context is not automatically better: as token count grows, accuracy and recall degrade, a phenomenon known as context rot. That makes curating what is in context just as important as how much space is available. Everything in a request counts toward the window, including documents, images, tool definitions, tool results and the model's own thinking output.","rationales":{"A":"This is the misconception the documentation names directly. Filling the window does not reliably improve recall, and the opposite effect is what is described.","B":"Documents count toward the context window, alongside the system prompt, every message, tool results, images and tool definitions.","C":"There is no automatic relevance filter inside an ordinary conversation. Retrieval-based selection is what a Project provides once its knowledge base is large enough, and that operates on project knowledge rather than chat uploads."},"sources":[{"title":"Context windows - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/context-windows","date":"2026-08-19","basis":"verified-live"}],"tags":["context-rot","context-window","curation"]},{"id":"D3-022","domain":"D3","objective":"Understand and manage context limitations and memory considerations (when to restart, summarize, or persist)","type":"multi","difficulty":"medium","scenario":true,"stem":"A bid team keeps hitting length limits partway through long working conversations on a Pro plan. Select TWO documented remedies for conversations that repeatedly hit length limits.","options":[{"key":"A","text":"Switch to a Free account, which resets the length limit at the start of each new session"},{"key":"B","text":"Remove unused files from project knowledge so they stop occupying space on every turn"},{"key":"C","text":"Ask Claude to increase the context window for the current conversation before continuing"},{"key":"D","text":"Expand the project instructions with more background detail so that fewer turns are needed"},{"key":"E","text":"Lower the effort level so routine parts of the work consume less of each turn"},{"key":"F","text":"Paste the full contents of every reference file into the chat instead of keeping them in project knowledge"}],"correct":["B","E"],"explanation":"The listed remedies for conversations that repeatedly hit length limits are: use projects with retrieval-augmented generation, shorten project instructions to the essentials, remove unused project files, toggle extended thinking off when it is not needed, lower the effort level for routine tasks, and temporarily disable non-critical tools and connectors. Options B and E are two of those remedies.","rationales":{"A":"Downgrading does not raise capacity. Paid plans reach the larger chat context windows, so moving to Free would make the problem worse.","C":"The context window is a property of the model and the plan rather than something a user or Claude can enlarge on request mid-conversation.","D":"The documented remedy is to shorten project instructions to focus on essential information, not to lengthen them, since instructions occupy context on every turn.","F":"Pasting full file contents consumes more of the window, which is the opposite of what is needed here."},"sources":[{"title":"How do usage and length limits work? - Anthropic Help Center","url":"https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work","date":"2026-07-13","basis":"published"}],"tags":["length-limits","usage-limits","projects","effort-parameter"]},{"id":"D3-023","domain":"D3","objective":"Understand and manage context limitations and memory considerations (when to restart, summarize, or persist)","type":"single","difficulty":"easy","scenario":true,"stem":"A knowledge manager has kept adding files to a Project until its knowledge base is larger than a single conversation could hold. What changes at that point?","options":[{"key":"A","text":"Nothing changes automatically; the project keeps loading everything into context and simply truncates the oldest files"},{"key":"B","text":"The project switches automatically to searching project knowledge and retrieving only the most relevant passages"},{"key":"C","text":"The project stops accepting new uploads until an administrator raises the storage quota for that workspace"},{"key":"D","text":"The project keeps the whole knowledge base in context but drops the conversation history to make room for it"}],"correct":["B"],"explanation":"Retrieval-augmented generation activates automatically when a project approaches or exceeds the context window limits, switching the project to searching its knowledge and returning only the most relevant passages. That allows up to 10 times more content than context-based processing. If project knowledge later shrinks below the threshold, the project converts back to context-based processing automatically. RAG for projects is available on all Claude plans.","rationales":{"A":"Behaviour does change: crossing the context-window threshold is exactly what triggers the switch to retrieval, rather than truncation of older files.","C":"There is no upload freeze at the threshold, and no administrator quota step. Crossing it is what expands effective capacity, by up to 10 times.","D":"Conversation history is not sacrificed to hold the knowledge base. The knowledge base itself stops being loaded whole and is searched instead."},"sources":[{"title":"Retrieval augmented generation (RAG) for projects - Anthropic Help Center","url":"https://support.claude.com/en/articles/11473015-retrieval-augmented-generation-rag-for-projects","date":"2026-03-16","basis":"published"}],"tags":["projects","rag","context-window"]},{"id":"D3-024","domain":"D3","objective":"Understand and manage context limitations and memory considerations (when to restart, summarize, or persist)","type":"multi","difficulty":"medium","scenario":true,"stem":"An HR partner handles two unrelated caseloads in two separate Projects and also uses Claude Cowork for document assembly. She is worried about context from one caseload surfacing in the other. Select TWO accurate statements about how Claude's memory is scoped.","options":[{"key":"A","text":"Each project has its own memory space and project summary, so context does not carry between projects"},{"key":"B","text":"Incognito chats are still written to Claude's memory, though they are hidden from the chat history list in the sidebar"},{"key":"C","text":"Chat memory does not carry into Cowork sessions, and within Cowork memory is supported in projects only"},{"key":"D","text":"Memory on claude.ai is a paid-plan capability and is therefore unavailable to anyone on the Free plan"},{"key":"E","text":"Chat search is available on all plans, including Free, across web, Claude Desktop and Claude Mobile"},{"key":"F","text":"Memory is compiled once a day into a single summary rather than being updated during a conversation"}],"correct":["A","C"],"explanation":"Each project has its own separate memory space and dedicated project summary, so the context within each project stays focused and separate from other projects and from non-project chats. On Cowork, the help centre states that what Claude remembers about you in chat does not carry into Cowork sessions yet, and that within Cowork memory is supported in projects only. The word 'yet' signals that this is a fast-moving statement and should be re-verified on each refresh.","rationales":{"B":"Incognito chats are excluded from memory and from chat history entirely, and Claude also does not pull from them when searching previous conversations.","D":"Memory is available on Free, Pro and Max plans across web, Claude Desktop and Claude Mobile, so it is not a paid-only capability.","E":"Searching past chats is a paid-plans feature (Pro, Max, Team and Enterprise), which is the reverse of memory's availability.","F":"In the current memory experience Claude reads, writes and updates individual entries in real time as you chat; the daily summary belongs to the legacy experience."},"sources":[{"title":"Use Claude's chat search and memory to build on previous context - Anthropic Help Center","url":"https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context","date":"2026-08-19","basis":"published"},{"title":"Get started with Claude Cowork - Anthropic Help Center","url":"https://support.claude.com/en/articles/13345190-get-started-with-claude-cowork","date":"2026-08-18","basis":"published"}],"tags":["memory","projects","cowork","incognito","high-churn"]},{"id":"D3-025","domain":"D3","objective":"Understand and manage context limitations and memory considerations (when to restart, summarize, or persist)","type":"single","difficulty":"easy","scenario":true,"stem":"A technical project coordinator using Claude Code has been in one long session all morning and is running low on context, but the task is only half finished. Later she will start a completely unrelated piece of work. How should she use the two context commands?","options":[{"key":"A","text":"Use /compact now to summarise the history and continue, then /clear when starting the unrelated task"},{"key":"B","text":"Use /clear now so that the current task can continue, then /compact when starting the unrelated task later"},{"key":"C","text":"Use either command in either situation, since both simply free up space in much the same way"},{"key":"D","text":"Avoid /clear entirely, because it also removes the project files and CLAUDE.md from the session"}],"correct":["A"],"explanation":"The guidance is to use /clear when starting new work and /compact to continue a long session. /compact summarises the conversation so far into a short recap, freeing up space while preserving the essential context, which suits a half-finished task. /clear wipes the conversation and starts fresh, which suits a switch to unrelated work.","rationales":{"B":"This reverses the guidance and would discard the half-finished task's history at the moment it is still needed.","C":"The two commands are not interchangeable: /clear wipes the conversation, whereas /compact summarises it so the thread of work survives.","D":"/clear removes only the chat history. CLAUDE.md and project files remain available in the session."},"sources":[{"title":"Models, usage, and limits in Claude Code - Anthropic Help Center","url":"https://support.claude.com/en/articles/14552983-models-usage-and-limits-in-claude-code","date":"2026-04-15","basis":"published"}],"tags":["claude-code","clear-vs-compact","context-management"]},{"id":"D4-001","domain":"D4","objective":"Apply Claude to analyze requirements and use cases","type":"single","difficulty":"medium","scenario":true,"stem":"An operations lead posts a task in a Claude Tag channel that begins 'Please look into our refund backlog and pull together whatever you think might be useful.' Two days later the thread is still open and nobody is sure whether the work is finished. What should the operations lead change FIRST?","options":[{"key":"A","text":"Put the verifiable outcome in the first sentence of the task and give it a definition of done."},{"key":"B","text":"Add far more background detail about the refund process so that Claude has fuller context to work from."},{"key":"C","text":"Split the task across several channels so that a different team reviews each part of the backlog."},{"key":"D","text":"Move the task to a model with a larger context window so the thread can be allowed to run for longer."}],"correct":["A"],"explanation":"Anthropic's documented rule is 'Name the outcome, not the activity' - put the verifiable outcome in the first sentence - and give every task a definition of done. A task without a stated end state produces an open-ended report and the thread stays open while the requester decides what to do with it, which is exactly the symptom described.","rationales":{"B":"More detail may improve quality but it does not create an end condition, so the thread still has no point at which anyone can close it. The documented first move is a verifiable definition of done, not more context.","C":"Splitting the work across channels multiplies open threads without giving any of them an end condition, and it works against the documented convention of one channel per project.","D":"Context window size is a length limit, not a scoping mechanism. A larger window lets a thread hold more text but does nothing to define when the task is finished."},"sources":[{"title":"Good habits for working with Claude Tag - Claude Docs","url":"https://claude.com/docs/claude-tag/users/good-habits","date":"2026-08-19","basis":"verified-live"}],"tags":["definition-of-done","task-scoping","claude-tag","name-the-outcome"]},{"id":"D4-002","domain":"D4","objective":"Apply Claude to analyze requirements and use cases","type":"single","difficulty":"medium","scenario":true,"stem":"A team lead writes the Claude Tag task 'Babysit this PR until it merges.' Claude merges the pull request as soon as the approvals arrive, while several open review comments are still unresolved. Which refinement to the definition of done was missing?","options":[{"key":"A","text":"The task belonged in a direct message, where Claude works against a narrower set of connections."},{"key":"B","text":"The end condition was under-specified, so every part of it had to be written into the task."},{"key":"C","text":"The end condition was not observable by Claude, so only a human could have closed the task."},{"key":"D","text":"The task named an activity rather than an outcome, so Claude had nothing verifiable it could close on."}],"correct":["B"],"explanation":"The second refinement to a definition of done is to spell out everything the condition includes. The documentation uses this exact example: 'Babysit this PR until it merges' can produce a merge the moment approvals arrive, before open review comments are addressed. If the full condition is approvals present, comments resolved, and the requester's final go-ahead, all three have to be written into the task. Wording of this kind steers Claude but does not restrict it, so a merge gate also needs an enforced control such
