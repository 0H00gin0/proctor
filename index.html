 as branch protection.","rationales":{"A":"The surface determines which connections and which billing apply, not how completely an end condition is written. The same wording would have merged early in a DM too.","C":"A merge in a connected repository is exactly the kind of objective check Claude can observe. Observability is the other refinement and is not the failure in this case.","D":"'Until it merges' is an outcome, and a merge is objectively observable, which is why Claude was able to close the task. The fault was that the outcome omitted the other conditions."},"sources":[{"title":"Good habits for working with Claude Tag - Claude Docs","url":"https://claude.com/docs/claude-tag/users/good-habits","date":"2026-08-19","basis":"verified-live"}],"tags":["definition-of-done","spell-out-the-condition","claude-tag","enforced-controls"]},{"id":"D4-003","domain":"D4","objective":"Apply Claude to analyze requirements and use cases","type":"single","difficulty":"hard","scenario":false,"stem":"Assessing whether a use case is viable on Claude Tag, which statement is correct about where its work runs and which organisations can use it?","options":[{"key":"A","text":"It runs on the requester's own computer, and it is available on Free, Pro, Max, Team and Enterprise plans alike."},{"key":"B","text":"It runs inside the organisation's own network, and it is available on any plan once an Owner has paired Slack."},{"key":"C","text":"It runs in an ephemeral sandbox hosted by Anthropic, and it is available on Team and Enterprise plans only."},{"key":"D","text":"It runs on the Slack workspace's own infrastructure, and it is offered on Pro and Max as well as on Team plans."}],"correct":["C"],"explanation":"Two facts have to be combined. Work runs in an ephemeral sandbox hosted by Anthropic, created when a conversation starts and discarded when the conversation goes idle, not on anyone's computer and not inside the organisation's network. Availability is limited to Team and Enterprise plans on Anthropic's first-party service; it is not offered on Free, Pro or Max, or for third-party deployments. A use case that depends on running inside the corporate network, or on individual-plan users, is therefore not viable here.","rationales":{"A":"Nothing runs on the requester's machine, and the individual plans are excluded, so both halves fail.","B":"The sandbox is hosted by Anthropic rather than in the customer's network, and pairing a Slack workspace does not extend the product to plans that do not include it.","D":"Slack supplies the interface, not the compute, and Pro and Max are individual plans that do not include Claude Tag."},"sources":[{"title":"Work with Claude Tag - Claude Docs","url":"https://claude.com/docs/claude-tag/overview","date":"2026-08-19","basis":"verified-live"},{"title":"Good habits for working with Claude Tag - Claude Docs","url":"https://claude.com/docs/claude-tag/users/good-habits","date":"2026-08-19","basis":"verified-live"}],"tags":["claude-tag","plan-availability","ephemeral-sandbox","use-case-feasibility"]},{"id":"D4-004","domain":"D4","objective":"Apply Claude to analyze requirements and use cases","type":"single","difficulty":"medium","scenario":true,"stem":"An analyst is scoping a recurring workflow in which Claude must work directly on a 120 MB CSV export and several 20 MB spreadsheets that sit in a folder on her laptop. She plans to attach that folder to a Cowork project. Which requirement does the scope have to account for?","options":[{"key":"A","text":"The files have to be uploaded to a claude.ai project first, because a Cowork project cannot hold local folders."},{"key":"B","text":"Items dragged into a project are always mounted as additional project folders rather than copied, whatever their type."},{"key":"C","text":"A Cowork project reads files of any size, so only the combined size of the attached folder needs to be checked."},{"key":"D","text":"Claude reads individual files up to 50 MB, so the 120 MB export sits above the per-file limit even inside the project."}],"correct":["D"],"explanation":"A Cowork project attaches one or more local folders that Claude can read and write inside that project's sessions, and Claude reads individual files up to 50 MB. The 20 MB spreadsheets are within that limit; the 120 MB export is not, so the workflow needs the export split, filtered or summarised before Claude can work on it. Note also that dragging items in behaves differently by type: individual files are copied into the project's first folder, while folders are mounted as additional project folders.","rationales":{"A":"A Cowork project holds local folders; it is the claude.ai project that does not, so this reverses the two containers.","B":"The behaviour depends on what is dragged in: files are copied into the first folder and only folders are mounted as additional project folders.","C":"The documented limit is per file rather than per folder, so a single oversized file blocks the workflow however small the folder total is."},"sources":[{"title":"Organize work with projects - Claude Docs","url":"https://claude.com/docs/cowork/guide/projects","date":"2026-08-19","basis":"verified-live"}],"tags":["cowork-project","local-folders","file-size-limit","requirements-analysis"]},{"id":"D4-005","domain":"D4","objective":"Apply Claude to analyze requirements and use cases","type":"single","difficulty":"easy","scenario":true,"stem":"A team lists what a new workflow needs Claude to reach: files in Google Drive, mail in Gmail, issues in GitHub and messages in Slack. Which is the correct reading of that list?","options":[{"key":"A","text":"All four are covered by first-party integrations, which are ready to use with no setup beyond authentication."},{"key":"B","text":"Only Google Drive and Gmail have first-party integrations, so GitHub and Slack each need a custom MCP server built."},{"key":"C","text":"None of the four is prebuilt, so the team must build and host its own remote MCP server for every service on the list."},{"key":"D","text":"All four are reachable, but only from Claude Code, so the workflow cannot be run from claude.ai or Claude Desktop."}],"correct":["A"],"explanation":"Anthropic provides first-party integrations with popular services including Google Drive, Gmail, Google Calendar, GitHub, Slack and Microsoft 365. These are ready to use with no setup beyond authentication, so none of the four requirements on this list calls for a custom connector. Prebuilt integrations and directory connectors work across all Claude products.","rationales":{"B":"GitHub and Slack are both named among the prebuilt first-party integrations, so neither of them requires a server to be built.","C":"Building a remote MCP server is the route for proprietary tools that have no listing, not for mainstream services that ship as integrations.","D":"Prebuilt integrations and directory connectors work across all Claude products, so the workflow is not confined to one surface."},"sources":[{"title":"Connectors overview - Claude Docs","url":"https://claude.com/docs/connectors/overview","date":"2026-08-19","basis":"verified-live"}],"tags":["prebuilt-integrations","connectors","google-drive","slack","requirements-analysis"]},{"id":"D4-006","domain":"D4","objective":"Leverage Claude for research, planning, and process optimization","type":"single","difficulty":"easy","scenario":false,"stem":"Which condition must be satisfied before Claude's Research mode can be used?","options":[{"key":"A","text":"Code execution must be enabled on the account."},{"key":"B","text":"Web search must be enabled on the account."},{"key":"C","text":"At least one custom connector must already be configured."},{"key":"D","text":"The conversation must be started inside a claude.ai project."}],"correct":["B"],"explanation":"Research is Claude's agentic multi-step investigation mode. It is available on paid plans across web, Desktop and Mobile, is turned on from the '+' menu, and requires web search to be enabled because it works by retrieving many sources and returning citations.","rationales":{"A":"Code execution is the prerequisite for Agent Skills, not for Research. The two features have different dependencies.","C":"Connectors extend what Research can reach, for example Google Workspace sources, but no connector is required for Research to run against the public web.","D":"Research is turned on from the '+' menu in a normal conversation. Being inside a project is not a precondition."},"sources":[{"title":"Use research on Claude - Anthropic Help Center","url":"https://support.claude.com/en/articles/11088861-use-research-on-claude","date":"2026-06-02","basis":"published"}],"tags":["research-mode","web-search","agentic-search","prerequisites"]},{"id":"D4-007","domain":"D4","objective":"Leverage Claude for research, planning, and process optimization","type":"single","difficulty":"medium","scenario":true,"stem":"A strategy consultant on a Team plan runs several Research investigations back to back and notices their usage allowance depleting much faster than during ordinary chats. They also want Research to draw on the firm's own documents and calendars, not just the public web. Which statement is correct?","options":[{"key":"A","text":"It is billed from a separate organisation research balance, and it reaches internal material only inside Claude Tag channels."},{"key":"B","text":"It draws only on the public web, and the faster depletion is a temporary defect that clears at the next billing period."},{"key":"C","text":"It consumes usage faster because it retrieves many sources, and it reaches internal material through Google Workspace connectors."},{"key":"D","text":"It consumes usage at the same rate as an ordinary chat, and internal material is reachable only by uploading the files."}],"correct":["C"],"explanation":"Research uses the same usage limits as normal chats but consumes them faster because it retrieves many sources across multiple steps. It draws on the public web plus internal sources when Google Workspace connectors such as Gmail, Google Calendar and Google Docs are activated, and it returns citations. Usage limits and length limits are distinct: usage limits measure consumption across all conversations, while length limits are the per-conversation context window.","rationales":{"A":"There is no separate research balance, and connectors rather than Claude Tag channels are what give Research its internal reach.","B":"Research is documented as drawing on internal sources through connectors as well as the public web, and the faster consumption is expected behaviour rather than a defect.","D":"Research consumes usage faster than an ordinary chat because of the number of sources it retrieves, and connectors give it internal reach without any upload step."},"sources":[{"title":"Use research on Claude - Anthropic Help Center","url":"https://support.claude.com/en/articles/11088861-use-research-on-claude","date":"2026-06-02","basis":"published"},{"title":"How do usage and length limits work? - Anthropic Help Center","url":"https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work","date":"2026-07-13","basis":"published"}],"tags":["research-mode","usage-limits","google-workspace-connectors","citations"]},{"id":"D4-008","domain":"D4","objective":"Leverage Claude for research, planning, and process optimization","type":"single","difficulty":"medium","scenario":true,"stem":"A product manager on a Max plan wants to hand long-running background work to Dispatch from Claude Desktop. Which statement correctly describes how Dispatch handles the work?","options":[{"key":"A","text":"Dispatch runs all of its work in the claude.ai web app so that results can be shared with the wider team."},{"key":"B","text":"Dispatch routes work to whichever surface was used last, and child tasks may spawn further child tasks as required."},{"key":"C","text":"All Dispatch work runs in Claude Code, with knowledge tasks first converted into scripts that Code can execute."},{"key":"D","text":"Coding work is routed to Claude Code against an existing workspace, and knowledge work to Cowork in a named project."}],"correct":["D"],"explanation":"Dispatch is Cowork's long-running background agent. It requires a Pro or Max plan and the latest Claude Desktop on macOS or Windows, and it routes coding work to Code against an existing workspace and knowledge work to Cowork in a named project.","rationales":{"A":"Dispatch runs from Claude Desktop and depends on it; it is not a claude.ai web feature, and shareability is not the routing criterion.","B":"Routing is by the nature of the work, not by recency of use, and Dispatch's child tasks explicitly do not spawn further children of their own.","C":"Knowledge work is routed to Cowork, not converted into code. Dispatch does not force everything through Claude Code."},"sources":[{"title":"Run tasks in the background with Dispatch - Claude Docs","url":"https://claude.com/docs/cowork/guide/dispatch","date":"2026-08-19","basis":"verified-live"}],"tags":["dispatch","background-agent","cowork","child-task"]},{"id":"D4-009","domain":"D4","objective":"Leverage Claude for research, planning, and process optimization","type":"single","difficulty":"hard","scenario":true,"stem":"An operations lead starts a Dispatch task and then goes into a long meeting. Part way through, the task forwards a permission request and nobody answers it for twenty minutes. What happens?","options":[{"key":"A","text":"The request is automatically denied after ten minutes and the task continues without that action."},{"key":"B","text":"The request stays pending indefinitely and the task remains paused until somebody answers it."},{"key":"C","text":"The task is cancelled outright and has to be restarted from the beginning by the operations lead."},{"key":"D","text":"The request is automatically approved after ten minutes so that the background task is not blocked."}],"correct":["A"],"explanation":"Anthropic documents that if a forwarded Dispatch permission request is not answered within ten minutes it is automatically denied, and the task carries on without performing that action. The safe default is denial, not approval and not indefinite blocking.","rationales":{"B":"Indefinite pausing is not the documented behaviour; the timeout resolves the request at ten minutes so the background task is not stranded.","C":"The task is not cancelled. It proceeds without the denied action, which is why the result may be incomplete rather than absent.","D":"Automatic approval would be the unsafe default and is explicitly not what happens. Treating silence as consent is a common misconception."},"sources":[{"title":"Run tasks in the background with Dispatch - Claude Docs","url":"https://claude.com/docs/cowork/guide/dispatch","date":"2026-08-19","basis":"verified-live"},{"title":"Get started with Claude Cowork - Anthropic Help Center","url":"https://support.claude.com/en/articles/13345190-get-started-with-claude-cowork","date":"2026-08-18","basis":"published"}],"tags":["dispatch","permission-request","timeout","human-in-the-loop"]},{"id":"D4-010","domain":"D4","objective":"Leverage Claude for research, planning, and process optimization","type":"single","difficulty":"medium","scenario":true,"stem":"A support manager has run six unrelated tasks inside a single Claude Tag thread over two weeks, and replies have become slower and less accurate. Recent configuration changes also seem not to be taking effect in that thread. What should the manager do?","options":[{"key":"A","text":"Keep the thread and ask Claude to summarise it periodically so that the session stays small enough to work with."},{"key":"B","text":"Start a new thread for each new task, since each thread runs its own session that carries the whole conversation into every reply."},{"key":"C","text":"Raise the channel's spend limit so that the session has more room to work with as the thread grows."},{"key":"D","text":"Move the work into a direct message, on the basis that a DM opens a fresh session for every reply and so never accumulates context."}],"correct":["B"],"explanation":"Anthropic's documented threading discipline is one thread per task. Each thread runs its own session carrying the whole conversation into every reply, so a thread that accumulates many tasks eventually grows past what one session can hold. A fresh session starts with full room and picks up configuration changes made since the old thread began.","rationales":{"A":"Summarising does not reset the session, and the thread still will not pick up configuration changes made after it began. The documented answer is a new thread per task.","C":"A spend limit caps how much of the organisation usage balance channel work can draw. It has no bearing on session size or on stale configuration.","D":"Direct messages also run sessions that carry the conversation forward; they differ in connector scope and billing, not in session behaviour."},"sources":[{"title":"Good habits for working with Claude Tag - Claude Docs","url":"https://claude.com/docs/claude-tag/users/good-habits","date":"2026-08-19","basis":"verified-live"}],"tags":["threading-discipline","session","claude-tag","context-window"]},{"id":"D4-011","domain":"D4","objective":"Leverage Claude for research, planning, and process optimization","type":"multi","difficulty":"medium","scenario":true,"stem":"A programme lead is rolling Claude Tag out across a department and is concerned that the team's review capacity will not scale with the number of threads Claude can open. Which TWO conventions does Anthropic document for exactly this problem? (Select TWO.)","options":[{"key":"A","text":"Batch your reviews instead of reviewing continuously."},{"key":"B","text":"Route every thread to a single named reviewer so standards stay consistent."},{"key":"C","text":"Run one channel per project rather than one per team."},{"key":"D","text":"Turn off channel memory so that threads cannot accumulate context."},{"key":"E","text":"Keep all of a project's tasks in one long thread so reviews happen in one place."}],"correct":["A","C"],"explanation":"Because review capacity does not scale with thread count, Anthropic documents three conventions: one channel per project, batch your reviews, and mark closed threads. One channel per project and batching reviews are the two listed here.","rationales":{"B":"Concentrating all review on one person makes the capacity bottleneck worse, and it is not a documented convention.","D":"Channel memory is a place to make corrections stick; disabling it removes a useful control and does nothing to address reviewer capacity.","E":"This contradicts the documented threading discipline of starting a new thread for each task, and a thread accumulating many tasks eventually outgrows what one session can hold."},"sources":[{"title":"Good habits for working with Claude Tag - Claude Docs","url":"https://claude.com/docs/claude-tag/users/good-habits","date":"2026-08-19","basis":"verified-live"}],"tags":["review-capacity","one-channel-per-project","batch-reviews","claude-tag"]},{"id":"D4-012","domain":"D4","objective":"Use Claude to support solution design, development, and iteration","type":"single","difficulty":"medium","scenario":true,"stem":"A business team wants to keep a large library of Agent Skills installed, but worries that ordinary chats unrelated to any of them will be slowed or crowded out. Which property of the progressive disclosure design answers that concern?","options":[{"key":"A","text":"Every SKILL.md is loaded at startup, and each one is then discarded once the task has been understood."},{"key":"B","text":"Skills are loaded in installation order until the context window is full, at which point loading stops."},{"key":"C","text":"At startup Claude reads only each skill's name and description, roughly 100 tokens each."},{"key":"D","text":"A skill's reference files load first, and its SKILL.md loads only if those files turn out to fall short."}],"correct":["C"],"explanation":"Progressive disclosure has three stages: names and descriptions only at startup, at roughly 100 tokens per skill; the full SKILL.md once a task matches a skill's description; and any bundled scripts or reference files only when they are actually needed. The standing cost of an installed library is therefore small and flat, which is what lets a team keep many skills installed without degrading unrelated chats.","rationales":{"A":"Loading every SKILL.md up front is exactly what progressive disclosure avoids, and it would make the standing cost grow with the size of the library.","B":"Skills are matched to the task by description rather than loaded in installation order, and filling the context window is the failure mode the design prevents.","D":"The order is reversed: the SKILL.md loads once a match is made, and bundled files load afterwards only if they are required."},"sources":[{"title":"Skills overview - Claude Docs","url":"https://claude.com/docs/skills/overview","date":"2026-08-19","basis":"verified-live"}],"tags":["agent-skills","progressive-disclosure","skill-library","context-cost"]},{"id":"D4-013","domain":"D4","objective":"Use Claude to support solution design, development, and iteration","type":"single","difficulty":"medium","scenario":true,"stem":"A client-services lead needs two things: a standing set of brand background documents that should be available in every chat about the Acme account, and a repeatable step-by-step procedure for producing the monthly business review pack that should load only when that particular job comes up. Which pairing is correct?","options":[{"key":"A","text":"Custom Instructions for the brand background, and an MCP connector for the review-pack procedure."},{"key":"B","text":"A Plugin for the brand background, and Custom Instructions for the review-pack procedure."},{"key":"C","text":"A Skill for the brand background, and a Project for the review-pack procedure."},{"key":"D","text":"A Project for the brand background, and a Skill for the review-pack procedure."}],"correct":["D"],"explanation":"The published four-way distinction is that Projects hold static background knowledge always loaded in specific chats, while Skills are task-specific procedures that load dynamically when a task matches their description. Brand background is standing knowledge for a set of chats; the review-pack procedure is a task-specific method.","rationales":{"A":"Custom Instructions are broad preferences applied to all conversations, which is too wide for one account's brand documents, and MCP connects Claude to external services rather than encoding a procedure.","B":"Plugins are shareable packages bundling skills, connectors, slash commands and sub-agents, not a store of reference documents, and Custom Instructions are not task-specific procedures.","C":"This inverts the definitions. Skills are procedural and load on demand; Projects are the container for always-loaded background knowledge."},"sources":[{"title":"Skills overview - Claude Docs","url":"https://claude.com/docs/skills/overview","date":"2026-08-19","basis":"verified-live"},{"title":"What are projects? - Anthropic Help Center","url":"https://support.claude.com/en/articles/9517075-what-are-projects","date":"2026-07-22","basis":"published"}],"tags":["skills-vs-projects","solution-design","custom-instructions","mcp"]},{"id":"D4-014","domain":"D4","objective":"Use Claude to support solution design, development, and iteration","type":"single","difficulty":"easy","scenario":true,"stem":"A team is standing up a new Claude Tag channel for weekly reporting and asks how much work Claude should be allowed to close on its own. What is the best approach?","options":[{"key":"A","text":"Check everything at first, then widen what Claude closes on its own as its output holds up."},{"key":"B","text":"Require a human to close every task permanently, since Claude cannot verify any of its own work."},{"key":"C","text":"Set the level of autonomy according to the seniority of whoever happens to have opened the thread."},{"key":"D","text":"Let Claude close everything from the outset and roll back only if a problem is later discovered."}],"correct":["A"],"explanation":"The documented pattern is graduated autonomy: check everything produced in a new channel at first and widen what Claude closes on its own as its output holds up under review. For tasks Claude closes itself, ask it to attach proof such as a source link, chart, test output or diff, so the reviewer reads the proof rather than the transcript.","rationales":{"B":"Claude can close tasks itself when an objective check it can observe passes, so permanent human closure of everything is stricter than the guidance and wastes the pattern.","C":"Autonomy is calibrated on demonstrated output quality in that channel, not on the requester's seniority.","D":"Starting at full autonomy skips the calibration period the guidance is built around, and rolling back after the fact is not the documented pattern."},"sources":[{"title":"Good habits for working with Claude Tag - Claude Docs","url":"https://claude.com/docs/claude-tag/users/good-habits","date":"2026-08-19","basis":"verified-live"}],"tags":["graduated-autonomy","iteration","attach-proof","human-in-the-loop"]},{"id":"D4-015","domain":"D4","objective":"Use Claude to support solution design, development, and iteration","type":"single","difficulty":"hard","scenario":false,"stem":"A report-formatting rule written into a Claude Tag channel's memory keeps being ignored, and the channel's Configure page carries an older Channel instructions entry saying the opposite. Which statement is correct?","options":[{"key":"A","text":"Only a CLAUDE.md file at a repository root can override an entry held in channel memory, whatever else is set."},{"key":"B","text":"The Channel instructions field outranks channel memory, so the conflicting entry there has to be updated."},{"key":"C","text":"Channel memory outranks Channel instructions, so the memory entry simply needs to be restated more clearly."},{"key":"D","text":"Custom instructions at workspace scope are the only place where a formatting rule can be written at all."}],"correct":["B"],"explanation":"In the five-tier table for making a correction stick, the Configure page's Channel instructions field applies to that channel and explicitly outranks channel memory. A conflicting instruction there will keep overriding the memory entry until it is corrected. The other tiers are channel memory, a CLAUDE.md at a repository root, a skill in the organisation's plugin marketplace, and custom instructions on a workspace or organisation scope.","rationales":{"A":"A CLAUDE.md at a repository root applies to any session in that repository and is guidance rather than an override of channel-level configuration; it is not the only lever available.","C":"The precedence runs the other way. Channel memory can be written by anyone in the channel but is outranked by Channel instructions.","D":"Workspace or organisation custom instructions are one of five tiers, written by an Owner and reaching every session in scope. They are not the only place a rule can live."},"sources":[{"title":"Good habits for working with Claude Tag - Claude Docs","url":"https://claude.com/docs/claude-tag/users/good-habits","date":"2026-08-19","basis":"verified-live"}],"tags":["correction-hierarchy","channel-instructions","channel-memory","claude.md"]},{"id":"D4-016","domain":"D4","objective":"Use Claude to support solution design, development, and iteration","type":"single","difficulty":"easy","scenario":true,"stem":"A team is designing how Claude should work in a new Claude Tag channel and has not told it which decisions it may take on its own and which must come back to a person. What is the likely consequence?","options":[{"key":"A","text":"Claude pauses before every action until an explicit list of approved decisions has been added to the channel's configuration."},{"key":"B","text":"Claude routes each decision automatically to the most senior member currently present in the channel."},{"key":"C","text":"Claude judges each case itself, so it may act where you wanted a say, or ask so often that it mostly waits."},{"key":"D","text":"Claude declines to start the task at all until the Configure page names the decisions it is allowed to take."}],"correct":["C"],"explanation":"The guidance is to tell Claude which decisions it can make on its own and which ones it must bring to you before acting. If you do not, Claude judges each case itself: it may make a change you wanted to see first, or stop to ask so often that it spends most of the task waiting for your replies. Instructions of this kind steer Claude but do not restrict it, so a decision that must come back to a person also needs an enforced control such as branch protection.","rationales":{"A":"Claude does not block on every action for want of a decision list; it exercises its own judgement, which is the behaviour the guidance exists to shape.","B":"There is no automatic routing by seniority. Decision boundaries are stated in the task or in the channel's configuration.","D":"Claude does not decline the task. The Configure page carries standing channel instructions, not a required register of approved decisions."},"sources":[{"title":"Good habits for working with Claude Tag - Claude Docs","url":"https://claude.com/docs/claude-tag/users/good-habits","date":"2026-08-19","basis":"verified-live"}],"tags":["decision-boundaries","escalation","claude-tag","enforced-controls"]},{"id":"D4-017","domain":"D4","objective":"Use Claude to support solution design, development, and iteration","type":"multi","difficulty":"hard","scenario":true,"stem":"A research analyst on a Team plan keeps a Cowork project on her laptop and a claude.ai project for the same body of work, and wants to know how they relate. Which TWO statements are correct? (Select TWO.)","options":[{"key":"A","text":"Archiving the Cowork project also deletes the local folders that were attached to it."},{"key":"B","text":"Linking the claude.ai project copies the Cowork project's local folders into her Claude account, so the folders then exist in both places."},{"key":"C","text":"A claude.ai project can be linked into the Cowork project so sessions draw on its knowledge, without merging them."},{"key":"D","text":"A Cowork project can be shared with colleagues on Team and Enterprise in the same way a claude.ai project can be."},{"key":"E","text":"The Cowork project lives on her computer only, can hold local folders, and cannot be shared with teammates."}],"correct":["C","E"],"explanation":"A Cowork project lives on the local computer, can hold local folders and is not shareable, whereas a claude.ai project lives in the Claude account, holds no local folders and is shareable on Team and Enterprise. A claude.ai project can be linked into a Cowork project so sessions draw on its knowledge, but linking does not merge them.","rationales":{"A":"Archiving a Cowork project deletes its name, instructions, links and memory, but leaves the attached local folders untouched.","B":"Linking does not merge or copy anything; a claude.ai project holds no local folders and the Cowork project's folders stay on the machine.","D":"Sharing with Can view and Can edit permissions is a claude.ai project capability on Team and Enterprise. Cowork projects are local-only and cannot be shared."},"sources":[{"title":"Organize work with projects - Claude Docs","url":"https://claude.com/docs/cowork/guide/projects","date":"2026-08-19","basis":"verified-live"},{"title":"What are projects? - Anthropic Help Center","url":"https://support.claude.com/en/articles/9517075-what-are-projects","date":"2026-07-22","basis":"published"}],"tags":["cowork-project","claude.ai-project","project-linking","archiving"]},{"id":"D4-018","domain":"D4","objective":"Integrate Claude into existing workflows to augment or redesign them","type":"single","difficulty":"easy","scenario":false,"stem":"Connectors in Claude are powered by which open standard, created by Anthropic?","options":[{"key":"A","text":"MCP Bundle (MCPB)"},{"key":"B","text":"The Anthropic Software Directory Policy"},{"key":"C","text":"OpenTelemetry (OTLP)"},{"key":"D","text":"Model Context Protocol (MCP)"}],"correct":["D"],"explanation":"Connectors are powered by the Model Context Protocol, an open standard created by Anthropic. MCP is what lets a connector expose tools and information to Claude and, through MCP Apps, surface interactive UI components in the conversation.","rationales":{"A":"MCP Bundle is a packaging format for local desktop extensions. It is a distribution mechanism built on top of MCP, not the standard itself.","B":"The Anthropic Software Directory Policy is the standard a connector is reviewed against for directory verification, not the protocol it runs on.","C":"OpenTelemetry is the logs and events protocol used to export Cowork organisation monitoring data. It is not what connectors are built on."},"sources":[{"title":"Connectors overview - Claude Docs","url":"https://claude.com/docs/connectors/overview","date":"2026-08-19","basis":"verified-live"}],"tags":["mcp","connectors","open-standard"]},{"id":"D4-019","domain":"D4","objective":"Integrate Claude into existing workflows to augment or redesign them","type":"multi","difficulty":"easy","scenario":false,"stem":"Anthropic describes connectors as doing two distinct things in a Claude conversation. Which TWO? (Select TWO.)","options":[{"key":"A","text":"Surface interactive UI components such as charts, maps and forms in the conversation through MCP Apps."},{"key":"B","text":"Grant a user access to resources they cannot otherwise reach in the source system, once an admin approves."},{"key":"C","text":"Provide tools and information, so Claude can read data and take actions in a connected service."},{"key":"D","text":"Store the organisation's audit logs so that they can later be retrieved through the Compliance API."},{"key":"E","text":"Extend the conversation's context window beyond the published limit for the model in use."}],"correct":["A","C"],"explanation":"Anthropic states that connectors can do two distinct things: provide tools and information so Claude can read data and take actions, and surface interactive UI components in the conversation via MCP Apps, such as charts, maps and forms.","rationales":{"B":"Connectors respect each user's existing permissions in the source system. If a person cannot reach a resource there, the connector cannot reach it either.","D":"Audit logging and the Compliance API are administrative features of the Claude platform, not a function of connectors.","E":"The context window is a property of the model, not something a connector changes. Connectors bring in data; they do not enlarge the window."},"sources":[{"title":"Connectors overview - Claude Docs","url":"https://claude.com/docs/connectors/overview","date":"2026-08-19","basis":"verified-live"},{"title":"Use connectors to extend Claude's capabilities - Anthropic Help Center","url":"https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities","date":"2026-08-05","basis":"published"}],"tags":["connectors","mcp-apps","tools-and-information"]},{"id":"D4-020","domain":"D4","objective":"Communicate Claude's value and limitations to stakeholders","type":"multi","difficulty":"medium","scenario":true,"stem":"A finance director asks how putting Claude into the company's Slack workspace will show up on the bill, and how the team could size the cost before committing. Which TWO statements are correct? (Select TWO.)","options":[{"key":"A","text":"Every member of a channel where Claude Tag is enabled is charged an additional per-seat licence fee each month."},{"key":"B","text":"Channel and thread work draws from a usage balance an Owner funds, rather than adding a per-seat charge."},{"key":"C","text":"A spend limit caps how much of that balance the work can use in each billing period."},{"key":"D","text":"Direct messages to Claude draw on the same organisation usage balance as channel work, and at the same rate."},{"key":"E","text":"Cost can be reviewed only for the organisation as a whole, so there is no way to see what one channel consumed."}],"correct":["B","C"],"explanation":"Adding Claude to Slack does not add a per-seat charge. Channel and thread work is billed by usage: it draws from a usage balance, an amount in the organisation's billing currency that an Owner funds, and a spend limit caps how much of that balance the work can use each billing period. A direct message does not draw from the balance, because it runs on the sender's own claude.ai account under that seat's usual usage limits. To size the cost before committing, the documented approach is to run a pilot with a spend limit set and watch the per-channel breakdown on the usage page in admin settings.","rationales":{"A":"There is no per-seat charge for adding Claude to Slack; the commercial model is consumption against a funded balance.","D":"A direct message runs on the sender's own claude.ai account and follows that seat's usual usage limits, so the organisation spend limit does not apply to it.","E":"The admin usage page shows a per-channel breakdown, which is exactly what makes a bounded pilot a usable way to size the cost."},"sources":[{"title":"Work with Claude Tag - Claude Docs","url":"https://claude.com/docs/claude-tag/overview","date":"2026-08-19","basis":"verified-live"}],"tags":["claude-tag","usage-balance","spend-limit","pilot","stakeholder-communication"]},{"id":"D4-021","domain":"D4","objective":"Communicate Claude's value and limitations to stakeholders","type":"single","difficulty":"easy","scenario":true,"stem":"A compliance officer objects to enabling a document-management connector, arguing it will let staff reach files they are not entitled to see. What is the correct explanation to give?","options":[{"key":"A","text":"A connector inherits each person's permissions from the connected service, so it cannot reach a file they cannot."},{"key":"B","text":"A connector grants read access across the whole repository unless an admin blocks specific actions for everyone."},{"key":"C","text":"A connector authenticates with a single shared service account, so every connected user sees the same set of files."},{"key":"D","text":"Setting an action to 'Always allow' extends a user's reach to resources the source system would otherwise withhold from them."}],"correct":["A"],"explanation":"Claude inherits each person's permissions from the connected service: if someone cannot access a specific file, channel or record in the source system, the connector cannot reach it from Claude either. Admin action restrictions can only narrow what is permitted, never grant access beyond what the source system allows.","rationales":{"B":"There is no default whole-repository grant. The connector is bounded by the individual's permissions before any admin control is applied.","C":"Access is per user against their own permissions in the source system, not through a shared service identity that flattens entitlements.","D":"'Always allow' is one of three org-wide per-action controls (Always allow, Needs approval, Blocked). These controls only narrow permissions; none of them widens access."},"sources":[{"title":"Use connectors to extend Claude's capabilities - Anthropic Help Center","url":"https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities","date":"2026-08-05","basis":"published"}],"tags":["connector-permissions","least-privilege","admin-controls","source-system"]},{"id":"D4-022","domain":"D4","objective":"Integrate Claude into existing workflows to augment or redesign them","type":"single","difficulty":"medium","scenario":true,"stem":"An analyst on a Team plan opens the Connectors Directory and finds a 'Request' button on a connector rather than an option to connect. What is happening?","options":[{"key":"A","text":"The connector is a Community listing, so its developer must approve each new organisation before it can be used."},{"key":"B","text":"The analyst lacks permission to enable connectors, so the button raises a request to the organisation's admins."},{"key":"C","text":"The analyst has hit the one-custom-connector cap, so the request asks an admin to raise that limit."},{"key":"D","text":"The connector is withheld from Team plans, so the request is queued with Anthropic support for review."}],"correct":["B"],"explanation":"On Team plans, members without permission to enable connectors see a 'Request' button on each directory connector, which changes to 'Requested' after use. Admins pick the pending items up under 'Requested by your team' in Organization settings > Connectors and on the Requests tab of Organization settings > Notifications. An Owner or Primary Owner must first enable connectors at the organisation level before members can authenticate.","rationales":{"A":"The Community label affects display and discovery in the directory only. It does not introduce a developer approval step.","C":"The one-custom-connector cap applies to Free-plan users and concerns custom connectors, not the directory Request flow on a Team plan.","D":"Directory connectors are not withheld from Team plans, and requests route to the organisation's own admins rather than to Anthropic."},"sources":[{"title":"Connectors directory - Claude Docs","url":"https://claude.com/docs/connectors/directory","date":"2026-08-19","basis":"verified-live"},{"title":"Use connectors to extend Claude's capabilities - Anthropic Help Center","url":"https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities","date":"2026-08-05","basis":"published"}],"tags":["connectors-directory","request-flow","team-plan","organisation-settings"]},{"id":"D4-023","domain":"D4","objective":"Communicate Claude's value and limitations to stakeholders","type":"single","difficulty":"hard","scenario":true,"stem":"In a review meeting, a stakeholder states that a connector labelled 'Verified' in the directory can be adopted with no further diligence because Anthropic has audited it, and that a 'Community' connector runs with reduced access once connected. How should this be corrected?","options":[{"key":"A","text":"Verification is a security audit, and a Community connector is sandboxed so that it cannot reach organisation data at all."},{"key":"B","text":"Both labels are purely cosmetic, and neither of them involves any review of the connector by Anthropic at any stage."},{"key":"C","text":"Verification is a closer review, not a security audit or performance guarantee, and a Community connector has the same access once connected."},{"key":"D","text":"Verification is a full security audit, and a Community connector does run with reduced permissions once it has been connected to Claude."}],"correct":["C"],"explanation":"Verification means the connector was tested for quality and compatibility and met the Anthropic Software Directory Policy requirements at the time of review; it is explicitly not a security audit or a guarantee of how the connector will perform, and the developer can change its tools afterwards. The label reflects the level of review and affects how the connector is displayed and discovered in the directory, not how it functions: once connected, a community connector has the same capabilities and access as any connector you grant.","rationales":{"A":"This compounds both errors, treating verification as an audit and imagining a technical sandbox around Community connectors that does not exist.","B":"Verification does involve a review by Anthropic. Describing the labels as purely cosmetic understates what verification represents.","D":"Both halves are wrong: verification is explicitly not a security audit, and Community connectors are not technically restricted once connected."},"sources":[{"title":"Connector verification - Claude Docs","url":"https://claude.com/docs/connectors/verification","date":"2026-08-19","basis":"verified-live"},{"title":"Connectors directory - Claude Docs","url":"https://claude.com/docs/connectors/directory","date":"2026-08-19","basis":"verified-live"}],"tags":["connector-verification","verified-vs-community","due-diligence","stakeholder-communication"]},{"id":"D4-024","domain":"D4","objective":"Apply Claude to analyze requirements and use cases","type":"multi","difficulty":"medium","scenario":true,"stem":"An internal tools team has built an MCP server for the company's ticketing system. It is not listed in the Connectors Directory, and it currently runs only on the corporate network. Which TWO statements are correct? (Select TWO.)","options":[{"key":"A","text":"Custom connectors run on separate, more tightly restricted infrastructure than the connectors listed in the directory."},{"key":"B","text":"Because custom connectors connect from Anthropic's cloud rather than the local device, the MCP server must be reachable over the public internet."},{"key":"C","text":"Custom connectors connect from the user's own device rather than from Anthropic's cloud, so an internal-only server works without any network change."},{"key":"D","text":"It can be added as a custom connector using its URL, running on the same infrastructure and technology as directory connectors."},{"key":"E","text":"Listing in the Connectors Directory is a prerequisite before any connector can be used in Claude at all."}],"correct":["B","D"],"explanation":"The Connectors Directory is a catalogue, not a separate class of connector: directory and custom connectors run on the same infrastructure and technology, and any connector whose URL you have can be added as a custom connector. Anthropic states that when a custom connector is added, 'Claude connects to your remote MCP server from Anthropic's cloud infrastructure, rather than from your local device', so the server 'must be reachable over the public internet from Anthropic's IP ranges'; servers on a private corporate network, behind a VPN or blocked by a firewall will not connect.","rationales":{"A":"There is no separate restricted infrastructure for custom connectors; they run on the same infrastructure as directory connectors.","C":"This is the opposite of the documented behaviour. Custom connectors connect from Anthropic's cloud, so an internal-only server would be unreachable until it is exposed to Anthropic's IP ranges.","E":"The directory is optional. It affects discovery only, and an unlisted connector is fully usable once added by URL."},"sources":[{"title":"Connector verification - Claude Docs","url":"https://claude.com/docs/connectors/verification","date":"2026-08-19","basis":"verified-live"},{"title":"Get started with custom connectors using remote MCP - Anthropic Help Center","url":"https://support.claude.com/en/articles/11175166-get-started-with-custom-connectors-using-remote-mcp","date":"2026-08-11","basis":"published"}],"tags":["custom-connector","connectors-directory","remote-mcp-server","network-reachability"]},{"id":"D4-025","domain":"D4","objective":"Integrate Claude into existing workflows to augment or redesign them","type":"single","difficulty":"easy","scenario":false,"stem":"Which four component types does a Claude plugin bundle?","options":[{"key":"A","text":"Projects, connectors, custom instructions and memories"},{"key":"B","text":"Skills, projects, channel instructions and routines"},{"key":"C","text":"Connectors, Office add-ins, site allowlists and audit logs"},{"key":"D","text":"Skills, MCP connectors, slash commands and sub-agents"}],"correct":["D"],"explanation":"Plugins are shareable capability packages that bundle four component types: Skills, MCP connectors, slash commands and sub-agents. They are supported in Claude Code and Claude Cowork, and Anthropic has open-sourced eleven of its internally used plugins. Plugin support in Cowork is currently a beta for all paid Claude users, with plugins saved locally to the machine and organisation-wide sharing and management still to come.","rationales":{"A":"Projects, custom instructions and memories are separate configuration mechanisms in their own right and are not packaged inside a plugin.","B":"Channel instructions belong to Claude Tag channel configuration and routines are scheduled tasks; neither is a plugin component.","C":"Office add-ins, site allowlists and audit logs are product and administrative features, not things a plugin bundles."},"sources":[{"title":"Plugins overview - Claude Docs","url":"https://claude.com/docs/plugins/overview","date":"2026-08-19","basis":"verified-live"}],"tags":["plugins","skills","slash-commands","sub-agents"]},{"id":"D4-026","domain":"D4","objective":"Use Claude to support solution design, development, and iteration","type":"single","difficulty":"medium","scenario":true,"stem":"An Enterprise owner wants a set of internally written Skills to be available to everyone in the organisation without each person installing them individually. Which statement is correct?","options":[{"key":"A","text":"Owners can provision skills organisation-wide, where they appear for everyone but stay individually toggleable."},{"key":"B","text":"Skills can only be installed one user at a time, because organisation-wide provisioning is not supported on any plan."},{"key":"C","text":"Organisation-provisioned skills are locked on for every user and cannot be toggled by individuals at all."},{"key":"D","text":"Skills are distributed through the Connectors Directory once an owner has submitted them for verification."}],"correct":["A"],"explanation":"Team and Enterprise owners can provision skills organisation-wide; they then appear automatically for all users while remaining individually toggleable. Skills also require code execution to be enabled before they can be used, and custom skills can be uploaded as ZIP files.","rationales":{"B":"Organisation-wide provisioning is explicitly supported on Team and Enterprise, so per-user installation is not the only route.","C":"Provisioned skills appear automatically but users can still toggle them individually; they are not locked on.","D":"The Connectors Directory catalogues connectors, not skills, and verification applies to connectors. Skills are provisioned by an owner or uploaded as ZIP files."},"sources":[{"title":"Use Skills in Claude - Anthropic Help Center","url":"https://support.claude.com/en/articles/12512180-use-skills-in-claude","date":"2026-08-12","basis":"published"},{"title":"Skills overview - Claude Docs","url":"https://claude.com/docs/skills/overview","date":"2026-08-19","basis":"verified-live"}],"tags":["organisation-provisioned-skills","code-execution","enterprise-administration","agent-skills"]},{"id":"D4-027","domain":"D4","objective":"Integrate Claude into existing workflows to augment or redesign them","type":"single","difficulty":"medium","scenario":true,"stem":"A Team-plan analyst has installed all four Claude for M365 add-ins (Excel, PowerPoint, Word and Outlook) from Microsoft AppSource and has opened each app and activated its add-in at least once. Claude still will not move figures from the open workbook into the open document. What is the MOST likely cause?","options":[{"key":"A","text":"The add-ins must be deployed from the Microsoft 365 Admin Center rather than AppSource before cross-app mode appears in Settings."},{"key":"B","text":"'Let Claude work across files' is OFF by default on Team and Enterprise and must be enabled per add-in on that device."},{"key":"C","text":"Cross-app working is switched on once for the whole organisation and then applies immediately on every device."},{"key":"D","text":"Cross-app working is an Enterprise-only capability and is not offered on Team plans at any add-in version."}],"correct":["B"],"explanation":"With all four add-ins installed from AppSource and activated once, the remaining step is the per-add-in setting. Cross-app working is enabled through 'Let Claude work across files' in each add-in's Settings. It is on by default on Pro and Max but defaults to off on Team and Enterprise, and the toggle is per-device, so a Team user must switch it on themselves in every host they want to coordinate from.","rationales":{"A":"Anthropic's requirements list installation from the Microsoft AppSource for all four add-ins. Admins can manage member access to the add-ins through the Microsoft 365 Admin Center, but Admin Center deployment is not a precondition for cross-app mode.","C":"Admins can toggle 'Let Claude work across apps' at Organization settings > Office agents, but the user-facing setting is per add-in and per device, so it does not propagate automatically to every machine.","D":"Cross-app working is available on any paid plan, Pro, Max, Team or Enterprise; the difference between them is the default state of the toggle, not availability."},"sources":[{"title":"Work across M365 apps - Claude Docs","url":"https://claude.com/docs/office-agents/work-across-apps","date":"2026-08-19","basis":"verified-live"}],"tags":["claude-for-m365","cross-app-mode","per-device-setting","add-ins"]},{"id":"D4-028","domain":"D4","objective":"Communicate Claude's value and limitations to stakeholders","type":"single","difficulty":"hard","scenario":true,"stem":"An enterprise architect plans to deploy Claude for Microsoft 365 through the organisation's existing Azure AI Foundry deployment, and has already promised the finance team that Claude will work across an open Excel workbook and an open PowerPoint deck. Which limitation must be communicated?","options":[{"key":"A","text":"Cross-app working is supported through Azure AI Foundry, though not through Amazon Bedrock or Google Cloud Vertex AI."},{"key":"B","text":"Cross-app working is supported on any deployment path, provided the add-ins were installed from Microsoft AppSource."},{"key":"C","text":"Cross-app working is supported only when signing in with a Claude account directly, not through a cloud provider or gateway."},{"key":"D","text":"Cross-app working through a cloud provider is supported once Organization settings > Office agents is set to manual approval."}],"correct":["C"],"explanation":"Anthropic documents that cross-app working in Claude for Microsoft 365 is available only when signing in with a Claude account directly. It is not supported when connecting through Amazon Bedrock, Google Cloud Vertex AI, Azure AI Foundry, or an LLM gateway, so the promised behaviour would not work on this deployment path.","rationales":{"A":"Azure AI Foundry is named alongside Bedrock and Vertex AI as unsupported. Singling it out as the exception reverses the documentation.","B":"Installing from AppSource is required, but it does not overcome the deployment-path restriction; the sign-in route is what determines support.","D":"The Organization settings > Office agents control is a simple 'Let Claude work across apps' toggle. There is no manual-approval mode that unlocks gateway deployments."},"sources":[{"title":"Work across M365 apps - Claude Docs","url":"https://claude.com/docs/office-agents/work-across-apps","date":"2026-08-19","basis":"verified-live"},{"title":"Use Claude for Excel - Claude Docs","url":"https://claude.com/docs/office-agents/excel","date":"2026-08-19","basis":"verified-live"}],"tags":["claude-for-m365","deployment-path","bedrock","vertex-ai","azure-ai-foundry"]},{"id":"D4-029","domain":"D4","objective":"Integrate Claude into existing workflows to augment or redesign them","type":"single","difficulty":"easy","scenario":false,"stem":"Claude Cowork's permission model offers three modes. Which set is correct?","options":[{"key":"A","text":"Verified, Community and Custom"},{"key":"B","text":"Always allow, Needs approval and Blocked"},{"key":"C","text":"Automatically approve and Manually approve"},{"key":"D","text":"Manual, Auto and Skip"}],"correct":["D"],"explanation":"Cowork's three permission modes are Manual (Claude pauses and asks for approval), Auto (Claude reviews actions for safety and blocks unsafe ones) and Skip (no automatic review). Cowork also accesses only the folders a user explicitly connects.","rationales":{"A":"Verified, Community and Custom are the connector labels used in the Connectors Directory, which govern display and discovery rather than permissions.","B":"Always allow, Needs approval and Blocked are the per-action organisation-wide controls for connectors on Team and Enterprise plans, not Cowork's permission modes.","C":"Automatically approve and Manually approve are the two action-approval modes in Claude in Chrome, and there are only two of them."},"sources":[{"title":"Get started with Claude Cowork - Anthropic Help Center","url":"https://support.claude.com/en/articles/13345190-get-started-with-claude-cowork","date":"2026-08-18","basis":"published"}],"tags":["cowork","permission-modes","manual-auto-skip","folder-access"]},{"id":"D4-030","domain":"D4","objective":"Integrate Claude into existing workflows to augment or redesign them","type":"single","difficulty":"easy","scenario":true,"stem":"A data analyst has a custom skill saved locally in the Claude Code CLI's configuration directory and expects it to appear when she opens Cowork on the same machine. It does not appear. Why, and what is the fix?","options":[{"key":"A","text":"Cowork syncs from the claude.ai account and does not read the CLI directory, so add the skill under Customize."},{"key":"B","text":"Cowork loads local skills only from a marketplace, so she must publish it to the organisation's plugin marketplace."},{"key":"C","text":"Cowork reads the CLI directory only after a restart, so quit and reopen Claude Desktop before starting the session."},{"key":"D","text":"Skills written for Claude Code cannot run in Cowork at all, so the skill will have to be rewritten for Cowork."}],"correct":["A"],"explanation":"Cowork loads the connectors, skills and plugins enabled for the claude.ai account, synced at session start, and deliberately does not read the Claude Code CLI's local configuration directory. A skill that exists only there has to be added under Customize.","rationales":{"B":"Publishing to a marketplace is one distribution route but is not required. Adding the skill under Customize is the documented fix.","C":"This is not a timing issue. Cowork never reads the CLI's local directory, so restarting Claude Desktop changes nothing.","D":"The skill can run in Cowork without being rewritten; it simply has to be added through Customize rather than inherited from the CLI's local configuration."},"sources":[{"title":"Cowork overview - Claude Docs","url":"https://claude.com/docs/cowork/overview","date":"2026-08-19","basis":"verified-live"}],"tags":["cowork","skills-sync","customize","claude-code-configuration"]},{"id":"D4-031","domain":"D4","objective":"Communicate Claude's value and limitations to stakeholders","type":"single","difficulty":"hard","scenario":true,"stem":"A financial controller asks whether Claude for Excel can pull up last quarter's workbook from the shared drive, run its VBA macros and produce a summary. What should be communicated?","options":[{"key":"A","text":"Claude supports macros and data tables, but it cannot preserve formula relationships when a value is changed."},{"key":"B","text":"Claude can read from and write to only workbooks that are already open, and it does not support macros or VBA."},{"key":"C","text":"Claude can open workbooks from a shared drive but cannot write to them, and macros in those workbooks run as normal."},{"key":"D","text":"Claude can open and switch between workbooks freely, but macros have to be rewritten as formulas before they will run."}],"correct":["B"],"explanation":"Claude for Excel can read from and write to only the file currently open; it cannot create, open, close or switch files. It also explicitly does not support data tables or macros and VBA, so both halves of the controller's request are outside its documented capability.","rationales":{"A":"This inverts the documented behaviour. Macros and data tables are unsupported, while preserving formula relationships when changing values is something Claude for Excel does do.","C":"Claude cannot open files at all, and it can write to an open workbook. Both parts of this option are wrong, and macros are unsupported.","D":"Claude cannot open or switch files, so the premise fails before macros are considered."},"sources":[{"title":"Use Claude for Excel - Claude Docs","url":"https://claude.com/docs/office-agents/excel","date":"2026-08-19","basis":"verified-live"},{"title":"Work across M365 apps - Claude Docs","url":"https://claude.com/docs/office-agents/work-across-apps","date":"2026-08-19","basis":"verified-live"}],"tags":["claude-for-excel","open-files-only","macros-and-vba","limitations"]},{"id":"D4-032","domain":"D4","objective":"Communicate Claude's value and limitations to stakeholders","type":"multi","difficulty":"medium","scenario":true,"stem":"A consultant is drafting an internal guidance note on where Claude for Excel should not be relied upon. Anthropic names three cases the product is 'not recommended for'. Which THREE? (Select THREE.)","options":[{"key":"A","text":"Audit-critical calculations without verification"},{"key":"B","text":"Final client deliverables without human review"},{"key":"C","text":"Exploratory analysis of a draft workbook by the colleague who built it"},{"key":"D","text":"Models containing highly sensitive or regulated data without proper controls"},{"key":"E","text":"Sorting and filtering large ranges of data across several worksheets"},{"key":"F","text":"Workbooks that rely on pivot tables, conditional formatting or data validation dropdowns"}],"correct":["A","B","D"],"explanation":"Anthropic explicitly lists three cases Claude for Excel is not recommended for: final client deliverables without human review, audit-critical calculations without verification, and models containing highly sensitive or regulated data without proper controls. Each is qualified by the missing control rather than being an outright prohibition.","rationales":{"C":"Exploratory analysis by the person who built the workbook is a mainstream use, and Claude provides clickable cell-level citations to support it.","E":"Sorting and filtering are among the native Excel operations explicitly supported, so they are not on the not-recommended list.","F":"Pivot tables, conditional formatting and data validation dropdowns are native operations Claude for Excel supports. Data tables and macros are the unsupported features."},"sources":[{"title":"Use Claude for Excel - Claude Docs","url":"https://claude.com/docs/office-agents/excel","date":"2026-08-19","basis":"verified-live"}],"tags":["claude-for-excel","not-recommended-for","human-review","regulated-data"]},{"id":"D4-033","domain":"D4","objective":"Communicate Claude's value and limitations to stakeholders","type":"multi","difficulty":"medium","scenario":true,"stem":"An Enterprise compliance manager assumes Claude for Microsoft 365 add-in activity will flow into the organisation's existing oversight tooling and retention policy. Which TWO points must be communicated? (Select TWO.)","options":[{"key":"A","text":"Add-in activity is not included in Enterprise audit logs, the Compliance API or data exports."},{"key":"B","text":"Backend inputs and outputs from the add-ins are retained indefinitely so that they remain available for compliance review later."},{"key":"C","text":"The add-ins do not inherit the organisation's custom data-retention settings, and chat history is stored locally in the browser."},{"key":"D","text":"Add-in chat history syncs across a user's devices and can be exported centrally by an administrator."},{"key":"E","text":"Add-in activity appears in audit logs, but only once the Compliance API has been enabled by an owner."}],"correct":["A","C"],"explanation":"Anthropic states that the Claude for M365 add-ins do not inherit custom data retention settings an organisation may have set, and that 'activity is not included in Enterprise audit logs, the Compliance API, or data exports'. Add-in chat history is stored locally in the browser rather than on Anthropic's servers, and backend inputs and outputs are deleted within 30 days of receipt or generation.","rationales":{"B":"Backend inputs and outputs are deleted within 30 days rather than retained indefinitely, which is part of why the add-ins are unsuitable as a compliance record.","D":"Add-in chat history sits locally in the browser and is not synced across devices, so there is nothing for an administrator to export centrally.","E":"Enabling the Compliance API does not bring add-in activity into scope; the exclusion is a property of the add-ins themselves."},"sources":[{"title":"Work across M365 apps - Claude Docs","url":"https://claude.com/docs/office-agents/work-across-apps","date":"2026-08-19","basis":"verified-live"},{"title":"Use Claude for Excel - Claude Docs","url":"https://claude.com/docs/office-agents/excel","date":"2026-08-19","basis":"verified-live"}],"tags":["audit-logs","compliance-api","data-retention","claude-for-m365"]},{"id":"D4-034","domain":"D4","objective":"Communicate Claude's value and limitations to stakeholders","type":"single","difficulty":"medium","scenario":true,"stem":"A team lead reports that colleagues keep 'hitting a limit' during long working sessions and asks whether moving to a model with a bigger context window will solve it. How should the distinction be explained?","options":[{"key":"A","text":"Usage limits and length limits are the same measure expressed two ways, so a larger context window raises both."},{"key":"B","text":"Automatic context management reduces usage consumption by trimming older parts of a long conversation."},{"key":"C","text":"Usage limits govern total use across all conversations and surfaces; length limits are the per-conversation context window."},{"key":"D","text":"Usage limits apply separately to each surface, so shifting work from claude.ai to Claude Code effectively resets them."}],"correct":["C"],"explanation":"Usage limits control how much Claude can be used across all conversations over a period and are shared across claude.ai, Claude Code and Claude Desktop; length limits are the per-conversation context window, which on paid plans reaches up to 1M tokens on the newest models while others support 500K or 200K. A bigger context window therefore addresses only the second. Where code execution is enabled, Claude automatically manages long conversations by summarising earlier messages, and conversations that trigger that automatic context management consume more of the usage limit, not less.","rationales":{"A":"They are separate concepts. A larger context window addresses length limits only and does not increase how much of Claude the person can use overall.","B":"Where automatic context management is available it increases usage consumption rather than reducing it, which is the opposite of the intuitive assumption.","D":"Usage limits are shared across claude.ai, Claude Code and Claude Desktop, so moving surfaces does not reset anything."},"sources":[{"title":"How do usage and length limits work? - Anthropic Help Center","url":"https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work","date":"2026-07-13","basis":"published"}],"tags":["usage-limits","length-limits","context-window","automatic-context-management"]},{"id":"D5-001","domain":"D5","objective":"Configure Claude Projects with instructions and knowledge sources","type":"single","difficulty":"easy","scenario":false,"stem":"According to Anthropic's documentation, what access do free-plan accounts have to Projects?","options":[{"key":"A","text":"Free accounts can create any number of projects, but they are not able to add knowledge files to them."},{"key":"B","text":"Free accounts cannot create projects at all, so a paid plan is required before a project can be set up."},{"key":"C","text":"Free accounts can create projects, up to a maximum of five."},{"key":"D","text":"Projects are a paid-plan feature aimed at Team and Enterprise organizations rather than individual users."}],"correct":["C"],"explanation":"Projects are available to all users including free accounts, with free-plan users able to create a maximum of five projects. The cap is on the number of projects, not on the ability to add project instructions or knowledge.","rationales":{"A":"Reverses the documented position: the count is capped at five for free users, and knowledge can be added to those projects.","B":"Projects are explicitly available to free accounts; only some project features, such as sharing, are plan-restricted.","D":"Project sharing with permission levels is Team and Enterprise only, but creating a project is not."},"sources":[{"title":"What are projects? | Anthropic Help Center","url":"https://support.claude.com/en/articles/9517075-what-are-projects","date":"2026-07-22","basis":"published"}],"tags":["projects","plan-limits","free-plan"]},{"id":"D5-002","domain":"D5","objective":"Configure Claude Projects with instructions and knowledge sources","type":"single","difficulty":"easy","scenario":true,"stem":"A consultant sets up a project for a client engagement and writes detailed project instructions covering tone, terminology and report structure. Later that week she starts a new conversation from the main chat screen, outside the project, and notices Claude ignores those rules entirely. What is the most likely explanation?","options":[{"key":"A","text":"Project instructions take effect only after at least one knowledge file has been attached to the project."},{"key":"B","text":"Project instructions are applied only when the memory feature has been switched on for the account."},{"key":"C","text":"Project instructions expire on a rolling basis and must be re-saved at the start of each working week."},{"key":"D","text":"Project instructions apply only to chats started inside that project."}],"correct":["D"],"explanation":"A project is a self-contained workspace with its own chat history and knowledge base, and project instructions only apply to chats within that project. To have guidance follow her into every conversation she would need profile-level Instructions for Claude instead, which are account-wide.","rationales":{"A":"Instructions are independent of knowledge files; an empty project still applies its instructions inside the project.","B":"Memory is a separate personalization feature and is not a precondition for project instructions.","C":"There is no documented expiry or weekly re-save requirement for project instructions."},"sources":[{"title":"Understanding Claude's personalization features | Anthropic Help Center","url":"https://support.claude.com/en/articles/10185728-understanding-claude-s-personalization-features","date":"2026-08-19","basis":"published"}],"tags":["projects","project-instructions","scope"]},{"id":"D5-003","domain":"D5","objective":"Configure Claude Projects with instructions and knowledge sources","type":"single","difficulty":"medium","scenario":true,"stem":"Over several weeks a procurement analyst has worked through supplier naming conventions with Claude in ordinary standalone chats. He then creates a project for the supplier review and is surprised that Claude does not recall any of those conventions inside the project. Which statement best explains this behaviour?","options":[{"key":"A","text":"Memory is cleared automatically whenever a new project is created, so every project starts from a blank slate."},{"key":"B","text":"Each project has its own separate memory space and summary, so memory built in standalone chats does not carry into a project."},{"key":"C","text":"Memory transfers into a project only once the project has been shared with at least one colleague who can edit it."},{"key":"D","text":"Memory applies only to chats where a knowledge file has been attached, so it does not operate in an empty project."}],"correct":["B"],"explanation":"Each project has its own separate memory space and dedicated project summary, so the context in each project stays separate from other projects and from non-project chats. The remedy is to restate the conventions in project instructions or project knowledge.","rationales":{"A":"Creating a project does not delete account memory; only Reset memory does that.","C":"Sharing is a Team and Enterprise permission feature and has no documented effect on memory scope.","D":"Memory operation is not conditional on file attachments in a conversation."},"sources":[{"title":"Use Claude's chat search and memory to build on previous context | Anthropic Help Center","url":"https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context","date":"2026-08-19","basis":"published"}],"tags":["projects","memory","scope"]},{"id":"D5-004","domain":"D5","objective":"Manage uploaded knowledge and connectors (e.g., Google Drive, Gmail)","type":"multi","difficulty":"medium","scenario":true,"stem":"An office manager at a small charity is on a Free plan and is adding connectors to Claude for the first time. She wants to understand what control she has over them. Which TWO statements are accurate? (Select TWO.)","options":[{"key":"A","text":"Every action a connector offers is enabled automatically and cannot be adjusted once the connector has been added."},{"key":"B","text":"Each action a connector can take is set individually to Always allow, Needs approval or Blocked."},{"key":"C","text":"Free-plan users may add up to five custom connectors."},{"key":"D","text":"Connector permissions are fixed for the whole organization and cannot differ between individual users."},{"key":"E","text":"Free-plan users are limited to one custom connector."},{"key":"F","text":"Adding a connector automatically copies every file it can reach into project knowledge."}],"correct":["B","E"],"explanation":"The actions a connector can take are controlled individually, with each action set to Always allow, Needs approval or Blocked, and Free users are limited to one custom connector. Action-level permissions are the practical control point for a new connector, and the Free-plan cap governs how many custom connectors she can add at all.","rationales":{"A":"Connector actions are adjustable at any time; the documented settings are Always allow, Needs approval and Blocked.","C":"Five is not the documented Free-plan figure; Free users are limited to one custom connector.","D":"Connectors authenticate per user and access permissions are enforced at the user level, although Owners gate which connectors may be added on Team and Enterprise.","F":"Connectors retrieve data and take actions on request; they do not bulk-copy a service's contents into project knowledge."},"sources":[{"title":"Use connectors to extend Claude's capabilities | Anthropic Help Center","url":"https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities","date":"2026-08-01","basis":"published"}],"tags":["connectors","permissions","plan-limits","governance"]},{"id":"D5-005","domain":"D5","objective":"Configure Claude Projects with instructions and knowledge sources","type":"single","difficulty":"medium","scenario":true,"stem":"A school business leader has set account-wide Instructions for Claude in her profile asking for concise, plain-English answers with no jargon. She now creates a project for a funding bid and writes project instructions covering the funder's terminology and bid structure. A colleague tells her the project instructions will simply replace her profile instructions once she works inside the project. What should she expect instead?","options":[{"key":"A","text":"Both sets are in force inside the project: the account-wide instructions still apply, and the project instructions add context for chats in that project."},{"key":"B","text":"Only the project instructions apply inside the project, because account-wide instructions are suspended for any chat that belongs to a project rather than the main chat screen."},{"key":"C","text":"Neither set applies until she picks them from the personalization menu at the start of each new chat she opens inside the project."},{"key":"D","text":"The account-wide instructions apply and the project instructions are ignored, because profile settings always take precedence over anything configured at project level."}],"correct":["A"],"explanation":"Instructions for Claude are account-wide settings that apply across all conversations, while project instructions apply only to chats within that project, and the personalization features are designed to be used independently or in combination. Inside the project both layers are therefore in force, which is why project instructions are best written as additions rather than as a restatement of her general preferences.","rationales":{"B":"Nothing suspends account-wide instructions inside a project; they are documented as applying across all conversations.","C":"Neither layer requires per-conversation selection, unlike a style, which is chosen for a given chat.","D":"No precedence rule of that kind is documented; the layers combine rather than one cancelling the other."},"sources":[{"title":"Understanding Claude's personalization features | Anthropic Help Center","url":"https://support.claude.com/en/articles/10185728-understanding-claude-s-personalization-features","date":"2026-08-19","basis":"published"}],"tags":["personalization-layers","project-instructions","profile-instructions","scope"]},{"id":"D5-006","domain":"D5","objective":"Manage uploaded knowledge and connectors (e.g., Google Drive, Gmail)","type":"single","difficulty":"hard","scenario":false,"stem":"Which statement correctly describes Anthropic's documented file limits for project knowledge compared with files attached to an ordinary chat?","options":[{"key":"A","text":"Project files are capped at 500MB each with no cap on file count, and chat attachments are capped at 30MB each with a limit of 20 files per chat."},{"key":"B","text":"Project files and chat attachments are both capped at 30MB each, with a shared limit of 20 files in total."},{"key":"C","text":"Project files and chat attachments are both capped at 500MB each, with project files limited to 20 per project."},{"key":"D","text":"Project files are capped at 30MB each with no cap on file count; chat attachments are capped at 500MB each and 20 files per chat."}],"correct":["D"],"explanation":"Project knowledge allows 30MB per file with an unlimited number of files, bounded only by Claude's context window, while files attached directly to a chat allow 500MB per file and up to 20 files per chat. Answering correctly means holding both figures and both count rules at once, because every option is a plausible recombination of the same four numbers.","rationales":{"A":"Swaps the two per-file limits; 500MB is the chat attachment limit, not the project knowledge limit.","B":"The 20-file limit belongs to a single chat, not to projects, and project files are not capped by count.","C":"Applies the chat per-file limit to projects and invents a 20-file project cap."},"sources":[{"title":"Upload files to Claude | Anthropic Help Center","url":"https://support.claude.com/en/articles/8241126-upload-files-to-claude","date":"2026-07-22","basis":"published"}],"tags":["knowledge-limits","file-upload","projects"]},{"id":"D5-007","domain":"D5","objective":"Manage uploaded knowledge and connectors (e.g., Google Drive, Gmail)","type":"single","difficulty":"medium","scenario":true,"stem":"An operations lead at a manufacturing firm uploads a 240-page regulatory PDF and asks Claude to interpret a chart on page 180. Claude summarises the surrounding text accurately but says it cannot see the chart. Which behaviour
