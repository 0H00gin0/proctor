colleague could act on is both the documented advice and the same idea as the golden rule of clear prompting.","rationales":{"A":"More keywords do not restore the relationships between them. The documented fix is phrasing the request as a person would phrase it, then being specific about what is wanted.","B":"No fixed field layout of this kind appears in Anthropic's guidance for claude.ai users. Specificity comes from describing the task, not from imposing a template on every request.","D":"Being specific in requests is one of the listed getting started tips, so how the request is worded plainly does affect the answer."},"sources":[{"title":"Get started with Claude - Claude Help Centre","url":"https://support.claude.com/en/articles/8114491-get-started-with-claude","date":"2026-06-02","basis":"published"},{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-20","basis":"verified-live"}],"tags":["phrasing","getting-started","specificity","beginner-myth","conversational"],"notes":{"signal":"The keyword-string habit is carried over from search engines and is the first thing new business users do wrong, yet the unofficial guides start at prompt structure and never address how a request should be phrased. Verified against bank #1: D1-001 keys the golden rule and D1-006 keys supplying background as though to someone with no prior knowledge, but neither bank has any item on Anthropic's user-facing advice about the register and phrasing of a request."}},{"id":"D1-C003","domain":"D1","objective":"Create effective prompts for business and technical tasks","type":"multi","difficulty":"medium","scenario":true,"stem":"A communications manager asks Claude for a twelve slide investor update. The deck comes back well organised, but it ignores the corporate slide template she is required to use, and it pads the middle with two summary slides that repeat what earlier slides already said. Which TWO changes match Anthropic's documented guidance for document and deck creation? (Select TWO.)","options":[{"key":"A","text":"Ask for one slide per prompt and assemble the deck herself at the end."},{"key":"B","text":"Give Claude the specific template and styles the deck has to follow."},{"key":"C","text":"Repeat the phrase no filler three times so the instruction cannot be missed."},{"key":"D","text":"Ask for as many features and flourishes as possible so the deck feels fuller."},{"key":"E","text":"Tell Claude to match the length to the task and leave out filler sections."},{"key":"F","text":"Ask Claude to double-check the finished deck against her brief before replying."}],"correct":["B","E"],"explanation":"Anthropic documents document creation as something the current models usually get usable on the first try, and the Claude Opus 5 guidance on office and document tasks says to prompt the model with any specific styles or templates it needs to follow. The same page treats deliverable length as a separate lever, because written documents run long by default: it recommends explicit length calibration, telling Claude to match the length of written documents to what the task needs, covering the substance without padding with filler sections, redundant summaries or boilerplate. Those two instructions map onto the two defects she is seeing.","rationales":{"A":"The documentation describes whole decks produced in one pass. Splitting the work into a prompt per slide adds handling and still leaves the template unstated.","C":"Repetition and emphatic wording are not the documented lever here, and heavy wording tends to be followed too literally later. The documented lever is an explicit length calibration.","D":"Asking for as many features as possible is the documented way to get more ambitious output, which is the opposite of the padding problem she is trying to fix.","F":"Claude Opus 5 verifies its own work, and Anthropic advises removing explicit verification instructions because they cause over-verification with no gain in quality."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-20","basis":"verified-live"},{"title":"Prompting Claude Opus 5 - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5","date":"2026-08-20","basis":"verified-live"}],"tags":["document-creation","templates","deliverable-length","output-format","multiple-response"],"notes":{"signal":"Decks and written documents are the deliverables non-developer candidates produce most often, and the unofficial material covers prompting for text but not for a document that has to satisfy a house template and a length expectation. Verified against bank #1: D1-009 keys the above-and-beyond modifier and D1-019 keys plain-text formatting, but neither bank has an item on prompting for a document or deck, on supplying the template it must follow, or on calibrating the length of a written deliverable."}},{"id":"D1-C004","domain":"D1","objective":"Apply task decomposition techniques to structure complex requests","type":"single","difficulty":"hard","scenario":true,"stem":"A transformation lead has a genuinely hard, loosely specified piece of work: consolidating three regional processes into one. She has Claude Fable 5 available and cannot decide whether to break the work into small prompts herself or hand the whole thing over. Which approach matches Anthropic's documented guidance for that model?","options":[{"key":"A","text":"Reduce the work to the simplest sub-task she can define and build up from there."},{"key":"B","text":"Write the full plan herself and give Claude one step at a time to execute."},{"key":"C","text":"Ask for three rival plans up front and choose between them before any work starts."},{"key":"D","text":"Give it the whole task and have it scope the work, ask questions, then execute."}],"correct":["D"],"explanation":"Anthropic's guidance for Claude Fable 5 tells you to start at the top of your difficulty range: pick a task harder than you would assign to prior models, and have the model scope it, ask clarifying questions and execute. The same page lists navigating ambiguity among the capability improvements, describing the model as performing well when given complex, multithreaded requests and asked to determine next steps, and it warns that testing the model only on simpler workloads tends to undersell its capability range. Decomposition remains available when she needs to inspect a step, but pre-chopping a hard task is what this guidance argues against.","rationales":{"A":"Anthropic says the reverse for this model: the teams seeing the best outcomes give it their hardest problems, and simpler workloads undersell what it can do.","B":"Feeding one step at a time removes the scoping the guidance asks the model to perform, and it makes her plan rather than the work the limit on quality.","C":"Choosing between plans drawn up before anything has been scoped is not the documented pattern; scoping and clarifying questions come first."},"sources":[{"title":"Prompting Claude Fable 5 - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-fable-5","date":"2026-08-20","basis":"verified-live"}],"tags":["decomposition","scoping","clarifying-questions","fable-5","when-not-to-decompose"],"notes":{"signal":"Unofficial D1 material teaches decomposition as an unconditional habit, so candidates arrive believing that a harder task always means more chopping. Verified against bank #1: D1-011 keys the two conditions under which explicit chaining is still useful, D1-013 and D1-014 key when to delegate and when to work directly, and D1-015 keys substeps as a documented remedy, but nothing in either bank keys the documented advice to hand a hard, loosely specified task over whole and have the model scope it and ask clarifying questions first."}},{"id":"D1-C005","domain":"D1","objective":"Iterate prompts to improve output quality","type":"single","difficulty":"medium","scenario":true,"stem":"A finance officer pastes a fourteen section policy into Claude Sonnet 5 and asks for it to be rewritten in plain English. The reply rewrites the first section well and leaves the other thirteen untouched. She reports it to her team as a product defect. What does Anthropic's guidance for that model tell her to change?","options":[{"key":"A","text":"State the scope explicitly: every section, not only the first one."},{"key":"B","text":"Send the same request again until a reply covers the whole document."},{"key":"C","text":"Add that the rewrite is important, so the instruction carries further."},{"key":"D","text":"Open fourteen conversations and rewrite one section in each of them."}],"correct":["A"],"explanation":"Anthropic documents Claude Sonnet 5 as interpreting prompts literally and explicitly. It does not silently generalise an instruction from one item to another, and it does not infer requests you did not make. The documented remedy is to state the scope explicitly, and the example given is almost this case: apply this formatting to every section, not just the first one. Read that way the reply is not a defect at all, but a literal reading of an instruction that never said how far it reached.","rationales":{"B":"Resending an unchanged prompt leaves the scope exactly as unstated as it was the first time, so there is nothing for the model to read differently.","C":"Emphasis is not scope. Telling Claude that the task matters says nothing about how many sections the instruction is meant to cover.","D":"Fourteen conversations is a great deal of handling for something one clause fixes, and it splits work the model can do in a single pass."},"sources":[{"title":"Prompting Claude Sonnet 5 - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-sonnet-5","date":"2026-08-20","basis":"verified-live"}],"tags":["iteration","instruction-following","scope","sonnet-5","diagnosis"],"notes":{"signal":"Partial completion on a multi-item request is one of the most common things business users report as a bug, and the unofficial guides have nothing on it. Verified against bank #1: D1-016 keys surfacing findings before filtering, D1-023 keys diagnose-then-fix iteration, and D1-024 keys constraining a widened scope, but no item in either bank keys literal instruction reading or the remedy of stating how broadly an instruction applies."}},{"id":"D1-C006","domain":"D1","objective":"Iterate prompts to improve output quality","type":"single","difficulty":"medium","scenario":true,"stem":"A policy officer asks for a full rewrite of a long procedure. The reply stops part way through section four and simply ends. A colleague tells her that Claude has run out of context window and that she should start again with a shorter extract. What does Anthropic's help centre tell her to do?","options":[{"key":"A","text":"Start again with a shorter extract, since the reply cannot exceed what she sent."},{"key":"B","text":"Send the previous prompt and the answer so far back and ask Claude to continue."},{"key":"C","text":"Move to a plan with a larger context window so replies stop being cut short."},{"key":"D","text":"Resend the identical request, because the reply completes on a second attempt."}],"correct":["B"],"explanation":"The help centre article on responses that come back too brief draws a distinction candidates routinely get wrong: Claude's context window applies to the prompts you provide, not to the output it generates. The documented step is to retool the prompt by including the previous prompt and the response so far in the next message, which lets Claude carry on from where it left off. The colleague's diagnosis is the wrong one, and shortening the input is not the remedy the article gives for this symptom.","rationales":{"A":"This treats the input limit as a cap on the answer, which is precisely the distinction the article corrects.","C":"A larger context window governs how much material she can send in, not the point at which a generated answer stops.","D":"Resending the same request is undirected. The documented step is to supply the prior exchange so the answer resumes instead of restarting."},"sources":[{"title":"Claude's response to my prompt is too brief - Claude Help Centre","url":"https://support.claude.com/en/articles/8114518-claude-s-response-to-my-prompt-is-too-brief","date":"2026-03-16","basis":"published"},{"title":"My prompt isn't giving me a helpful answer - Claude Help Centre","url":"https://support.claude.com/en/articles/7996857-my-prompt-isn-t-giving-me-a-helpful-answer","date":"2026-03-16","basis":"published"}],"tags":["iteration","truncated-output","context-window","continuation","misconception"],"notes":{"signal":"Context window folklore is the single most confident piece of misinformation in the unofficial material, and an answer that stops mid-sentence is the case where it does most damage. Verified against bank #1 and the other community files: D7-001 covers a message that exceeds the input length limit, D3-022 covers length limits inside long conversations and D3-021 covers degradation as token count grows, but no item anywhere covers an answer that stops part way, and none states the documented distinction that the context window applies to the prompt rather than to the generated output."}},{"id":"D1-C008","domain":"D1","objective":"Iterate prompts to improve output quality","type":"single","difficulty":"medium","scenario":true,"stem":"A strategy analyst has Claude Fable 5 helping her pick a supplier shortlist. The replies keep re-arguing a decision the team settled last week, walk at length through options she has already ruled out, and end without naming a preferred supplier. Which instruction matches Anthropic's documented guidance for this behaviour?","options":[{"key":"A","text":"Ask for the answer twice and keep whichever of the two replies is shorter."},{"key":"B","text":"Tell it to act once it has enough information and to give a recommendation."},{"key":"C","text":"Tell it not to waffle, not to repeat itself and not to sit on the fence."},{"key":"D","text":"Ask it to set out in full why every option was considered before concluding."}],"correct":["B"],"explanation":"Anthropic's guidance for Claude Fable 5 addresses this under longer turns by default, and supplies a sample instruction for keeping the model from overplanning on an ambiguous task: when you have enough information to act, act; do not re-derive facts already established in the conversation or re-litigate a decision the user has already made; and if you are weighing a choice, give a recommendation rather than an exhaustive survey. Every symptom the analyst describes is named in that one instruction.","rationales":{"A":"Picking between two replies by length is a selection rule rather than a change to the prompt, and it does nothing about the settled decision being reopened.","C":"This is a list of things to avoid, and Anthropic's documented steer is to tell Claude what to do instead of what not to do.","D":"Setting out every option in full is the exhaustive survey the guidance tells you to prompt away from, so it would deepen the problem."},"sources":[{"title":"Prompting Claude Fable 5 - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-fable-5","date":"2026-08-20","basis":"verified-live"},{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-20","basis":"verified-live"}],"tags":["iteration","decisiveness","overplanning","fable-5","recommendation"],"notes":{"signal":"An indecisive answer that surveys everything and recommends nothing is a common complaint in business use, and the unofficial material treats it as a verbosity problem to be solved with a word limit. Verified against bank #1: D1-021 keys stating a length requirement explicitly, D1-024 keys constraining a widened scope and D1-020 keys removing carried-over verification instructions, but nothing in either bank keys the documented instruction for a model that re-argues settled decisions and surveys options instead of recommending one."}},{"id":"D2-C001","domain":"D2","objective":"Determine when human review or additional verification is required","type":"single","difficulty":"medium","scenario":true,"stem":"A policy team fact-checks a Claude-drafted consultation briefing claim by claim against the source pack, corrects two figures, and signs the 1,200-word draft off. The head of communications then asks for it at 600 words, so the team gives the approved draft back to Claude and asks for it to be cut by half. The shortened version is due to go to the board this afternoon. What does the earlier fact-check establish about the version that will actually be sent?","options":[{"key":"A","text":"It carries over in full, because a shortening pass can only take material away and has no way of putting a new claim in."},{"key":"B","text":"Nothing yet: the shortened text is a fresh output, so its claims have to be checked in the version that will be sent."},{"key":"C","text":"It carries over provided the cut is made in the same conversation, since the approved draft is still there in the context."},{"key":"D","text":"It carries over once Claude has confirmed that the shortened version preserves every figure that the team checked."}],"correct":["B"],"explanation":"Verification attaches to a particular output, not to a document title. Asking Claude to cut an approved draft is iterative refinement, a documented technique in which Claude's output becomes the input to a follow-up prompt, and what comes back is newly generated text. Compression is where qualifiers get dropped, two findings get merged into one, and a hedged estimate turns into a stated fact, none of which the earlier pass examined. Anthropic's guidance is explicit that hallucination-reduction techniques do not eliminate the problem and that critical information should always be validated, especially for high-stakes decisions, and the support centre warns that Claude can write things that look correct but are very mistaken. The claims in the 600-word version are the ones the board will act on, so those are the claims that have to be checked.","rationales":{"A":"Shortening is generation, not deletion. Claude rewrites the material as it condenses it, which is exactly how a caveat disappears or two separate findings become a single causal sentence that neither source supported.","C":"Having the approved draft in context makes a faithful cut more likely, but it is not a check. Nothing in the conversation compares the new sentences against the source pack, and the team would be relying on the same process that produced the draft.","D":"A confirmation from Claude is a self-report from the process under examination. Anthropic's support guidance is that Claude should not be relied on as a singular source of truth, not that it should be asked to vouch for its own output."},"sources":[{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-20","basis":"verified-live"},{"title":"Claude is providing incorrect or misleading responses. What's going on? - Claude Help Centre","url":"https://support.claude.com/en/articles/8525154-claude-is-providing-incorrect-or-misleading-responses-what-s-going-on","date":"2026-03-16","basis":"published"}],"tags":["re-verification","iterative-refinement","version-specific-check","human-review-threshold","compression-risk"],"notes":{"caveat":"The community_signal makes a false absolute claim about bank #1 coverage - the same defect class the item was originally replaced for. It states: 'every bank #1 item checks a single generation once an","signal":"Community study material presents verification as a single gate at the end of a drafting workflow, which leaves candidates with no rule for what a later refinement pass does to a completed check, and cutting an approved draft to length is one of the most common last steps in real office use. Verified against bank #1: D2-006, D2-028 and D2-032 all rebut substitutes for verification, and D2-022 and D2-036 key iterative refinement as a technique, but every bank #1 item checks a single generation once and none addresses re-verification after the text has been regenerated."}},{"id":"D2-C002","domain":"D2","objective":"Apply fact-checking and validation techniques","type":"single","difficulty":"medium","scenario":true,"stem":"A fundraising manager uploads one 30-page impact report and asks Claude for a two-page donor summary drawn from it. The draft is fluent and reads well, but it contains a sentence attributing a precise 37 per cent improvement to a named 2026 university study, and a sentence dating a partnership announcement to a specific month. Neither the study nor the announcement is anything she recognises from the report. Which check most directly tests those specifics against the material she actually supplied?","options":[{"key":"A","text":"Ask Claude to quote, word for word from the supplied report, the passage behind each figure and named source, and to delete what it cannot quote."},{"key":"B","text":"Run the same request several more times and keep the version whose figures and dates recur most consistently across the separate runs."},{"key":"C","text":"Ask Claude whether it is confident that the named 2026 study and the 37 per cent figure are accurate, and circulate the draft if it says that it is."},{"key":"D","text":"Judge each figure against what she already knows about outcomes in her sector and retain the ones that fall within a plausible range."}],"correct":["A"],"explanation":"Anthropic's guidance on reducing hallucinations lists verifying with citations as a basic strategy: have Claude cite quotes and sources for each claim, and have it verify each claim by finding a supporting quote after generating the response, retracting any claim for which no quote can be found. The related direct-quote technique grounds work in the actual text of a long document. That is precisely the test this situation needs, because the question is not whether the figure is plausible in the abstract but whether the supplied report supports it. Fabricated specifics are dangerous exactly because they are formatted like verifiable ones, so the check has to be against the source rather than against impressions.","rationales":{"B":"Best-of-N verification is documented, and inconsistency across runs is a useful hallucination signal, but the inference only runs one way. A fabrication that reproduces itself consistently passes this test, and the test never touches the supplied report.","C":"Self-reported confidence comes from the same generation process as the claim. Anthropic's support guidance is that Claude should not be relied on as a single source of truth, not that it should be asked to vouch for itself.","D":"A plausibility check is the test a well-formed fabrication is built to survive; 37 per cent looks entirely reasonable, which is why it needs to be traced to a passage rather than weighed against intuition."},"sources":[{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-20","basis":"verified-live"},{"title":"Claude is providing incorrect or misleading responses. What's going on? - Claude Help Centre","url":"https://support.claude.com/en/articles/8525154-claude-is-providing-incorrect-or-misleading-responses-what-s-going-on","date":"2026-03-16","basis":"published"}],"tags":["fabricated-specifics","quote-grounding","verify-with-citations","best-of-n-limits"],"notes":{"signal":"Multiple unofficial guides teach candidates to look for invented statistics, invented studies and invented dates as the classic hallucination shape, and one hands-on course builds a lab around checking a draft against an uploaded document. Bank #1 has an item on an invented page reference (D2-001) and a definitional item (D2-002), but nothing that makes the candidate choose the test for a named study and a precise percentage against the supplied source, with best-of-N sitting there as the plausible wrong answer."}},{"id":"D2-C003","domain":"D2","objective":"Evaluate Claude-generated outputs for accuracy and completeness","type":"single","difficulty":"medium","scenario":true,"stem":"A membership officer uploads twelve regional branch returns and asks Claude for a short summary with the headline numbers. The summary opens by saying that membership across the twelve branches grew by 6 per cent and that total membership now stands at 48,910. She checks every branch figure quoted in the summary against the returns and each one matches. What still has to be checked before the summary goes to the committee?","options":[{"key":"A","text":"Nothing further, because the branch figures have been confirmed at source and the total and the percentage follow arithmetically from figures that are now known to be right."},{"key":"B","text":"The summary should be produced twice more from the same returns and the three sets of headline numbers compared, since agreement across runs is what establishes the arithmetic."},{"key":"C","text":"Claude should be asked to set out the calculation it performed and to confirm the two headline numbers, since a stated method is what makes a derived figure auditable."},{"key":"D","text":"The total and the percentage, recalculated from the twelve returns, because a figure Claude derived can be wrong even when every figure it quoted is right."}],"correct":["D"],"explanation":"Accuracy has to be judged claim by claim, and a total or a percentage is a claim in its own right. The two headline numbers were not read out of any return; they were produced in the same generation pass as the prose around them, so confirming the addends says nothing about the sum. Anthropic's support guidance warns that Claude can write things that might look correct but are very mistaken and that users should not rely on Claude as a singular source of truth. The documented verification move is to trace each claim back to something that supports it and retract what cannot be supported; for a derived figure the support is the calculation over the underlying returns, which the officer has to perform herself. The trap is that a successful check of the quoted inputs feels like a check of the whole summary.","rationales":{"A":"This assumes that arithmetic performed inside a generated response is guaranteed by the correctness of its inputs. The headline numbers are text produced alongside the narrative, not the output of a checked calculation, and either one can be wrong while all twelve branch figures are right.","B":"Best-of-N verification is documented and drift across runs is a genuine hallucination signal, but the inference only runs one way. A miscalculation that reproduces itself passes this test, and none of the three runs is ever compared with the returns.","C":"Displayed reasoning is at best a summary of how an answer was produced and is never an audit trail. A plausible-looking method statement can sit above a wrong number, and asking the same process to confirm its own figure adds no independent evidence."},"sources":[{"title":"Claude is providing incorrect or misleading responses. What's going on? - Claude Help Centre","url":"https://support.claude.com/en/articles/8525154-claude-is-providing-incorrect-or-misleading-responses-what-s-going-on","date":"2026-03-16","basis":"published"},{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-20","basis":"verified-live"}],"tags":["derived-figures","arithmetic-check","accuracy-claim-by-claim","quoted-versus-computed"],"notes":{"signal":"Community material teaches hallucination-spotting almost entirely as invented facts, invented studies and invented citations, and reduces number-checking to checking figures against the source, which leaves the derived-figure case unaddressed even though it is the everyday one in finance, membership and reporting work. Verified against bank #1: D2-024 keys shape versus values for extracted fields, D2-033 keys a contradiction between a narrative and a table, and D2-001 keys an invented page reference, but no bank #1 item asks the candidate to treat a total or a percentage that Claude computed as an unverified claim."}},{"id":"D2-C005","domain":"D2","objective":"Determine when human review or additional verification is required","type":"multi","difficulty":"medium","scenario":true,"stem":"An operations director is setting the threshold at which a Claude-assisted output must be signed off by a suitably qualified person before it leaves her team. She weighs three things for each output: who receives it, how easily it can be corrected or undone, and how consequential the decision it carries is. Which TWO of the following outputs cross that threshold? Select TWO.","options":[{"key":"A","text":"A shortlist of possible venues for the team away-day, shared with the four colleagues who are organising the day between them."},{"key":"B","text":"A letter to a customer declining an insurance claim, drafted from the policy wording and posted under the company's name."},{"key":"C","text":"A message to an unsuccessful job applicant setting out why the application did not proceed, drafted from the interview record."},{"key":"D","text":"A summary of yesterday's stand-up posted to the team's own channel, which everyone who attended can read and correct."},{"key":"E","text":"A list of proposed discussion topics for a supplier's quarterly review, emailed in advance to the account manager, who can add to it or amend it."},{"key":"F","text":"A plain-English explainer on the new expenses rules, posted on the staff intranet, where any member of staff who spots an error can flag it."}],"correct":["B","C"],"explanation":"All three of the director's tests point the same way for the claim refusal and the recruitment rejection. Each one communicates a decision about a single identified person outside the team; each reaches someone who has no way to correct it and no sight of what it was drafted from; and neither can meaningfully be undone once sent, because the recipient has already been told the outcome. Both also carry the most consequential class of decision on the list, one financial and contractual, the other affecting a person's employment. Anthropic's guidance is that hallucination-reduction techniques significantly reduce hallucinations but do not eliminate them, and that critical information should always be validated, especially for high-stakes decisions; the support centre adds that users should not rely on Claude as a singular source of truth and should carefully scrutinise high-stakes advice. Those obligations bite hardest where the output is itself the decision the recipient receives. The other four outputs each fail at least two of the tests: their readers are the people best placed to spot an error, and a correction costs one further message.","rationales":{"A":"Internal audience, no consequential decision, and trivially reversible. If a venue is wrong a colleague says so and the list changes.","D":"The readers are the people who were in the meeting, so they are the best error detectors available, and any correction is a single follow-up message.","E":"This is the tempting one, because the reader is outside the organisation. An external audience on its own does not settle the question: no decision is being communicated, the account manager can amend the list, and an updated agenda can be sent at any point before the meeting.","F":"Publication feels weighty, but the audience is internal, the explainer informs rather than decides, and the intranet gives every reader a route to flag an error that can then be corrected for everyone at once."},"sources":[{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-20","basis":"verified-live"},{"title":"Claude is providing incorrect or misleading responses. What's going on? - Claude Help Centre","url":"https://support.claude.com/en/articles/8525154-claude-is-providing-incorrect-or-misleading-responses-what-s-going-on","date":"2026-03-16","basis":"published"},{"title":"Claude Certified Associate - Foundations Exam Guide, Version 1.0, Section 6 Domain 2 objectives","url":"https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542847/Claude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf","date":"2026-07-08","basis":"published"}],"tags":["escalation-threshold","reversibility","external-audience","consequential-decision","human-in-the-loop"],"notes":{"signal":"Community study material teaches escalation as a short list of always-escalate domains, hiring, legal, medical and financial among them, and treats it as the most learnable part of the syllabus, which produces candidates who match on domain words rather than on what the output does to its reader. Verified against bank #1: D2-043 asks which abstract factors should drive the decision, and D2-037 and D2-038 test risk-based review and domain expertise on a single output each; none of them makes the candidate apply the combined audience, correctability and consequence test across a set of concrete outputs, and none of them includes a case where the audience is external but the threshold is not crossed."}},{"id":"D2-C006","domain":"D2","objective":"Evaluate Claude-generated outputs for accuracy and completeness","type":"single","difficulty":"medium","scenario":true,"stem":"A grants officer puts five specific questions about a funder's guidance pack to Claude in a single message. The reply is a well-organised page that answers three of them in depth and does not mention the other two at all. She checks every statement in the reply against the guidance pack, and every one of them is correct. What is the correct judgement on this output?","options":[{"key":"A","text":"It passes, because accuracy is the property that matters for a factual task, and the two remaining questions can be picked up separately later on."},{"key":"B","text":"It passes, because the two questions Claude left out are almost certainly ones that the funder's guidance pack does not address anywhere in its text."},{"key":"C","text":"It fails on completeness, because coverage is judged against the five questions asked, so the two unanswered ones must still be dealt with."},{"key":"D","text":"It fails, because a reply that leaves questions out shows the guidance pack exceeded the amount of material the model was able to read."}],"correct":["C"],"explanation":"Accuracy and completeness are separate properties, and the D2 objective names both. Anthropic's guidance on defining success stresses that criteria should be specific and relevant to the purpose of the work, and that most use cases need multidimensional evaluation along several success criteria rather than a single one. Here the purpose was to answer five questions, so coverage against those five is a criterion in its own right and a claim-by-claim accuracy check cannot substitute for it. The trap is that a wholly accurate output feels finished. The remedy is to put the two missing questions back, and, following the documented practice of letting Claude say it does not know, to invite it to state explicitly where the pack does not answer a question rather than passing over it in silence.","rationales":{"A":"This treats accuracy as the whole of quality. An output that answers three of five questions is a partial deliverable however sound its content, and deferring the gap leaves the officer working from a summary she may reasonably believe is complete.","B":"This is an assumption presented as a finding. Nothing in the reply says the pack is silent on those questions, and silence in an output is not evidence of silence in the source.","D":"This invents a cause. Omission has many explanations, and diagnosing a context limit from the symptom alone does not tell the officer whether the two questions have answers in the pack."},"sources":[{"title":"Define your success criteria - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/define-success","date":"2026-08-20","basis":"verified-live"},{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-20","basis":"verified-live"},{"title":"Claude Certified Associate - Foundations Exam Guide v1.0","url":"https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542847/Claude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf","date":"2026-07-08","basis":"published"}],"tags":["completeness-vs-accuracy","request-coverage","materially-incomplete","allow-uncertainty"],"notes":{"caveat":"Keyed proposition duplicates bank #1 D2-039 at construct level, and lexical overlap (0.045 on keyed text) hides it. D2-039 keys 'It is accurate but incomplete, and incompleteness is always a defect in","signal":"Every unofficial guide that breaks D2 down separates accuracy from completeness and warns that the exam sets traps where a candidate signs off an output because the fact-check passed. Bank #1 tests omission against a source document twice (D2-007, D2-039) but never against the scope of the request itself, which is the more common failure when a practitioner batches several questions into one message."}},{"id":"D2-C007","domain":"D2","objective":"Organize and curate information and select appropriate output formats (artifacts, inline, structured data)","type":"single","difficulty":"medium","scenario":true,"stem":"A finance assistant has Claude read a folder of supplier statements and pull out roughly 180 line items, each with a date, a reference and an amount. The figures have one destination: the team's existing quarterly spreadsheet model, which already holds the formulas, the pivot tables and the charts that the finance manager relies on. Given that stated downstream use, which output vehicle should she ask for?","options":[{"key":"A","text":"A written summary of the totals in the chat, on the basis that the spreadsheet model already performs all of the arithmetic that matters."},{"key":"B","text":"The 180 rows set out inline in the chat as a markdown table, which she can read through and then copy across into the model by hand."},{"key":"C","text":"The rows presented as a shareable artifact, so that colleagues can open it, comment on the figures and suggest corrections in place."},{"key":"D","text":"The rows produced as a spreadsheet file that she downloads and pastes straight into the existing model."}],"correct":["D"],"explanation":"Format choice follows the consumer of the output. Here the consumer is an existing spreadsheet model, not a reader, so the right vehicle is the one that arrives as data. Anthropic's help centre documents that Claude can create Excel spreadsheets, Word documents, PowerPoint decks and PDFs, and that users can download those files or save them to Google Drive, which is exactly the handoff this task needs. The other options each optimise for something the assistant did not ask for: reading, discussing, or summarising.","rationales":{"A":"A prose summary answers a different question. It gives the finance manager numbers to read rather than data the model can compute on, and the 180 underlying line items never reach the spreadsheet.","B":"An inline table is a reasonable vehicle for a handful of rows a person will glance at, but at 180 rows the manual copy step is the whole cost of the task and is where transcription errors enter.","C":"Artifacts are documented for content that is significant and self-contained and that you are likely to edit, iterate on or reuse outside the conversation. Collaborative comment and review is not the stated downstream use, and an artifact still leaves the data to be moved into the model."},"sources":[{"title":"Create and edit files with Claude - Claude Help Centre","url":"https://support.claude.com/en/articles/12111783-create-and-edit-files-with-claude","date":"2026-08-20","basis":"verified-live"},{"title":"What are artifacts and how do I use them? - Claude Help Centre","url":"https://support.claude.com/en/articles/9487310-what-are-artifacts-and-how-do-i-use-them","date":"2026-08-20","basis":"verified-live"}],"tags":["output-format","downstream-use","file-creation","artifact-vs-inline","structured-data"],"notes":{"signal":"Community study material frames this objective as a downstream-use decision and drills it with spreadsheet and reporting-tool scenarios, which is its everyday form for a non-developer. Verified against bank #1: D2-025 does key a plain format-follows-consumer principle, that structured data is the right delivery format when another system rather than a person will consume the fields, so this item claims no novelty on that principle. What bank #1 nowhere covers is the vehicle a Claude.ai user actually has for it, a generated spreadsheet file that can be downloaded or saved to Google Drive; D2-024 and the second key of D2-025 rest on Structured Outputs, an API feature out of scope for this audience, and the artifact items D2-029, D2-030 and D2-040 stop at artifact versus inline."}},{"id":"D2-C008","domain":"D2","objective":"Identify hallucinations, inconsistencies, and biases in responses","type":"multi","difficulty":"medium","scenario":true,"stem":"A grants officer asks Claude to draft a funding case using only three documents she has uploaded: a project plan, a monitoring report and a budget. Web search is off. She now reads the draft looking for statements that did not come from those three documents. Which TWO features of the draft are evidence that it has gone beyond the uploaded material? Select TWO.","options":[{"key":"A","text":"A sentence that reproduces a finding from the monitoring report accurately but rounds its figure from 62.4 per cent to a flat 62 per cent."},{"key":"B","text":"A widely reported sector statistic that is entirely correct and that none of the three uploaded documents contains."},{"key":"C","text":"A paragraph that draws together a point from the project plan and a related point from the budget into a single argument."},{"key":"D","text":"A passage that restates the project's main objective twice, once in the opening section and again in the closing section of the case."},{"key":"E","text":"A named evaluation study, cited with its year in support of the project's method, that appears nowhere in the three documents."},{"key":"F","text":"A sentence reporting the contingency line from the budget and marking it as an estimate rather than as a committed figure."}],"correct":["B","E"],"explanation":"For a deliverable that is supposed to rest on supplied documents, the test is whether the uploads contain the claim, not whether the claim happens to be true. Anthropic documents external knowledge restriction, explicitly instructing Claude to use only information from provided documents and not its general knowledge, and verify with citations, having Claude find a supporting quote for each claim after generating a response and retract any claim it cannot support. Both keyed features fail that test: neither the sector statistic nor the named study can be traced to the plan, the monitoring report or the budget. The correct statistic is the more dangerous of the two, because a reviewer who knows the sector will recognise it and wave it through, and it will still be unsupported when the funder asks where it came from. The remaining features are either faithful to the uploads or observations about how the draft is written.","rationales":{"A":"The figure is in the monitoring report and the sentence can be traced to it. Rounding is a fidelity point to correct in editing, and a fairly minor one, but it is not a claim that came from outside the pack.","C":"Drawing supplied points together into an argument is the work that was asked for. Both halves trace back to an upload, and synthesis of provided material is not the same as importing material.","D":"Repetition across sections is a structural or editorial defect. It affects how the case reads and says nothing at all about where the content came from.","F":"This reports a line that is in the budget and labels it honestly as an estimate. Marking a figure as provisional makes a claim easier to check rather than harder, and the claim is grounded in the uploads either way."},"sources":[{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-20","basis":"verified-live"},{"title":"Claude is providing incorrect or misleading responses. What's going on? - Claude Help Centre","url":"https://support.claude.com/en/articles/8525154-claude-is-providing-incorrect-or-misleading-responses-what-s-going-on","date":"2026-03-16","basis":"published"}],"tags":["ungrounded-but-true","external-knowledge-restriction","source-bound-deliverable","verify-with-citations","grounding-versus-truth"],"notes":{"signal":"Community material teaches hallucination-spotting as looking for statements that are false, which leaves the true-but-ungrounded sentence invisible; in grant and bid writing that sentence, a correct sector statistic no supplied document contains, is the one that collapses under a funder's query. Verified against bank #1: D2-044 keys the name of the technique that prevents this, D2-001 keys an invented page reference, D2-002 keys the definition of a fabricated detail, and D2-034 separates evidence about content from properties of the writing, but no bank #1 item asks the candidate to identify ungrounded statements that are nonetheless accurate."}},{"id":"D3-C001","domain":"D3","objective":"Align model selection with task requirements (cost, speed, quality)","type":"single","difficulty":"hard","scenario":true,"stem":"A shared services team is deciding between two Claude models for a document review workload. To keep the trial manageable they assemble a sample of the most typical, everyday documents, run both models over it, find the results almost indistinguishable, and prepare to standardise on the cheaper of the two. Against Anthropic's published guidance on optimising for cost and intelligence, what is wrong with that comparison?","options":[{"key":"A","text":"The sample is the wrong slice of the workload: models should be compared on the hardest tenth of the tasks rather than the typical one."},{"key":"B","text":"The sample is too small: a comparison between two models is not considered valid until several hundred documents have been put through each of them."},{"key":"C","text":"The wrong figure is being compared: the decision should rest on the published per-token price of each model, which is what determines the monthly bill."},{"key":"D","text":"The sample is fine, but both models should have been run at the maximum effort setting, so that each one was judged at the top of its range."}],"correct":["A"],"explanation":"Anthropic's cost and intelligence guidance says to price the tail of the workload rather than the median, and to compare models on the hardest tenth of the tasks rather than the typical one. The reason given is that on a typical task every model looks similar and the cheapest looks best, but the bill is decided by the tasks the cheaper model fails: a failed task still bills its tokens, then the retry, then whatever the failure costs downstream. The same page notes that the tail dominates spend even when nothing fails, citing a 20-problem run in which two problems carried 43 percent of the cost. A trial built only from everyday documents is therefore structurally incapable of showing the difference that will decide the bill.","rationales":{"B":"No minimum sample size is published. The documented instruction concerns which slice of the workload the sample is drawn from, not how many items it contains.","C":"Per-token price is the wrong unit. For anyone choosing or switching models the documented rule is to compare on cost per completed task rather than per token, because a more capable model can finish a task with fewer turns and less rework.","D":"Pinning both models at maximum effort is not the documented method. Below a model's ceiling the highest effort levels pay for depth the task never uses, so the guidance is to sweep two or three effort levels on a sample of real traffic rather than to fix effort at the top."},"sources":[{"title":"Optimizing for cost and intelligence - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence","date":"2026-08-20","basis":"verified-live"},{"title":"Choosing the right model - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/choosing-a-model","date":"2026-08-20","basis":"verified-live"}],"tags":["cost-optimisation","model-comparison","workload-tail","evaluation","sampling"],"notes":{"caveat":"KEY IS STATED VERBATIM INSIDE BANK #1 D3-015's EXPLANATION. C001's key A is 'models should be compared on the hardest tenth of the tasks rather than the typical one'. Bank #1 D3-015's explanation clos","signal":"Unofficial guides reduce model comparison to a slogan about running a few prompts side by side and picking the cheaper model if the answers look the same, which is precisely the sampling error this item tests. Bank #1's D3-015 keys per-token price against cost per completed task and D3-017 keys the first step of the upgrade sequence; neither bank #1 nor any other community file keys which slice of the workload the comparison sample must be drawn from."}},{"id":"D3-C002","domain":"D3","objective":"Align model selection with task requirements (cost, speed, quality)","type":"single","difficulty":"medium","scenario":true,"stem":"A service desk runs a live assistant on Claude Fable 5. Answer quality is right, the effort setting has already been brought down to low, and replies are still too slow for staff who are on the phone to a customer while they wait. A colleague proposes moving further up the line-up, on the reasoning that a stronger model will always come back faster. What does Anthropic's published model comparison support?","options":[{"key":"A","text":"Comparative latency is the same across the current line-up, so the only lever left is shortening the prompt and the answer that is asked for."},{"key":"B","text":"Moving further up the line-up is the documented route to faster replies, because a more capable model needs fewer words to reach the same result."},{"key":"C","text":"Comparative latency differs by model, and Fable 5 is listed as the slowest of the current four, so a faster model is the lever that remains."},{"key":"D","text":"Response speed is a property of the claude.ai plan rather than of the model, so the documented fix is to move the team on to a higher plan."}],"correct":["C"],"explanation":"The Models overview comparison table publishes a comparative latency row for every current model: Claude Haiku 4.5 is Fastest, Claude Sonnet 5 is Fast, Claude Opus 5 is Moderate and Claude Fable 5 is Slower. Speed is also one of the criteria Anthropic tells you to establish before choosing a model. So the line-up is not neutral on latency, and the most capable model sits at the slow end of it: once effort has already been lowered, which the cost guidance confirms is itself a speed lever, the remaining documented lever for a latency-bound desk is a model listed as faster.","rationales":{"A":"The comparison table publishes four different comparative latency values across the four current models, so latency is not uniform. Shortening the exchange is sensible but it is not the only lever.","B":"This inverts the published table. Fable 5 is listed as Slower and Haiku 4.5 as Fastest. Anthropic does document one speed feature tied to a model, fast mode, but it is offered on Claude Opus 5 and Claude Opus 4.8 as a research preview at premium pricing, and it is not a consequence of moving up the line-up.","D":"No plan-level latency tier is documented. Plans govern which models and limits are available; comparative latency is published per model."},"sources":[{"title":"Models overview - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/overview","date":"2026-08-20","basis":"verified-live"},{"title":"Choosing the right model - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/choosing-a-model","date":"2026-08-20","basis":"verified-live"},{"title":"Optimizing for cost and intelligence - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence","date":"2026-08-20","basis":"verified-live"}],"tags":["latency","model-tiers","speed-requirement","fable-5","cost-speed-quality"],"notes":{"signal":"Community study material teaches capability as a single ladder and treats speed as though it rose with it, which is the misconception in this stem. Bank #1's D3-018 keys lowering effort as the first move for a workflow that is slightly slow and expensive, and D3-016 keys Haiku-first prototyping; the published comparative latency ordering, which is what tells a team that moving up the line-up makes a latency problem worse, is not keyed anywhere in bank #1 or in the other community files."}},{"id":"D3-C003","domain":"D3","objective":"Differentiate between Claude model types (Haiku, Sonnet, Opus)","type":"single","difficulty":"medium","scenario":false,"stem":"A training deck for non-technical staff carries a slide on the Claude model tiers. Which statement on that slide is accurate against Anthropic's current published line-up?","options":[{"key":"A","text":"Opus is Anthropic's most capable widely released model, with nothing offered above it"},{"key":"B","text":"Haiku, Sonnet and Opus differ mainly in response speed, and their accuracy on hard reasoning is much the same"},{"key":"C","text":"Sonnet is the slowest and costliest of the three and is held back for the hardest reasoning work"},{"key":"D","text":"Of Haiku, Sonnet and Opus, Haiku is the fastest and lowest cost and Opus is the strongest of the three"}],"correct":["D"],"explanation":"Anthropic's Models overview presents the current line-up in a comparison table whose columns run Claude Fable 5, Claude Opus 5, Claude Sonnet 5 and Claude Haiku 4.5. Anthropic does not publish a single ranked capability list, so the ordering has to be read off the table: Haiku 4.5 carries the lowest listed price at $1 per million input tokens and $5 per million output tokens and the fastest comparative latency, Sonnet 5 sits between at $2 and $10, and Opus 5 is listed at $5 and $25 and described as being for complex agentic coding and enterprise work. So within the three tiers named in the exam objective the relationship stated in this option holds, and it stays correct however far the line-up extends above Opus.","rationales":{"A":"This is the widely taught three-tier picture, and it is now factually wrong: Anthropic describes Claude Fable 5 as its most capable widely released model, with Claude Opus 5 recommended as the starting point for complex agentic and enterprise work.","B":"Capability differs materially, not just speed. On a hard reasoning benchmark Anthropic measured Haiku 4.5 at 63 percent against Opus 5's 92 percent, and it falls further behind again on long tasks.","C":"This inverts Sonnet's position. Sonnet 5 is documented as the best combination of speed and intelligence, priced and positioned between Haiku and Opus."},"sources":[{"title":"Models overview - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/overview","date":"2026-08-20","basis":"verified-live"},{"title":"Optimizing for cost and intelligence - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence","date":"2026-08-20","basis":"verified-live"},{"title":"Choosing the right model - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/choosing-a-model","date":"2026-08-20","basis":"verified-live"}],"tags":["community-myth","model-tiers","blueprint-safe","haiku","sonnet","opus"],"notes":{"caveat":"THE FLAGGED EXPLANATION ERROR WAS REPLACED WITH A NEW FALSE STATEMENT, AND THE ORIGINAL FLAG WAS PARTLY WRONG. The repaired explanation now reads 'Anthropic does not publish a single ranked capability","signal":"Every unofficial source teaches the three-tier matrix with Opus as the top tier, and several build their model-selection lesson on that premise; the published Exam Guide objective itself reads Haiku, Sonnet, Opus. Verified live, Opus is no longer the most capable model offered. Bank #1 answers the tier question in Fable and Mythos terms (D3-009, D3-011, D3-014) and covers Sonnet 5 through its price and default status (D3-012), and it names Haiku as fastest and cheapest only inside a distractor (D3-018); no bank #1 item keys the tier relationship in the blueprint's own vocabulary."}},{"id":"D3-C004","domain":"D3","objective":"Differentiate between Claude model types (Haiku, Sonnet, Opus)","type":"multi","difficulty":"medium","scenario":true,"stem":"A shared-services team is drafting internal guidance on which Claude tier staff should reach for. Select TWO statements that match how Anthropic documents Haiku, Sonnet and Opus.","options":[{"key":"A","text":"Haiku suits high-volume work with checkable outputs and tight latency needs, not long agentic loops"},{"key":"B","text":"Because the tiers share the same training data, the choice affects speed and price but not the quality of reasoning"},{"key":"C","text":"Sonnet is the best combination of speed and intelligence, and Opus is for complex agentic and enterprise work"},{"key":"D","text":"Opus should be the standing default for every task, since starting lower means redoing the prompt work later"},{"key":"E","text":"Haiku carries the same context window as Sonnet and Opus, so the size of a document never bears on the tier choice"},{"key":"F","text":"Moving up a tier always lowers the cost per completed task, whatever the workload and however it is measured"}],"correct":["A","C"],"explanation":"The published comparison describes Claude Haiku 4.5 as the fastest model with near-frontier intelligence, aimed at real-time applications, high-volume intelligent processing and cost-sensitive deployments, and the cost guidance adds that it fits high-volume work with checkable outputs rather than long agentic loops. Claude Sonnet 5 is described as the best combination of speed and intelligence for coding, agents and enterprise workflows, and Claude Opus 5 as the model for complex agentic coding and enterprise work.","rationales":{"B":"Training data cutoffs differ across the line-up and so does measured reasoning accuracy, so the tier choice is not merely a speed and price decision.","D":"This is the over-selection anti-pattern. Anthropic sets out two starting approaches, and the efficiency-first path deliberately begins with Haiku 4.5 for prototyping, latency-sensitive and high-volume straightforward work.","E":"Context windows differ: Haiku 4.5 is documented at 200k tokens while Sonnet 5 and Opus 5 are documented at 1M tokens by default.","F":"The documentation states the ranking flips by workload and that no price list tells you which way, so each candidate has to be priced in cost per completed task on your own traffic."},"sources":[{"title":"Models overview - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/overview","date":"2026-08-20","basis":"verified-live"},{"title":"Choosing the right model - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/choosing-a-model","date":"2026-08-20","basis":"verified-live"},{"title":"Optimizing for cost and intelligence - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence","date":"2026-08-20","basis":"verified-live"}],"tags":["model-tiers","blueprint-safe","context-window","haiku","sonnet","opus"],"notes":{"signal":"Unofficial guides present a Haiku/Sonnet/Opus matrix as the core D3 content and several of the practice sets drill matching a tier to a workload. Bank #1 covers the line-up through Fable 5 and Mythos 5 availability and pricing (D3-008, D3-009, D3-010, D3-014) and through Sonnet 5's price and default status (D3-012), but no bank #1 item keys the documented positioning of Haiku, Sonnet and Opus against workload shape, which is the framing the published objective uses."}},{"id":"D3-C005","domain":"D3","objective":"Align model selection with task requirements (cost, speed, quality)","type":"single","difficulty":"medium","scenario":true,"stem":"A programme team is deciding whether to move a working contract-summarisation workflow up a tier. It has already built a benchmark set for the use case and has run its real prompts and real contracts through both the current tier and the one above. Following Anthropic's documented sequence, what comes next?","options":[{"key":"A","text":"Ask which tier comparable organisations in the same sector have standardised on, and follow that"},{"key":"B","text":"Compare the two on accuracy, quality and edge cases, then weigh performance against cost"},{"key":"C","text":"Settle the per-token price difference first, and run the quality comparison only if the two prices turn out to be close"},{"key":"D","text":"Force the highest effort setting on both tiers so the comparison is made at each model's ceiling"}],"correct":["B"],"explanation":"The documented four-step sequence is to create benchmark tests specific to the use case, test with your actual prompts and data, compare performance across models for accuracy, response quality and handling of edge cases, then weigh performance and cost tradeoffs. The team has completed the first two steps, so the structured comparison is next and the cost tradeoff is the final step rather than the gate.","rationales":{"A":"Sector convention is not part of the sequence and cannot tell the team how the tiers behave on their own contracts, which is what the benchmark set was built to reveal.","C":"Cost is the fourth step, not the first, and per-token price is a poor proxy because models are compared on cost per completed task.","D":"Maximum effort is not part of the sequence, and the guidance is that below a model's ceiling the highest effort levels pay for depth the task never uses; effort should be swept, not pinned at the top."},"sources":[{"title":"Choosing the right model - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/choosing-a-model","date":"2026-08-20","basis":"verified-live"},{"title":"Optimizing for cost and intelligence - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence","date":"2026-08-20","basis":"verified-live"},{"title":"Change the model, effort, and thinking settings - Anthropic Help Center","url":"https://support.claude.com/en/articles/8664678-change-the-model-effort-and-thinking-settings","date":"2026-08-20","basis":"verified-live"}],"tags":["model-upgrade","evaluation","process","cost-quality-tradeoff"],"notes":{"caveat":"NEAR-DUPLICATE SETUP WITH BANK #1 D3-017, AND THE community_signal's DIFFERENTIATOR DOES NOT HOLD. Full-stem-plus-key Jaccard against D3-017 is 0.260, the highest against bank #1 D3 (the repairer repo","signal":"Several study guides reduce the upgrade question to a slogan about picking the strongest model that fits the budget, without the documented order of operations. Bank #1's D3-017 tests only which step is first, so a candidate who has memorised that one fact still cannot place the cost tradeoff correctly."}},{"id":"D3-C006","domain":"D3","objective":"Select appropriate Claude product features (Projects, research mode, chat, artifacts)","type":"single","difficulty":"medium","scenario":true,"stem":"Over three months an operations manager has had Claude produce about a dozen artifacts, each in a different conversation. She opens the Artifacts section in her Claude sidebar expecting to find the whole set collected there and finds almost none of them. What is the documented explanation?","options":[{"key":"A","text":"Artifacts are listed in the sidebar for thirty days from creation and are cleared automatically after that, so only the most recent ones are still shown."},{"key":"B","text":"The Artifacts section lists only artifacts Claude produced as documents; code, diagrams and images are filed elsewhere."},{"key":"C","text":"Artifacts are listed in the sidebar only while the conversation that produced them is open, so each chat has to be reopened for its artifact to reappear."},{"key":"D","text":"Artifacts made in a conversation are not added to the sidebar automatically; clicking Publish is what files one in that section."}],"correct":["D"],"explanation":"Anthropic documents that artifacts you create in a conversation do not appear in your sidebar automatically, that all of your artifacts are reached through the dedicated Artifacts section in the Claude sidebar, and that to add an artifact to that section you open it and click Publish. Publishing is therefore not only about distributing work to other people; it is also the step that files an artifact where it can be found again later.","rationales":{"A":"No thirty-day expiry is documented for artifacts. What is documented is that they are not filed in the sidebar unless they are published.","B":"The documented artifact types, which include documents in Markdown or plain text, diagrams and flowcharts, and images, are all reached through the same Artifacts section rather than being split across the sidebar.","C":"Artifacts are not tied to an open conversation in this way. The Artifacts section is described as a dedicated place holding all of the user's artifacts, populated by publishing."},"sources":[{"title":"What are artifacts and how do I use them? - Anthropic Help Center","url":"https://support.claude.com/en/articles/9487310-what-are-artifacts-and-how-do-i-use-them","date":"2026-08-20","basis":"verified-live"}],"tags":["artifacts","publishing","surface-selection","sidebar","retrieval-of-past-work"],"notes":{"caveat":"AVAILABLE PUBLICATION DATE DISCARDED IN FAVOUR OF THE VERIFICATION DATE, INCONSISTENT WITH THE CORPUS CONVENTION. Applies to all three support.claude.com citations in the file (D3-C006 and D3-C007 cit","signal":"Unofficial guides teach artifacts as a definition to recall and treat publishing purely as a sharing action, so candidates learn nothing about where an artifact lives afterwards. Bank #1's D3-004 keys the sharing and unpublishing rules on a Team or Enterprise account, and bank #1's D2-029 and D2-040 key the criteria for when Claude produces an artifact at all; nothing in either bank keys the fact that an unpublished artifact never reaches the Artifacts section."}},{"id":"D3-C009","domain":"D3","objective":"Differentiate between Claude model types (Haiku, Sonnet, Opus)","type":"single","difficulty":"hard","scenario":true,"stem":"A knowledge manager is briefing colleagues on what each Claude model does and does not know unaided. She notices that the Models overview publishes two separate dates for every current model, and that for Claude Haiku 4.5 the two are several months apart while for the other current models they match. What is the documented difference between the two dates?","options":[{"key":"A","text":"Reliable knowledge cutoff is the date through which the model's knowledge is most extensive and reliable, and training data cutoff is the broader date range used."},{"key":"B","text":"Training data cutoff is the date up to which the model's answers can be trusted, and reliable knowledge cutoff is the date on which that model was released to the public."},{"key":"C","text":"The two are the same measurement published twice for different audiences, one figure for claude.ai users and one for developers, so either of them may be quoted."},{"key":"D","text":"Reliable knowledge cutoff describes the model when web search is switched on, and training data cutoff describes it when it is answering with no tools at all."}],"correct":["A"],"explanation":"The Models overview publishes both fields for every current model and defines them: reliable knowledge cutoff indicates the date through which a model's knowledge is most extensive and reliable, while training data cutoff is the broader date range of training data used. The two can differ, and in the current line-up they differ for Claude Haiku 4.5, listed at a reliable knowledge cutoff of Feb 2025 against a training data cutoff of Jul 2025. Haiku 4.5 also carries the oldest reliable cutoff of the current four, where Claude Opus 5 carries the newest at May 2026, so the tier a team picks also decides how recent its unaided knowledge is.","rationales":{"B":"This swaps the two definitions and invents a third meaning. Neither field is a release date; the reliable knowledge cutoff, not the training data cutoff, is the one that marks where knowledge is most extensive and reliable.","C":"They are two different measurements with two published definitions and, for Claude Haiku 4.5, two different values. Quoting either one interchangeably would misstate what the model reliably knows.","D":"Neither field is conditioned on tool use. Both describe the model's training, and web search or Research is the separate remedy when a task needs information from after the cutoff."},"sources":[{"title":"Models overview - Claude Platform Docs","url":"https://platform.claude.com/docs/en/about-claude/models/overview","date":"2026-08-20","basis":"verified-live"}],"tags":["model-tiers","knowledge-cutoff","haiku","documentation-literacy","blueprint-safe"],"notes":{"signal":"Community sets teach a single knowledge cutoff per model and then test only the remedy, which leaves candidates unable to say which of the two published dates governs. Bank #1 keys a cutoff as a reason to add web search or Research (D3-019, and D2-027 for a stale answer), and the D2 community file does the same; neither bank keys the distinction between the two dated fields Anthropic publishes for every model, nor the fact that Claude Haiku 4.5 carries the oldest reliable cutoff in the current line-up."}},{"id":"D4-C001","domain":"D4","objective":"Apply Claude to analyze requirements and use cases","type":"single","difficulty":"medium","scenario":true,"stem":"An operations analyst is scoping a recurring workflow in which Claude must read two files that sit in the same Google Drive folder: the quarterly forecast, which is a Google Sheet, and the commercial policy, which is a Google Doc. She plans to add both through the Google Drive integration. Which requirement does the scope have to account for?","options":[{"key":"A","text":"Google Sheets is not currently supported by the integration, so the forecast has to reach Claude by another route."},{"key":"B","text":"Both file types are supported, so the only thing left to check is that the two documents together fit the context window."},{"key":"C","text":"Both file types are supported once she has authenticated with Google, which happens the first time she adds a document."},{"key":"D","text":"Neither file type can be added inside a project, so the whole workflow has to be run in ordinary chats rather than a project."}],"correct":["A"],"explanation":"The integration's supported file types are published as a table: Google Docs are supported, up to 10MB and text extraction only, while Google Sheets and Google Slides are marked not currently supported, and images inside documents and comments or suggestions are not extracted either. A workflow scoped on the assumption that the connector will read a spreadsheet is built on a capability the product does not have, so the forecast needs a different route into Claude. Options B and C each state something true about the integration - multiple documents are allowed if they fit the context window, and authentication with Google happens on first use - but neither removes the file-type limit.","rationales":{"B":"Adding multiple documents is supported as long as they fit within the context window, but that limit applies only to documents the integration can read at all. It does not make a Google Sheet readable.","C":"Authenticating with Google on first use is a real step, and for the Google Doc it is the only one needed, but authentication does not extend the integration to unsupported file types.","D":"The integration works in chats and in private projects, so the workflow does not have to avoid projects. The binding constraint here is file type, not the surface the work runs on."},"sources":[{"title":"Google Drive integration - Claude Docs","url":"https://claude.com/docs/connectors/google/drive","date":"2026-08-20","basis":"verified-live"}],"tags":["connectors","google-drive","supported-file-types","requirements-analysis","scoping"],"notes":{"caveat":"TEMPLATE CLONE of bank #1 D4-004, and an inaccurate community_signal enumeration. The replacement item reuses D4-004's construction almost word for word: D4-004 stem = 'An analyst is scoping a recurri","signal":"Study guides list the connector-or-upload decision as a recurring D4 scoping question but stop at whether an integration for the service exists. Bank #1's connector items key which first-party integrations Anthropic provides (D4-005), what a connector does in a conversation (D4-018, D4-019), permission inheritance (D4-021), the directory request flow (D4-022), what the Verified label means (D4-023) and how a custom connector is reached (D4-024); none of them keys what the Google Drive integration can and cannot actually read, so a scope that assumes it covers spreadsheets is untested."}},{"id":"D4-C002","domain":"D4","objective":"Apply Claude to analyze requirements and use cases","type":"single","difficulty":"medium","scenario":true,"stem":"A team is specifying a task where a mistake would be expensive to undo: restating every active customer contract's renewal terms into a new template. Anthropic's guidance is to give Claude more detail for exactly this kind of task. In what form should that detail be written?","options":[{"key":"A","text":"As extra background on why the work matters, so that Claude can use its own judgement on the details."},{"key":"B","text":"As one fully worked example, so that Claude can infer the remaining requirements by copying the pattern."},{"key":"C","text":"As a list of everyone affected, so that Claude can weigh whose interests should take priority in each case."},{"key":"D","text":"As constraints: the rules the work must respect, the checks that count as verification, and what it must not touch."}],"correct":["D"],"explanation":"The documented pattern is that when a mistake would be costly to undo, the extra detail should be written as constraints - naming the rules the change must respect, the checks that count as verification, and what the work must not touch. That converts a vague high-stakes request into something with a stated boundary and a stated proof of completion.","rationales":{"A":"More background is not the documented form of the detail, and inviting Claude to use its own judgement on a costly-to-undo task is the opposite of what the guidance asks for.","B":"A worked example helps with format, but it does not state what must not be touched or what check counts as verification, which are the two things a high-stakes task needs.","C":"Listing affected parties is a governance consideration, not the form in which task detail is documented, and it gives Claude no verification condition."},"sources":[{"title":"Good habits for working with Claude Tag - Claude Docs","url":"https://claude.com/docs/claude-tag/users/good-habits","date":"2026-08-20","basis":"verified-live"}],"tags":["requirements-elicitation","constraints","high-stakes-task","verification-condition"],"notes":{"signal":"Study guides list 'specifying a task before prompting' as a D4 skill and repeatedly frame it as scoping rather than prompt wording. Bank #1 has no item on how requirement detail should be expressed for high-stakes work."}},{"id":"D4-C003","domain":"D4","objective":"Apply Claude to analyze requirements and use cases","type":"multi","difficulty":"medium","scenario":true,"stem":"A programme manager is mapping a Claude-assisted workflow step by step and recording who closes each step. Which TWO statements match Anthropic's documented guidance on end conditions and ownership? (Select TWO.)","options":[{"key":"A","text":"Every step should be closed by the most senior person available, so that accountability sits at the right grade."},{"key":"B","text":"A step whose end condition is an objective check Claude can observe can be closed by Claude on its own."},{"key":"C","text":"A step whose proof sits in a system the workflow cannot reach needs an end condition a person closes instead."},{"key":"D","text":"A step with no verifiable end condition should still be raised as a task, so that it is not quietly forgotten."},{"key":"E","text":"A step that asks a person to choose between options is closed by Claude once it has stated its recommendation."}],"correct":["B","C"],"explanation":"The documented table maps each kind of end condition to who closes it: an objective check that passes is closed by Claude itself, a prepared result is closed by the person approving it, a choice between options is closed by the person choosing, and a step with no verifiable condition should be reframed rather than run as a task. Two refinements govern ownership: the condition must be observable by Claude, and if the proof lives in a system that is not connected, the condition must be changed to one the person closes.","rationales":{"A":"Ownership follows the kind of end condition, not seniority. Routing everything to the most senior person concentrates the review bottleneck rather than resolving it.","D":"Where no verifiable condition exists, the guidance is to reframe the item as a question rather than run it as a task, because a task nobody can close stays open indefinitely.","E":"When the end condition is that a person chooses between options, that person closes the step. Claude's recommendation is the input to the decision, not the decision."},"sources":[{"title":"Good habits for working with Claude Tag - Claude Docs","url":"https://claude.com/docs/claude-tag/users/good-habits","date":"2026-08-20","basis":"verified-live"},{"title":"Track projects and chase approvals - Claude Docs","url":"https://claude.com/docs/claude-tag/users/use-cases/track-projects","date":"2026-08-20","basis":"verified-live"}],"tags":["ownership-mapping","handoff","end-conditions","who-closes-it"],"notes":{"signal":"Datrick names 'workflow handoff and ownership mapping - who does which step, where accountability sits' as one of six scored CCAO-F capabilities. Bank #1 has zero D4 items on ownership mapping
