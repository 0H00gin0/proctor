."}},{"id":"D4-C004","domain":"D4","objective":"Integrate Claude into existing workflows to augment or redesign them","type":"single","difficulty":"medium","scenario":true,"stem":"A team is integrating Claude into a Slack channel used by ten colleagues. The team lead assumes that when Claude works in that channel it reaches each connected system with the permissions of whoever tagged it, so a junior member's request will see less than her own. How should that assumption be corrected?","options":[{"key":"A","text":"In a channel Claude acts as the person who tagged it, until an admin attaches an access bundle to that channel."},{"key":"B","text":"In a channel Claude combines the connectors on every member's own Claude account, so its reach grows as people join."},{"key":"C","text":"In a channel Claude acts with its own service accounts, so everyone there gets the same capability whoever asked."},{"key":"D","text":"In a channel Claude acts as the person who created the channel, so its reach follows whatever that colleague can open."}],"correct":["C"],"explanation":"In Slack channels Claude acts with its own service accounts rather than as a specific user, and what it can reach in a channel comes from the access bundles an admin attached to that channel's scope. Anthropic states the consequence directly: anyone in the channel gets the same capability, and what Claude can do never changes based on who asked. A shared channel uses only the service-account connections an admin attached, not connectors on anyone's own Claude account. Direct messages are the opposite case, because there is no scope to attach an identity to, so a DM session runs on the individual's own account with their personal connectors.","rationales":{"A":"There is no stage at which a channel session acts as the requester. The provisioned identity is what a channel session uses from the outset, and an access bundle changes what that identity can reach, not who it is.","B":"Personal connectors apply in a direct message, not in a shared channel. Adding people to a channel does not widen what Claude can reach from it.","D":"Reach follows the access bundles attached to the channel's scope, not any individual, and that includes the colleague who created the channel."},"sources":[{"title":"How agent identity works - Claude Docs","url":"https://claude.com/docs/claude-tag/concepts/agent-identity","date":"2026-08-20","basis":"verified-live"},{"title":"Good habits for working with Claude Tag - Claude Docs","url":"https://claude.com/docs/claude-tag/users/good-habits","date":"2026-08-20","basis":"verified-live"}],"tags":["agent-identity","service-account","access-bundles","channel-vs-dm","workflow-integration"],"notes":{"caveat":"SURFACE NOT NAMED, and the cited page itself makes the omission matter. The stem says only 'integrating Claude into a Slack channel used by ten colleagues', and the keyed correction ('In a channel Cla","signal":"Community guides carry the claude.ai rule that a connector inherits each person's own permissions and generalise it to every surface Claude runs on. Bank #1's D4-021 keys exactly that claude.ai rule, and no item in bank #1 covers the identity a Claude Tag channel session actually runs under, so the case where the generalisation fails is never tested."}},{"id":"D4-C005","domain":"D4","objective":"Integrate Claude into existing workflows to augment or redesign them","type":"multi","difficulty":"hard","scenario":true,"stem":"An operations team has automated part of its weekly reporting as a routine that Claude runs from the team's project channel. The colleague who set the routine up is moving to another department. Which TWO statements about the routine match Anthropic's documentation? (Select TWO.)","options":[{"key":"A","text":"It keeps running if its creator leaves the organisation, but stops firing if the creator is removed from the channel."},{"key":"B","text":"It runs with its creator's personal connectors, so it fails the moment that colleague's own access is withdrawn."},{"key":"C","text":"It is visible only to its creator, so the team must recreate it before anyone else can see what it is scheduled to do."},{"key":"D","text":"Any member of the channel can list, edit or disable it, so it does not have to be handed over with the person."},{"key":"E","text":"It has to be recreated whenever it changes owner, because a job stays bound to the account that first scheduled it."}],"correct":["A","D"],"explanation":"Standing work belongs to the channel it was set up in. Anthropic documents that a job runs with the channel's connections, the same as an interactive request; that standing work is visible to the channel, because jobs post into the channel they belong to; and that anyone in the channel can list, edit or disable it. On continuity the rule is specific: routines keep running if their creator leaves the organisation, but stop firing if the creator is removed from the channel. Integrating an automated step therefore means watching channel membership, not account status.","rationales":{"B":"A job runs with the channel's connections, the same as an interactive request. Personal connectors apply in a direct message, where there is no channel to scope the session to.","C":"Standing work is visible to the channel, because jobs post into the channel they belong to, and any member can ask Claude to list that channel's routines.","E":"Nothing has to be recreated on a change of owner. Any member can edit or disable the job by describing the change, and the job keeps running when its creator leaves the organisation."},"sources":[{"title":"Set up routines - Claude Docs","url":"https://claude.com/docs/claude-tag/users/proactivity","date":"2026-08-20","basis":"verified-live"}],"tags":["routines","standing-work","channel-ownership","continuity","workflow-integration"],"notes":{"signal":"Ecosystem guides present scheduled work as set-and-forget and say nothing about what becomes of it when the person who set it up moves on. Bank #1's background-work items cover Dispatch routing (D4-008) and its ten-minute permission timeout (D4-009), and no bank #1 item covers Claude Tag routines at all, so the ownership and continuity rules are untested."}},{"id":"D4-C006","domain":"D4","objective":"Use Claude to support solution design, development, and iteration","type":"single","difficulty":"hard","scenario":true,"stem":"A marketing lead has written into her team's standing instructions, 'Never send anything to the customer mailing list without my approval.' She tells her director that this makes an unapproved send impossible. How should that claim be corrected?","options":[{"key":"A","text":"The instruction applies only to threads she starts herself, so it belongs in the team's shared memory rather than instructions."},{"key":"B","text":"The instruction will hold reliably, but only if it is restated at the beginning of every individual task she assigns."},{"key":"C","text":"Instructions steer Claude but do not restrict it, so a decision that must come back to a person needs an enforced control too."},{"key":"D","text":"The instruction is unnecessary, because Claude is unable to take any action that reaches people outside the organisation."}],"correct":["C"],"explanation":"Anthropic documents this explicitly: constraints written into a task, and standing instructions of this kind, steer Claude but do not restrict Claude from performing a specific action or from deciding on its own, because anything typed to Claude goes into its working context, where it can be forgotten or overridden. Actions Claude must not take have to be enforced outside the conversation, through permissions and required approval checks in the system where the action actually happens. For a mailing list that means a send permission or an approval gate in the mailing tool, not a sentence in the instructions.","rationales":{"A":"Standing instructions apply to every new session in that scope, not only to threads the author starts, and moving the rule to memory would make it weaker rather than stronger.","B":"Repetition raises the odds that Claude follows the instruction but does not change its nature. Steering is still not a restriction, however often it is stated.","D":"Claude can act through connected tools, which is precisely why external-facing actions need an enforced gate in the source system."},"sources":[{"title":"Good habits for working with Claude Tag - Claude Docs","url":"https://claude.com/docs/claude-tag/users/good-habits","date":"2026-08-20","basis":"verified-live"}],"tags":["community-myth","integration-boundary","enforced-controls","approval-gate"],"notes":{"signal":"Community guides teach 'decide what Claude may close on its own' but present written instructions as the control. The documented fact is that instructions steer and do not restrict, so the community belief becomes the attractive distractor here."}},{"id":"D4-C007","domain":"D4","objective":"Integrate Claude into existing workflows to augment or redesign them","type":"single","difficulty":"easy","scenario":true,"stem":"A market research team hands Claude a multi-day piece of work in a channel and expects to collect the finished deck at the end of it. Three days in, the thread holds a great deal of intermediate analysis but nothing anyone can open. What should have been written into the task?","options":[{"key":"A","text":"A requirement that Claude summarise the thread each morning, so that the analysis so far is preserved in the conversation."},{"key":"B","text":"A requirement that getting the deliverable somewhere durable is part of done, such as posting the file to the thread as it goes."},{"key":"C","text":"A requirement that the work be split across several channels, so that each part of the deck is produced in a separate place."},{"key":"D","text":"A requirement that the team ask for a progress update whenever they want one, so that nothing has to be posted before the end."}],"correct":["B"],"explanation":"Anthropic's guidance for long-running work is to make getting the deliverable somewhere durable part of the definition of done, and the example it gives first is posting the file to the thread as the work goes. That is a separate refinement from naming the outcome, and it exists because a long task otherwise leaves its result inside the conversation, where the team has nothing to open and nothing to hand on.","rationales":{"A":"A summary is still text in the same thread. It preserves an account of the work rather than the deliverable, so the team still has nothing they can open.","C":"Splitting one piece of work across channels multiplies the threads that need reviewing and produces a durable artefact in none of them.","D":"An update on request says where the work has reached. It is not the deliverable, and it leaves the team chasing rather than collecting."},"sources":[{"title":"Good habits for working with Claude Tag - Claude Docs","url":"https://claude.com/docs/claude-tag/users/good-habits","date":"2026-08-20","basis":"verified-live"}],"tags":["definition-of-done","long-running-work","durable-deliverable","workflow-integration"],"notes":{"signal":"Guides treat definition of done as a single idea about how to word an end state. Bank #1's D4-001 keys naming the outcome and D4-002 keys spelling out everything an end condition includes, and neither covers the separate refinement for long-running work, that delivering the artefact somewhere durable is itself part of the definition."}},{"id":"D4-C008","domain":"D4","objective":"Integrate Claude into existing workflows to augment or redesign them","type":"single","difficulty":"medium","scenario":true,"stem":"A compliance team is running a review in which every reviewer must work from the exact version of the supplier policy that was approved in March. That document is still being edited in Google Drive ahead of the next release. A colleague suggests adding it through the Drive integration so nobody has to hunt for it. What is wrong with that suggestion, and what should the team do?","options":[{"key":"A","text":"The integration cannot read policy documents at all, so the team should paste the policy text into the conversation instead."},{"key":"B","text":"The integration would expose the March version to the whole organisation, so the team should tighten the sharing settings first."},{"key":"C","text":"The integration adds documents to chats but never to projects, so the team should upload the policy to a project instead."},{"key":"D","text":"The linked document keeps syncing with later edits, so the team should attach a fixed copy of the March version."}],"correct":["D"],"explanation":"The same live-sync behaviour that makes a connector right for volatile data makes it wrong here. Anthropic documents that a document added through the Drive integration continues syncing with the latest version, so reviewers would silently start reading the in-progress draft rather than the approved March text. When the workflow depends on a specific point-in-time version, the static copy is the correct choice.","rationales":{"A":"The integration reads Google Docs, including policy documents, up to the documented size limit. The problem is version drift, not capability.","B":"Access follows the user's existing Drive permissions - only documents the user can already view can be synced - so adding it does not widen who can see the file.","C":"The integration works in chats and in private projects, so the statement misdescribes the product. It is shared projects the integration does not cover, and in any case moving the document would not address the version drift that is the actual problem."},"sources":[{"title":"Google Drive integration - Claude Docs","url":"https://claude.com/docs/connectors/google/drive","date":"2026-08-20","basis":"verified-live"}],"tags":["community-myth","connector-vs-upload","live-sync","version-control","workflow-design"],"notes":{"signal":"Vendors teach 'connect the live source' as a blanket best practice. The documented behaviour makes that wrong for point-in-time review work, so this item keys the exception and uses the blanket rule as the distractor."}},{"id":"D4-C009","domain":"D4","objective":"Communicate Claude's value and limitations to stakeholders","type":"multi","difficulty":"medium","scenario":true,"stem":"Six months after a Claude pilot, a budget holder asks the team to show that the invoice-query workflow actually improved anything. Which TWO pieces of evidence best support that claim? (Select TWO.)","options":[{"key":"A","text":"A comparison of how long the same query types took in the three months before the pilot and the three months after."},{"key":"B","text":"The weekly active member count shown on the organisation's usage analytics dashboard for the pilot period."},{"key":"C","text":"The total number of conversations the team started in Claude across the six months of the pilot."},{"key":"D","text":"The proportion of Claude's drafted responses that reviewers accepted without correction, tracked across the pilot."},{"key":"E","text":"The estimated time saved figure from the analytics dashboard, presented on its own as the headline result."}],"correct":["A","D"],"explanation":"Anthropic's guidance on defining success criteria is that a good criterion is specific, measurable, achievable and relevant, and the documented worked example states its target as an improvement over the current baseline. A before-and-after comparison of the same query types is exactly that. Quality needs a measure of its own, and the share of drafted responses accepted without correction is one the team can track through the pilot. Together they speak to time and to quality, which is what the budget holder is asking about.","rationales":{"B":"Weekly active members is an adoption metric on the analytics dashboard. It shows how many people opened Claude, not whether the workflow produced a better or faster result.","C":"Conversation counts measure activity. A team could hold more conversations while getting worse outcomes, so the number cannot carry the business case.","E":"The dashboard's estimated time saved is a modelled estimate reported by the vendor's own tooling. It can support a case but cannot be the headline evidence to a sceptical budget holder without an independent baseline."},"sources":[{"title":"Define your success criteria - Claude Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/define-success","date":"2026-08-20","basis":"verified-live"},{"title":"View usage analytics for Team and Enterprise plans - Claude Support","url":"https://support.claude.com/en/articles/12883420-view-usage-analytics-for-team-and-enterprise-plans","date":"2026-08-20","basis":"verified-live"}],"tags":["business-case","roi","evidence","adoption-vs-outcome","baseline"],"notes":{"signal":"ROI and business-case reasoning is named across the ecosystem as a D4 skill, and D4 is the second-heaviest domain, yet bank #1 has no squarely-on-target item on measuring whether a Claude-assisted workflow delivered."}},{"id":"D4-C010","domain":"D4","objective":"Leverage Claude for research, planning, and process optimization","type":"single","difficulty":"easy","scenario":true,"stem":"A compliance team in Sydney automates its weekly review with the message 'every Monday at 9am, check the shared folder for documents added in the past week and post the findings here.' The findings keep arriving at an unhelpful time of day. What is the documented cause and the fix?","options":[{"key":"A","text":"Schedules follow the timezone of whoever reads the post first, so the team should nominate one named recipient."},{"key":"B","text":"Schedules run in the Slack workspace's timezone, so an administrator has to change that setting for the workspace."},{"key":"C","text":"Schedules fire at an approximate time rather than a stated one, so the team should widen the window it expects."},{"key":"D","text":"Schedules default to UTC when no timezone is named, so the message should state the timezone the team wants."}],"correct":["D"],"explanation":"Anthropic documents that schedules default to UTC. When you say 'every weekday at 9am', include the timezone, for example '9am Pacific', so Claude converts correctly; without one it may guess. The same note appears on the recurring document review recipe, and the documented way to confirm what was actually set is to ask Claude what triggers it has set up in the channel.","rationales":{"A":"Nothing about a schedule depends on who reads the post. A routine posts into the channel it belongs to, at the time it was scheduled for.","B":"The documented default is UTC rather than the Slack workspace's timezone, and the fix is to name the timezone in the request, not to change a workspace setting.","C":"Scheduled jobs fire on the schedule they were given. The problem here is that no timezone was given, not that the firing time is approximate."},"sources":[{"title":"Set up routines - Claude Docs","url":"https://claude.com/docs/claude-tag/users/proactivity","date":"2026-08-20","basis":"verified-live"},{"title":"Review documents against a checklist - Claude Docs","url":"https://claude.com/docs/claude-tag/users/use-cases/review-documents","date":"2026-08-20","basis":"verified-live"}],"tags":["routines","scheduling","timezone","utc","process-optimization"],"notes":{"signal":"Study guides name automating a recurring task as a D4 process-optimisation skill but stop at 'ask Claude to run it on a schedule'. Bank #1 has no item on Claude Tag routines and none on how a stated schedule is interpreted, so the default that most often makes an automated workflow fire at the wrong time is untested."}},{"id":"D4-C011","domain":"D4","objective":"Communicate Claude's value and limitations to stakeholders","type":"single","difficulty":"medium","scenario":true,"stem":"A sceptical director says, 'If I cannot rely on it being right every single time, it is no use to us.' The team's workflow has Claude check supplier documents against a data-handling policy and post one finding per checklist item. What is the strongest response to the director?","options":[{"key":"A","text":"Point out that the workflow has not yet produced an incorrect finding, so the concern is theoretical rather than practical."},{"key":"B","text":"Offer to add a second Claude session that checks the first session's findings before any person reads them."},{"key":"C","text":"Explain that each finding names the section it came from, so reviewers can check findings in proportion to the stakes."},{"key":"D","text":"Agree to restrict the workflow to documents where an incorrect finding would carry no consequence whatsoever."}],"correct":["C"],"explanation":"Anthropic's documented pattern for this workflow is to ask for the section each finding was based on, because that keeps every finding checkable - the reviewer can open what Claude read. The accompanying guidance is to read the findings before acting on them, in proportion to what is at stake. The honest answer to the director is therefore not a claim of perfect reliability but a design in which the output is verifiable and human review is proportionate to risk.","rationales":{"A":"An absence of observed errors is a weak argument, and it concedes the director's framing that value depends on never being wrong.","B":"Stacking a second automated pass adds cost without adding independent verification, and it removes the human reviewer the guidance places in the loop.","D":"Confining the workflow to consequence-free documents surrenders the value case, when the documented answer is proportionate review rather than avoidance."},"sources":[{"title":"Review documents against a checklist - Claude Docs","url":"https://claude.com/docs/claude-tag/users/use-cases/review-documents","date":"2026-08-20","basis":"verified-live"}],"tags":["stakeholder-communication","limitations","checkable-output","proportionate-review"],"notes":{"signal":"The ecosystem treats 'communicate value and limitations' as recall of product limits. The blueprint objective is a judgement skill, and this item tests the argument a practitioner actually has to make to a sceptic."}},{"id":"D4-C012","domain":"D4","objective":"Leverage Claude for research, planning, and process optimization","type":"single","difficulty":"medium","scenario":true,"stem":"A team's daily automated digest is accurate but nobody reads it. Every post is a different length, the items appear in a different order each day, and routine items are mixed in with the ones that need somebody to act. What does Anthropic's guidance say to change?","options":[{"key":"A","text":"Run the digest less often, so that each post carries more material and the channel receives fewer of them overall."},{"key":"B","text":"Spell out the shape of each post in the job: how long each item runs, the status legend to use, and what to leave out."},{"key":"C","text":"Move the digest into a direct message with each reader, so that everyone receives the summary that matches their interests."},{"key":"D","text":"Ask Claude to rank the items by importance each day and let it choose the length and layout that suit that day's contents."}],"correct":["B"],"explanation":"The documented instruction is to specify the output format for anything recurring. A monitor or digest that posts on a schedule posts to the channel repeatedly, so spell out the shape you want each post to take: say how long each item should be, give it the status legend to use, and tell it what to leave out, so the channel can read every post at a glance. The routines guidance repeats the point, to name the output format in the job so recurring posts stay scannable, and the project-digest recipe says to name the format in the prompt so every digest comes back in the same readable shape. Once a post matches the format you want, you can also point at it and ask for that format going forward.","rationales":{"A":"Frequency is not what makes the posts unreadable. A less frequent digest in an unpredictable shape is still unpredictable, and it delays anything that needs someone to act.","C":"A digest sent to individuals leaves the channel without the standing record, and it multiplies the work instead of fixing the format. Standing work posts into the channel it belongs to.","D":"Letting Claude choose the layout each day is the cause of the problem. The point of specifying the format is that every post can be read at a glance because every post has the same shape."},"sources":[{"title":"Good habits for working with Claude Tag - Claude Docs","url":"https://claude.com/docs/claude-tag/users/good-habits","date":"2026-08-20","basis":"verified-live"},{"title":"Set up routines - Claude Docs","url":"https://claude.com/docs/claude-tag/users/proactivity","date":"2026-08-20","basis":"verified-live"},{"title":"Track projects and chase approvals - Claude Docs","url":"https://claude.com/docs/claude-tag/users/use-cases/track-projects","date":"2026-08-20","basis":"verified-live"}],"tags":["recurring-output-format","digest","routines","scannability","process-optimization"],"notes":{"signal":"Ecosystem guides treat output formatting as a one-off prompting skill applied to a single answer. Bank #1's D4 items cover threading discipline (D4-010), review batching (D4-011) and graduated autonomy (D4-014), and no item in bank #1 or in the other community files covers the standing-format rule for work that posts to the same place repeatedly."}},{"id":"D4-C013","domain":"D4","objective":"Use Claude to support solution design, development, and iteration","type":"single","difficulty":"easy","scenario":true,"stem":"A department has four candidate workflows and wants to hand just one of them to Claude first, to learn how the team should work with it. Which is the most sensible first choice?","options":[{"key":"A","text":"The workflow with the highest annual cost, so that the pilot can demonstrate the largest possible saving."},{"key":"B","text":"A recurring workflow whose output can be checked against something written down and is cheap to correct."},{"key":"C","text":"A workflow that nobody currently owns, so that the pilot disrupts no one's existing responsibilities."},{"key":"D","text":"The workflow that most often causes disputes with customers, so that the pilot tackles the loudest problem."}],"correct":["B"],"explanation":"The documented approach to a new deployment is calibration: check everything Claude produces in a new channel at first, and widen what it closes on its own as its output holds up under review. Two things follow. Checking requires something to check against, which is why the documented pattern for a review asks Claude to name the section each finding came from, so a reviewer can open what it read. And the guidance reserves heavier treatment, written as constraints, for work where a mistake would be costly to undo, so a first channel is better pointed somewhere a mistake is cheap to correct. Recurring work repays the calibration effort, because the same check is made week after week. Anthropic does not publish an ordered list of starter use cases, so this is reasoning from the calibration rule rather than a documented sequence.","rationales":{"A":"The highest-cost workflow is usually also the highest-risk one, which is the opposite of where calibration should begin.","C":"An unowned workflow has nobody to review the output or judge whether it is right, so the pilot produces no reliable learning.","D":"Customer disputes put a first pilot directly in front of external parties, where mistakes are expensive and public rather than cheap to correct."},"sources":[{"title":"Good habits for working with Claude Tag - Claude Docs","url":"https://claude.com/docs/claude-tag/users/good-habits","date":"2026-08-20","basis":"verified-live"},{"title":"Review documents against a checklist - Claude Docs","url":"https://claude.com/docs/claude-tag/users/use-cases/review-documents","date":"2026-08-20","basis":"verified-live"}],"tags":["rollout","pilot-selection","graduated-autonomy","checkable-output"],"notes":{"signal":"Guides describe 'what to pilot first' as part of D4 adoption planning but state it as advice rather than testing the judgement. Bank #1 has no item on selecting a first use case."}},{"id":"D4-C014","domain":"D4","objective":"Integrate Claude into existing workflows to augment or redesign them","type":"single","difficulty":"medium","scenario":true,"stem":"An operations team asks Claude to run its weekly vendor review. The checklist it uses exists only in the team leader's head, and the decisions that shaped it were made in direct messages. The team's current fix is to retype the checklist into the request every week. What is the better change?","options":[{"key":"A","text":"Put the checklist in a document Claude can read, and move the decisions somewhere the team can see them too."},{"key":"B","text":"Have the team leader personally review every output, since only she holds the criteria the review actually depends on."},{"key":"C","text":"Shorten the checklist until it is small enough to be restated reliably at the start of each week's request."},{"key":"D","text":"Keep retyping the checklist but ask Claude to remember it, so that later weeks do not need it entered again."}],"correct":["A"],"explanation":"This is the difference between redesigning a process around Claude and bolting Claude onto it unchanged. Anthropic documents that knowledge living in direct messages or only spoken aloud is invisible to Claude, and that a checklist should be kept as a document Claude can read - in a connected tool or linked from the working channel - rather than re-described each time. Making the criteria and the decisions visible fixes the process rather than patching each week's request.","rationales":{"B":"This keeps the single point of failure in place. The criteria stay undocumented, so nobody else can run or check the review.","C":"Trimming the checklist degrades the review to fit the workaround, rather than putting the criteria where both the team and Claude can use them.","D":"Memory is for short, durable conventions, and long entries crowd out other context. A full checklist belongs in a document that is linked, not stored as a remembered note."},"sources":[{"title":"Good habits for working with Claude Tag - Claude Docs","url":"https://claude.com/docs/claude-tag/users/good-habits","date":"2026-08-20","basis":"verified-live"},{"title":"Review documents against a checklist - Claude Docs","url":"https://claude.com/docs/claude-tag/users/use-cases/review-documents","date":"2026-08-20","basis":"verified-live"}],"tags":["process-redesign","workflow-integration","knowledge-visibility","checklist-as-document"],"notes":{"caveat":"Distractor rationale D rests on a documented fact the item does not cite. Rationale D reads 'Memory is for short, durable conventions, and long entries crowd out other context. A full checklist belong","signal":"Study guides list 'redesign the process rather than bolting Claude on' as a D4 concept but leave it abstract. Bank #1 has no item where the candidate must choose between fixing the process and patching each request."}},{"id":"D5-C001","domain":"D5","objective":"Manage uploaded knowledge and connectors (e.g., Google Drive, Gmail)","type":"single","difficulty":"medium","scenario":true,"stem":"A market analyst on a Team plan asks a question that Claude answers using a spreadsheet reached through her Google Drive connector. The answer is exactly what a colleague in the same organization needs, so she looks for the option to send him that conversation and finds she cannot. What is the documented explanation and the sensible way forward?","options":[{"key":"A","text":"Chat sharing is reserved for Owners on a Team plan, so an Owner has to share the conversation on her behalf."},{"key":"B","text":"The conversation shares normally as soon as her colleague has authenticated the same connector, because sharing is checked against the recipient."},{"key":"C","text":"A chat that includes synced connector content cannot be shared, so her colleague should ask the question himself once he has connected the service."},{"key":"D","text":"Sharing is blocked because the spreadsheet is above the file size allowed in a shared conversation, so a smaller extract would share normally."}],"correct":["C"],"explanation":"Anthropic lists three connector conditions for Team and Enterprise plans: access permissions are enforced at the user level and each person authenticates with the third-party service when first using the connector, connectors are only available in private projects, and chats with synced content cannot be shared. The restriction attaches to the conversation itself rather than to the recipient, so there is no setting to unlock it. Because each person reaches only what they are already permitted to see in the source service, the workable route is for the colleague to run the question under his own authenticated connection.","rationales":{"A":"The constraint is not a role or seniority matter. An Owner cannot share a chat containing synced content either, because the restriction attaches to the conversation.","B":"Sharing is not evaluated against the recipient's connector access; a chat carrying synced content is simply not shareable, whatever the other person has connected.","D":"No file size rule governs this. The documented restriction concerns synced connector content in the chat, not the size of the underlying spreadsheet."},"sources":[{"title":"Use connectors to extend Claude's capabilities | Anthropic Help Center","url":"https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities","date":"2026-08-20","basis":"verified-live"},{"title":"Use Google Workspace connectors | Anthropic Help Center","url":"https://support.claude.com/en/articles/10166901-use-google-workspace-connectors","date":"2026-08-20","basis":"verified-live"}],"tags":["connectors","google-drive","chat-sharing","team-plan","collaboration","community-signal"],"notes":{"signal":"Unofficial guides present connectors as the way to put a shared source of truth in front of a whole team, and the constraint practitioners actually hit first is that the resulting conversation cannot be passed on at all. Bank #1 tests connector permission inheritance (D5-010), the Drive picker being disabled for shared projects (D5-012) and custom connector governance (D5-011), and no bank #1 item covers what happens when someone tries to share the chat itself."}},{"id":"D5-C002","domain":"D5","objective":"Create effective system-level instructions","type":"multi","difficulty":"medium","scenario":true,"stem":"A Team-plan Owner is about to publish organization instructions for the first time, setting house standards for tone and formatting. Colleagues want to know what this will mean for their own settings. Which TWO statements should she give them? (Select TWO.)","options":[{"key":"A","text":"Each member has to accept the instructions in their profile settings before those instructions start to apply to that member."},{"key":"B","text":"The instructions apply inside shared projects only, so plain chats and private projects carry on exactly as they are today."},{"key":"C","text":"Where the organization instructions and a member's own Instructions for Claude disagree, Claude follows the organization instructions."},{"key":"D","text":"Any member can open the organization instructions and edit them, so the wording has to be agreed by the team before publication."},{"key":"E","text":"A change she saves may take up to an hour to take effect across Claude products, so colleagues should not expect it immediately."},{"key":"F","text":"Organization instructions supersede project instructions, which stop being applied once organization instructions exist."}],"correct":["C","E"],"explanation":"Organization instructions are custom guidelines that Admins, Owners and Primary Owners on Team and Enterprise plans set for Claude to follow in every conversation across the organization. Two documented properties are what members need to be told: the organization instructions take precedence where they conflict with an individual user's instructions, and a change may take up to an hour to take effect across Claude products. Only Admins and above can view or edit them, and the field is capped at 3,000 characters, which is why the documented guidance is to keep them concise and limited to uniform standards.","rationales":{"A":"There is no per-member acceptance step. Once saved, the instructions apply across the organization's conversations, subject only to the propagation delay.","B":"They apply to every conversation across the organization rather than to one surface, which is exactly why they are meant to carry uniform standards.","D":"Only Admins and above can view or edit organization instructions; ordinary members cannot open them, which is why expectations have to be communicated in advance.","F":"Project instructions continue to apply inside their own project. The organization layer sits alongside the other personalization layers rather than switching them off."},"sources":[{"title":"Set organization instructions | Anthropic Help Center","url":"https://support.claude.com/en/articles/14546867-set-organization-instructions","date":"2026-08-20","basis":"verified-live"},{"title":"Understanding Claude's personalization features | Anthropic Help Center","url":"https://support.claude.com/en/articles/10185728-understanding-claude-s-personalization-features","date":"2026-08-20","basis":"verified-live"}],"tags":["organization-instructions","system-level-instructions","precedence","admin-controls","propagation-delay","community-signal"],"notes":{"caveat":"Distractor F's rationale rests on an undocumented claim, and the item's second cited source does not support the material it is cited alongside - the same defect class the original reviewer raised as ","signal":"The unofficial material teaches system-level instructions almost entirely as an individual profile setting and treats the admin-set organization layer as an announcement rather than as a configured object with documented behaviour. Bank #1's system-level instruction items cover the account-wide Instructions for Claude field (D5-014), custom skills (D5-015 to D5-019) and instruction wording drift (D5-025), and contain no item on organization instructions."}},{"id":"D5-C003","domain":"D5","objective":"Inform, maintain, and update Claude configurations, knowledge sources, and instructions","type":"single","difficulty":"medium","scenario":true,"stem":"A company reissued its expenses policy in June, raising the threshold above which a receipt is required. The finance team's project knowledge still holds the superseded version alongside the new one, and Claude's drafted replies to staff keep citing the old threshold. What should the project's editor do first?","options":[{"key":"A","text":"Add a note to the end of the project instructions asking Claude to prefer the newer document wherever two policies disagree with each other."},{"key":"B","text":"Delete the superseded policy from the project knowledge so that only the current version remains available to Claude."},{"key":"C","text":"Start a fresh conversation inside the project for every expenses question, so that the older document is not carried over from earlier chats."},{"key":"D","text":"Rename both files to include their issue dates and leave them both in place, so that Claude can work out for itself which one is current."}],"correct":["B"],"explanation":"Project knowledge is the material Claude draws on across every conversation in that project, so while the withdrawn policy remains uploaded it stays eligible to be used and cited. Removing it is the direct fix and is the only option that stops the wrong threshold being available at all. The other options try to steer Claude around a document that should simply not be there.","rationales":{"A":"An instruction to prefer the newer document leaves the withdrawn text in scope and depends on Claude correctly identifying which of two similar documents is newer on every occasion.","C":"Starting a new chat does not change what the project knowledge contains; the knowledge base is shared across all conversations in the project, which is the point of a project.","D":"Descriptive filenames are documented good practice and genuinely help retrieval, but naming does not withdraw the superseded document; a retrieval that lands on the old file will still quote the old threshold."},"sources":[{"title":"What are projects? | Anthropic Help Center","url":"https://support.claude.com/en/articles/9517075-what-are-projects","date":"2026-08-20","basis":"verified-live"},{"title":"Retrieval augmented generation (RAG) for projects | Anthropic Help Center","url":"https://support.claude.com/en/articles/11473015-retrieval-augmented-generation-rag-for-projects","date":"2026-03-16","basis":"published"}],"tags":["knowledge-staleness","project-knowledge","maintenance","curation","community-signal"],"notes":{"signal":"Knowledge staleness, and specifically the superseded-policy-still-in-the-project scenario, is one of the most repeated worked examples across the unofficial D5 material, which uses it to teach that curating knowledge is a maintenance task rather than a prompting task. Bank #1 has no item in which an out-of-date knowledge file is the cause of a bad output."}},{"id":"D5-C004","domain":"D5","objective":"Inform, maintain, and update Claude configurations, knowledge sources, and instructions","type":"single","difficulty":"medium","scenario":true,"stem":"A Team-plan project that supports a monthly board pack is shared with eleven colleagues. Its instructions and knowledge were written nine months ago and nobody has touched them since. The programme manager wants to put a maintenance routine in place that will actually hold. Which arrangement is most appropriate?","options":[{"key":"A","text":"Give all eleven members Can edit permission so that whoever first notices an out-of-date document is able to correct it on the spot."},{"key":"B","text":"Leave the configuration untouched until Claude produces an obviously wrong answer, on the basis that editing a shared project discards its chats."},{"key":"C","text":"Ask each member to take a personal copy of the project so that everyone is free to maintain their own instructions and knowledge as they prefer."},{"key":"D","text":"Name one owner with Can edit who reviews instructions and knowledge on a set cadence and whenever a source document is reissued."}],"correct":["D"],"explanation":"Anthropic's documented permission levels for shared projects distinguish Can view, where members see the contents, knowledge and instructions and can chat in the project, from Can edit, where members can modify instructions and knowledge and update member settings. A workable routine assigns that edit right to a named owner, gives everyone else Can view, and defines both a regular cadence and an event trigger, namely a source document being reissued, so that the review is not left to chance.","rationales":{"A":"Spreading Can edit across all eleven members diffuses accountability rather than establishing it, and the more people who can change instructions and knowledge, the harder it is to know what state the configuration is in.","B":"Editing a shared project does not discard the conversations held inside it, and waiting for a visibly wrong answer means the errors that are not obvious go uncorrected.","C":"Duplicating the project into eleven personal copies multiplies the maintenance burden, guarantees the copies diverge, and gives up the shared workspace the team needs."},"sources":[{"title":"Manage project visibility and sharing | Anthropic Help Center","url":"https://support.claude.com/en/articles/9519189-manage-project-visibility-and-sharing","date":"2026-08-20","basis":"verified-live"},{"title":"How can I create and manage projects? | Anthropic Help Center","url":"https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects","date":"2026-08-20","basis":"verified-live"}],"tags":["maintenance","ownership","review-cadence","sharing","permissions","community-signal"],"notes":{"signal":"The unofficial guides consistently describe a maintenance routine as a named D5 behaviour, covering who reviews a project, how often, and on what trigger. Bank #1's D5 maintenance items address memory pausing (D5-023), instruction wording drift (D5-025) and skill sharing (D5-021), and none asks who owns a configuration review or what should trigger it."}},{"id":"D5-C005","domain":"D5","objective":"Configure Claude Projects with instructions and knowledge sources","type":"single","difficulty":"easy","scenario":true,"stem":"A communications officer is setting up a project for her team's regular customer notices. She has three pieces of material: a standing rule that every notice is written in plain English and runs to no more than 300 words; a 60-page style and terminology manual; and the fact that this particular week's notice must not name the supplier involved. Where should each of the three go?","options":[{"key":"A","text":"The standing rule in project instructions, the manual in project knowledge, and the supplier restriction in the prompt for that one notice."},{"key":"B","text":"All three in the project instructions, so that Claude has the complete picture in front of it for every conversation held in the project."},{"key":"C","text":"The standing rule and the supplier restriction in project instructions, with the manual pasted into the prompt each time a notice is drafted."},{"key":"D","text":"The manual in project instructions, the standing rule in project knowledge, and the supplier restriction in her account-wide Instructions for Claude."}],"correct":["A"],"explanation":"Anthropic describes project instructions as guidance for how Claude should behave and respond in that project, covering things such as tone, formatting and rules, and project knowledge as documents and files that Claude uses to understand the context and can refer to across conversations. The standing 300-word plain-English rule is durable behaviour, the manual is reference material, and a restriction that applies to a single notice belongs in that notice's request rather than being written into any persistent layer.","rationales":{"B":"A 60-page manual is reference material, not a behavioural rule, and pushing it into the instructions field mixes durable standing rules with bulk reference text that the knowledge base exists to hold.","C":"Pasting the manual on every occasion throws away the persistent knowledge base, and promoting a one-week restriction into project instructions turns it into a standing rule that will silently apply to later notices.","D":"This inverts instructions and knowledge, and putting a single notice's restriction into the account-wide Instructions for Claude would apply it to every conversation across the whole account."},"sources":[{"title":"Understanding Claude's personalization features | Anthropic Help Center","url":"https://support.claude.com/en/articles/10185728-understanding-claude-s-personalization-features","date":"2026-08-20","basis":"verified-live"},{"title":"What are projects? | Anthropic Help Center","url":"https://support.claude.com/en/articles/9517075-what-are-projects","date":"2026-08-20","basis":"verified-live"}],"tags":["project-instructions","project-knowledge","one-off-prompt","placement","configuration","community-signal"],"notes":{"signal":"Sorting content into instructions, knowledge or the prompt itself is the single most commonly taught D5 exercise in the unofficial material, usually presented as a three-way placement drill. Bank #1 tests the scope of each layer (D5-002, D5-005, D5-014) but never asks the candidate to place given content into the right one of the three."}},{"id":"D5-C006","domain":"D5","objective":"Configure Claude Projects with instructions and knowledge sources","type":"single","difficulty":"easy","scenario":true,"stem":"An analyst has spent an afternoon in an ordinary standalone chat working out how to present a new reporting metric. The work belongs with her monthly reporting project, and she wants that conversation filed there rather than left loose in her chat list. She does not want to redo any of it. What should she do?","options":[{"key":"A","text":"Export the conversation and upload the transcript into the project's knowledge, because a chat can join a project only as a knowledge file."},{"key":"B","text":"Copy the project's instructions into the standalone chat, because a conversation started outside a project can never afterwards be brought into one."},{"key":"C","text":"Add the existing chat to the project from the dropdown beside the chat name, which files the conversation inside the project."},{"key":"D","text":"Open a new chat inside the project and paste the whole transcript into her first message, as that is the only way to carry the work across."}],"correct":["C"],"explanation":"Anthropic documents that a standalone chat can be moved into a project using the dropdown arrow next to the chat name and the Add to project option. A project is a self-contained workspace with its own chat history and knowledge base, so filing the conversation there keeps it with the rest of that work. Nothing has to be exported, retyped or rebuilt.","rationales":{"A":"Uploading a transcript converts a conversation into reference material and still leaves the original chat outside the project; the chat itself can simply be moved.","B":"A standalone chat is not permanently stuck outside a project, and hand-copying instructions duplicates configuration the project already holds.","D":"Recreating the conversation by hand duplicates the work, and a transcript pasted into a message is not the same as the chat being filed in the project."},"sources":[{"title":"How can I create and manage projects? | Anthropic Help Center","url":"https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects","date":"2026-08-20","basis":"verified-live"},{"title":"What are projects? | Anthropic Help Center","url":"https://support.claude.com/en/articles/9517075-what-are-projects","date":"2026-08-20","basis":"verified-live"}],"tags":["projects","chat-organization","add-to-project","configuration","community-signal"],"notes":{"signal":"Keeping related conversations inside the project they belong to is taught in the unofficial material as basic project hygiene, and candidates routinely assume that a chat begun outside a project can only be brought in by copying its text. Bank #1 covers what does not carry from standalone chats into a project (D5-003, on memory) but has no item on moving an existing conversation into one."}},{"id":"D5-C007","domain":"D5","objective":"Inform, maintain, and update Claude configurations, knowledge sources, and instructions","type":"multi","difficulty":"medium","scenario":true,"stem":"A marketing manager on a Team plan makes her campaign project visible to the whole organization. Its knowledge includes a client's unreleased pricing document, and she has already held several conversations inside the project. Which TWO consequences should she expect? (Select TWO.)","options":[{"key":"A","text":"Everyone in the organization can view and use the project, the client pricing document in its knowledge included."},{"key":"B","text":"The conversations she has already held inside the project become visible to the organization along with the project itself."},{"key":"C","text":"Organization-wide visibility extends to the instructions only, and the knowledge files stay restricted to members she has invited by name."},{"key":"D","text":"Her existing conversations inside the project remain private to her unless she chooses to share them individually."},{"key":"E","text":"Making a project organization-wide promotes every member to Can edit, so any of them is then able to replace its knowledge."},{"key":"F","text":"An administrator is able to allow organization-wide visibility only for those projects that hold no uploaded knowledge files."}],"correct":["A","D"],"explanation":"Anthropic documents that with a public project everyone in your organization can view and use the project, and that members with view access can see the project contents, knowledge and instructions. It separately documents that your chats within a project are private and inaccessible to other members of your organization unless you manually share them. So the unreleased pricing document becomes readable organization-wide, which is the risk she needs to weigh, while her own conversations do not.","rationales":{"B":"Conversations held inside a project are private by default; sharing the project does not share the chats within it.","C":"Members with view access see the project's contents and knowledge as well as its instructions, so the knowledge files are not held back.","E":"Visibility and permission level are separate settings. Making a project public does not confer Can edit; that permission is granted deliberately.","F":"Administrators can disable public projects for the organization altogether, but that control is not conditioned on whether a project has files attached."},"sources":[{"title":"Manage project visibility and sharing | Anthropic Help Center","url":"https://support.claude.com/en/articles/9519189-manage-project-visibility-and-sharing","date":"2026-08-20","basis":"verified-live"},{"title":"What are projects? | Anthropic Help Center","url":"https://support.claude.com/en/articles/9517075-what-are-projects","date":"2026-08-20","basis":"verified-live"}],"tags":["sharing","visibility","project-knowledge","confidentiality","governance","community-signal"],"notes":{"signal":"The community reads D5 sharing as a governance decision rather than a menu operation, and the recurring teaching point is that sharing a project exposes its knowledge base, not just its instructions. Bank #1's sharing item (D5-020) turns on plan availability, so the exposure consequences of sharing were untested."}},{"id":"D6-C001","domain":"D6","objective":"Apply data sensitivity, regulatory, and privacy considerations","type":"single","difficulty":"easy","scenario":true,"stem":"A category manager receives a supplier quote marked commercial in confidence and wants Claude to compare it against two earlier quotes. She has a personal Claude Pro subscription, and her employer has a Claude Enterprise plan on which she is already provisioned. Company policy permits supplier pricing in the approved workspace. What should she do?","options":[{"key":"A","text":"Use the personal Pro account, having first switched the model improvement setting off in privacy settings."},{"key":"B","text":"Use the employer's Enterprise workspace, the account covered by the company's commercial agreement."},{"key":"C","text":"Use the personal Pro account in an Incognito chat, so that the exchange is not retained."},{"key":"D","text":"Use either account, because the same underlying models and safeguards apply to both."}],"correct":["B"],"explanation":"Confidential business material belongs in the account that the employer's commercial agreement covers. On Claude for Work plans the organisation manages the account and all associated data, Anthropic acts as a processor under that agreement, and inputs and outputs from commercial products are not used to train models by default. A personal consumer subscription sits outside all of that, whatever the individual settings say.","rationales":{"A":"The model improvement control changes one consumer setting; it does not place the conversation under the employer's commercial agreement, give the employer retention control, or provide admin visibility.","C":"Incognito affects whether the chat is used to improve Claude and whether it is kept in history. It does not make a personal account an appropriate home for confidential company material.","D":"The models may be the same, but the contractual position, retention controls and organisational governance are not. The account matters, not the model."},"sources":[{"title":"Who owns and manages the data of my team? - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/9265372-who-owns-and-manages-the-data-of-my-team","date":"2026-03-16","basis":"published"},{"title":"Is my data used for model training? (Commercial) - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/7996868-is-my-data-used-for-model-training","date":"2026-08-20","basis":"verified-live"}],"tags":["data-sensitivity","plan-choice","consumer-vs-commercial","triage"],"notes":{"signal":"Multiple study guides frame D6 as practitioner triage - decide whether a specific document may go into Claude and on which plan - rather than as vendor assurance. Datrick and spectrumailab both list plan choice for sensitive material as a scored behaviour. Bank #1 tests ZDR scope and BAAs instead."}},{"id":"D6-C002","domain":"D6","objective":"Apply data sensitivity, regulatory, and privacy considerations","type":"single","difficulty":"medium","scenario":true,"stem":"A recruitment coordinator wants Claude to check a candidate CV against the essential technical criteria in a job specification. Her employer permits CVs in the approved Claude workspace but requires that only the data the task needs is included. Which redaction leaves the task workable?","options":[{"key":"A","text":"Remove the employment dates and job titles, and keep the name and contact details so the file stays identifiable."},{"key":"B","text":"Replace every proper noun, including former employer names and the names of technology products, with placeholders."},{"key":"C","text":"Remove the name, contact details, address and photograph, and keep the skills, qualifications and history."},{"key":"D","text":"Leave the CV intact and add an instruction telling Claude not to retain or reuse the personal details it contains."}],"correct":["C"],"explanation":"Redaction is a matter of stripping what identifies the person while keeping what the task is actually judged on. The essential criteria are assessed against skills, qualifications and experience, so those stay; name, contact details, address and photograph carry no analytic value here and are the direct identifiers. Anthropic's Privacy Policy makes the submitter responsible for having the rights to include personal data in inputs, and notes that personal data in inputs may be reproduced in outputs, which is a further reason to leave it out.","rationales":{"A":"This is backwards. It strips the evidence the criteria are assessed against and keeps precisely the identifiers that should have gone.","B":"Over-redaction. Removing former employer names and technology product names destroys the relevant experience signal, so the check cannot be performed.","D":"An instruction in the prompt is not a technical control. The data is still submitted, and the obligation to minimise what is submitted is not discharged by asking the model to disregard it."},"sources":[{"title":"Privacy Policy - Anthropic","url":"https://www.anthropic.com/legal/privacy","date":"2026-07-08","basis":"published"}],"tags":["redaction","anonymisation","data-minimisation","recruitment"],"notes":{"caveat":"The originally-flagged within-file redundancy (D6-C002/D6-C014, with D6-C016's option E named as a third encoding) is only partly closed. D6-C014 was replaced, but the repeated distractor archetypes r","signal":"Three vendors name anonymisation and redaction before upload as a discrete drilled skill, and one builds a hands-on lab around deciding what to strip from a supplied document. Bank #1's data-handling items turn on retention windows, training-data defaults and contractual posture; none asks the candidate to decide what to remove from a document before it is sent."}},{"id":"D6-C003","domain":"D6","objective":"Follow organizational AI policies and governance standards","type":"single","difficulty":"medium","scenario":true,"stem":"A marketing manager wants to paste a list of named customers into Claude to draft segment descriptions. Nothing in Anthropic's Usage Policy prohibits it, and her employer holds a commercial agreement with Anthropic. Her employer's internal AI policy, however, bans customer records in any AI tool without written approval from the data protection officer. Which statement is correct?","options":[{"key":"A","text":"She must not proceed; her employer's policy binds her and is the stricter of the two rules here."},{"key":"B","text":"Anthropic's Usage Policy is the governing document for the product, so she may proceed as planned."},{"key":"C","text":"She may proceed if she anonymises the list, because anonymisation removes the need for the approval."},{"key":"D","text":"She should ask Anthropic to confirm in writing that the intended use is permitted under its policy."}],"correct":["A"],"explanation":"Anthropic's Usage Policy sets a floor, not a ceiling. Anthropic's own documentation states that the customer organisation manages the account and its data and governs internal usage policies for Claude for Work. Where the employer's policy is stricter, the employer's policy is the operative rule for the employee, and the required step is to obtain the data protection officer's approval.","rationales":{"B":"Compliance with the Usage Policy is a minimum condition of using the product. It does not license conduct that the employer has separately forbidden.","C":"The policy conditions the use on approval by the data protection officer. Deciding unilaterally that a redaction is sufficient substitutes the manager's judgement for the reviewer the policy names.","D":"Anthropic does not adjudicate a customer's internal policy, and a confirmation from the vendor would not satisfy an internal approval requirement."},"sources":[{"title":"Who owns and manages the data of my team? - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/9265372-who-owns-and-manages-the-data-of-my-team","date":"2026-03-16","basis":"published"},{"title":"Updates to our Acceptable Use Policy (now Usage Policy), Consumer Terms of Service, and Privacy Policy - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/9301722-updates-to-our-acceptable-use-policy-now-usage-policy-consumer-terms-of-service-and-privacy-policy","date":"2026-03-16","basis":"published"}],"tags":["employer-policy","policy-conflict","governance","approval-routes"],"notes":{"caveat":"Within-file keyed-proposition duplication that the repair did not touch. Both items key the same governance rule - a stricter external obligation prevails over a more permissive one - and use the same","signal":"The community consistently frames D6 as check your company's policy before you paste. Bank #1's policy items all turn on Anthropic's own rules - the structure of the Usage Policy, its high-risk requirements, its enforcement route - and none makes an employer's internal policy the governing rule."}},{"id":"D6-C004","domain":"D6","objective":"Apply data sensitivity, regulatory, and privacy considerations","type":"single","difficulty":"easy","scenario":true,"stem":"A project manager receives a draft contract from a partner organisation. It carries no classification label and she cannot tell whether it is meant to be confidential. She would like Claude's help summarising the obligations it places on her team. Applying the principle that uncertain material should be treated as sensitive, what should she do?","options":[{"key":"A","text":"Upload it and ask Claude to assess whether the content looks confidential before she relies on the summary."},{"key":"B","text":"Upload it in a chat she deletes immediately afterwards, which limits how long the exposure lasts."},{"key":"C","text":"Upload it with the partner organisation's name removed, which is enough to de-identify a commercial document."},{"key":"D","text":"Treat it as confidential and confirm its status with the partner or the contract owner before uploading."}],"correct":["D"],"explanation":"The default exists because the classification decision cannot be made after the fact. Anthropic's Privacy Policy places responsibility on the person providing inputs for having the necessary rights, permissions or authority to do so, which is a judgement to be settled before submission. When the status of a document is unknown, the conservative handling applies until someone with authority confirms otherwise.","rationales":{"A":"This inverts the order of operations. The upload is the act that needs authorising, so it cannot be justified by an assessment produced after the upload has happened.","B":"Deletion shortens retention but does not undo the submission, and it does nothing about whether she had the right to submit the partner's document at all.","C":"A commercial contract is identifiable from its terms, parties, dates and figures. Removing one name does not de-identify it, and confidentiality here is about the content, not the label."},"sources":[{"title":"Privacy Policy - Anthropic","url":"https://www.anthropic.com/legal/privacy","date":"2026-07-08","basis":"published"},{"title":"Using Claude for Legal Work: Privilege, Confidentiality, and How to Think About Configuration - Claude Support","url":"https://support.claude.com/en/articles/15707726-using-claude-for-legal-work-privilege-confidentiality-and-how-to-think-about-configuration","date":"2026-06-30","basis":"published"}],"tags":["default-to-sensitive","classification","third-party-material","data-sensitivity"],"notes":{"caveat":"The originally-flagged within-file redundancy (D6-C002/D6-C014, with D6-C016's option E named as a third encoding) is only partly closed. D6-C014 was replaced, but the repeated distractor archetypes r","signal":"Several study guides teach a treat it as sensitive when uncertain default as one of the most learnable D6 rules. Bank #1 has no item testing that default: its data-sensitivity items ask what a control does, not what to do when the classification of a document is unknown."}},{"id":"D6-C005","domain":"D6","objective":"Follow organizational AI policies and governance standards","type":"multi","difficulty":"medium","scenario":true,"stem":"A project lead notices a colleague pasting client deliverables into Claude on a personal Pro subscription, saying it is the same Claude and he pays for it himself. The firm holds a Claude Enterprise plan on which the colleague has a seat. Which TWO statements about that arrangement are accurate? (Select TWO.)","options":[{"key":"A","text":"The personal account sits outside the firm's commercial agreement, so the firm has no processing terms, retention control or admin visibility."},{"key":"B","text":"Switching the model improvement setting off on the personal account makes it contractually equivalent to working in the firm's Enterprise workspace."},{"key":"C","text":"Any zero data retention agreement the firm holds with Anthropic follows the person rather than the plan, so it reaches his personal account too."},{"key":"D","text":"Free, Pro and Max are documented as plans for individual users, with Team and Enterprise as the business offerings for work of this kind."},{"key":"E","text":"Anthropic notifies the organisation's administrators whenever an employee signs in to a personal account and uses it for the firm's material."}],"correct":["A","D"],"explanation":"Shadow AI is a contractual and governance problem before it is a technical one. Claude for Work data is governed by the agreement between Anthropic and the organisation, with the organisation's Primary Owner managing the account and its data; none of that reaches a personal subscription. Separately, Anthropic documents Free, Pro and Max as plans intended for individual users and points businesses and teams to the Team and Enterprise plans, so client deliverables on a personal Pro account are in the wrong place whoever is paying for it.","rationales":{"B":"The setting governs whether conversations are used to improve Claude. It creates no data processing terms, no organisational retention control and no admin visibility, which are the things the Enterprise plan supplies.","C":"Zero data retention is approval-gated and applies to eligible commercial surfaces. It has never covered consumer plans, and cannot be extended to one by the employee's intent.","E":"There is no such notification. Discovering unmanaged accounts is something the organisation has to do for itself, for example through domain claiming on Enterprise plans."},"sources":[{"title":"Who owns and manages the data of my team? - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/9265372-who-owns-and-manages-the-data-of-my-team","date":"2026-03-16","basis":"published"},{"title":"I have a zero data retention agreement with Anthropic. What products does it apply to? - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/8956058-i-have-a-zero-data-retention-agreement-with-anthropic-what-products-does-it-apply-to","date":"2026-06-09","basis":"published"},{"title":"Choose a Claude plan - Claude Support","url":"https://support.claude.com/en/articles/11049762-choose-a-claude-plan","date":"2026-05-19","basis":"published"}],"tags":["shadow-ai","personal-accounts","consumer-terms","governance"],"notes":{"signal":"Shadow AI and unapproved-tool use are named across the unofficial ecosystem as a natural D6 business-practitioner scenario, and bank #1 has zero items on it."}},{"id":"D6-C006","domain":"D6","objective":"Follow organizational AI policies and governance standards","type":"single","difficulty":"hard","scenario":true,"stem":"An Enterprise administrator discovers around forty personal Claude accounts registered on the company's verified email domain, several of them holding client work. She wants those accounts and the content already in them brought into the company's Enterprise workspace, not merely blocked. Which capability does that?","options":[{"key":"A","text":"Tenant Restrictions, which relocate existing personal accounts into the organisation's Enterprise workspace."},{"key":"B","text":"Organization instructions, which direct Claude to decline work submitted from personal accounts."},{"key":"C","text":"Custom data retention controls, which apply the organisation's retention period to those accounts."},{"key":"D","text":"Domain claiming, which surfaces personal accounts on a verified domain and gives users a migration window."}],"correct":["D"],"explanation":"Domain claiming, available on Enterprise plans only, lets an administrator see the Free, Pro and Max accounts registered on a verified company domain and open a 30-day migration window in which each user either merges their existing chats, projects and files into an account inside the Enterprise workspace or joins fresh. Accounts not migrated by the deadline are deactivated. That is the mechanism that captures existing content rather than simply cutting off access.","rationales":{"A":"Tenant Restrictions are a network-level control: a corporate proxy injects a header and Anthropic blocks access from organisations not on the allowed list. They prevent personal-account use on the corporate network but move nothing.","B":"Organization instructions are custom instructions Claude follows in conversations across the organisation. They apply within the organisation's own workspace and have no reach into separate personal accounts.","C":"Custom data retention controls set retention inside the Enterprise organisation. They do not apply to accounts that are not part of it."},"sources":[{"title":"Claim and migrate accounts on your domain - Claude Support","url":"https://support.claude.com/en/articles/14625619-claim-and-migrate-accounts-on-your-domain","date":"2026-08-20","basis":"verified-live"},{"title":"Enforce network-level access control with Tenant Restrictions - Claude Support","url":"https://support.claude.com/en/articles/13198485-enforce-network-level-access-control-with-tenant-restrictions","date":"2026-08-20","basis":"verified-live"},{"title":"Set organization instructions - Claude Support","url":"https://support.claude.com/en/articles/14546867-set-organization-instructions","date":"2026-08-20","basis":"verified-live"}],"tags":["shadow-ai","domain-claiming","tenant-restrictions","admin-controls"],"notes":{"signal":"Shadow AI remediation is the practitioner half of the community's governance reading of D6. Bank #1's admin-control items cover Cowork enablement, retention posture and certifications; none covers discovering or migrating unmanaged personal accounts on a company domain."}},{"id":"D6-C007","domain":"D6","objective":"Understand the ethical implications of AI usage","type":"single","difficulty":"medium","scenario":true,"stem":"A wellbeing lead has noticed that Claude sometimes shows a crisis support banner when a conversation touches on distress, and wants to write it into the staff wellbeing policy as an escalation route: if someone is struggling while using Claude, the system will notice and the organisation will hear about it. What is the accurate position?","options":[{"key":"A","text":"Enterprise administrators are notified whenever a banner is shown to a member of their organisation, which is what would make an escalation route of it."},{"key":"B","text":"The banner is written by Claude as part of its own response, so both its wording and the threshold at which it appears can be set organisation-wide."},{"key":"C","text":"The banner offers the user independent helpline services; the responders are not Anthropic staff, and nothing reaches the employer."},{"key":"D","text":"The banner cannot be dismissed until the user has made contact with one of the listed services, which is precisely why it can be relied on here."}],"correct":["C"],"explanation":"The crisis banners are produced by a detection system that sits separately from Claude, and what they offer the user is a route to independent crisis helplines. Anthropic's documentation is explicit that helpline responders are not Anthropic employees and that the user's Claude activity stays private, that contact can be anonymous, and that a user may dismiss a banner with no consequence for their account, after which it does not reappear for around two hours. It is a signpost offered to an individual, not a monitoring or reporting channel. An employer that writes it into a policy as an escalation route has both misdescribed a safety feature and left the duty of care it was meant to discharge with nothing behind it.","rationales":{"A":"There is no such notification, and building one would defeat the point of the feature. Nothing about a banner is reported to an administrator or an employer.","B":"A separate detection system, not Claude, decides when the banner appears. It is not part of the model's response and is not something an organisation configures.","D":"Users can dismiss the banner, and doing so carries no consequence for the account. A prompt the user is free to close is not a control an employer can lean on."},"sources":[{"title":"Crisis Helpline Support in Claude - Claude Support","url":"https://support.claude.com/en/articles/13171706-crisis-helpline-support-in-claude","date":"2026-03-16","basis":"published"}],"tags":["safety-features","crisis-support","duty-of-care","ethics","trap-item"],"notes":{"signal":"Community material treats in-product safety features as if they were organisational controls, and study guides rarely ask what a feature actually does or who hears about it. Bank #1's ethics items are about bias, published evaluations, watermarking and chatbot disclosure; none tests a safety feature a practitioner will actually see in the product."}},{"id":"D6-C008","domain":"D6","objective":"Follow organizational AI policies and governance standards","type":"single","difficulty":"medium","scenario":true,"stem":"An operations manager has kept several thousand Claude outputs from a document categorisation workflow. Two reuse proposals reach her for sign-off: building a narrow in-house tool that sorts documents into the same categories, and building a general purpose in-house chatbot that staff can ask anything. Under Anthropic's terms on reusing outputs, what should she tell them?","options":[{"key":"A","text":"Both proposals are fine, because the customer owns the outputs Claude produces and may put them to whatever purpose it chooses."},{"key":"B","text":"The categorisation tool is permitted; the general purpose chatbot is not, absent written permission from Anthropic."},{"key":"C","text":"Neither is permitted, because outputs may only be used inside the workflow and the product that produced them."},{"key":"D","text":"Both are permitted so long as a person reviews the outputs first and the resulting tool is kept inside the company rather than sold on."}],"correct":["B"],"explanation":"Anthropic's guidance on reusing outputs draws the line at competing models rather than at reuse in general. The customer owns the outputs and may build specialised tools from them, with content categorisation, sentiment analysis, summarisation and information extraction given as examples, and may integrate them into its own applications. What is off limits without written permission is using outputs to train general purpose chatbots or models for open-ended text generation, using outputs as training targets, or working back from them to reverse engineer Anthropic's training methods. A narrow categoriser sits on the permitted side of that line; a general purpose staff chatbot is the case the restriction names.","rationales":{"A":"Ownership of the outputs is real but it is not an unlimited licence. The restriction on training competing general purpose models sits alongside the ownership grant rather than being displaced by it.","C":"Too restrictive. Outputs may be integrated into the customer's own applications and used to build specialised tools, so confining them to the originating workflow misstates the position.","D":"Human review and keeping the work internal are good practice but they are not the condition the restriction turns on. What matters is the kind of model being trained, not who sees it."},"sources":[{"title":"Can I use my Outputs to train an AI model? - Claude Support","url":"https://support.claude.com/en/articles/12326764-can-i-use-my-outputs-to-train-an-ai-model","date":"2026-03-16","basis":"published"}],"tags":["output-ownership","competing-models","terms-of-service","governance","sign-off"],"notes":{"signal":"Community study material treats D6 governance almost entirely as a question of what may be put into Claude. Bank #1 follows the same shape: its governance and data items cover retention, training-data defaults, certifications and contractual posture, and none of them covers the customer's rights and restrictions over what comes out."}},{"id":"D6-C010","domain":"D6","objective":"Identify appropriate and inappropriate use cases","type":"single","difficulty":"hard","scenario":true,"stem":"A defence contractor's compliance lead finds that one of the firm's analytical workflows runs into a restriction in Anthropic's Usage Policy. The firm's legal team asks whether it can apply to Anthropic for a carve-out from that restriction. What is the accurate answer?","options":[{"key":"A","text":"Tailored restrictions are considered only for carefully vetted government entities, and a core set of prohibitions is never lifted."},{"key":"B","text":"Carve-outs are available to any customer on an Enterprise plan and are recorded as a variation in the commercial agreement."},{"key":"C","text":"Carve-outs are granted case by case to any customer that can evidence a lawful purpose and adequate safeguards against misuse."},{"key":"D","te
