<script>
"use strict";

/* ===================== exam setup ===================== */
var DIFFS = ['easy', 'medium', 'hard'];

function defaultSetup() {
  var cfg = activeConfig(), doms = {};
  allDomains().forEach(function (d) { doms[d.id] = true; });
  return {
    mode: 'exam', source: 'all',
    count: cfg.examLength, timed: true, minutes: cfg.timeLimitMinutes,
    domains: doms, diffs: { easy: true, medium: true, hard: true },
    weighted: !!cfg.blueprintWeighted, shuffleOpts: true, shuffleOrder: true
  };
}
function setupCfg() {
  if (!APP.setup) {
    var saved = APP.prefs.setup;
    APP.setup = defaultSetup();
    if (saved) {
      ['mode', 'source', 'count', 'timed', 'minutes', 'weighted', 'shuffleOpts', 'shuffleOrder'].forEach(function (k) {
        if (saved[k] !== undefined) APP.setup[k] = saved[k];
      });
      if (saved.diffs) APP.setup.diffs = saved.diffs;
    }
    var live = allDomains();
    var doms = {};
    live.forEach(function (d) { doms[d.id] = saved && saved.domains && saved.domains[d.id] !== undefined ? saved.domains[d.id] : true; });
    if (!Object.keys(doms).some(function (k) { return doms[k]; })) live.forEach(function (d) { doms[d.id] = true; });
    APP.setup.domains = doms;
  }
  return APP.setup;
}

function pool(c) {
  var rec = itemRecord(), out = [];
  var anyDom = Object.keys(c.domains).length > 0;
  enabledPacks().forEach(function (p) {
    p.items.forEach(function (it) {
      var d = it.domain || '';
      if (anyDom && d && !c.domains[d]) return;
      if (!c.diffs[it.difficulty]) return;
      var r = rec[it.id];
      if (c.source === 'missed' && !(r && r.lastOk === false)) return;
      if (c.source === 'unseen' && r) return;
      out.push(it);
    });
  });
  return out;
}

function sampleItems(items, count, weighted) {
  count = Math.min(count, items.length);
  if (!weighted) return shuffle(items).slice(0, count);

  var groups = {}, weights = {}, dm = allDomains();
  items.forEach(function (it) { (groups[it.domain || ''] = groups[it.domain || ''] || []).push(it); });
  var keys = Object.keys(groups);
  keys.forEach(function (k) {
    var d = dm.filter(function (x) { return x.id === k; })[0];
    weights[k] = d && d.weight > 0 ? d.weight : 0;
  });
  var wsum = keys.reduce(function (a, k) { return a + weights[k]; }, 0);
  if (!wsum) return shuffle(items).slice(0, count);

  var exact = {}, base = {}, taken = 0;
  keys.forEach(function (k) {
    exact[k] = count * (weights[k] / wsum);
    base[k] = Math.min(groups[k].length, Math.floor(exact[k]));
    taken += base[k];
  });
  keys.sort(function (a, b) { return (exact[b] - base[b]) - (exact[a] - base[a]); })
    .forEach(function (k) {
      if (taken >= count) return;
      if (base[k] < groups[k].length) { base[k]++; taken++; }
    });

  var picked = [];
  keys.forEach(function (k) { picked = picked.concat(shuffle(groups[k]).slice(0, base[k])); });
  if (picked.length < count) {                      // top up if a domain ran dry
    var have = {}; picked.forEach(function (i) { have[i.id] = 1; });
    picked = picked.concat(shuffle(items.filter(function (i) { return !have[i.id]; })).slice(0, count - picked.length));
  }
  return picked;
}

function materialise(it, shuffleOpts) {
  var copy = JSON.parse(JSON.stringify(it));
  copy._orig = {};
  copy.options.forEach(function (o) { copy._orig[o.key] = o.key; });
  if (!shuffleOpts || copy.options.length < 2) return copy;
  var order = shuffle(copy.options), map = {}, rats = {};
  order.forEach(function (o, i) { map[o.key] = KEYS[i]; });
  copy.options = order.map(function (o, i) { return { key: KEYS[i], text: o.text }; });
  copy.correct = copy.correct.map(function (k) { return map[k] || k; }).sort();
  Object.keys(copy.rationales || {}).forEach(function (k) { rats[map[k] || k] = copy.rationales[k]; });
  copy.rationales = rats;
  copy._orig = {};
  Object.keys(map).forEach(function (oldK) { copy._orig[map[oldK]] = oldK; });
  return copy;
}

/* ===================== view: setup ===================== */
function viewSetup() {
  var c = setupCfg(), dm = allDomains(), avail = pool(c);
  if (!enabledPacks().length) {
    return '<div class="wrap narrow"><div class="card empty"><b>No active dataset</b>' +
      '<p>Turn a dataset on, or import one, before building an exam.</p>' +
      '<button class="btn primary" data-act="go" data-view="library">Open the library</button></div></div>';
  }
  var rec = itemRecord();
  var missed = 0, unseen = 0;
  enabledPacks().forEach(function (p) {
    p.items.forEach(function (i) {
      var r = rec[i.id];
      if (r && r.lastOk === false) missed++;
      if (!r) unseen++;
    });
  });

  var domRows = dm.map(function (d) {
    var n = 0;
    enabledPacks().forEach(function (p) { p.items.forEach(function (i) { if (i.domain === d.id) n++; }); });
    var on = c.domains[d.id];
    return '<label class="check' + (on ? ' on' : '') + '">' +
      '<input type="checkbox" data-act="set-domain" data-id="' + esc(d.id) + '"' + (on ? ' checked' : '') + '>' +
      '<span class="mono" style="font-size:11px">' + esc(d.id) + '</span> ' + esc(d.name) +
      '<span class="n">' + n + '</span></label>';
  }).join('');

  var diffRows = DIFFS.map(function (d) {
    var n = 0;
    enabledPacks().forEach(function (p) { p.items.forEach(function (i) { if (i.difficulty === d) n++; }); });
    return '<label class="check' + (c.diffs[d] ? ' on' : '') + '">' +
      '<input type="checkbox" data-act="set-diff" data-id="' + d + '"' + (c.diffs[d] ? ' checked' : '') + '>' +
      d.charAt(0).toUpperCase() + d.slice(1) + '<span class="n">' + n + '</span></label>';
  }).join('');

  var cfg = activeConfig();
  var presets = [10, 20, 30, cfg.examLength, avail.length].filter(function (v, i, a) {
    return v > 0 && a.indexOf(v) === i && v <= avail.length;
  }).sort(function (a, b) { return a - b; });

  return '<div class="wrap stack">' +
    '<div class="pagehead"><span class="eyebrow">New exam</span><h1>Build a sitting</h1>' +
      '<p>Exam mode holds all feedback back until you submit, the way the real thing does. Practice mode marks each question as you go.</p></div>' +
    '<div class="grid2">' +
      '<div class="stack">' +

        '<div class="card sect">' +
          '<h2>Mode</h2>' +
          '<div class="row" style="gap:14px">' +
            '<div class="seg">' +
              '<button data-act="set-mode" data-v="exam" aria-pressed="' + (c.mode === 'exam') + '">Exam</button>' +
              '<button data-act="set-mode" data-v="practice" aria-pressed="' + (c.mode === 'practice') + '">Practice</button>' +
            '</div>' +
            '<p class="muted" style="font-size:13px;flex:1 1 220px">' +
              (c.mode === 'exam'
                ? 'One shot, timed, no marking until the end. Flag anything you want to revisit.'
                : 'Check each answer as you go and read the reasoning before moving on. Untimed by default.') +
            '</p>' +
          '</div>' +
        '</div>' +

        '<div class="card sect">' +
          '<h2>Draw from</h2>' +
          '<div class="seg">' +
            '<button data-act="set-source" data-v="all" aria-pressed="' + (c.source === 'all') + '">Everything</button>' +
            '<button data-act="set-source" data-v="missed" aria-pressed="' + (c.source === 'missed') + '">My misses<span class="n mono" style="margin-left:6px;font-size:11px;color:var(--faint)">' + missed + '</span></button>' +
            '<button data-act="set-source" data-v="unseen" aria-pressed="' + (c.source === 'unseen') + '">Not yet seen<span class="n mono" style="margin-left:6px;font-size:11px;color:var(--faint)">' + unseen + '</span></button>' +
          '</div>' +
          '<hr class="rule">' +
          '<div class="field"><label>Domains</label><div class="row" style="gap:7px">' + domRows +
            '<button class="btn sm ghost" data-act="domains-all">All</button>' +
            '<button class="btn sm ghost" data-act="domains-none">None</button></div></div>' +
          '<div class="field"><label>Difficulty</label><div class="row" style="gap:7px">' + diffRows + '</div></div>' +
        '</div>' +

        '<div class="card sect">' +
          '<h2>Length and timing</h2>' +
          '<div class="row" style="gap:18px;align-items:flex-end">' +
            '<div class="field" style="width:120px"><label>Questions</label>' +
              '<input type="number" id="count" min="1" max="' + Math.max(1, avail.length) + '" value="' + Math.min(c.count, Math.max(1, avail.length)) + '" data-act="set-count"></div>' +
            '<div class="row" style="gap:6px">' + presets.map(function (n) {
              return '<button class="btn sm ghost" data-act="preset" data-v="' + n + '">' + n + '</button>';
            }).join('') + '</div>' +
          '</div>' +
          '<hr class="rule">' +
          '<div class="row" style="gap:18px;align-items:flex-end">' +
            '<label class="check' + (c.timed ? ' on' : '') + '"><input type="checkbox" data-act="set-timed"' + (c.timed ? ' checked' : '') + '>Timed</label>' +
            '<div class="field" style="width:120px"><label>Minutes</label>' +
              '<input type="number" id="minutes" min="1" max="600" value="' + c.minutes + '" data-act="set-minutes"' + (c.timed ? '' : ' disabled') + '></div>' +
          '</div>' +
          '<hr class="rule">' +
          '<div class="row" style="gap:7px">' +
            '<label class="check' + (c.weighted ? ' on' : '') + '"><input type="checkbox" data-act="set-weighted"' + (c.weighted ? ' checked' : '') + '>Blueprint-weighted draw</label>' +
            '<label class="check' + (c.shuffleOpts ? ' on' : '') + '"><input type="checkbox" data-act="set-shuffleopts"' + (c.shuffleOpts ? ' checked' : '') + '>Shuffle options</label>' +
          '</div>' +
          '<p class="muted" style="font-size:12.5px">A blueprint-weighted draw allocates questions across domains by their published exam weight rather than sampling the pool evenly.</p>' +
        '</div>' +
      '</div>' +

      '<div class="sticky" id="summary">' + setupSummary() + '</div>' +
    '</div>' +
  '</div>';
}

function setupSummary() {
  var c = setupCfg(), avail = pool(c), cfg = activeConfig();
  var n = Math.min(c.count, avail.length);
  var draw = n ? sampleItems(avail, n, c.weighted) : [];
  var byDom = {};
  draw.forEach(function (i) { byDom[i.domain || ''] = (byDom[i.domain || ''] || 0) + 1; });
  var keys = Object.keys(byDom).sort();
  var hues = ['#E3A94F', '#84AADB', '#5DBE96', '#C98BD9', '#E0706A', '#6FC7C0', '#D9A97F'];
  var mix = keys.map(function (k, i) {
    return '<i style="width:' + (byDom[k] / (draw.length || 1) * 100) + '%;background:' + hues[i % hues.length] + '" title="' + esc(k) + ': ' + byDom[k] + '"></i>';
  }).join('');
  var legend = keys.map(function (k, i) {
    return '<span style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)">' +
      '<i style="width:8px;height:8px;border-radius:2px;background:' + hues[i % hues.length] + '"></i>' +
      '<span class="mono" style="font-size:10.5px">' + esc(k || 'n/a') + '</span> ' + byDom[k] + '</span>';
  }).join('');

  var mr = draw.filter(function (i) { return i.type === 'multi'; }).length;
  var warn = '';
  if (!avail.length) warn = 'No questions match these filters.';
  else if (c.count > avail.length) warn = 'Only ' + avail.length + ' questions match, so that is what you will get.';

  return '<div class="card sect">' +
    '<h2>This sitting</h2>' +
    '<div class="kpis">' +
      '<div class="kpi"><b>' + n + '</b><span>Questions</span></div>' +
      '<div class="kpi"><b>' + (c.timed ? c.minutes + 'm' : '&#8734;') + '</b><span>Time</span></div>' +
      '<div class="kpi"><b>' + cfg.passPercent + '%</b><span>Pass mark</span></div>' +
    '</div>' +
    (keys.length ? '<div class="field"><label>Domain mix</label><div class="mixline">' + mix + '</div>' +
      '<div class="row" style="gap:11px;margin-top:8px">' + legend + '</div></div>' : '') +
    '<p class="muted" style="font-size:12.5px">' +
      (mr ? plural(mr, 'question') + ' of ' + n + ' ' + (mr === 1 ? 'is' : 'are') + ' multiple-response - pick every correct option. ' : '') +
      'Drawn from ' + plural(enabledPacks().length, 'dataset') + ', pool of ' + avail.length + '.' +
    '</p>' +
    (warn ? '<p class="note">' + esc(warn) + '</p>' : '') +
    '<button class="btn primary lg" data-act="start" ' + (n ? '' : 'disabled') + '>Start ' + (c.mode === 'exam' ? 'exam' : 'practice') + '</button>' +
  '</div>';
}

function refreshSummary() {
  var el = $('#summary');
  if (el) el.innerHTML = setupSummary();
  APP.prefs.setup = APP.setup;
  savePrefs();
}
function afterSetup() { }

/* ===================== start an exam ===================== */
function startExam() {
  var c = setupCfg(), avail = pool(c);
  var n = Math.min(c.count, avail.length);
  if (!n) { toast('No questions match these filters.', 'bad'); return; }
  var chosen = sampleItems(avail, n, c.weighted);
  var items = shuffle(chosen).map(function (it) { return materialise(it, c.shuffleOpts); });
  var cfg = activeConfig();

  APP.session = {
    id: uid(), startedAt: Date.now(), elapsed: 0,
    mode: c.mode,
    timed: c.mode === 'exam' ? c.timed : false,
    limitMs: c.minutes * 60000,
    packIds: enabledPacks().map(function (p) { return p.id; }),
    scoring: { passPercent: cfg.passPercent, scaleMin: cfg.scaleMin, scaleMax: cfg.scaleMax, scalePass: cfg.scalePass },
    items: items, answers: {}, flags: {}, checked: {}, times: {},
    cur: 0, finishedAt: null
  };
  APP.result = null;
  saveSession();
  go('exam');
}

<script>
"use strict";

/* ===================== the clock ===================== */
var TICK = null, LAST = 0, SAVE_AT = 0;
function startTimer() {
  stopTimer(); LAST = Date.now();
  TICK = setInterval(tick, 500);
}
function stopTimer() { if (TICK) clearInterval(TICK); TICK = null; }
function tick() {
  var s = APP.session;
  if (!s || s.finishedAt || APP.view !== 'exam') { stopTimer(); return; }
  var now = Date.now(), d = now - LAST; LAST = now;
  s.elapsed += d;
  s.times[s.cur] = (s.times[s.cur] || 0) + d;
  paintClock();
  if (now - SAVE_AT > 8000) { SAVE_AT = now; saveSession(); }
  if (s.timed && s.elapsed >= s.limitMs) { toast('Time is up. The paper was submitted automatically.', 'bad'); finishExam(); }
}
function paintClock() {
  var s = APP.session, el = $('#clock'); if (!s || !el) return;
  var left = s.limitMs - s.elapsed;
  el.className = 'clock' + (s.timed ? (left < 60000 ? ' crit' : left < 300000 ? ' warn' : '') : '');
  $('#clockval').textContent = s.timed ? fmtClock(left) : fmtClock(s.elapsed);
  var done = Object.keys(s.answers).length;
  var m = $('#progfill'); if (m) m.style.width = (done / s.items.length * 100) + '%';
  var pl = $('#proglab'); if (pl) pl.textContent = done + ' of ' + s.items.length + ' answered';
}

/* ===================== view: exam ===================== */
function viewExam() {
  var s = APP.session;
  if (!s) return '<div class="wrap"><div class="card empty"><b>Nothing in progress</b><button class="btn primary" data-act="go" data-view="setup">Build an exam</button></div></div>';
  var it = s.items[s.cur], practice = s.mode === 'practice', revealed = practice && s.checked[s.cur];
  var chosen = s.answers[s.cur] || [];
  var done = Object.keys(s.answers).length;

  var sheet = s.items.map(function (q, i) {
    var st = '';
    if (s.answers[i] && s.answers[i].length) st = 'answered';
    if (practice && s.checked[i]) st = sameSet(s.answers[i] || [], q.correct) ? 'correct' : 'wrong';
    return '<button data-act="jump" data-i="' + i + '" data-s="' + st + '" data-f="' + (s.flags[i] ? 1 : 0) +
      '" aria-current="' + (i === s.cur) + '" title="Question ' + (i + 1) + '">' + (i + 1) + '</button>';
  }).join('');

  var opts = it.options.map(function (o) {
    var sel = chosen.indexOf(o.key) >= 0;
    var v = '';
    if (revealed) v = it.correct.indexOf(o.key) >= 0 ? 'key' : (sel ? 'miss' : '');
    var why = (revealed && v !== 'key' && it.rationales && it.rationales[o.key])
      ? '<div class="why">' + esc(it.rationales[o.key]) + '</div>' : '';
    return '<button class="opt" data-act="pick" data-k="' + esc(o.key) + '" data-sel="' + (sel ? 1 : 0) + '"' +
      (v ? ' data-v="' + v + '"' : '') + (revealed ? ' disabled' : '') + '>' +
      '<span class="k">' + esc(o.key) + '</span>' +
      '<span class="t">' + esc(o.text) + why + '</span></button>';
  }).join('');

  var fb = revealed ? feedbackBlock(it, chosen) : '';

  return '<div class="wrap"><div class="runner">' +
    '<aside class="rail">' +
      '<div class="clock" id="clock">' +
        '<span class="eyebrow">' + (s.timed ? 'Time remaining' : 'Elapsed') + '</span>' +
        '<b id="clockval">' + (s.timed ? fmtClock(s.limitMs - s.elapsed) : fmtClock(s.elapsed)) + '</b>' +
        '<div class="meter"><i id="progfill" style="width:' + (done / s.items.length * 100) + '%"></i></div>' +
        '<span class="eyebrow" id="proglab" style="margin-top:6px">' + done + ' of ' + s.items.length + ' answered</span>' +
      '</div>' +
      '<div class="sheet">' + sheet + '</div>' +
      '<div class="legend">' +
        '<span><i style="background:var(--raised);border-color:var(--line-2)"></i>Answered</span>' +
        '<span><i style="background:var(--flag)"></i>Flagged for review</span>' +
        (practice ? '<span><i style="background:var(--jade-wash);border-color:var(--jade-line)"></i>Marked correct</span>' : '') +
      '</div>' +
      '<button class="btn' + (done === s.items.length ? ' primary' : '') + '" data-act="finish">Submit paper</button>' +
      '<button class="btn ghost sm" data-act="abandon">Abandon</button>' +
    '</aside>' +

    '<section class="qcard">' +
      '<div class="qhead">' +
        '<span class="idx">Q' + (s.cur + 1) + ' / ' + s.items.length + '</span>' +
        (it.domain ? '<span class="chip">' + esc(it.domain) + ' &middot; ' + esc(domainName(it.domain)) + '</span>' : '') +
        '<span class="diff" title="' + esc(it.difficulty) + '">' +
          [1, 2, 3].map(function (n) {
            var lvl = it.difficulty === 'easy' ? 1 : it.difficulty === 'medium' ? 2 : 3;
            return '<i class="' + (n <= lvl ? 'on' : '') + '"></i>';
          }).join('') + esc(it.difficulty) + '</span>' +
        '<span class="spacer"></span>' +
        '<button class="btn sm ' + (s.flags[s.cur] ? '' : 'ghost') + '" data-act="flag" ' +
          'style="' + (s.flags[s.cur] ? 'color:var(--flag);border-color:var(--flag-line);background:var(--flag-wash)' : '') + '">' +
          (s.flags[s.cur] ? 'Flagged' : 'Flag') + '</button>' +
      '</div>' +
      '<div class="qbody">' +
        '<p class="stem">' + esc(it.stem) + '</p>' +
        (it.type === 'multi' ? '<p class="instr">Choose all that apply' +
          (it.correct.length ? ' &middot; ' + it.correct.length + ' correct' : '') + '</p>' : '') +
        '<div class="opts">' + opts + '</div>' +
        fb +
      '</div>' +
      '<div class="qfoot">' +
        '<button class="btn ghost" data-act="prev"' + (s.cur === 0 ? ' disabled' : '') + '>Back</button>' +
        (practice && !revealed
          ? '<button class="btn primary" data-act="check"' + (chosen.length ? '' : ' disabled') + '>Check answer</button>' : '') +
        '<button class="btn' + (practice && revealed ? ' primary' : '') + '" data-act="next"' +
          (s.cur === s.items.length - 1 ? ' disabled' : '') + '>Next</button>' +
        '<span class="spacer"></span>' +
        '<span class="dim mono" style="font-size:10.5px">' + esc(it.id) + '</span>' +
        '<span class="dim nowrap" style="font-size:11.5px"><kbd>A</kbd>&ndash;<kbd>' +
          esc(it.options[it.options.length - 1].key) + '</kbd> pick &nbsp; <kbd>&#8594;</kbd> next &nbsp; <kbd>F</kbd> flag</span>' +
      '</div>' +
    '</section>' +
  '</div></div>';
}

function feedbackBlock(it, chosen) {
  var ok = sameSet(chosen, it.correct);
  var srcs = (it.sources || []).filter(function (s) { return s.title || s.url; }).map(function (s) {
    var label = esc(s.title || s.url);
    var d = s.date ? '<span class="d">' + esc(s.date) + (s.basis === 'verified-live' ? ' &middot; verified live' : '') + '</span>' : '';
    return s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + d + '<span>' + label + '</span></a>'
      : '<span style="font-size:12.5px;color:var(--ink-2);display:flex;gap:8px">' + d + label + '</span>';
  }).join('');

  return '<div class="fb ' + (ok ? 'ok' : 'no') + '">' +
    '<div class="verdict">' + (ok ? 'Correct' : 'Not the key') +
      '<span class="chip ' + (ok ? 'jade' : 'clay') + '">Answer ' + esc(it.correct.join(' + ')) + '</span>' +
      (chosen.length && !ok ? '<span class="chip">You chose ' + esc(chosen.join(' + ')) + '</span>' : '') +
      (!chosen.length ? '<span class="chip">Left blank</span>' : '') +
    '</div>' +
    (it.explanation ? '<p class="body">' + esc(it.explanation) + '</p>' : '') +
    (it.notes && it.notes.caveat ? '<p class="note">Caveat on this item: ' + esc(it.notes.caveat) + '</p>' : '') +
    (it.objective ? '<p class="eyebrow">Objective &middot; ' + esc(it.objective) + '</p>' : '') +
    (srcs ? '<div class="srcs">' + srcs + '</div>' : '') +
  '</div>';
}

function afterExam() {
  var s = APP.session;
  if (!s || s.finishedAt) return;
  startTimer();
  var cell = $('.sheet button[aria-current="true"]');
  if (cell && cell.scrollIntoView) cell.scrollIntoView({ block: 'nearest' });
}
function repaintExam() {
  var y = window.scrollY;
  $('#main').innerHTML = viewExam();
  renderNav(); afterExam();
  window.scrollTo(0, y);
}

/* ===================== exam interactions ===================== */
function pickOption(key) {
  var s = APP.session; if (!s) return;
  var it = s.items[s.cur];
  if (s.mode === 'practice' && s.checked[s.cur]) return;
  var cur = (s.answers[s.cur] || []).slice();
  if (it.type === 'multi') {
    var at = cur.indexOf(key);
    if (at >= 0) cur.splice(at, 1); else cur.push(key);
  } else {
    cur = cur.length === 1 && cur[0] === key ? [] : [key];
  }
  cur.sort();
  if (cur.length) s.answers[s.cur] = cur; else delete s.answers[s.cur];
  saveSession();
  repaintExam();
}
function gotoQ(i) {
  var s = APP.session; if (!s) return;
  s.cur = clamp(i, 0, s.items.length - 1);
  saveSession(); repaintExam();
}
function checkAnswer() {
  var s = APP.session; if (!s || s.mode !== 'practice') return;
  if (!(s.answers[s.cur] || []).length) return;
  s.checked[s.cur] = true;
  saveSession(); repaintExam();
}
function toggleFlag() {
  var s = APP.session; if (!s) return;
  if (s.flags[s.cur]) delete s.flags[s.cur]; else s.flags[s.cur] = true;
  saveSession(); repaintExam();
}
function confirmFinish() {
  var s = APP.session; if (!s) return;
  var blank = s.items.length - Object.keys(s.answers).length;
  var flagged = Object.keys(s.flags).length;
  if (!blank && !flagged) { finishExam(); return; }
  modal('<h2 style="font-size:17px">Submit the paper?</h2>' +
    '<p class="muted" style="font-size:13.5px;line-height:1.6">' +
      (blank ? '<b style="color:var(--clay)">' + plural(blank, 'question') + ' unanswered</b>' + (flagged ? ' and ' : '. ') : '') +
      (flagged ? plural(flagged, 'question') + ' still flagged for review.' : '') +
      ' Unanswered questions score zero.</p>' +
    '<div class="row" style="justify-content:flex-end">' +
      '<button class="btn ghost" data-act="close-modal">Keep working</button>' +
      '<button class="btn primary" data-act="finish-go">Submit</button>' +
    '</div>');
}
function abandonExam() {
  modal('<h2 style="font-size:17px">Abandon this sitting?</h2>' +
    '<p class="muted" style="font-size:13.5px">Nothing is scored and nothing is kept.</p>' +
    '<div class="row" style="justify-content:flex-end">' +
      '<button class="btn ghost" data-act="close-modal">Cancel</button>' +
      '<button class="btn danger" data-act="abandon-go">Abandon</button>' +
    '</div>');
}

/* ===================== grading ===================== */
function scaledScore(p, sc) {
  var lo = sc.scaleMin, hi = sc.scaleMax, cut = sc.scalePass, pp = sc.passPercent;
  if (!(hi > lo) || !(cut > lo) || !(cut < hi) || !(pp > 0) || !(pp < 100)) return Math.round(p);
  return p <= pp ? Math.round(lo + (cut - lo) * (p / pp))
                 : Math.round(cut + (hi - cut) * ((p - pp) / (100 - pp)));
}
function toOrig(item, keys) {
  return keys.map(function (k) { return (item._orig && item._orig[k]) || k; }).sort();
}
function finishExam() {
  var s = APP.session; if (!s || s.finishedAt) return;
  stopTimer();
  s.finishedAt = Date.now();
  closeModal();

  var view = s.items.map(function (it, idx) {
    var chosen = (s.answers[idx] || []).slice().sort();
    return { item: it, chosen: chosen, ok: chosen.length > 0 && sameSet(chosen, it.correct),
             ms: s.times[idx] || 0, fl: !!s.flags[idx], idx: idx };
  });
  var correct = view.filter(function (v) { return v.ok; }).length;
  var p = pct(correct, view.length);
  var record = {
    id: s.id, ts: s.finishedAt, mode: s.mode, packIds: s.packIds,
    total: view.length, correct: correct, pct: p,
    scoring: s.scoring, scaled: scaledScore(p, s.scoring),
    durationMs: s.elapsed, timed: s.timed, limitMs: s.limitMs,
    results: view.map(function (v) {
      return { i: v.item.id, d: v.item.domain, f: v.item.difficulty, ok: v.ok,
               c: toOrig(v.item, v.chosen), k: toOrig(v.item, v.item.correct),
               ms: v.ms, fl: v.fl };
    })
  };
  APP.history.push(record); saveHistory();
  APP.result = { record: record, view: view };
  APP.session = null; STORE.del(K.sess);
  APP.reviewFilter = 'wrong';
  go('results');
}
</script>
<script>
"use strict";

/* ===================== analysis helpers ===================== */
function analysisEntries(rec, view) {
  if (view) {
    return view.map(function (v) {
      return { item: v.item, chosen: v.chosen, key: v.item.correct, ok: v.ok, ms: v.ms, fl: v.fl,
               id: v.item.id, domain: v.item.domain, difficulty: v.item.difficulty,
               objective: v.item.objective, tags: v.item.tags || [] };
    });
  }
  return (rec.results || []).map(function (r) {
    var it = findItem(r.i);
    return { item: it, chosen: r.c || [], key: r.k || [], ok: !!r.ok, ms: r.ms || 0, fl: !!r.fl,
             id: r.i, domain: r.d, difficulty: r.f,
             objective: it ? it.objective : '', tags: it ? (it.tags || []) : [] };
  });
}
function groupBy(entries, keyFn) {
  var map = {}, order = [];
  entries.forEach(function (e) {
    var ks = keyFn(e);
    if (!Array.isArray(ks)) ks = [ks];
    ks.forEach(function (k) {
      if (k === undefined || k === null || k === '') return;
      if (!map[k]) { map[k] = { k: k, n: 0, ok: 0, ms: 0 }; order.push(map[k]); }
      map[k].n++; map[k].ms += e.ms; if (e.ok) map[k].ok++;
    });
  });
  order.forEach(function (g) { g.pct = pct(g.ok, g.n); });
  return order;
}
function bandColour(p, passMark) {
  if (p >= passMark) return 'var(--jade)';
  if (p >= passMark - 15) return 'var(--brass)';
  return 'var(--clay)';
}
function barRow(label, sub, g, passMark) {
  return '<div class="bar">' +
    '<div class="lab">' +
      '<div class="t">' + (sub ? '<span class="chip">' + esc(sub) + '</span>' : '') + '<em>' + esc(label) + '</em>' +
        '<span class="dim mono nowrap" style="font-size:11px;margin-left:auto">' + g.ok + '/' + g.n + '</span></div>' +
      '<div class="track"><i data-w="' + g.pct + '" style="width:0;background:' + bandColour(g.pct, passMark) + '"></i>' +
        '<span class="cut" style="left:' + passMark + '%"></span></div>' +
    '</div>' +
    '<div class="val">' + g.pct + '%</div>' +
  '</div>';
}

/* the score dial: a 100-1000 style scale with the cut score notched in */
function dialSvg(value, sc, ok) {
  var lo = sc.scaleMin, hi = sc.scaleMax, cut = sc.scalePass;
  if (!(hi > lo)) { lo = 0; hi = 100; cut = sc.passPercent; }
  var cx = 154, cy = 162, r = 122, L = Math.PI * r;
  var t = clamp((value - lo) / (hi - lo), 0, 1);
  var tc = clamp((cut - lo) / (hi - lo), 0, 1);
  function polar(rad, u) { var a = Math.PI - u * Math.PI; return [cx + rad * Math.cos(a), cy - rad * Math.sin(a)]; }
  var n1 = polar(r - 12, tc), n2 = polar(r + 12, tc);
  var ticks = [0, .25, .5, .75, 1].map(function (u) {
    var a = polar(r - 11, u), b = polar(r + 1, u);
    return '<line class="tick" x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '"></line>';
  }).join('');
  return '<svg class="dial" viewBox="0 0 308 196" role="img" aria-label="Score ' + value + ' out of ' + hi + '">' +
    '<path class="track" d="M ' + (cx - r) + ' ' + cy + ' A ' + r + ' ' + r + ' 0 0 1 ' + (cx + r) + ' ' + cy + '"></path>' +
    ticks +
    '<path id="dialfill" class="fill" stroke="' + (ok ? 'var(--jade)' : 'var(--brass)') + '" ' +
      'stroke-dasharray="' + L.toFixed(1) + '" stroke-dashoffset="' + L.toFixed(1) + '" ' +
      'data-off="' + (L * (1 - t)).toFixed(1) + '" ' +
      'd="M ' + (cx - r) + ' ' + cy + ' A ' + r + ' ' + r + ' 0 0 1 ' + (cx + r) + ' ' + cy + '"></path>' +
    '<line class="notch" x1="' + n1[0].toFixed(1) + '" y1="' + n1[1].toFixed(1) + '" x2="' + n2[0].toFixed(1) + '" y2="' + n2[1].toFixed(1) + '"></line>' +
    '<text x="' + (cx - r) + '" y="182" text-anchor="middle">' + lo + '</text>' +
    '<text x="' + (cx + r) + '" y="182" text-anchor="middle">' + hi + '</text>' +
    '<text x="' + n2[0].toFixed(1) + '" y="' + (n2[1] - 7).toFixed(1) + '" text-anchor="middle" fill="var(--ink-2)">PASS ' + cut + '</text>' +
  '</svg>';
}

/* ===================== view: results ===================== */
function viewResults() {
  var R = APP.result;
  if (!R) return '<div class="wrap"><div class="card empty"><b>No result open</b><button class="btn primary" data-act="go" data-view="history">Open history</button></div></div>';
  var rec = R.record, sc = rec.scoring, E = analysisEntries(rec, R.view);
  var passMark = sc.passPercent, ok = rec.pct >= passMark;
  var scaledish = sc.scaleMax > 100;
  var blank = E.filter(function (e) { return !e.chosen.length; }).length;
  var flagged = E.filter(function (e) { return e.fl; }).length;
  var avg = E.length ? rec.durationMs / E.length : 0;

  var byDom = groupBy(E, function (e) { return e.domain || 'Unclassified'; })
    .sort(function (a, b) { return a.k < b.k ? -1 : 1; });
  var byDiff = ['easy', 'medium', 'hard'].map(function (d) {
    return groupBy(E, function (e) { return e.difficulty; }).filter(function (g) { return g.k === d; })[0];
  }).filter(Boolean);
  var byObj = groupBy(E, function (e) { return e.objective; })
    .sort(function (a, b) { return a.pct - b.pct || b.n - a.n; });
  var byTag = groupBy(E, function (e) { return e.tags; })
    .filter(function (g) { return g.n >= 2; })
    .sort(function (a, b) { return a.pct - b.pct || b.n - a.n; }).slice(0, 12);
  var slowest = E.slice().sort(function (a, b) { return b.ms - a.ms; }).slice(0, 5);

  var weak = byDom.filter(function (g) { return g.pct < passMark; }).sort(function (a, b) { return a.pct - b.pct; });
  var verdictLine = ok
    ? (weak.length ? 'Above the line, but ' + weak.map(function (g) { return g.k; }).join(' and ') + ' came in under it.'
                   : 'Every domain cleared the pass mark.')
    : (weak.length ? 'Short of the mark. The gap is in ' + weak.slice(0, 3).map(function (g) { return g.k + ' (' + g.pct + '%)'; }).join(', ') + '.'
                   : 'Short of the mark, with the shortfall spread evenly across domains.');

  return '<div class="wrap stack">' +
    '<div class="pagehead"><span class="eyebrow">' + esc(fmtDate(rec.ts)) + ' &middot; ' + esc(rec.mode) + ' &middot; ' + plural(rec.total, 'question') + '</span>' +
      '<h1>Result</h1></div>' +

    '<div class="card"><div class="scorewrap">' +
      dialSvg(scaledish ? rec.scaled : rec.pct, sc, ok) +
      '<div class="verdictbox">' +
        '<span class="stamp ' + (ok ? 'pass' : 'fail') + '">' + (ok ? 'Pass' : 'Below pass') + '</span>' +
        '<div class="big" style="color:' + (ok ? 'var(--jade)' : 'var(--brass)') + '">' +
          (scaledish ? rec.scaled : rec.pct + '%') + '</div>' +
        '<p class="muted" style="font-size:14px;max-width:52ch">' +
          esc(rec.correct + ' of ' + rec.total + ' correct (' + rec.pct + '%). ') +
          (scaledish ? 'Scaled against a ' + sc.scalePass + ' cut score anchored at ' + passMark + '%. ' : '') +
          esc(verdictLine) + '</p>' +
        '<div class="row" style="gap:8px">' +
          '<button class="btn primary" data-act="practise-misses">Practise these misses</button>' +
          '<button class="btn ghost" data-act="result-copy">Copy result</button>' +
        '</div>' +
      '</div>' +
    '</div></div>' +

    '<div class="kpis">' +
      '<div class="kpi"><b>' + rec.correct + '<span style="color:var(--faint)">/' + rec.total + '</span></b><span>Correct</span></div>' +
      '<div class="kpi"><b>' + fmtDur(rec.durationMs) + '</b><span>Time used</span></div>' +
      '<div class="kpi"><b>' + fmtDur(avg) + '</b><span>Per question</span></div>' +
      '<div class="kpi"><b' + (blank ? ' style="color:var(--clay)"' : '') + '>' + blank + '</b><span>Left blank</span></div>' +
      '<div class="kpi"><b' + (flagged ? ' style="color:var(--flag)"' : '') + '>' + flagged + '</b><span>Flagged</span></div>' +
    '</div>' +

    '<div class="card sect">' +
      '<h2>By domain</h2>' +
      '<div class="bars">' + byDom.map(function (g) {
        return barRow(domainName(g.k), g.k, g, passMark);
      }).join('') + '</div>' +
      '<p class="dim" style="font-size:12px">The hairline on each track marks the ' + passMark + '% pass threshold.</p>' +
    '</div>' +

    '<div class="grid2">' +
      '<div class="card sect"><h2>By difficulty</h2><div class="bars">' +
        byDiff.map(function (g) { return barRow(g.k.charAt(0).toUpperCase() + g.k.slice(1), '', g, passMark); }).join('') +
      '</div></div>' +
      '<div class="card sect"><h2>Pacing</h2>' +
        '<div class="scroll"><table class="tbl"><tbody>' + slowest.map(function (e) {
          return '<tr><td><span class="chip ' + (e.ok ? 'jade' : 'clay') + '">' + (e.ok ? 'OK' : 'X') + '</span></td>' +
            '<td class="read" style="font-size:12.5px;max-width:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
            esc(e.item ? e.item.stem : e.id) + '</td>' +
            '<td class="num">' + fmtDur(e.ms) + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<p class="dim" style="font-size:12px">Longest five. Time on a question you still got wrong is the signal worth chasing.</p>' +
      '</div>' +
    '</div>' +

    (byObj.length > 1 ? '<div class="card flush sect" style="gap:0">' +
      '<div style="padding:18px 20px 12px"><h2 style="font-size:15px">By objective</h2>' +
      '<p class="dim" style="font-size:12px;margin-top:6px">Weakest first. Objectives you saw only once say little on their own.</p></div>' +
      '<div class="scroll"><table class="tbl"><thead><tr><th>Objective</th><th>Domain</th>' +
      '<th style="text-align:right">Seen</th><th style="text-align:right">Correct</th><th style="text-align:right">Score</th></tr></thead><tbody>' +
      byObj.map(function (g) {
        var dom = E.filter(function (e) { return e.objective === g.k; })[0];
        return '<tr><td style="max-width:520px">' + esc(g.k) + '</td>' +
          '<td class="mono dim">' + esc(dom ? dom.domain : '') + '</td>' +
          '<td class="num">' + g.n + '</td><td class="num">' + g.ok + '</td>' +
          '<td class="num" style="color:' + bandColour(g.pct, passMark) + '">' + g.pct + '%</td></tr>';
      }).join('') + '</tbody></table></div></div>' : '') +

    (byTag.length ? '<div class="card sect"><h2>Topics to revisit</h2>' +
      '<div class="row" style="gap:7px">' + byTag.map(function (g) {
        return '<span class="chip" style="border-color:' + bandColour(g.pct, passMark) + ';color:' + bandColour(g.pct, passMark) + '">' +
          esc(g.k) + ' ' + g.ok + '/' + g.n + '</span>';
      }).join('') + '</div>' +
      '<p class="dim" style="font-size:12px">Tags carried on the questions themselves, restricted to those you met at least twice.</p></div>' : '') +

    reviewSection(E) +
  '</div>';
}

function reviewSection(E) {
  var f = APP.reviewFilter || 'wrong';
  var list = E.filter(function (e) {
    return f === 'all' ? true : f === 'wrong' ? !e.ok : f === 'flagged' ? e.fl : true;
  });
  var counts = { all: E.length, wrong: E.filter(function (e) { return !e.ok; }).length, flagged: E.filter(function (e) { return e.fl; }).length };

  var body = list.length ? list.map(function (e, n) {
    var it = e.item;
    if (!it) return '<div class="revitem"><div style="padding:14px 16px" class="muted">' +
      esc(e.id) + ' - the dataset holding this question is no longer loaded.</div></div>';
    var opts = it.options.map(function (o) {
      var isKey = e.key.indexOf(o.key) >= 0, isMine = e.chosen.indexOf(o.key) >= 0;
      var v = isKey ? 'key' : (isMine ? 'miss' : '');
      var why = (!isKey && it.rationales && it.rationales[o.key]) ? '<div class="why">' + esc(it.rationales[o.key]) + '</div>' : '';
      return '<div class="opt" data-v="' + v + '"' + (isMine ? ' data-sel="0"' : '') + ' style="cursor:default">' +
        '<span class="k">' + esc(o.key) + '</span><span class="t">' + esc(o.text) +
        (isMine ? ' <span class="chip" style="margin-left:6px">your answer</span>' : '') + why + '</span></div>';
    }).join('');
    return '<details class="revitem"' + (list.length <= 3 ? ' open' : '') + '>' +
      '<summary>' +
        '<span class="chip ' + (e.ok ? 'jade' : 'clay') + '">' + (e.ok ? 'Correct' : (e.chosen.length ? 'Wrong' : 'Blank')) + '</span>' +
        (e.fl ? '<span class="chip flagc">Flagged</span>' : '') +
        '<span class="chip">' + esc(e.domain || '-') + '</span>' +
        '<span class="stemline">' + esc(it.stem) + '</span>' +
        '<span class="dim mono" style="font-size:10.5px">' + esc(it.id) + ' &middot; ' + fmtDur(e.ms) + '</span>' +
      '</summary>' +
      '<div class="qbody">' +
        '<p class="stem" style="font-size:15px">' + esc(it.stem) + '</p>' +
        '<div class="opts">' + opts + '</div>' +
        feedbackBlock({ correct: e.key, explanation: it.explanation, notes: it.notes,
                        objective: it.objective, sources: it.sources }, e.chosen) +
      '</div>' +
    '</details>';
  }).join('') : '<div class="card empty"><b>Nothing here</b><p>No questions match this filter.</p></div>';

  return '<div class="sect">' +
    '<h2>Question review</h2>' +
    '<div class="row between">' +
      '<div class="seg">' +
        '<button data-act="rev-filter" data-v="wrong" aria-pressed="' + (f === 'wrong') + '">Missed (' + counts.wrong + ')</button>' +
        '<button data-act="rev-filter" data-v="flagged" aria-pressed="' + (f === 'flagged') + '">Flagged (' + counts.flagged + ')</button>' +
        '<button data-act="rev-filter" data-v="all" aria-pressed="' + (f === 'all') + '">All (' + counts.all + ')</button>' +
      '</div>' +
      '<button class="btn sm ghost" data-act="rev-expand">Expand all</button>' +
    '</div>' +
    '<div class="stack" style="gap:10px" id="revlist">' + body + '</div>' +
  '</div>';
}

function afterResults() {
  requestAnimationFrame(function () {
    var f = $('#dialfill');
    if (f) f.setAttribute('stroke-dashoffset', f.getAttribute('data-off'));
    $$('.bar .track i').forEach(function (i) { i.style.width = i.getAttribute('data-w') + '%'; });
  });
}

/* ===================== view: history ===================== */
function viewHistory() {
  var H = APP.history.slice().reverse();
  if (!H.length) {
    return '<div class="wrap narrow stack">' +
      '<div class="pagehead"><span class="eyebrow">History</span><h1>Nothing sat yet</h1>' +
      '<p>Every submitted paper is kept here, with a running record of which questions you have met and which you keep getting wrong.</p></div>' +
      '<div class="card empty"><b>No attempts</b><button class="btn primary" data-act="go" data-view="setup">Build your first exam</button></div></div>';
  }

  var rec = itemRecord();
  var totalPool = enabledPacks().reduce(function (a, p) { return a + p.items.length; }, 0);
  var seen = Object.keys(rec).length;
  var shaky = Object.keys(rec).filter(function (k) { return rec[k].lastOk === false; }).length;
  var best = H.reduce(function (a, r) { return Math.max(a, r.pct); }, 0);

  /* cumulative mastery per domain across every attempt */
  var dom = {};
  APP.history.forEach(function (a) {
    (a.results || []).forEach(function (r) {
      var d = r.d || 'Unclassified';
      var e = dom[d] || (dom[d] = { k: d, n: 0, ok: 0 });
      e.n++; if (r.ok) e.ok++;
    });
  });
  var domList = Object.keys(dom).sort().map(function (k) { dom[k].pct = pct(dom[k].ok, dom[k].n); return dom[k]; });
  var passMark = activeConfig().passPercent;

  var rows = H.map(function (r) {
    var ok = r.pct >= (r.scoring ? r.scoring.passPercent : passMark);
    return '<tr data-act="open-attempt" data-id="' + esc(r.id) + '" style="cursor:pointer">' +
      '<td class="nowrap">' + esc(fmtDate(r.ts)) + '</td>' +
      '<td><span class="chip">' + esc(r.mode) + '</span></td>' +
      '<td class="num">' + r.total + '</td>' +
      '<td class="num">' + r.correct + '</td>' +
      '<td class="num" style="color:' + bandColour(r.pct, r.scoring ? r.scoring.passPercent : passMark) + '">' + r.pct + '%</td>' +
      '<td class="num">' + (r.scoring && r.scoring.scaleMax > 100 ? r.scaled : '-') + '</td>' +
      '<td class="num dim">' + fmtDur(r.durationMs) + '</td>' +
      '<td><span class="chip ' + (ok ? 'jade' : 'clay') + '">' + (ok ? 'Pass' : 'Below') + '</span></td>' +
      '</tr>';
  }).join('');

  return '<div class="wrap stack">' +
    '<div class="row between" style="align-items:flex-end;gap:20px">' +
      '<div class="pagehead"><span class="eyebrow">History</span><h1>' + plural(APP.history.length, 'sitting') + '</h1>' +
        '<p>Scores over time, and a cumulative read on which domains hold up across attempts rather than on one good day.</p></div>' +
      '<div class="row"><button class="btn ghost" data-act="practise-shaky"' + (shaky ? '' : ' disabled') + '>Practise ' + shaky + ' shaky</button>' +
      '<button class="btn danger" data-act="clear-history">Clear</button></div>' +
    '</div>' +

    '<div class="kpis">' +
      '<div class="kpi"><b>' + best + '%</b><span>Best score</span></div>' +
      '<div class="kpi"><b>' + H[0].pct + '%</b><span>Latest</span></div>' +
      '<div class="kpi"><b>' + seen + '<span style="color:var(--faint)">/' + totalPool + '</span></b><span>Bank covered</span></div>' +
      '<div class="kpi"><b' + (shaky ? ' style="color:var(--clay)"' : '') + '>' + shaky + '</b><span>Wrong last time</span></div>' +
    '</div>' +

    (H.length > 1 ? '<div class="card sect"><h2>Score trend</h2>' + trendSvg(APP.history, passMark) +
      '<p class="dim" style="font-size:12px">Oldest to newest. The dashed line is the ' + passMark + '% pass mark.</p></div>' : '') +

    '<div class="card sect"><h2>Cumulative mastery</h2><div class="bars">' +
      domList.map(function (g) { return barRow(domainName(g.k), g.k, g, passMark); }).join('') +
    '</div><p class="dim" style="font-size:12px">Every question you have answered in this domain, across all attempts.</p></div>' +

    '<div class="card flush"><div class="scroll"><table class="tbl"><thead><tr>' +
      '<th>Sat</th><th>Mode</th><th style="text-align:right">Items</th><th style="text-align:right">Correct</th>' +
      '<th style="text-align:right">Score</th><th style="text-align:right">Scaled</th><th style="text-align:right">Time</th><th></th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
  '</div>';
}

function trendSvg(hist, passMark) {
  var W = 600, H = 136, pad = 10;
  var pts = hist.map(function (r, i) {
    var x = hist.length === 1 ? W / 2 : pad + (i / (hist.length - 1)) * (W - pad * 2);
    var y = H - pad - (clamp(r.pct, 0, 100) / 100) * (H - pad * 2);
    return [x, y];
  });
  var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  var area = line + ' L ' + pts[pts.length - 1][0].toFixed(1) + ' ' + (H - pad) + ' L ' + pts[0][0].toFixed(1) + ' ' + (H - pad) + ' Z';
  var cutY = H - pad - (passMark / 100) * (H - pad * 2);
  var grid = [0, 50, 100].map(function (v) {
    var y = H - pad - (v / 100) * (H - pad * 2);
    return '<line class="gl" x1="' + pad + '" y1="' + y.toFixed(1) + '" x2="' + (W - pad) + '" y2="' + y.toFixed(1) + '" vector-effect="non-scaling-stroke"></line>';
  }).join('');
  return '<svg class="trend" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Score trend">' +
    '<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#E3A94F" stop-opacity=".26"></stop>' +
      '<stop offset="100%" stop-color="#E3A94F" stop-opacity="0"></stop></linearGradient></defs>' +
    grid +
    '<line class="cutline" x1="' + pad + '" y1="' + cutY.toFixed(1) + '" x2="' + (W - pad) + '" y2="' + cutY.toFixed(1) + '" vector-effect="non-scaling-stroke"></line>' +
    '<path class="ar" d="' + area + '"></path>' +
    '<path class="ln" d="' + line + '" vector-effect="non-scaling-stroke"></path>' +
    pts.map(function (p, i) {
      return '<circle class="dot' + (i === pts.length - 1 ? ' last' : '') + '" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.5" vector-effect="non-scaling-stroke"></circle>';
    }).join('') +
  '</svg>';
}

function afterHistory() {
  requestAnimationFrame(function () {
    $$('.bar .track i').forEach(function (i) { i.style.width = i.getAttribute('data-w') + '%'; });
  });
}

function openAttempt(id) {
  var r = APP.history.filter(function (a) { return a.id === id; })[0];
  if (!r) return;
  APP.result = { record: r, view: null };
  APP.reviewFilter = 'wrong';
  go('results');
}
</script>
<script>
"use strict";

function repaintSetup() {
  var y = window.scrollY;
  $('#main').innerHTML = viewSetup();
  renderNav();
  window.scrollTo(0, y);
  APP.prefs.setup = APP.setup; savePrefs();
}

function startPracticeFrom(ids, label) {
  var items = [];
  ids.forEach(function (id) { var it = findItem(id); if (it) items.push(it); });
  if (!items.length) { toast('Those questions are no longer in the library.', 'bad'); return; }
  var cfg = activeConfig();
  APP.session = {
    id: uid(), startedAt: Date.now(), elapsed: 0, mode: 'practice', timed: false,
    limitMs: 0, packIds: enabledPacks().map(function (p) { return p.id; }),
    scoring: { passPercent: cfg.passPercent, scaleMin: cfg.scaleMin, scaleMax: cfg.scaleMax, scalePass: cfg.scalePass },
    items: shuffle(items).map(function (it) { return materialise(it, setupCfg().shuffleOpts); }),
    answers: {}, flags: {}, checked: {}, times: {}, cur: 0, finishedAt: null
  };
  APP.result = null; saveSession();
  toast(label + ' - ' + plural(items.length, 'question') + ' in practice mode.', 'good');
  go('exam');
}

/* ---------- clicks ---------- */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  if (el.tagName === 'INPUT') return;            /* checkboxes ride the change event */
  var act = el.getAttribute('data-act');

  if (act === 'modal-bg') { if (ev.target === el) closeModal(); return; }

  var s = APP.session, c;
  switch (act) {
    case 'go': go(el.getAttribute('data-view')); break;
    case 'close-modal': closeModal(); break;

    /* library */
    case 'pick-file': $('#file').click(); break;
    case 'paste-json': pasteJson(); break;
    case 'paste-go':
      var t = $('#paste'); if (!t || !t.value.trim()) { toast('Nothing to import.', 'bad'); break; }
      closeModal(); importText(t.value, 'pasted.json'); break;
    case 'format-help': formatHelp(); break;
    case 'pack-detail': packDetail(el.getAttribute('data-id')); break;
    case 'pack-copy':
      var p = packById(el.getAttribute('data-id'));
      if (p) { var cp = Object.assign({}, p); delete cp._src; delete cp._skipped; copyText(JSON.stringify(cp, null, 2), 'Dataset copied'); }
      break;
    case 'pack-remove':
      var rid = el.getAttribute('data-id'), rp = packById(rid);
      modal('<h2 style="font-size:17px">Remove ' + esc(rp ? rp.name : 'dataset') + '?</h2>' +
        '<p class="muted" style="font-size:13.5px">The questions leave the pool. Past results stay, but their review will show gaps.</p>' +
        '<div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="close-modal">Cancel</button>' +
        '<button class="btn danger" data-act="pack-remove-go" data-id="' + esc(rid) + '">Remove</button></div>');
      break;
    case 'pack-remove-go':
      APP.packs = APP.packs.filter(function (x) { return x.id !== el.getAttribute('data-id'); });
      saveImported(); APP.setup = null; closeModal(); render(); toast('Dataset removed.'); break;

    /* setup */
    case 'set-mode':
      c = setupCfg(); c.mode = el.getAttribute('data-v');
      if (c.mode === 'practice') c.timed = false;
      repaintSetup(); break;
    case 'set-source': c = setupCfg(); c.source = el.getAttribute('data-v'); repaintSetup(); break;
    case 'domains-all': c = setupCfg(); allDomains().forEach(function (d) { c.domains[d.id] = true; }); repaintSetup(); break;
    case 'domains-none': c = setupCfg(); allDomains().forEach(function (d) { c.domains[d.id] = false; }); repaintSetup(); break;
    case 'preset': c = setupCfg(); c.count = parseInt(el.getAttribute('data-v'), 10); repaintSetup(); break;
    case 'start': startExam(); break;

    /* exam */
    case 'pick': pickOption(el.getAttribute('data-k')); break;
    case 'jump': gotoQ(parseInt(el.getAttribute('data-i'), 10)); break;
    case 'prev': if (s) gotoQ(s.cur - 1); break;
    case 'next': if (s) gotoQ(s.cur + 1); break;
    case 'check': checkAnswer(); break;
    case 'flag': toggleFlag(); break;
    case 'finish': confirmFinish(); break;
    case 'finish-go': finishExam(); break;
    case 'abandon': abandonExam(); break;
    case 'abandon-go':
      APP.session = null; STORE.del(K.sess); closeModal(); go('setup'); toast('Sitting abandoned.'); break;

    /* results and history */
    case 'rev-filter': APP.reviewFilter = el.getAttribute('data-v'); repaintResults(); break;
    case 'rev-expand':
      var items = $$('#revlist details'), openAll = items.some(function (d) { return !d.open; });
      items.forEach(function (d) { d.open = openAll; });
      el.textContent = openAll ? 'Collapse all' : 'Expand all'; break;
    case 'result-copy':
      if (APP.result) copyText(JSON.stringify(APP.result.record, null, 2), 'Result copied'); break;
    case 'practise-misses':
      if (!APP.result) break;
      startPracticeFrom(APP.result.record.results.filter(function (r) { return !r.ok; })
        .map(function (r) { return r.i; }), 'Misses from this paper');
      break;
    case 'practise-shaky':
      var rec = itemRecord();
      startPracticeFrom(Object.keys(rec).filter(function (k) { return rec[k].lastOk === false; }), 'Shaky questions');
      break;
    case 'open-attempt': openAttempt(el.getAttribute('data-id')); break;
    case 'clear-history':
      modal('<h2 style="font-size:17px">Clear all history?</h2>' +
        '<p class="muted" style="font-size:13.5px">Every past sitting and the record of which questions you have met goes with it.</p>' +
        '<div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="close-modal">Cancel</button>' +
        '<button class="btn danger" data-act="clear-history-go">Clear history</button></div>');
      break;
    case 'clear-history-go':
      APP.history = []; saveHistory(); APP.result = null; closeModal(); go('history'); toast('History cleared.'); break;
  }
});

function repaintResults() {
  var y = window.scrollY;
  $('#main').innerHTML = viewResults();
  renderNav(); afterResults();
  window.scrollTo(0, y);
}

/* ---------- checkboxes and number fields ---------- */
document.addEventListener('change', function (ev) {
  var el = ev.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act'), c = APP.setup;
  switch (act) {
    case 'toggle-pack':
      var id = el.getAttribute('data-id');
      if (el.checked) delete APP.prefs.disabled[id]; else APP.prefs.disabled[id] = true;
      savePrefs(); APP.setup = null; render(); break;
    case 'set-domain': c = setupCfg(); c.domains[el.getAttribute('data-id')] = el.checked; repaintSetup(); break;
    case 'set-diff': c = setupCfg(); c.diffs[el.getAttribute('data-id')] = el.checked; repaintSetup(); break;
    case 'set-timed': c = setupCfg(); c.timed = el.checked; repaintSetup(); break;
    case 'set-weighted': c = setupCfg(); c.weighted = el.checked; repaintSetup(); break;
    case 'set-shuffleopts': c = setupCfg(); c.shuffleOpts = el.checked; repaintSetup(); break;
  }
});
document.addEventListener('input', function (ev) {
  var el = ev.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act');
  if (act === 'set-count') { setupCfg().count = Math.max(1, parseInt(el.value, 10) || 1); refreshSummary(); }
  if (act === 'set-minutes') { setupCfg().minutes = Math.max(1, parseInt(el.value, 10) || 1); refreshSummary(); }
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function (ev) {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  var tag = (ev.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if ($('#modal-host').firstChild) { if (ev.key === 'Escape') closeModal(); return; }
  var s = APP.session;
  if (APP.view !== 'exam' || !s) return;
  var it = s.items[s.cur], k = ev.key.toUpperCase();

  if (/^[A-J]$/.test(k) && it.options.some(function (o) { return o.key === k; })) {
    ev.preventDefault(); pickOption(k); return;
  }
  if (/^[1-9]$/.test(k)) {
    var o = it.options[parseInt(k, 10) - 1];
    if (o) { ev.preventDefault(); pickOption(o.key); } return;
  }
  if (ev.key === 'ArrowRight' || k === 'N') { ev.preventDefault(); gotoQ(s.cur + 1); return; }
  if (ev.key === 'ArrowLeft' || k === 'P') { ev.preventDefault(); gotoQ(s.cur - 1); return; }
  if (k === 'F') { ev.preventDefault(); toggleFlag(); return; }
  if (ev.key === 'Enter') {
    ev.preventDefault();
    if (s.mode === 'practice' && !s.checked[s.cur] && (s.answers[s.cur] || []).length) checkAnswer();
    else if (s.cur < s.items.length - 1) gotoQ(s.cur + 1);
    else confirmFinish();
  }
});

window.addEventListener('beforeunload', function (ev) {
  if (APP.session && !APP.session.finishedAt) {
    saveSession();
    ev.preventDefault(); ev.returnValue = '';
  }
});

/* ---------- boot ---------- */
loadAll();
APP.reviewFilter = 'wrong';
APP.view = (APP.session && !APP.session.finishedAt) ? 'exam' : 'library';
render();
if (APP.session && !APP.session.finishedAt) toast('Picked up where you left off.', 'good');
</script>
