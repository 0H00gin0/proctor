hinking and gets careful reasoning built on an out-of-date version of the rule. What is the appropriate adjustment?","options":[{"key":"A","text":"Let it think for longer, so that the model reasons its way through to the current text of the rule."},{"key":"B","text":"Turn extended thinking off, since it is what introduced the outdated information into the answer."},{"key":"C","text":"Ask the model to state its confidence in the rule text and proceed if that confidence is high."},{"key":"D","text":"Combine extended thinking with a search-based mode so current information feeds the reasoning."}],"correct":["D"],"explanation":"Extended thinking is documented for complex reasoning that does not require recent information, so it must be paired with a search-based mode when freshness matters. The help centre explicitly notes that Research and extended thinking can be combined so Claude both plans its approach thoughtfully and gathers comprehensively.","rationales":{"A":"More thinking cannot supply facts the model does not have. Extended thinking is defined as the option for reasoning that does not require recent information.","B":"Disabling thinking removes the reasoning quality she needs and does not solve the freshness problem, which thinking never caused.","C":"A model's self-reported confidence is not a reliable signal that a fact is correct, and stating a confidence level retrieves nothing."},"sources":[{"title":"When should I use web search, extended thinking, and research? | Claude Help Center","url":"https://support.claude.com/en/articles/11095361-when-should-i-use-web-search-extended-thinking-and-research","date":"2026-06-02","basis":"published"}],"tags":["extended-thinking","freshness","task-type","analysis"]},{"id":"D1-028","domain":"D1","objective":"Adapt prompting strategies based on task type (analysis, research, drafting, brainstorming)","type":"single","difficulty":"medium","scenario":true,"stem":"A policy researcher is setting up a complex research task in which Claude will work through a large corpus, and she needs to be able to see afterwards how the conclusions were reached. Which approach should she take?","options":[{"key":"A","text":"Ask for a single best answer with no working shown, so as to keep the final output short and readable."},{"key":"B","text":"Define clear success criteria, ask Claude to verify across multiple sources, and have it keep research notes."},{"key":"C","text":"Ask Claude to settle on the first authoritative-looking source it finds, so as to keep the task short."},{"key":"D","text":"Supply the corpus with no instructions at all, on the basis that current models research best when left unconstrained."}],"correct":["B"],"explanation":"For optimal research results Anthropic documents three things: provide clear success criteria defining what a successful answer looks like; encourage source verification by asking Claude to verify information across multiple sources; and for complex research tasks use a structured approach. The sample prompt for complex research asks Claude to develop several competing hypotheses, track its confidence levels in progress notes to improve calibration, self-critique its approach regularly, and update a hypothesis tree or research notes file to persist information and provide transparency.","rationales":{"A":"Suppressing the working removes the transparency she needs and contradicts the documented advice to persist research notes for exactly that purpose.","C":"Settling on the first source is the direct opposite of the documented instruction to verify information across multiple sources.","D":"The documented research guidance is prescriptive rather than hands-off: success criteria, source verification, and a structured approach for complex tasks."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["research","success-criteria","source-verification","task-type"]},{"id":"D1-029","domain":"D1","objective":"Adapt prompting strategies based on task type (analysis, research, drafting, brainstorming)","type":"multi","difficulty":"medium","scenario":true,"stem":"An internal communications specialist wants Claude's drafts to match a plain, heading-free house voice. Which TWO adjustments are documented levers for shaping drafting output? (Select TWO.)","options":[{"key":"A","text":"Supply positive examples of the communication style she wants."},{"key":"B","text":"List every formatting element that the draft must never be allowed to contain."},{"key":"C","text":"Add markdown headings to her own prompt, so that Claude can see the structure she is describing."},{"key":"D","text":"Write her own prompt in the same plain style she wants back, without markdown."},{"key":"E","text":"Ask Claude to produce each draft twice and then pick whichever of the two reads more plainly."},{"key":"F","text":"Supply examples of house styles she dislikes, each one labelled as a style to avoid."}],"correct":["A","D"],"explanation":"Anthropic states that positive examples of the communication style you want tend to be more effective than instructions about what not to do, and lists matching your prompt style to the desired output style as an output-format lever, noting that removing markdown from your prompt can reduce the volume of markdown in the output. Both act directly on the style of the draft.","rationales":{"B":"Prohibition lists are the documented weaker lever. Telling Claude what to do outranks telling it what not to do.","C":"This inverts the style-matching lever. The formatting style used in your prompt influences Claude's response style, so adding markdown to the prompt increases markdown in the output.","E":"Producing two drafts and choosing between them is unguided resampling. It gives Claude no definition of what plain means and no documented lever is being applied.","F":"Negative examples are the weaker form. Anthropic's documented preference is positive examples of the style you want."},"sources":[{"title":"Prompting Claude Opus 5 - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5","date":"2026-08-19","basis":"verified-live"},{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["drafting","style-matching","positive-examples","multiple-response"]},{"id":"D2-001","domain":"D2","objective":"Apply fact-checking and validation techniques","type":"single","difficulty":"medium","scenario":true,"stem":"A quality lead asks Claude to summarise an internal standard operating procedure. Claude returns a confident summary that attributes a specific escalation threshold to \"page 12 of the SOP\". The lead intends to circulate the summary to shift supervisors this afternoon. What should the lead do FIRST?","options":[{"key":"A","text":"Forward the summary to the SOP owner for information without reading the cited page first."},{"key":"B","text":"Run the same question past Claude a second time and circulate the summary if the two answers agree with each other."},{"key":"C","text":"Open page 12 of the SOP and confirm that it states the escalation threshold the summary claims."},{"key":"D","text":"Add a caveat line noting that the summary was drafted with AI assistance before circulating it."}],"correct":["C"],"explanation":"A specific-looking citation is the classic surface of a fabricated detail, so the only step that addresses correctness is opening the cited page and reading it. Verification against the source is the documented first move, and it is the action the exam guide's own Domain 2 sample question keys.","rationales":{"A":"Passing the summary on without reading the cited page moves the unverified claim closer to the people who will act on it rather than testing it.","B":"A second Claude response is not independent evidence. Agreement between two model outputs is weaker than one look at the SOP, and disagreement would only tell her something is unstable.","D":"Disclosure is good practice but does not establish whether page 12 says what the summary claims; supervisors would still act on a possibly fabricated threshold."},"sources":[{"title":"Claude Certified Associate - Foundations Exam Guide, Version 1.0, Section 8 Sample Questions","url":"https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542847/Claude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf","date":"2026-07-08","basis":"published"},{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"}],"tags":["hallucinated-citation","verify-against-source","internal-sop"]},{"id":"D2-002","domain":"D2","objective":"Identify hallucinations, inconsistencies, and biases in responses","type":"single","difficulty":"easy","scenario":false,"stem":"Which of the following BEST describes how a hallucination typically presents in a Claude-generated business document?","options":[{"key":"A","text":"A vague, hedged answer that avoids committing to any particular fact."},{"key":"B","text":"A response containing obvious spelling and grammar errors, which a reader would notice on a first pass and correct."},{"key":"C","text":"A refusal to answer, accompanied by an explanation of the relevant usage policy and an alternative."},{"key":"D","text":"A fabricated detail that looks specific and plausible, such as an invented citation or subsection number."}],"correct":["D"],"explanation":"The failure is operational rather than stylistic: a language model can fabricate specific-looking details such as citation numbers. The danger is precisely that the fabrication is specific and plausible, which is why it survives a casual read and gets forwarded as fact.","rationales":{"A":"Hedging is the opposite surface. A vague answer is easy to spot and rarely gets forwarded as fact; the concern is confident specificity.","B":"Surface errors are a proofreading issue. Hallucinated content is usually fluent and well formed, which is what makes it dangerous.","C":"A refusal is a safety or capability behaviour, not a fabrication of content."},"sources":[{"title":"Claude Certified Associate - Foundations Exam Guide, Version 1.0, answer key for Sample 1","url":"https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542847/Claude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf","date":"2026-07-08","basis":"published"},{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"}],"tags":["hallucination-definition","specific-looking-detail"]},{"id":"D2-003","domain":"D2","objective":"Apply fact-checking and validation techniques","type":"multi","difficulty":"easy","scenario":false,"stem":"Anthropic's guidance on reducing hallucinations lists three BASIC strategies. Which THREE of the following are those strategies? Select THREE.","options":[{"key":"A","text":"Ask Claude to produce a longer answer so more supporting detail is included."},{"key":"B","text":"Have Claude re-read each claim after drafting and remove any claim it cannot support with a quote."},{"key":"C","text":"Instruct Claude to answer only in complete, formally worded sentences."},{"key":"D","text":"Give Claude explicit permission to say \"I don't know\" when it is unsure."},{"key":"E","text":"Ask Claude to attach a numeric confidence score to every factual claim it makes."},{"key":"F","text":"Ask Claude to ground its answer in direct quotes drawn from the supplied source material."}],"correct":["B","D","F"],"explanation":"The three basic strategies are documented in order: allow Claude to say \"I don't know\", use direct quotes for factual grounding, and verify with citations by having Claude find a supporting quote for each claim after it generates a response, retracting any claim it cannot support.","rationales":{"A":"Length is unrelated to grounding. A longer answer creates more surface area for unsupported claims, not less.","C":"Formality of wording is a style control, not a hallucination control. It changes how the answer reads, not whether it is true.","E":"A self-reported confidence score is not one of the documented strategies, and self-reported confidence is rejected elsewhere in the exam material as an accuracy signal."},"sources":[{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"}],"tags":["basic-strategies","allow-uncertainty","direct-quotes","verify-with-citations"]},{"id":"D2-004","domain":"D2","objective":"Apply fact-checking and validation techniques","type":"single","difficulty":"medium","scenario":true,"stem":"A knowledge manager supplies Claude with a 60-page vendor contract, well over 20,000 tokens, and asks a series of questions about the liability clauses. Which documented technique is specifically prescribed for source documents of this size to keep the answers grounded?","options":[{"key":"A","text":"Split the contract across twenty separate conversations so no single context is overloaded."},{"key":"B","text":"Have Claude extract word-for-word quotes from the contract first, then answer using only those quotes."},{"key":"C","text":"Have Claude answer from general knowledge of standard commercial contracts and consult the document only if an answer looks wrong."},{"key":"D","text":"Have Claude condense the contract into one paragraph and answer all of the questions from that condensed version."}],"correct":["B"],"explanation":"Anthropic prescribes direct-quote grounding for tasks involving long documents over roughly 20,000 tokens: ask Claude to extract word-for-word quotes first, then perform the task using only those quotes. The quotes become the checkable evidence trail for every claim.","rationales":{"A":"Fragmenting the document across conversations destroys cross-clause context and is not a documented grounding technique.","C":"This is the inverse of the documented rule: no claim about a source should be made before the source has actually been read.","D":"Summarising first discards the exact wording that liability analysis depends on and moves the answer one step further from the source, increasing rather than reducing fabrication risk."},"sources":[{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"}],"tags":["quote-extraction","20k-token-threshold","long-documents"]},{"id":"D2-005","domain":"D2","objective":"Identify hallucinations, inconsistencies, and biases in responses","type":"single","difficulty":"easy","scenario":true,"stem":"A market analyst suspects that a market-size figure in a Claude-generated briefing may be invented. The underlying source is not available to her right now. Which documented technique gives her the strongest SIGNAL that the figure may be a hallucination?","options":[{"key":"A","text":"Ask Claude directly whether it is confident that the figure is accurate."},{"key":"B","text":"Run the same prompt several more times and check whether the figure stays consistent."},{"key":"C","text":"Ask Claude to rewrite the briefing in a more cautious, hedged tone."},{"key":"D","text":"Ask Claude to add a standing disclaimer to the briefing saying that all figures should be independently checked before use."}],"correct":["B"],"explanation":"Best-of-N verification is documented as an advanced technique: run Claude through the same prompt multiple times and compare the outputs, because inconsistencies across outputs could indicate hallucinations. A grounded fact tends to reproduce; a fabricated one tends to drift.","rationales":{"A":"Self-reported confidence is rejected as an accuracy signal, so a confident answer here would be misleading rather than informative.","C":"Hedged wording changes tone only. The figure is either supported or it is not, and rewriting does not test that.","D":"A blanket disclaimer transfers risk to the reader without generating any evidence about this particular figure."},"sources":[{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"}],"tags":["best-of-n","inconsistency-signal","detection"]},{"id":"D2-006","domain":"D2","objective":"Determine when human review or additional verification is required","type":"single","difficulty":"medium","scenario":true,"stem":"A team has applied quote grounding, external knowledge restriction and chain-of-thought verification to a Claude workflow that drafts patient-facing medication guidance. The team lead argues that with three techniques stacked, the clinical validation step can now be removed. What is the correct assessment?","options":[{"key":"A","text":"Once three or more of the documented techniques are combined, the output can be treated as verified and released without further review."},{"key":"B","text":"Validation can be dropped provided every prompt and response is logged for later audit."},{"key":"C","text":"Validation is only required when Claude declines to answer or explicitly flags uncertainty."},{"key":"D","text":"These techniques reduce hallucinations but never eliminate them, so critical information must always be validated."}],"correct":["D"],"explanation":"Anthropic states in writing that while these techniques significantly reduce hallucinations, they do not eliminate them entirely, and that critical information must always be validated, especially for high-stakes decisions. Patient-facing medication guidance is a textbook high-stakes case.","rationales":{"A":"No documented count or combination of prompting techniques is described as removing the need for validation, so the stacking argument has no basis in the guidance.","B":"Logging supports after-the-fact investigation. It does nothing to prevent an incorrect instruction reaching a patient.","C":"Review is driven by the risk class of the output, not by whether the model volunteered a caveat. Relying on the model to raise its hand is the documented trap."},"sources":[{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"},{"title":"Claude Certified Associate - Foundations Exam Guide, Version 1.0, Section 3 Intended Audience","url":"https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542847/Claude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf","date":"2026-07-08","basis":"published"}],"tags":["high-stakes","residual-risk","human-validation"]},{"id":"D2-007","domain":"D2","objective":"Evaluate Claude-generated outputs for accuracy and completeness","type":"single","difficulty":"medium","scenario":true,"stem":"An operations lead asks Claude to identify the common root causes across three long incident reports. The answer names two root causes, both of which check out, but omits a third that is stated plainly in the second report. What does this MOST directly indicate, and what should she do about it?","options":[{"key":"A","text":"The answer is inaccurate, so she should discard it and treat the two named root causes as unreliable."},{"key":"B","text":"The answer is accurate but incomplete, so she should check the output against each report section by section."},{"key":"C","text":"The answer is sound, because naming two verified root causes shows the method is working."},{"key":"D","text":"The omission is a formatting problem, so she should ask for the findings as a table."}],"correct":["B"],"explanation":"Accuracy and completeness are separate properties of an output. Every statement present can be true while material content is missing, and an omission is not detected by checking the statements that are there. The remedy is a coverage check of the output against the source, not a re-read of what was returned.","rationales":{"A":"Nothing stated is wrong, so calling the output inaccurate misdiagnoses the defect and throws away two findings that survived checking.","C":"Two correct findings say nothing about how many findings were missed. Judging completeness from the accuracy of what is present is the trap.","D":"Presentation format has no bearing on whether content was omitted; the same gap would appear in a table."},"sources":[{"title":"Claude Certified Associate - Foundations Exam Guide, Version 1.0, Section 6 Domain 2 objectives","url":"https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542847/Claude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf","date":"2026-07-08","basis":"published"},{"title":"Define your success criteria - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/define-success","date":"2026-08-19","basis":"verified-live"}],"tags":["completeness","omission","coverage-check"]},{"id":"D2-008","domain":"D2","objective":"Identify hallucinations, inconsistencies, and biases in responses","type":"single","difficulty":"medium","scenario":true,"stem":"A product team asks Claude to condense several hundred pieces of customer feedback into themes for a board pack. Every theme it names checks out against the feedback, but the team wants to know whether one group of customers has been over-represented in the write-up. Which check addresses that question?","options":[{"key":"A","text":"Ask Claude to state how confident it is in each theme, and treat a high rating as evidence that the themes are representative."},{"key":"B","text":"Count the words devoted to each theme and confirm that no theme is described at greater length than any of the others."},{"key":"C","text":"Compare the share of the feedback each customer group contributed with the share of the summary their concerns occupy."},{"key":"D","text":"Ask Claude to rewrite the summary in a more neutral tone so that no group of customers appears to be favoured."}],"correct":["C"],"explanation":"Skew is a property of proportion and emphasis, not of any single statement being false, so it survives a check that only asks whether each named theme is true. The observable test is to set what went in against what came out: if a group supplied a tenth of the feedback and occupies half of the write-up, the summary is unbalanced even though nothing in it is inaccurate. Accuracy and even-handedness are separate properties and have to be checked separately.","rationales":{"A":"Self-reported confidence is not a reliable accuracy signal, and it says nothing at all about which voices the summary amplified or dropped.","B":"Equal word counts are a surface proxy. Themes genuinely differ in weight, and equalising their length can itself distort the picture the board receives.","D":"Neutral tone changes the register of the prose. The imbalance is in what was selected and how much space it was given, which a tone rewrite leaves untouched."},"sources":[{"title":"Claude Certified Associate - Foundations Exam Guide, Version 1.0, Section 6 Domain 2 objectives","url":"https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542847/Claude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf","date":"2026-07-08","basis":"published"},{"title":"Define your success criteria - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/define-success","date":"2026-08-19","basis":"verified-live"}],"tags":["bias-check","representation-skew","proportion-against-source"]},{"id":"D2-009","domain":"D2","objective":"Evaluate Claude-generated outputs for accuracy and completeness","type":"single","difficulty":"hard","scenario":false,"stem":"A set of test cases has been assembled to check the quality of a prompt before it is rolled out to a team. Which characteristic of that set is the clearest weakness?","options":[{"key":"A","text":"The cases are graded by an automated string match rather than read and scored by a person one at a time."},{"key":"B","text":"The set holds more cases than any single reviewer could realistically read through in one sitting."},{"key":"C","text":"The cases were drawn from the team's own live workload rather than from a published benchmark set."},{"key":"D","text":"The cases are all clean, typical inputs, with nothing ambiguous, irrelevant or overlong among them."}],"correct":["D"],"explanation":"Test cases are supposed to mirror the real task distribution, edge cases included, and the documented edge cases are irrelevant or nonexistent input data, overly long input, poor or harmful user input, and ambiguous cases where even people would struggle to agree. A set made only of clean typical inputs measures the easy half of the workload and passes a prompt that will fail the moment real material arrives. The other three characteristics are documented preferences, not defects.","rationales":{"A":"Automated grading is the documented preference rather than a defect: more questions with slightly lower-signal automated grading beats fewer questions hand-graded by a person.","B":"Volume is a documented strength of a test set, and it stops being a burden once grading is automated rather than read case by case.","C":"Drawing cases from the team's own workload is what makes an evaluation task-specific; a published benchmark would be less representative of this task, not more."},"sources":[{"title":"Create strong empirical evaluations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests","date":"2026-08-19","basis":"verified-live"},{"title":"Define your success criteria - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/define-success","date":"2026-08-19","basis":"verified-live"}],"tags":["test-cases","edge-cases","pre-rollout-testing"]},{"id":"D2-010","domain":"D2","objective":"Edit, adapt, refine, and compare outputs for the intended audience","type":"single","difficulty":"medium","scenario":true,"stem":"A proposal manager wants Claude to improve its own first draft in a way the bid team can inspect at each stage. Which sequence matches Anthropic's documented self-correction chaining pattern?","options":[{"key":"A","text":"Generate a draft, have Claude review it against explicit criteria, then have Claude refine it."},{"key":"B","text":"Generate a draft, then ask Claude to confirm whether it is satisfied with what it produced."},{"key":"C","text":"Generate several drafts at once and have Claude pick a favourite without explaining the choice."},{"key":"D","text":"Generate the draft and the final polished version together in a single response so that nothing can be lost between the separate steps."}],"correct":["A"],"explanation":"Anthropic documents self-correction chaining as three ordered steps: draft, review against explicit criteria, then refine based on the review. Each step is a separate call specifically so the intermediate output can be inspected, logged, evaluated or branched on.","rationales":{"B":"A yes-or-no self-satisfaction check is a self-report, not an evaluation against explicit criteria, and carries the same weakness as self-reported confidence.","C":"An unexplained preference is not a review against criteria and produces nothing a reviewer can audit or argue with.","D":"Collapsing the chain into one response hides the review step, which is the part the bid team needs to see and challenge."},"sources":[{"title":"Prompting best practices - Claude Platform Docs, Chain complex prompts","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["self-correction-chain","draft-review-refine","inspectable-steps"]},{"id":"D2-011","domain":"D2","objective":"Edit, adapt, refine, and compare outputs for the intended audience","type":"single","difficulty":"medium","scenario":true,"stem":"A communications lead keeps receiving bulleted markdown when she wants flowing prose for a newsletter. Following Anthropic's documented order of levers for steering output format, which adjustment should she try FIRST?","options":[{"key":"A","text":"Paste an example newsletter written in the desired style and ask Claude to match it."},{"key":"B","text":"Attach a long list of detailed formatting rules covering every element of the newsletter."},{"key":"C","text":"State firmly, and more than once, that Claude must not use markdown, bullet points or headings anywhere in the draft."},{"key":"D","text":"State positively what the response should be, for example that it should be smoothly flowing prose paragraphs."}],"correct":["D"],"explanation":"The documented order of levers starts with telling Claude what to do instead of what not to do, and the worked example is almost word for word this case: \"Your response should be composed of smoothly flowing prose paragraphs\" in place of \"Do not use markdown in your response\". XML format indicators, matching the prompt style to the desired output, and detailed formatting prompts come afterwards.","rationales":{"A":"Matching the prompt style to the desired output is the third documented lever, not the first, and it is a heavier change than restating the instruction positively.","B":"Detailed prompts for specific formatting preferences are the fourth and last documented lever, and are heavier than the situation needs.","C":"Prohibition-only phrasing is the documented weaker form of the same instruction; it is listed as the thing to move away from, not the first lever."},"sources":[{"title":"Prompting best practices - Claude Platform Docs, Control the format of responses","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["format-control","positive-instruction","refinement"]},{"id":"D2-012","domain":"D2","objective":"Evaluate Claude-generated outputs for accuracy and completeness","type":"single","difficulty":"hard","scenario":true,"stem":"Before evaluating a Claude summarisation workflow, a team writes down the success criterion \"the summaries should be good quality\". Which of Anthropic's four documented properties of a good success criterion is this criterion MOST clearly missing?","options":[{"key":"A","text":"Relevant: restate it so that it describes the model's general capability rather than this task."},{"key":"B","text":"Achievable: restate it as a requirement that every summary be rated perfect by every reviewer."},{"key":"C","text":"Measurable: restate it as a target such as an average rubric score of at least 4 out of 5."},{"key":"D","text":"Specific: restate it so that it names the file format each summary will be delivered in and where it will be stored."}],"correct":["C"],"explanation":"Anthropic's four properties are Specific, Measurable, Achievable and Relevant. \"Good quality\" cannot be scored, so nothing can be compared before and after a change. The documented fix is a quantitative target, for example a rubric score threshold; the criterion is also loosely specific, but measurability is the property that stops the evaluation working at all.","rationales":{"A":"Relevant means the criterion matters for this use case. Restating it to describe general model capability makes it less relevant, not more.","B":"Achievable means basing targets on benchmarks, prior results or expert knowledge. Demanding a perfect rating from every reviewer moves away from achievable, not towards it.","D":"Specificity here concerns what the summary must contain and how it will be judged, not the file format or storage location."},"sources":[{"title":"Define your success criteria - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/define-success","date":"2026-08-19","basis":"verified-live"}],"tags":["success-criteria","measurable","evaluation-design"]},{"id":"D2-013","domain":"D2","objective":"Evaluate Claude-generated outputs for accuracy and completeness","type":"multi","difficulty":"easy","scenario":false,"stem":"Which THREE of the following appear in Anthropic's list of common success criteria for evaluating model output? Select THREE.","options":[{"key":"A","text":"Task fidelity"},{"key":"B","text":"Context utilization"},{"key":"C","text":"Token entropy"},{"key":"D","text":"Prompt novelty"},{"key":"E","text":"Privacy preservation"},{"key":"F","text":"Refusal rate"}],"correct":["A","B","E"],"explanation":"Anthropic enumerates eight common success criteria: task fidelity, consistency, relevance and coherence, tone and style, privacy preservation, context utilization, latency and price. Context utilization is defined as how well the model references and builds on information already given.","rationales":{"C":"Token entropy is a sampling statistic, not one of the documented evaluation criteria.","D":"Prompt novelty describes the input, not a quality of the output being evaluated, and is not on the list.","F":"Refusal rate is a safety metric that may matter operationally but is not among the eight named success criteria."},"sources":[{"title":"Define your success criteria - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/define-success","date":"2026-08-19","basis":"verified-live"}],"tags":["eight-success-criteria","context-utilization","privacy-preservation"]},{"id":"D2-014","domain":"D2","objective":"Evaluate Claude-generated outputs for accuracy and completeness","type":"single","difficulty":"medium","scenario":true,"stem":"A colleague proposes judging a new Claude summarisation workflow on five hand-picked example documents that he will read and grade himself. What is the MAIN weakness of that proposal as a way of judging the workflow?","options":[{"key":"A","text":"Five hand-graded cases is too small a sample; the guidance favours many more cases graded automatically."},{"key":"B","text":"Hand grading is unacceptable here, because a model is better placed than a person to grade another model's output."},{"key":"C","text":"The proposal is sound, because careful human grading of a few worked examples is the strongest available signal of quality."},{"key":"D","text":"The examples should have been written by Claude rather than picked from the team's own documents."}],"correct":["A"],"explanation":"Anthropic's evaluation principles are be task-specific, automate when possible, and prioritize volume over quality, stating explicitly that more questions with slightly lower-signal automated grading beats fewer questions with high-quality human hand-grading. Five hand-picked cases also invite selection bias.","rationales":{"B":"Human grading is one of the documented grading families and is not ruled out; the documented principle concerns sample size and automation, not who does the grading.","C":"This is the named trap. It sounds rigorous, but the documented principle deliberately favours the larger automated set over a small hand-graded one.","D":"Test cases should reflect real-world use. Model-written examples would make the evaluation less task-specific, not more."},"sources":[{"title":"Create strong empirical evaluations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests","date":"2026-08-19","basis":"verified-live"}],"tags":["eval-design","volume-over-quality","sample-size"]},{"id":"D2-015","domain":"D2","objective":"Apply fact-checking and validation techniques","type":"single","difficulty":"easy","scenario":true,"stem":"An analyst supplies a single vendor report and asks Claude a question that the report does not actually address. Claude answers anyway, in plausible detail. Which documented BASIC strategy would most directly have prevented that?","options":[{"key":"A","text":"Ask Claude to state how confident it is in the answer so the analyst can decide whether to rely on it."},{"key":"B","text":"Explicitly give Claude permission to say it does not have enough information to answer."},{"key":"C","text":"Ask Claude for a longer answer so that more supporting detail is available for the analyst to check."},{"key":"D","text":"Ask Claude to rewrite the report into a shorter briefing before any questions are put to it."}],"correct":["B"],"explanation":"The first documented basic strategy is to allow Claude to say \"I don't know\": explicitly give it permission to admit uncertainty, with the worked example instructing it to say it does not have enough information to confidently assess something when the source lacks the necessary material. Without that permission the model fills the gap.","rationales":{"A":"A self-reported confidence statement is not a reliable accuracy signal and would not have stopped the ungrounded answer being produced in the first place.","C":"A longer answer creates more unsupported surface area. Volume is not grounding.","D":"Condensing the report first moves the answer further from the source wording and does nothing about a question the report never covered."},"sources":[{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"}],"tags":["allow-uncertainty","i-don't-know","ungrounded-answer"]},{"id":"D2-016","domain":"D2","objective":"Apply fact-checking and validation techniques","type":"single","difficulty":"medium","scenario":true,"stem":"Claude's Citations capability anchors each cited passage to individual sentences of the supplied source rather than to the document as a whole. For a reviewer checking a Claude-drafted analysis, what is the MAIN practical benefit of that granularity?","options":[{"key":"A","text":"Each claim can be checked against one specific sentence instead of re-reading the whole document."},{"key":"B","text":"The reviewer can be confident the cited sentence supports the claim without opening the source."},{"key":"C","text":"The source document no longer needs to be retained anywhere, because the citation itself preserves the evidence."},{"key":"D","text":"Longer source documents become cheaper to process, because only the cited sentences are read."}],"correct":["A"],"explanation":"Sentence-level anchoring turns verification from a re-reading exercise into a lookup: the reviewer goes to one sentence per claim. That is what makes claim-by-claim checking practical on a long source, which is the whole point of citing at all.","rationales":{"B":"A citation locates evidence; it does not confirm that the evidence supports the claim. Opening it is the check, not an optional extra.","C":"The cited sentence is a pointer into the source. Discarding the source destroys the ability to confirm the pointer, and record-keeping obligations are unaffected.","D":"Citation granularity is about where a claim is anchored, not about how much of the document is processed."},"sources":[{"title":"Citations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/citations","date":"2026-08-19","basis":"verified-live"}],"tags":["citations","sentence-granularity","claim-by-claim-checking"]},{"id":"D2-017","domain":"D2","objective":"Determine when human review or additional verification is required","type":"single","difficulty":"medium","scenario":true,"stem":"A records officer uploads a scanned copy of a decade-old policy. The scan is a page image with no extractable text layer. She needs every claim in Claude's answer to be traceable to a quoted passage of the policy. What is the correct expectation?","options":[{"key":"A","text":"Traceability is unaffected, because any claim Claude makes about a file that has been uploaded is automatically quotable."},{"key":"B","text":"The scan can be quoted normally, because a page image is read just as reliably as a text layer."},{"key":"C","text":"Claims from the scan cannot be tied to a quoted passage, so they must be checked against a text copy."},{"key":"D","text":"Quoted passages will be produced, but they will be paraphrases rather than the exact words on the page."}],"correct":["C"],"explanation":"A page image carries no extractable text, and documents that are scans without extractable text are not citable. Claude may still describe what it sees on the page, but that description cannot be anchored to a quoted passage, so the officer needs an accurate text version of the policy before citation-backed answers are possible.","rationales":{"A":"Uploading a file does not make its contents quotable; that depends on whether extractable text is present.","B":"Reading an image and quoting a text layer are different operations. The absence of a text layer is exactly what blocks quoting.","D":"A paraphrase is not a quoted passage. The officer's requirement is traceability to the original wording, which a paraphrase cannot supply."},"sources":[{"title":"Citations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/citations","date":"2026-08-19","basis":"verified-live"}],"tags":["scanned-document","no-extractable-text","traceability-limit"]},{"id":"D2-018","domain":"D2","objective":"Edit, adapt, refine, and compare outputs for the intended audience","type":"single","difficulty":"medium","scenario":true,"stem":"A marketing lead has two Claude-generated versions of the same product announcement and must choose one in a way she can justify to her director. What is the MOST appropriate basis for the comparison?","options":[{"key":"A","text":"Score both versions against explicit written criteria such as task fidelity, tone and style, and coherence."},{"key":"B","text":"Choose the longer version, since greater length is more likely to mean the announcement is complete."},{"key":"C","text":"Choose the version that was generated most recently, on the basis that later outputs benefit from more conversation context."},{"key":"D","text":"Ask Claude which version it prefers and adopt that choice without further checks."}],"correct":["A"],"explanation":"Anthropic's documented success criteria, including task fidelity, tone and style, and relevance and coherence, give a stable, stateable basis for judging output quality. Comparing against written criteria is what makes the choice defensible rather than a matter of taste.","rationales":{"B":"Length is not a documented criterion and often trades against relevance and coherence rather than supporting completeness.","C":"Recency is not a quality signal. A later generation can drift further from the brief than an earlier one.","D":"A model preference is a self-report with the same weakness as self-reported confidence, and it gives the director nothing to review."},"sources":[{"title":"Define your success criteria - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/define-success","date":"2026-08-19","basis":"verified-live"},{"title":"Claude Certified Associate - Foundations Exam Guide, Version 1.0, Section 6 Domain 2 objectives","url":"https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542847/Claude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf","date":"2026-07-08","basis":"published"}],"tags":["comparing-outputs","explicit-criteria","tone-and-style"]},{"id":"D2-019","domain":"D2","objective":"Determine when human review or additional verification is required","type":"multi","difficulty":"easy","scenario":true,"stem":"A researcher receives a Claude answer built on web search results, and every claim arrives with a source attached. Which TWO statements are correct? Select TWO.","options":[{"key":"A","text":"Sources are always attached to web search results and cannot be switched off."},{"key":"B","text":"A list of sources means that the claims in the answer have already been independently verified."},{"key":"C","text":"Having sources attached does not discharge the duty to open them and check the claims."},{"key":"D","text":"A page that has been cited is by definition an authoritative source for the claim."},{"key":"E","text":"Sources are attached only when the researcher asks for them in the prompt."}],"correct":["A","C"],"explanation":"For the web search tool, citations are always enabled and cannot be disabled, so a source list arrives with the answer whether or not it was asked for. That is a provenance aid, not a verification: the claim still has to be read against the cited page.","rationales":{"B":"Nothing has been verified by anyone. A citation records where material came from, not that it was checked.","D":"Authority is a judgement about the publisher and the claim. Being retrieved and cited says nothing about either.","E":"There is no per-request switch; citations for web search results are on by design."},"sources":[{"title":"Web search tool - Claude Platform Docs, Citations","url":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-search-tool","date":"2026-08-19","basis":"verified-live"}],"tags":["web-search-citations","always-enabled","citation-is-not-verification"]},{"id":"D2-020","domain":"D2","objective":"Apply fact-checking and validation techniques","type":"single","difficulty":"medium","scenario":true,"stem":"A knowledge manager is publishing Claude-drafted answers built on web search results to an internal help site that staff will act on, reproducing the answers as generated. What must the help site do when it displays those answers?","options":[{"key":"A","text":"Show only the search phrase Claude used, because source URLs may change over time."},{"key":"B","text":"Strip the source links so that the help site presents a single clean and authoritative answer."},{"key":"C","text":"Replace the source citations with a notice explaining that the content was AI generated."},{"key":"D","text":"Include citations to the original sources alongside the answers that staff will read and act on."}],"correct":["D"],"explanation":"Anthropic states that when displaying outputs directly to end users, citations to the original source must be included. Surfacing the sources is what lets a reader check the claim rather than take it on trust. The documentation also notes that where outputs are modified or recombined rather than reproduced as generated, how citations are displayed should be decided in consultation with legal counsel.","rationales":{"A":"The search phrase is not the source. It tells the reader nothing about which page a claim came from.","B":"Removing sources makes the answer unverifiable and directly contradicts the documented requirement.","C":"An AI-generated notice discloses how the text was written, not where the facts came from, so it does not satisfy the requirement."},"sources":[{"title":"Web search tool - Claude Platform Docs, Citations","url":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-search-tool","date":"2026-08-19","basis":"verified-live"}],"tags":["display-obligations","citations-to-readers","internal-publishing"]},{"id":"D2-021","domain":"D2","objective":"Apply fact-checking and validation techniques","type":"multi","difficulty":"medium","scenario":true,"stem":"An administrator restricts which domains Claude's web search may draw on for a regulatory research task. Which TWO statements about what that control does and does not achieve are correct? Select TWO.","options":[{"key":"A","text":"Narrowing the pool of sites is a provenance control: it governs where results may come from."},{"key":"B","text":"Restricting domains also guarantees that the content retrieved from those sites is factually accurate."},{"key":"C","text":"Individual claims taken from an allowed site still have to be opened and checked."},{"key":"D","text":"Once the domain list is in place, sources can be left off the answers that people read."},{"key":"E","text":"A restricted domain list also stops Claude drawing on its own general knowledge."}],"correct":["A","C"],"explanation":"Domain restriction is a control over provenance: it narrows the set of sites results may be drawn from. It says nothing about whether any particular claim on an allowed site is true, so claim-level verification is unchanged.","rationales":{"B":"Constraining sources improves the trust profile of the pool. It certifies nothing about the accuracy of an individual claim drawn from it.","D":"The obligation to display citations to end users is independent of which domains were searched, so narrowing the pool does not release the publisher from showing sources.","E":"Domain filtering governs retrieval. Bounding the model to supplied material is a separate instruction, external knowledge restriction."},"sources":[{"title":"Web search tool - Claude Platform Docs","url":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-search-tool","date":"2026-08-19","basis":"verified-live"},{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"}],"tags":["domain-restriction","provenance-not-accuracy","source-trust"]},{"id":"D2-022","domain":"D2","objective":"Edit, adapt, refine, and compare outputs for the intended audience","type":"single","difficulty":"easy","scenario":true,"stem":"An HR partner has a Claude-drafted policy summary that is broadly right but thin in two sections. She feeds that draft back to Claude as input and asks it to verify and expand those sections. Which documented advanced technique is she using?","options":[{"key":"A","text":"External knowledge restriction"},{"key":"B","text":"Best-of-N verification"},{"key":"C","text":"Iterative refinement"},{"key":"D","text":"Chain-of-thought verification"}],"correct":["C"],"explanation":"Iterative refinement is documented as using Claude's outputs as inputs for follow-up prompts, asking it to verify or expand on previous statements. It is one of the four advanced techniques, alongside chain-of-thought verification, Best-of-N verification and external knowledge restriction.","rationales":{"A":"External knowledge restriction means instructing Claude to use only the supplied documents and not its general knowledge.","B":"Best-of-N means running the same prompt multiple times and treating inconsistency across runs as a hallucination signal, not reworking one draft.","D":"Chain-of-thought verification means asking for step-by-step reasoning before the final answer so faulty logic becomes visible."},"sources":[{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"}],"tags":["iterative-refinement","advanced-techniques"]},{"id":"D2-023","domain":"D2","objective":"Identify hallucinations, inconsistencies, and biases in responses","type":"single","difficulty":"hard","scenario":true,"stem":"An internal auditor asks a team to hand over \"Claude's actual reasoning\" for a set of decisions, expecting the reasoning Claude displays to serve as the audit trail. What is the correct position?","options":[{"key":"A","text":"It is a complete and faithful log of the model's internal reasoning, on every currently available Claude model."},{"key":"B","text":"Turning on extended thinking exposes the model's raw internal reasoning word for word."},{"key":"C","text":"It is a complete record, but only on the newest models; older models return a summary instead."},{"key":"D","text":"Whatever reasoning is shown is only ever a summary, is often not shown at all, and is never an audit trail."}],"correct":["D"],"explanation":"Displayed reasoning is never the model's verbatim internal chain of thought: no display setting returns the raw chain of thought, the text shown is a summary of the reasoning, and on the newest models the display defaults to omitted so nothing is shown at all. It is therefore not a verification artifact, and an audit trail has to be built from the inputs, the outputs and the human checks actually performed.","rationales":{"A":"This is the named trap. Treating displayed reasoning as a complete log misrepresents what it is, and on several current models the thinking text comes back empty by default.","B":"Extended thinking changes how much the model reasons before answering, not whether the raw reasoning is exposed.","C":"Newness does not change this. No current model returns the raw reasoning verbatim."},"sources":[{"title":"Thinking - Claude Platform Docs, Controlling thinking display","url":"https://platform.claude.com/docs/en/build-with-claude/thinking","date":"2026-08-19","basis":"verified-live"}],"tags":["visible-thinking","not-an-audit-trail","summary-at-best"]},{"id":"D2-024","domain":"D2","objective":"Organize and curate information and select appropriate output formats (artifacts, inline, structured data)","type":"single","difficulty":"medium","scenario":true,"stem":"A finance analyst uses Structured Outputs so Claude always returns invoice fields in an agreed data shape. A colleague concludes that because every response now validates cleanly, the extracted amounts no longer need checking against the invoices. What is correct?","options":[{"key":"A","text":"Structured Outputs retries the request until the values have been confirmed against the source invoice."},{"key":"B","text":"The agreed shape is guaranteed; the accuracy of the values inside it is not."},{"key":"C","text":"Structured Outputs applies numeric range checks to every value that it returns."},{"key":"D","text":"Conformance to the shape implies the values were read correctly from the source invoice document."}],"correct":["B"],"explanation":"Structured Outputs constrains generation so that a response conforms to the supplied shape, with no retries needed for shape violations. It guarantees shape only: every field can be perfectly well formed and factually wrong, so extraction accuracy still has to be checked against the invoice.","rationales":{"A":"The no-retries property refers to shape violations. There is no verification loop against the source document.","C":"Range checking of values is not part of the guarantee, so nothing flags an amount that is well formed but wrong.","D":"This is the named trap. Shape conformance and extraction accuracy are independent; a well-formed field can hold an invented amount."},"sources":[{"title":"Structured outputs - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/structured-outputs","date":"2026-08-19","basis":"verified-live"}],"tags":["structured-outputs","shape-not-correctness","still-verify"]},{"id":"D2-025","domain":"D2","objective":"Organize and curate information and select appropriate output formats (artifacts, inline, structured data)","type":"multi","difficulty":"medium","scenario":true,"stem":"A finance team wants Claude's extracted invoice fields to load straight into their reporting tool with no retyping. Which TWO statements match Anthropic's guidance on choosing the output format here? Select TWO.","options":[{"key":"A","text":"Structured data is the right delivery format when another system, not a person, will consume the fields."},{"key":"B","text":"An artifact is required whenever the output will leave the conversation in some form."},{"key":"C","text":"A response that conforms to the agreed shape still needs its values checked against the invoices."},{"key":"D","text":"Structured data should be used for any answer that runs to more than about fifteen lines."},{"key":"E","text":"Delivering the fields as prose and asking the team to retype them keeps a useful human in the loop."}],"correct":["A","C"],"explanation":"Format follows the consumer. A reporting tool consumes fields, so structured data is the right delivery format; an artifact is for significant, self-contained content a person will edit, iterate on or reuse, and inline prose is for short conversational answers. Choosing structured data settles delivery, not correctness: the values still have to be checked against the invoices.","rationales":{"B":"The artifact trigger is significant, self-contained content that a person is likely to edit or reuse, rather than any output that happens to leave the chat.","D":"The roughly fifteen-line guidance is one signal for creating an artifact, not a rule about structured data.","E":"Manual retyping is the problem being solved, and it adds transcription errors rather than a meaningful check."},"sources":[{"title":"What are Artifacts and how do I use them? - Claude Help Center","url":"https://support.claude.com/en/articles/9487310-what-are-artifacts-and-how-do-i-use-them","date":"2026-08-19","basis":"verified-live"},{"title":"Structured outputs - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/structured-outputs","date":"2026-08-19","basis":"verified-live"}],"tags":["structured-data","format-follows-consumer","still-verify"]},{"id":"D2-026","domain":"D2","objective":"Organize and curate information and select appropriate output formats (artifacts, inline, structured data)","type":"single","difficulty":"medium","scenario":true,"stem":"A bid team wants Claude to compare four supplier responses, and a reviewer will afterwards need to tell which supplier each statement in the comparison came from. How should the material be organised before the comparison is requested?","options":[{"key":"A","text":"Supply each response as a separately titled document, so every statement can be traced to the supplier it came from."},{"key":"B","text":"Paste the four responses as one continuous block of text, leaving a blank line between them to keep the reading order clear."},{"key":"C","text":"Summarise each response down to a short paragraph first, then supply only those four paragraphs for the comparison."},{"key":"D","text":"Supply the responses unlabelled and ask Claude to give each one a short descriptive name of its own choosing."}],"correct":["A"],"explanation":"A citation is anchored to the document a passage came from, so keeping each supplier response as its own titled document is what allows a statement in the comparison to be followed back to one supplier. Curating the inputs is a format decision taken before the question is asked, and it determines whether the answer can be checked afterwards.","rationales":{"B":"A single continuous block reads in order but carries no per-supplier boundary, so an attribution in the comparison cannot be tied back to one response.","C":"Summarising first throws away the exact wording a reviewer would want to check, and it moves the comparison one step further away from the source.","D":"A name the model invents is not source metadata and cannot be reconciled with the four documents the reviewer actually holds in front of them."},"sources":[{"title":"Citations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/citations","date":"2026-08-19","basis":"verified-live"},{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"}],"tags":["source-attribution","curating-inputs","traceability"]},{"id":"D2-027","domain":"D2","objective":"Determine when human review or additional verification is required","type":"single","difficulty":"medium","scenario":true,"stem":"A researcher asks Claude Sonnet 5 about a regulatory change announced in April 2026 and receives a confident, detailed answer with no caveats. Why should she treat the answer as unverified?","options":[{"key":"A","text":"Sonnet 5's training cutoff is January 2026, so later events must be supplied or searched for."},{"key":"B","text":"All Claude 5 models share a May 2026 cutoff, so April 2026 is comfortably covered and the answer can be relied on."},{"key":"C","text":"Regulatory material is excluded from training data as a matter of policy."},{"key":"D","text":"Claude models are retrained continuously, so a cutoff only affects unusually niche subject matter."}],"correct":["A"],"explanation":"Published cutoffs are model-specific and differ within a generation: Claude Opus 5 is May 2026 while Sonnet 5, Fable 5 and Opus 4.8 are January 2026. Anthropic states these models may not be aware of events after their respective cutoffs, and that recent details must be supplied by the user or retrieved with web search.","rationales":{"B":"This is the named trap. Cutoffs differ within the same generation, so assuming a shared date leads to trusting an answer the model could not have learned.","C":"No such exclusion exists; the issue is timing, not subject matter.","D":"Models are not retrained continuously, and the cutoff affects any event after the date regardless of how mainstream the topic is."},"sources":[{"title":"How up-to-date is Claude's training data? - Claude Help Center","url":"https://support.claude.com/en/articles/8114494-how-up-to-date-is-claude-s-training-data","date":"2026-08-19","basis":"verified-live"}],"tags":["training-cutoff","per-model-cutoffs","web-search"]},{"id":"D2-028","domain":"D2","objective":"Determine when human review or additional verification is required","type":"single","difficulty":"hard","scenario":true,"stem":"A team upgrades a legal-summary workflow to Claude Opus 5, citing its published description as the most aligned model to date with the lowest rates of deceptive behavior. On that basis they propose removing the solicitor sign-off step. What is the MOST appropriate assessment?","options":[{"key":"A","text":"Sign-off can be removed because alignment audits are applied to each individual response."},{"key":"B","text":"Sign-off can be removed provided the workflow records which model version produced each summary."},{"key":"C","text":"Model choice does not change the verification obligation for high-stakes legal output."},{"key":"D","text":"Improved alignment results are an accepted substitute for qualified human review of legal output."}],"correct":["C"],"explanation":"Anthropic's Opus 5 claims concern alignment behaviour and lower run-to-run variance, not guaranteed factual correctness, and Anthropic publishes no claim that a newer model removes the need to verify outputs. Choosing a model is a model selection decision; the verification obligation for high-stakes work is unchanged.","rationales":{"A":"Automated behavioral audits are evaluations run on the model, not a per-response check applied in production.","B":"Recording the model version supports traceability after the fact and does nothing to catch an error before it reaches a client.","D":"Alignment scores measure adherence to behavioural norms on audits, not the accuracy of a specific legal summary for a specific matter."},"sources":[{"title":"Introducing Claude Opus 5 - Anthropic News","url":"https://www.anthropic.com/news/claude-opus-5","date":"2026-07-24","basis":"published"},{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"}],"tags":["model-choice-is-not-verification","high-stakes","opus-5"]},{"id":"D2-029","domain":"D2","objective":"Organize and curate information and select appropriate output formats (artifacts, inline, structured data)","type":"single","difficulty":"easy","scenario":false,"stem":"According to Anthropic's help documentation, when does Claude produce an Artifact rather than answering inline in the conversation?","options":[{"key":"A","text":"Whenever the response contains formatting such as headings, bullet points or tables."},{"key":"B","text":"When content is significant, self-contained, over about 15 lines, and likely to be reused outside the chat."},{"key":"C","text":"Whenever the response answers a factual question of the kind that would require a supporting source to be cited."},{"key":"D","text":"Whenever the response runs to more than one paragraph of continuous prose."}],"correct":["B"],"explanation":"The documented trigger is content that is significant and self-contained, typically over 15 lines, something the user is likely to want to edit, iterate on or reuse outside the conversation, and able to stand on its own without extra conversation context. Short conversational answers stay inline.","rationales":{"A":"Formatting alone does not make content self-contained or reusable, and inline responses are routinely formatted.","C":"Whether an answer needs a source concerns verification, not the delivery format.","D":"Paragraph count is not the trigger. A two-paragraph conversational answer is exactly the sort of content that stays inline."},"sources":[{"title":"What are Artifacts and how do I use them? - Claude Help Center","url":"https://support.claude.com/en/articles/9487310-what-are-artifacts-and-how-do-i-use-them","date":"2026-08-19","basis":"verified-live"}],"tags":["artifacts","15-lines","self-contained"]},{"id":"D2-030","domain":"D2","objective":"Organize and curate information and select appropriate output formats (artifacts, inline, structured data)","type":"single","difficulty":"easy","scenario":true,"stem":"A project manager asks Claude for a quick bar chart of last quarter's ticket volumes to glance at during stand-up. She does not need a file or a document to keep. Since March 2026, what is the correct expectation about format?","options":[{"key":"A","text":"Charts must be described in words, because Claude cannot render visual output inside a response."},{"key":"B","text":"Claude can render the chart inline in its response, so a separate artifact is not required."},{"key":"C","text":"Visualizations can be delivered as a downloadable file for the user to open, and in no other way."},{"key":"D","text":"Every visualization has to be produced as a standalone artifact before it can be viewed."}],"correct":["B"],"explanation":"From 12 March 2026 Claude gained the ability to create custom charts, diagrams and other visualizations inline in its responses. A visualization therefore no longer implies a separate artifact, and choosing between inline and standalone is a genuine format decision.","rationales":{"A":"Claude renders visualizations inline, so falling back to a text description is an unnecessary downgrade of what the response can carry.","C":"File creation is one option among several rather than the only route, and a throwaway stand-up chart does not need a file at all.","D":"Artifacts are reserved for significant, self-contained content that will be edited or reused, and a throwaway stand-up chart does not meet that trigger."},"sources":[{"title":"Release notes - Claude Help Center, 12 March 2026","url":"https://support.claude.com/en/articles/12138966-release-notes","date":"2026-03-12","basis":"published"},{"title":"What are Artifacts and how do I use them? - Claude Help Center","url":"https://support.claude.com/en/articles/9487310-what-are-artifacts-and-how-do-i-use-them","date":"2026-08-19","basis":"verified-live"}],"tags":["inline-visualization","artifact-vs-inline","format-choice"]},{"id":"D2-031","domain":"D2","objective":"Edit, adapt, refine, and compare outputs for the intended audience","type":"single","difficulty":"medium","scenario":true,"stem":"A consultant has a long Claude-drafted report that her client has already reviewed and largely approved. One paragraph puts the emphasis in the wrong place. She does not want the rest of the document regenerated, because the wording elsewhere has been agreed. Which documented capability fits?","options":[{"key":"A","text":"Ask Claude to regenerate the whole document with the paragraph rewritten."},{"key":"B","text":"Export the report to a file, edit it in another application, then upload it again for Claude to reconcile."},{"key":"C","text":"Highlight the paragraph, type the change she wants, and have Claude edit that part in place."},{"key":"D","text":"Copy the paragraph into a new conversation and paste the revised version back by hand."}],"correct":["C"],"explanation":"Since 12 June 2026 Claude supports targeted draft editing: you highlight the part of a document you want changed, type the change, and Claude makes the edit exactly where you marked it rather than regenerating the whole output. That is the documented mechanism for surgical refinement.","rationales":{"A":"Regenerating the whole report risks changing agreed wording elsewhere, which is exactly the outcome she is trying to avoid.","B":"A round trip through another application is slower and reintroduces reconciliation risk for a single-paragraph change.","D":"Working in a separate conversation loses the document context and adds a manual paste-back step that the in-place edit removes."},"sources":[{"title":"Release notes - Claude Help Center, 12 June 2026","url":"https://support.claude.com/en/articles/12138966-release-notes","date":"2026-06-12","basis":"published"}],"tags":["draft-editing","targeted-refinement","in-place-edit"]},{"id":"D2-032","domain":"D2","objective":"Identify hallucinations, inconsistencies, and biases in responses","type":"single","difficulty":"easy","scenario":true,"stem":"An operations lead gives Claude a five-step data clean-up task. At the end Claude reports, in confident and specific terms, that all five steps were completed. What is the MOST appropriate way for the lead to treat that report?","options":[{"key":"A","text":"Accept the report, because a confident and specific completion claim is strong evidence the work was done."},{"key":"B","text":"Ask Claude to rate how confident it is that all five steps ran, and accept the report if the rating is high."},{"key":"C","text":"Ask Claude to restate the report in a more detailed format so that it is easier to file with the change record."},{"key":"D","text":"Treat the completion claim as unverified and inspect the data itself for every one of the five steps."}],"correct":["D"],"explanation":"A claim that work was completed is itself model-generated output and carries the same fabrication risk as any other specific-looking claim. Self-reported confidence is not a reliable accuracy signal, and Anthropic's guidance is that critical information must always be validated, so the only evidence that counts here is the state of the data.","rationales":{"A":"Confidence and specificity are properties of the writing, not of the underlying work. Fabricated detail is characteristically specific and plausible, which is exactly why it survives a casual read.","B":"Asking the model to grade its own claim produces another self-report, and self-reported confidence is rejected as an accuracy signal.","C":"Reformatting improves how the report reads and files. It supplies no evidence about whether the five steps actually ran."},"sources":[{"title":"Claude Certified Associate - Foundations Exam Guide, Version 1.0, answer key for Sample 1","url":"https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542847/Claude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf","date":"2026-07-08","basis":"published"},{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"}],"tags":["unverified-completion-claim","self-reported-confidence","multi-step-tasks"]},{"id":"D2-033","domain":"D2","objective":"Identify hallucinations, inconsistencies, and biases in responses","type":"single","difficulty":"medium","scenario":true,"stem":"A finance analyst reads a Claude-drafted quarterly review. The narrative says renewals grew by a fifth, while the summary table on the following page shows renewals falling. Both figures are drawn from the same supplied data pack. What has she found, and what follows from it?","options":[{"key":"A","text":"A layout fault in the table, which will resolve itself once the review is regenerated with a different table format."},{"key":"B","text":"An accuracy failure in the narrative specifically, so the narrative can be corrected and the table left alone as it stands."},{"key":"C","text":"A completeness gap, since the review needs an extra paragraph reconciling the two renewal figures for the reader."},{"key":"D","text":"An internal inconsistency, so both figures are in doubt and each has to be checked against the data pack."}],"correct":["D"],"explanation":"Two statements in the same output contradict each other, so at most one of them can be right and neither has been established. An inconsistency tells you the pair is unsound without telling you which half is wrong, which is why the resolution is to take both figures back to the data pack rather than to pick one. Inconsistency across repeated runs is the documented Best-of-N signal, and the same reasoning applies to a contradiction inside a single response.","rationales":{"A":"Layout has no bearing on a numeric contradiction, and regenerating in a different format can reproduce the conflict or bury it out of sight.","B":"Nothing so far shows which of the two figures is wrong, so treating the table as sound and correcting only the narrative is a guess dressed as a fix.","C":"Adding a reconciling paragraph papers over the contradiction. The defect is that two stated figures disagree, not that a section is missing."},"sources":[{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"},{"title":"Claude Certified Associate - Foundations Exam Guide, Version 1.0, Section 6 Domain 2 objectives","url":"https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542847/Claude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf","date":"2026-07-08","basis":"published"}],"tags":["internal-inconsistency","contradictory-figures","check-both"]},{"id":"D2-034","domain":"D2","objective":"Identify hallucinations, inconsistencies, and biases in responses","type":"multi","difficulty":"hard","scenario":true,"stem":"A reviewer is triaging a Claude-generated market briefing before it goes to the board. Which TWO observations are evidence about the accuracy of the content, rather than properties of the writing? Select TWO.","options":[{"key":"A","text":"The briefing is noticeably longer than the reviewer expected."},{"key":"B","text":"Claude rated its own confidence in the briefing as high when asked."},{"key":"C","text":"The briefing notes that two of the figures are estimates rather than reported values."},{"key":"D","text":"The briefing is formatted with clear headings and a consistent house style throughout."},{"key":"E","text":"Running the same prompt three times produces three different values for the same metric."},{"key":"F","text":"A precise-looking statistic attributed to a named report that the reviewer cannot locate."}],"correct":["E","F"],"explanation":"Hallucination is characterised by fabricated details that look specific and plausible, so an untraceable statistic attributed to a named report is a direct hit. Best-of-N verification treats inconsistency across repeated runs of the same prompt as a hallucination signal, making the drifting metric the second genuine warning sign. Both are observations about the content; the rest are observations about the prose.","rationales":{"A":"Length says nothing about whether the content is grounded; a short briefing can be entirely fabricated.","B":"Self-reported confidence is rejected as a reliable accuracy signal in the official answer key.","C":"Labelling figures as estimates is transparency about method, not a sign that they were invented.","D":"Headings and house style are properties of presentation and carry no information about whether the claims in the briefing are true."},"sources":[{"title":"Claude Certified Associate - Foundations Exam Guide, Version 1.0, answer key for Sample 1","url":"https://everpath-course-content.s3-accelerate.amazonaws.com/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1783542847/Claude+Certified+Associate+%E2%80%93+Foundations+Exam+Guide.pdf","date":"2026-07-08","basis":"published"},{"title":"Reduce hallucinations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","date":"2026-08-19","basis":"verified-live"}],"tags":["hallucination-signals","best-of-n","content-versus-prose"]},{"id":"D2-035","domain":"D2","objective":"Evaluate Claude-generated outputs for accuracy and completeness","type":"multi","difficulty":"hard","scenario":false,"stem":"Anthropic's guidance on getting high-quality research and information gathering from Claude names several requirements. Which THREE are documented? Select THREE.","options":[{"key":"A","text":"For complex research, develop several competing hypotheses and track confidence levels in the research notes to improve calibration."},{"key":"B","text":"Provide clear success criteria that define what a successful answer looks like."},{"key":"C","text":"Switch off extended reasoning so the research completes faster."},{"key":"D","text":"Ask Claude to verify information across multiple sources."},{"key":"E","text":"Ask Claude to declare the answer final before presenting it, to discourage drift."},{"key":"F","text":"Restrict the work to a single authoritative source so contradictions cannot arise."}],"correct":["A","B","D"],"explanation":"The documented requirements are clear success criteria defining a successful answer, encouraging source verification across multiple sources, and for complex research a structured approach that develops competing hypotheses, tracks confidence levels in the progress notes to improve calibration, and regularly self-critiques the approach and plan. Note that this is calibration tracking during the research process, which is a different thing from a finished answer carrying a self-reported confidence score offered as evidence that it is accurate; the latter is not a documented accuracy signal and is rejected elsewhere in this material.","rationales":{"C":"Speed is not a research quality lever in this guidance, and removing reasoning steps works against calibration and self-critique.","E":"Declaring an answer final is a rhetorical move that produces no evidence and blocks the self-critique the guidance calls for.","F":"Restricting to one source removes the cross-checking that the guidance explicitly asks for and hides rather than resolves contradictions."},"sources":[{"title":"Prompting best practices - Claude Platform Docs, Research and information gathering","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["research-quality","competing-hypotheses","calibration-versus-confidence-score"]},{"id":"D2-036","domain":"D2","objective":"Evaluate Claude-generated outputs for accuracy and completeness","type":"single","difficu
