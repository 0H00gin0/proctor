th requests handled solely by the customer's own workspace administrator under contract."},{"key":"C","text":"Anthropic, PBC, with requests routed to the relevant national supervisory authority before Anthropic sees them."},{"key":"D","text":"Anthropic Ireland, Limited, with requests to privacy@anthropic.com and a one-month window extendable by two months."}],"correct":["D"],"explanation":"For EEA, UK and Swiss users the controller and contracting entity is Anthropic Ireland, Limited, not Anthropic, PBC. Data subject requests go to privacy@anthropic.com with a one-month response window under GDPR and UK GDPR, extendable by two months for complex requests, and denials can be appealed to the same address.","rationales":{"A":"Anthropic, PBC is not the controller for these regions, and requests are not limited to in-product support.","B":"The controller identification is right, but data subject requests are made directly to Anthropic's privacy address rather than only through a customer administrator.","C":"Requests go to the controller first; a supervisory authority is a route for complaints, not the starting point."},"sources":[{"title":"Anthropic Privacy Policy","url":"https://www.anthropic.com/legal/privacy","date":"2026-07-08","basis":"published"}],"tags":["gdpr","data-controller","anthropic-ireland","data-subject-rights"]},{"id":"D6-020","domain":"D6","objective":"Follow organizational AI policies and governance standards","type":"single","difficulty":"medium","scenario":true,"stem":"An internal audit team on a Claude Enterprise plan asks the administrator to produce six months of Claude Cowork conversation history for staff who worked in local sessions. What is the correct answer?","options":[{"key":"A","text":"Local Cowork history is synchronised to the organisation's account and can be exported in the same way as any other conversation record."},{"key":"B","text":"Local Cowork history sits on each user's machine outside standard retention, though Enterprise admins can retrieve it in beta."},{"key":"C","text":"Local Cowork history is retained by Anthropic for 30 days and can be exported by an owner at any point within that window."},{"key":"D","text":"Local Cowork history can be exported only after zero data retention is enabled for the whole organisation."}],"correct":["B"],"explanation":"For local sessions, Cowork stores conversation history locally on users' computers. That data is not subject to Anthropic's standard data retention policies and cannot be centrally managed or exported through normal admin tooling; Claude Enterprise admins can, however, retrieve local session content in beta through the Compliance API, and deletion endpoints for local sessions are not yet available. Endpoint controls such as disk encryption remain the main protection layer, while cloud sessions run on Anthropic infrastructure and are saved to the user's account.","rationales":{"A":"Synchronisation to the organisation's account describes cloud sessions, not local sessions.","C":"Anthropic's standard retention policies do not govern local session history at all, so no 30-day export window exists.","D":"Zero data retention reduces what Anthropic keeps; it cannot create an export capability for data held on an endpoint."},"sources":[{"title":"Use Claude Cowork on Team and Enterprise plans - Anthropic Help Center","url":"https://support.claude.com/en/articles/13455879-use-claude-cowork-on-team-and-enterprise-plans","date":"2026-08-18","basis":"published"}],"tags":["cowork","local-sessions","compliance-api","audit"]},{"id":"D6-021","domain":"D6","objective":"Follow organizational AI policies and governance standards","type":"single","difficulty":"easy","scenario":false,"stem":"How is Anthropic's Usage Policy structured?","options":[{"key":"A","text":"Three tiers: Universal Usage Standards, High-Risk Use Case Requirements, and Additional Use Case Guidelines."},{"key":"B","text":"A single flat list of prohibited uses that applies identically to every customer, on every plan and in every region."},{"key":"C","text":"Two tiers: consumer standards and commercial standards, applied according to the customer's plan type."},{"key":"D","text":"Four tiers aligned to the AI Safety Levels defined in Anthropic's Responsible Scaling Policy."}],"correct":["A"],"explanation":"The Usage Policy has three tiers: Universal Usage Standards that apply to everyone, High-Risk Use Case Requirements that apply to specific consumer-facing use cases, and Additional Use Case Guidelines covering certain other uses such as consumer-facing chatbots.","rationales":{"B":"A flat prohibited-uses list was the older mental model; the restructured policy layers requirements by risk.","C":"The tiers are defined by use case and risk, not by whether the customer is consumer or commercial.","D":"AI Safety Levels belong to the Responsible Scaling Policy, which is a separate document from the Usage Policy."},"sources":[{"title":"Updates to our Acceptable Use Policy (now Usage Policy), Consumer Terms of Service, and Privacy Policy - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/9301722-updates-to-our-acceptable-use-policy-now-usage-policy-consumer-terms-of-service-and-privacy-policy","date":"2026-03-16","basis":"published"}],"tags":["usage-policy","policy-structure"]},{"id":"D6-022","domain":"D6","objective":"Follow organizational AI policies and governance standards","type":"single","difficulty":"medium","scenario":true,"stem":"A governance manager is updating an internal AI policy that still refers to Anthropic's Acceptable Use Policy. Which change should she record as the most consequential for her organisation's own customers?","options":[{"key":"A","text":"A change of name only, with the substance of the previous acceptable use rules carried over unchanged in every respect."},{"key":"B","text":"A shift of responsibility for high-risk use cases from the customer to Anthropic."},{"key":"C","text":"Replacement of the policy by the Responsible Scaling Policy for all commercial customers."},{"key":"D","text":"New disclosure obligations requiring organisations to tell their own end users that they are interacting with AI."}],"correct":["D"],"explanation":"The Acceptable Use Policy was renamed the Usage Policy, and the restructure refined which parties are covered, carved out named high-risk use cases with extra requirements, and added new disclosure obligations requiring organisations to inform their own end users that they are interacting with AI. That disclosure duty is the change that reaches the organisation's customers directly.","rationales":{"A":"The update was substantive rather than cosmetic, adding high-risk carve-outs and disclosure duties.","B":"Responsibility for meeting high-risk requirements sits with the deploying organisation, not with Anthropic.","C":"The Responsible Scaling Policy governs Anthropic's own model development and deployment standards; it does not replace the Usage Policy."},"sources":[{"title":"Updates to our Acceptable Use Policy (now Usage Policy), Consumer Terms of Service, and Privacy Policy - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/9301722-updates-to-our-acceptable-use-policy-now-usage-policy-consumer-terms-of-service-and-privacy-policy","date":"2026-03-16","basis":"published"}],"tags":["usage-policy","disclosure","policy-change"]},{"id":"D6-023","domain":"D6","objective":"Identify appropriate and inappropriate use cases","type":"multi","difficulty":"medium","scenario":true,"stem":"An insurance firm plans to use Claude to draft claim decision explanations that are sent directly to policyholders. Which TWO measures must be in place before the first explanation is sent? (Select TWO.)","options":[{"key":"A","text":"Registration of the use case with Anthropic before the service goes live."},{"key":"B","text":"A zero data retention agreement covering the claims workload end to end."},{"key":"C","text":"Review by a qualified professional before the output is disseminated."},{"key":"D","text":"An independent third-party bias audit of the drafting model, repeated every quarter."},{"key":"E","text":"Disclosure to the affected policyholder that AI was used."},{"key":"F","text":"Storage of all drafts for seven years to support later appeals."}],"correct":["C","E"],"explanation":"Each named high-risk category triggers two mandatory measures together: a qualified professional in that field must review the content or decision prior to dissemination or finalisation, and where model outputs are presented directly to individuals or consumers the organisation must disclose that AI was used, at a minimum at the beginning of each session. Candidates commonly treat these as alternatives when in fact both are required.","rationales":{"A":"No pre-launch registration of high-risk use cases with Anthropic is required by the policy.","B":"Zero data retention is a separate, approval-gated commercial arrangement and is not a high-risk requirement.","D":"A recurring third-party bias audit may be good practice, but it is not one of the two stated high-risk measures.","F":"The seven-year figure relates to trust and safety classification scores for flagged content, not to a drafting retention duty."},"sources":[{"title":"Updates to our Acceptable Use Policy (now Usage Policy), Consumer Terms of Service, and Privacy Policy - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/9301722-updates-to-our-acceptable-use-policy-now-usage-policy-consumer-terms-of-service-and-privacy-policy","date":"2026-03-16","basis":"published"}],"tags":["high-risk-use-cases","human-in-the-loop","disclosure","exam-trap"]},{"id":"D6-024","domain":"D6","objective":"Follow organizational AI policies and governance standards","type":"single","difficulty":"easy","scenario":false,"stem":"A customer asks what happens to an account that breaches the Usage Policy, and whether the outcome can be challenged. Which answer is accurate?","options":[{"key":"A","text":"Termination only, applied automatically by classifiers with no route of appeal and no human involvement at any stage."},{"key":"B","text":"Financial penalties scaled to account spend, with appeals heard by an external ombudsman."},{"key":"C","text":"Warning, suspending or terminating access, with an appeals process through which some bans are overturned."},{"key":"D","text":"Referral of every case to a national regulator, which then decides on account access."}],"correct":["C"],"explanation":"Anthropic's named enforcement actions for Usage Policy breaches are warning, suspending or terminating access. The Transparency Hub reports enforcement volumes for January to June 2026 of 11.4 million accounts banned, 398,000 appeals filed and 42,000 bans overturned, confirming that an appeals route exists and can succeed.","rationales":{"A":"Termination is only one of three named actions, and the published appeal and overturn figures show appeals are available.","B":"Financial penalties and an external ombudsman are not part of Anthropic's published enforcement model.","D":"Regulator referral is not the enforcement mechanism; separate reporting obligations, such as child-safety reports to NCMEC, are distinct from account enforcement."},"sources":[{"title":"Anthropic's Transparency Hub - System Trust and Reporting","url":"https://www.anthropic.com/transparency/system-trust-reporting","date":"2026-07-23","basis":"published"}],"tags":["enforcement","appeals","transparency-hub"]},{"id":"D6-025","domain":"D6","objective":"Follow organizational AI policies and governance standards","type":"single","difficulty":"easy","scenario":true,"stem":"An administrator on a Claude Team plan wants to enable Claude Cowork for the twelve people in the operations group only, leaving the rest of the organisation without it. What should she be told?","options":[{"key":"A","text":"Team supports group-based enablement, so she can scope Cowork to the operations group directly from the admin console."},{"key":"B","text":"On Team the Cowork toggle is organisation-wide, so selective enablement by group requires Enterprise."},{"key":"C","text":"Cowork cannot be restricted on any plan, because it is enabled per user by the individual."},{"key":"D","text":"Selective enablement requires a zero data retention agreement in addition to the Team plan."}],"correct":["B"],"explanation":"The Cowork enable and disable toggle is organisation-wide on Team, meaning all members or none. Enterprise administrators can instead use groups and custom roles to grant Cowork, or the ability to run Cowork in the cloud, selectively.","rationales":{"A":"Group-based scoping of Cowork is an Enterprise capability, not a Team capability.","C":"Cowork is administrator-controlled at organisation level rather than chosen freely by each user.","D":"Zero data retention concerns what Anthropic stores and has no bearing on which users can access Cowork."},"sources":[{"title":"Use Claude Cowork on Team and Enterprise plans - Anthropic Help Center","url":"https://support.claude.com/en/articles/13455879-use-claude-cowork-on-team-and-enterprise-plans","date":"2026-08-18","basis":"published"}],"tags":["cowork","admin-controls","team-vs-enterprise"]},{"id":"D6-026","domain":"D6","objective":"Follow organizational AI policies and governance standards","type":"multi","difficulty":"hard","scenario":true,"stem":"A risk officer is writing up the out-of-the-box posture of Claude Cowork before a rollout across a Team plan and an Enterprise plan. Which TWO statements describe the defaults? (Select TWO.)","options":[{"key":"A","text":"Cloud sessions are enabled by default on Team plans."},{"key":"B","text":"Cloud sessions are enabled by default on Enterprise plans."},{"key":"C","text":"Cowork is off for each Team member until that member opts in individually."},{"key":"D","text":"Members must approve write-capable connector tools per task, because always-allow is off by default."},{"key":"E","text":"Members can save always-allow preferences for write-capable connector tools without any admin action."},{"key":"F","text":"Cowork sessions run on Anthropic infrastructure whether local or cloud mode is selected."}],"correct":["A","D"],"explanation":"Cloud sessions are enabled by default on Team plans and disabled by default on Enterprise plans, where an owner must explicitly enable running Cowork in the cloud and then grant it to groups through custom roles. Separately, the setting allowing always-allow for connector tools is off by default on both plan types, so members must approve write-capable connector tools per task and cannot save an always-allow preference.","rationales":{"B":"The Enterprise default for cloud sessions is off, which is the reverse of the Team default.","C":"On Team the Cowork toggle is organisation-wide rather than a per-user opt-in.","E":"Saving always-allow preferences depends on an owner enabling that setting; it is off by default.","F":"Local sessions run on the user's own machine; only cloud sessions run on Anthropic infrastructure."},"sources":[{"title":"Use Claude Cowork on Team and Enterprise plans - Anthropic Help Center","url":"https://support.claude.com/en/articles/13455879-use-claude-cowork-on-team-and-enterprise-plans","date":"2026-08-18","basis":"published"}],"tags":["cowork","defaults","connectors","risk-assessment"]},{"id":"D6-027","domain":"D6","objective":"Understand the ethical implications of AI usage","type":"single","difficulty":"medium","scenario":true,"stem":"A support manager is launching a customer-facing chatbot built on Claude. Legal has added a line to the website terms of service stating that automated assistance may be used. Is that sufficient disclosure?","options":[{"key":"A","text":"Yes: a clear statement in the published terms of service satisfies the disclosure expectation."},{"key":"B","text":"Yes, provided the chatbot also confirms it is an AI whenever a customer asks it directly."},{"key":"C","text":"No: the disclosure must be repeated in every individual message the chatbot sends."},{"key":"D","text":"No: users must be told they are interacting with AI at the beginning of each chat session."}],"correct":["D"],"explanation":"All consumer-facing chatbots, including any external-facing or interactive AI agent, must disclose to users that they are interacting with AI rather than a human, and that disclosure must be provided at a minimum at the beginning of each chat session. A one-time notice buried in terms of service does not meet the requirement.","rationales":{"A":"A terms of service notice is exactly the pattern the per-session requirement is designed to rule out.","B":"Answering honestly on request is good practice but does not replace proactive disclosure at the start of the session.","C":"Per-message disclosure exceeds what is required; the stated minimum is at the beginning of each session."},"sources":[{"title":"Updates to our Acceptable Use Policy (now Usage Policy), Consumer Terms of Service, and Privacy Policy - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/9301722-updates-to-our-acceptable-use-policy-now-usage-policy-consumer-terms-of-service-and-privacy-policy","date":"2026-03-16","basis":"published"}],"tags":["chatbot-disclosure","transparency","exam-trap"]},{"id":"D6-028","domain":"D6","objective":"Understand the ethical implications of AI usage","type":"single","difficulty":"medium","scenario":true,"stem":"A communications director in Canada asks whether Claude's text watermarking affects her team, since the EU AI Act does not apply to them. What is the correct answer?","options":[{"key":"A","text":"It affects them: Anthropic applies watermarking globally, because it has no durable way to scope it by region."},{"key":"B","text":"It does not affect them, because watermarking is applied only to sessions that originate inside the European Union."},{"key":"C","text":"It affects them only if their workspace owner opts in to watermarking in the organisation's settings."},{"key":"D","text":"It does not affect them, because watermarking is applied only to generated image and document files, not to text."}],"correct":["A"],"explanation":"Anthropic states that it is applying watermarking globally at launch because it does not yet have a durable way to scope it by region, and that it will keep evaluating other approaches. The 2 August 2026 date belongs to the EU, which from that date requires providers serving its market to mark AI-generated content; Anthropic publishes no start date of its own, says future Claude models will generate watermarked text, and is working to add watermarking to models launched before that date under the law's transition period. No user opt-out is documented.","rationales":{"B":"Region-scoped application is precisely what Anthropic says it has no durable way to do, so the measure is global.","C":"No opt-in or opt-out control for watermarking is documented at user or workspace level.","D":"Files receive C2PA content credentials in their metadata, but text output is separately watermarked, so text-based teams are in scope."},"sources":[{"title":"How Claude's text watermarking works - Anthropic","url":"https://www.anthropic.com/news/claude-text-watermark","date":"2026-08-14","basis":"published"}],"tags":["watermarking","eu-ai-act","transparency","exam-trap"]},{"id":"D6-029","domain":"D6","objective":"Understand the ethical implications of AI usage","type":"multi","difficulty":"hard","scenario":true,"stem":"An academic integrity officer wants to use Claude's text watermark as evidence in misconduct cases. Which TWO documented limitations should temper that plan? (Select TWO.)","options":[{"key":"A","text":"It survives only while the text stays inside the Claude interface and is lost on copy-paste."},{"key":"B","text":"The signal is weak or absent in short passages and sparse in code or terminology-bound text."},{"key":"C","text":"It can be switched off by the user for a given conversation."},{"key":"D","text":"It is embedded only in the first paragraph of a response."},{"key":"E","text":"It reliably separates text Claude wrote from text Claude only lightly edited."},{"key":"F","text":"It cannot identify an individual user, organisation or conversation."}],"correct":["B","F"],"explanation":"The watermark works by seeding the choice among equally valid word options from a secret key plus the preceding words, producing a machine-detectable statistical pattern. Anthropic states that detection does not work well on small samples, where there are fewer word choices to go on, and that code, which often has to be exact, generally carries less watermarking than other text. It also states that nothing in the watermark or its key would let anyone recover information about the user, and that light editing probably will not remove the watermark while a complete rewrite replacing every word will.","rationales":{"A":"The pattern lives in the word choices themselves, so it survives copy-paste; a full rewrite is what destroys it.","C":"No user opt-out or per-conversation switch for watermarking is documented.","D":"The signal accumulates across the whole passage rather than being confined to the opening paragraph.","E":"Light editing probably will not remove the watermark, so its presence does not separate text Claude wrote from text Claude only touched up."},"sources":[{"title":"How Claude's text watermarking works - Anthropic","url":"https://www.anthropic.com/news/claude-text-watermark","date":"2026-08-14","basis":"published"}],"tags":["watermarking","limitations","attribution","exam-trap"]},{"id":"D6-030","domain":"D6","objective":"Understand the ethical implications of AI usage","type":"single","difficulty":"easy","scenario":true,"stem":"A communications team asks Claude to summarise both sides of a contested policy debate for a client briefing. The draft reads well and the briefing is due in an hour. What is the minimum responsible step before it is sent?","options":[{"key":"A","text":"Send it as drafted, since balance on contested topics is exactly what the model's published evaluations are designed to guarantee for every individual response."},{"key":"B","text":"Ask Claude whether its own summary is balanced, and send the briefing unchanged as soon as the model confirms that it is."},{"key":"C","text":"Read the draft for one-sided framing and check it against the underlying sources, because model-level testing does not make any single output balanced."},{"key":"D","text":"Add a note to the briefing saying the summary was produced with AI, which passes the judgement about balance across to the client."}],"correct":["C"],"explanation":"Anthropic's published even-handedness results measure a model in aggregate across a fixed evaluation set. They do not certify that a particular summary is balanced, so a consequential document still needs a human to read it against its sources. That critical evaluation of output is the Discernment competency in Anthropic's AI Fluency framework.","rationales":{"A":"Aggregate evaluation results describe the model, not the individual response about to be sent to a client.","B":"Asking a model to grade its own output adds no independent evidence that the summary is even-handed.","D":"Disclosure tells the client how the text was made; it does not correct one-sided framing or transfer the duty to check."},"sources":[{"title":"Anthropic's Transparency Hub - Model Report","url":"https://www.anthropic.com/transparency","date":"2026-08-17","basis":"published"},{"title":"AI Fluency Framework: Foundations - Anthropic","url":"https://www.anthropic.com/ai-fluency","date":"2026-08-19","basis":"verified-live"}],"tags":["bias","discernment","verification","ethics"]},{"id":"D6-031","domain":"D6","objective":"Understand the ethical implications of AI usage","type":"single","difficulty":"easy","scenario":true,"stem":"Before approving a new Claude use case, a governance board wants documented evidence of a model's benchmarked capabilities, safety evaluation summaries, testing methodology and knowledge cutoff. Where should they look?","options":[{"key":"A","text":"The Usage Policy, which lists capability limits for each released model."},{"key":"B","text":"Anthropic's Transparency Hub, which centralises model reports and model cards."},{"key":"C","text":"The Trust Portal, which is the source for model evaluation methodology."},{"key":"D","text":"The organisation's admin console, which surfaces per-model evaluation results for the plan's enabled models."}],"correct":["B"],"explanation":"The Transparency Hub centralises model reports and model cards covering benchmarked capabilities, safety evaluation summaries, testing methodology, Responsible Scaling Policy evaluations, knowledge cutoff dates and access surfaces. It is the canonical place to check a model's documented limitations before approving a use case.","rationales":{"A":"The Usage Policy sets rules for permitted use; it does not publish per-model capability or evaluation data.","C":"The Trust Portal at trust.anthropic.com is where compliance artefacts such as certifications are requested, not where model evaluations are published.","D":"Admin consoles manage users and settings; they do not publish model evaluation reports."},"sources":[{"title":"Anthropic's Transparency Hub - Model Report","url":"https://www.anthropic.com/transparency","date":"2026-08-17","basis":"published"}],"tags":["transparency-hub","model-cards","due-diligence"]},{"id":"D6-032","domain":"D6","objective":"Understand the ethical implications of AI usage","type":"single","difficulty":"medium","scenario":false,"stem":"Anthropic signed the EU Code of Practice on Transparency of AI-Generated Content, published by the European Commission in July 2026, alongside around 190 other signatories. What is the relationship between the Code and the binding EU requirement?","options":[{"key":"A","text":"The Code is voluntary; what binds providers is the EU requirement to mark AI-generated content, which applied from 2 August 2026."},{"key":"B","text":"The Code is mandatory for every provider placing an AI system on the EU market, and signing it is the way in which compliance is formally recorded."},{"key":"C","text":"Signing the Code replaces the underlying EU transparency obligations with the Code's own lighter, self-assessed requirements for signatories."},{"key":"D","text":"Signing the Code grants signatories an exemption from transparency penalties for their first two years of commercial operation in the EU."}],"correct":["A"],"explanation":"Anthropic states that it signed the EU Code of Practice on Transparency of AI-Generated Content in July 2026 along with several other major model providers and around 190 signatories in total, and that it is implementing watermarking to comply with the EU AI Act. The Code is a voluntary instrument. The binding requirement is the EU obligation that providers serving its market mark AI-generated content, which applied as of 2 August 2026, with a transition period for models launched before that date. Signing is reported as a route to demonstrating conformity, but the obligation itself comes from the AI Act.","rationales":{"B":"The Code is voluntary; it is the AI Act transparency obligation, not the Code, that binds providers in the EU market.","C":"Following the Code is a way of meeting the underlying obligations rather than substituting a lighter regime for them.","D":"No penalty holiday follows from signing, because a voluntary code cannot suspend a statutory obligation."},"sources":[{"title":"How Claude's text watermarking works - Anthropic","url":"https://www.anthropic.com/news/claude-text-watermark","date":"2026-08-14","basis":"published"},{"title":"Anthropic starts marking all of Claude's output worldwide as EU transparency rules take effect - TNW","url":"https://thenextweb.com/news/anthropic-watermarks-claude-output-eu-ai-act-article-50","date":"2026-08-12","basis":"published"}],"tags":["eu-ai-act","code-of-practice","transparency","exam-trap"]},{"id":"D7-001","domain":"D7","objective":"Identify, diagnose, and resolve issues with underperforming prompts or poor outputs","type":"single","difficulty":"medium","scenario":true,"stem":"A bid manager pastes a large tender document plus eight supporting attachments into a single claude.ai conversation. Claude responds with 'Your message will exceed the length limit for this chat.' She still needs to work on the tender today. What does Anthropic's documented guidance tell her to do?","options":[{"key":"A","text":"Reduce the content she is sending by attaching fewer or smaller files, or start a new conversation."},{"key":"B","text":"Report the message at status.claude.com and wait for the incident to be marked resolved."},{"key":"C","text":"Wait for her 5-hour usage window to reset, then send exactly the same message again."},{"key":"D","text":"Move to a higher-priced plan, since the paid tiers do not apply a maximum length to any single chat."}],"correct":["A"],"explanation":"Anthropic's error-message troubleshooting article attributes this string to input exceeding the maximum allowed message length, and the message itself names the documented fixes: try attaching fewer or smaller files, or start a new conversation. It is a length problem, not an availability or entitlement problem.","rationales":{"B":"status.claude.com covers genuine service incidents. A length-limit message is a normal validation response to the user's own input and is not an incident to report.","C":"This is a length-limit message, not a usage-limit message. Waiting for the 5-hour session window to reset changes nothing, because resending the same over-length input will produce the same error.","D":"The maximum message and chat length is a constraint on the input being sent, and it applies on every plan. The documented remedies are attaching fewer or smaller files or starting a new conversation, not upgrading."},"sources":[{"title":"Troubleshoot Claude error messages","url":"https://support.claude.com/en/articles/12466728-troubleshoot-claude-error-messages","date":"2026-05-18","basis":"published"}],"tags":["length-limit","error-messages","claude.ai","attachments"]},{"id":"D7-002","domain":"D7","objective":"Identify, diagnose, and resolve issues with underperforming prompts or poor outputs","type":"single","difficulty":"medium","scenario":true,"stem":"A procurement analyst's long-standing prompt for comparing supplier contracts has started returning vague, drifting answers. Her manager suggests moving the team to a higher plan tier and a larger model to fix it. Following Anthropic's documented approach to an unhelpful answer, what should she do FIRST?","options":[{"key":"A","text":"Move the team to the larger model at once, because answer quality tracks model size."},{"key":"B","text":"Work through the prompt remedies: state the ask clearly, add context, and break it into substeps."},{"key":"C","text":"Raise the effort setting to its maximum and leave the prompt itself exactly as it is."},{"key":"D","text":"Upgrade the plan tier first, since higher tiers are documented to produce more accurate answers."}],"correct":["B"],"explanation":"Anthropic's help centre gives four ordered remedies for an unhelpful answer: explain your ask simply and clearly; include as much context as possible, as though instructing someone with no background knowledge; break down complex requests into substeps; and give Claude feedback through follow-ups, clarifications or a request to rewrite. The prompt is what gets examined first. Anthropic's prompt engineering overview separately notes that not every failing result is best solved by prompt engineering, but the problems it points at model selection to solve are latency and cost.","rationales":{"A":"Model selection is the documented lever for latency and cost. Reaching for a larger model before checking clarity, context and structure skips every documented remedy for a weak answer.","C":"Effort governs how much the model thinks, not whether the request is clear. Leaving an under-specified prompt untouched leaves the actual defect in place while consuming more usage.","D":"Plan tier governs usage allowances and feature access, not answer accuracy. No documentation ties response quality to the price of the subscription."},"sources":[{"title":"My prompt isn't giving me a helpful answer | Claude Help Center","url":"https://support.claude.com/en/articles/7996857-my-prompt-isn-t-giving-me-a-helpful-answer","date":"2026-03-16","basis":"published"},{"title":"Prompt engineering overview - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview","date":"2026-07-24","basis":"verified-live"}],"tags":["triage-order","help-centre-remedies","prompt-before-model","first"]},{"id":"D7-003","domain":"D7","objective":"Identify, diagnose, and resolve issues with underperforming prompts or poor outputs","type":"single","difficulty":"medium","scenario":true,"stem":"A communications lead has already replaced her prohibition with a positive instruction ('Compose your response as smoothly flowing prose paragraphs'), but Claude still returns heavily bulleted markdown. Her own brief is written as a dense bulleted list. Which documented lever should she try NEXT?","options":[{"key":"A","text":"Ask Claude to confirm at the end of each draft that no markdown was used anywhere."},{"key":"B","text":"Add the original 'do not use markdown or bullet points' line back alongside the positive one."},{"key":"C","text":"Rewrite the brief itself in plain prose, since prompt style influences response style."},{"key":"D","text":"Lower the effort setting, because effort is the documented control for output structure."}],"correct":["C"],"explanation":"Anthropic lists four format-steering levers in order. She has already applied the first (say what to do rather than what not to do). The next documented lever is matching prompt style to the desired output: the formatting style used in your prompt may influence Claude's response style, and removing markdown from your prompt can reduce the volume of markdown in the output. The remaining lever after that is detailed explicit formatting guidance.","rationales":{"A":"Asking for self-confirmation is a verification step, not a steering step. It reports on the format after the fact and does nothing to change how the draft is produced.","B":"Reinstating the prohibition reverses the lever she has already applied correctly. Telling Claude what to do outranks telling it what not to do, and stacking both back together does not add a new mechanism.","D":"Effort governs how much the model thinks; it is not a formatting control and does not reliably reshape visible output structure or style."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-07-24","basis":"verified-live"}],"tags":["format-control","style-matching","markdown","lever-order"]},{"id":"D7-004","domain":"D7","objective":"Identify, diagnose, and resolve issues with underperforming prompts or poor outputs","type":"single","difficulty":"easy","scenario":true,"stem":"An office manager receives an answer that is broadly right but omits one section she needs. The fourth remedy in Anthropic's help centre article on unhelpful answers applies directly here. What is it?","options":[{"key":"A","text":"Submit the missing section to Anthropic through the status page so the gap is logged."},{"key":"B","text":"Open a brand new conversation and send the identical prompt again until a complete answer comes back."},{"key":"C","text":"Raise the effort level and resend, because completeness is governed by the effort setting."},{"key":"D","text":"Reply in the same conversation with follow-up instructions, clarifications, or a rewrite request."}],"correct":["D"],"explanation":"The four ordered remedies are: explain your ask simply and clearly; include as much context as possible; break down complex requests into substeps; and give Claude feedback, meaning you provide Claude with follow-up instructions, clarifications, or ask it to rewrite an answer. Iterative refinement through follow-up communication is the documented response to an answer that is close but incomplete.","rationales":{"A":"The status page publishes service incidents. It is not a route for correcting an individual answer, and an incomplete answer is not an incident.","B":"Resending an unchanged prompt supplies no new information, so there is no documented reason to expect a different result. The listed remedy is to give Claude feedback, not to repeat the request.","C":"Effort governs how much the model thinks, not which sections it includes. A missing requirement is addressed by stating the requirement."},"sources":[{"title":"My prompt isn't giving me a helpful answer | Claude Help Center","url":"https://support.claude.com/en/articles/7996857-my-prompt-isn-t-giving-me-a-helpful-answer","date":"2026-03-16","basis":"published"}],"tags":["follow-up-feedback","help-centre-remedies","iteration-in-conversation"]},{"id":"D7-005","domain":"D7","objective":"Identify, diagnose, and resolve issues with underperforming prompts or poor outputs","type":"single","difficulty":"hard","scenario":true,"stem":"An operations lead has a reusable prompt that pastes a customer email thread, a policy extract and her own instructions into one continuous block of text. Claude sometimes treats sentences from the pasted email as instructions and answers the wrong question. Which documented change addresses this?","options":[{"key":"A","text":"Wrap each kind of content in its own tag, such as instructions, context and input."},{"key":"B","text":"Repeat her instructions word for word at the very end of the prompt as a reminder."},{"key":"C","text":"Ask Claude to restate the instructions it identified before it answers the question."},{"key":"D","text":"Put her own instructions in capital letters so they stand out from the pasted material."}],"correct":["A"],"explanation":"Anthropic documents XML tags as the way to help Claude parse complex prompts unambiguously, especially when a prompt mixes instructions, context, examples and variable inputs. Wrapping each type of content in its own tag, for example instructions, context and input, reduces misinterpretation. The same guidance advises consistent, descriptive tag names and nesting where the content has a natural hierarchy.","rationales":{"B":"Repetition adds tokens without creating a boundary, and the pasted email still sits in the same undifferentiated block, so the same sentences can still be read as instructions.","C":"Asking Claude to restate its understanding is a verification step. It may surface the misreading after the fact but does not prevent it, and adds over-verification overhead on every run.","D":"Capitalisation is emphasis, not structure. It creates no boundary between the instruction block and the pasted material, which is what the model is misreading."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-07-24","basis":"verified-live"}],"tags":["xml-tags","prompt-structure","mixed-content","misinterpretation"]},{"id":"D7-006","domain":"D7","objective":"Identify, diagnose, and resolve issues with underperforming prompts or poor outputs","type":"single","difficulty":"medium","scenario":true,"stem":"A finance manager asks Claude to explain a variance calculation in writing. The explanation is correct, but the formulas come back in LaTeX notation that her word processor renders as raw markup. What does Anthropic document as the fix?","options":[{"key":"A","text":"Lower the effort setting, which makes Claude choose simpler mathematical notation."},{"key":"B","text":"Instruct Claude to answer in plain text and write expressions with ordinary characters."},{"key":"C","text":"Switch to a smaller model, since only the larger models default to LaTeX notation."},{"key":"D","text":"Accept it and convert afterwards, since the notation default cannot be changed by prompting."}],"correct":["B"],"explanation":"Anthropic documents that Claude's latest models default to LaTeX for mathematical expressions, equations and technical explanations, and gives a prompt-level remedy for users who prefer plain text: format the response in plain text only, with no LaTeX, MathJax or markup notation, writing math expressions with standard text characters such as / for division, * for multiplication and ^ for exponents.","rationales":{"A":"Effort governs how much the model thinks, not the notation it renders output in. It is not a formatting control.","C":"The LaTeX default is documented as behaviour of Claude's latest models generally, not a property of one size tier, so changing model is not the documented control.","D":"The default is explicitly overridable by prompting, and Anthropic publishes the instruction to do it, so accepting a manual conversion step every time is unnecessary rework."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-07-24","basis":"verified-live"}],"tags":["latex-output","plain-text","format-control","business-documents"]},{"id":"D7-007","domain":"D7","objective":"Adjust approach based on feedback and results","type":"single","difficulty":"medium","scenario":true,"stem":"Mid-morning, several staff report seeing 'Due to unexpected capacity constraints, Claude is unable to respond...' The operations lead checks status.claude.com and sees all systems operational. The team asks whether to raise a major incident with the vendor. What is the MOST appropriate response?","options":[{"key":"A","text":"Move everyone to Claude Desktop, which draws on a separate pool of capacity."},{"key":"B","text":"Assume the 5-hour session limit was reached and tell staff to wait for the window to reset."},{"key":"C","text":"Treat it as normal load management and have people retry in a few minutes."},{"key":"D","text":"Raise a major incident, since a message absent from the status page means an unreported outage."}],"correct":["C"],"explanation":"Anthropic explicitly distinguishes capacity constraints from outages: this message reflects high system-wide demand rather than an outage, and the documented remedy is to try again after a few minutes, as the issue typically resolves as demand shifts. Only genuine service incidents are published on the status page.","rationales":{"A":"claude.ai, Claude Desktop and Claude Code all draw on the same usage limit and the same service. Switching surface does not obtain separate capacity.","B":"Usage limits produce their own distinct banners ('Approaching 5-hour limit.', '5-hour limit reached - resets [time].'). A capacity-constraint message is a different failure mode with a different remedy.","D":"This inverts the documented rule. The message is not an outage, so its absence from the status page is expected rather than evidence of a hidden incident."},"sources":[{"title":"Troubleshoot Claude error messages","url":"https://support.claude.com/en/articles/12466728-troubleshoot-claude-error-messages","date":"2026-05-18","basis":"published"},{"title":"How do usage and length limits work?","url":"https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work","date":"2026-07-13","basis":"published"}],"tags":["capacity-constraints","status-page","incident-triage","error-messages"]},{"id":"D7-008","domain":"D7","objective":"Adjust approach based on feedback and results","type":"single","difficulty":"easy","scenario":true,"stem":"A training coordinator has collected examples from staff of Claude answers that were unhelpful or misleading, and wants to pass them back to Anthropic. Which route does Anthropic's help centre document for this?","options":[{"key":"A","text":"Ask Claude in a new chat to file the report, since it can log issues on a user's behalf."},{"key":"B","text":"Take no action, because an individual response cannot be reported once the chat is closed."},{"key":"C","text":"Post the examples on status.claude.com so that the model can be corrected centrally."},{"key":"D","text":"Use the thumbs-down button on the response, or write to Anthropic with the detail."}],"correct":["D"],"explanation":"Anthropic documents two feedback routes for a response that was unhelpful or misleading: the thumbs-down button, which flags that particular response, and writing to Anthropic with your thoughts or suggestions. Both are user-initiated quality feedback channels rather than incident reporting.","rationales":{"A":"Claude does not file support tickets or feedback on a user's behalf. Feedback reaches Anthropic through the thumbs-down control or a written message.","B":"Feedback is explicitly invited. The thumbs-down button and written feedback both exist precisely so that unhelpful responses can be reported.","C":"status.claude.com publishes service incidents. It is a one-way status channel, not a quality-feedback mechanism, and posting response examples there is not a documented route."},"sources":[{"title":"Claude is providing incorrect or misleading responses. What's going on?","url":"https://support.claude.com/en/articles/8525154-claude-is-providing-incorrect-or-misleading-responses-what-s-going-on","date":"2026-03-16","basis":"published"}],"tags":["feedback-channel","thumbs-down","status-page-misuse","help-centre"]},{"id":"D7-009","domain":"D7","objective":"Adjust approach based on feedback and results","type":"single","difficulty":"medium","scenario":true,"stem":"A consultant cannot sign in and sees 'There was an error logging you in'. Colleagues on the same plan are working normally at the same moment. Which sequence matches Anthropic's documented troubleshooting for this message?","options":[{"key":"A","text":"Disable VPN and browser extensions, clear cache and cookies, then check the status page."},{"key":"B","text":"Buy a usage bundle, since sign-in fails once the weekly usage limit has been exhausted."},{"key":"C","text":"Reinstall the operating system, as the documented cause is a corrupted local user profile."},{"key":"D","text":"Wait five hours for the session window to reset, which restores access to the account."}],"correct":["A"],"explanation":"Anthropic attributes this message to various technical issues during authentication and lists the remedies as disabling a VPN, deactivating browser extensions, clearing cache and cookies, and checking the status page. Colleagues working normally makes a service-wide problem unlikely, which is why the local, client-side steps come before escalation.","rationales":{"B":"Usage limits produce their own distinct banners and restrict what Claude will process, not whether the account can authenticate. Credits do not affect sign-in.","C":"This is not a documented cause or remedy, and it is disproportionate to a message whose published fixes are all lightweight browser-side steps.","D":"The 5-hour session window governs usage consumption, not authentication. Waiting does not address a login failure."},"sources":[{"title":"Troubleshoot Claude error messages","url":"https://support.claude.com/en/articles/12466728-troubleshoot-claude-error-messages","date":"2026-05-18","basis":"published"}],"tags":["login-error","authentication","client-side-troubleshooting","status-page"]},{"id":"D7-010","domain":"D7","objective":"Adjust approach based on feedback and results","type":"single","difficulty":"easy","scenario":false,"stem":"In a chat where no web search was used, Claude confidently describes a product launch that never took place. According to Anthropic's help centre, what best explains this?","options":[{"key":"A","text":"Claude always states when it does not know something, so the answer is probably right."},{"key":"B","text":"Claude can hallucinate, and may lack up-to-date training data about current events."},{"key":"C","text":"Claude only produces incorrect answers when the account is close to its usage limit."},{"key":"D","text":"This is a service fault, and it will appear as an incident on the Claude status page."}],"correct":["B"],"explanation":"Anthropic describes hallucinated information as a byproduct of some of the current limitations of frontier generative AI models, and notes that Claude might not have been trained on the most up-to-date information and may get confused when prompted about current events. The documented user-side responses are to scrutinise high-stakes advice carefully and to check original sources.","rationales":{"A":"Claude does not reliably announce the boundary of its knowledge, and self-reported confidence is not a reliable accuracy signal. A confident tone is not evidence of correctness.","C":"Nothing in the documentation links accuracy to how much of the usage limit has been consumed. Usage limits govern how much work can be done, not how correct it is.","D":"An incorrect answer is a documented model limitation rather than a service incident, so it will not appear on the status page, which covers availability."},"sources":[{"title":"Claude is providing incorrect or misleading responses. What's going on?","url":"https://support.claude.com/en/articles/8525154-claude-is-providing-incorrect-or-misleading-responses-what-s-going-on","date":"2026-03-16","basis":"published"}],"tags":["hallucination","training-cutoff","current-events","failure-modes"]},{"id":"D7-011","domain":"D7","objective":"Adjust approach based on feedback and results","type":"single","difficulty":"medium","scenario":true,"stem":"A knowledge manager must demonstrate that a revised Claude prompt for triaging support tickets genuinely performs better than the old one. She has time to build one evaluation set. Which design best matches Anthropic's published evaluation guidance?","options":[{"key":"A","text":"A set of ten cases hand-graded by the prompt's author against her own sense of quality."},{"key":"B","text":"A side-by-side comparison of a few outputs, with the team voting on the version they prefer."},{"key":"C","text":"A large set of automatically graded cases with measurable criteria, graded by a different model."},{"key":"D","text":"A large set graded by the same model that produced the outputs, since it knows the intent."}],"correct":["C"],"explanation":"Anthropic's evaluation guidance says success criteria should be SMART (specific, measurable, achievable, relevant, time-bound), that you should prioritise the volume of automatically graded questions over a small number of hand-graded ones, and that it is best practice to use a different model to grade an output than the model that generated it.","rationales":{"A":"Ten hand-graded cases is exactly the low-volume, subjective pattern Anthropic advises against, and grading by the prompt's own author adds bias to an already small sample.","B":"Preference voting over a handful of outputs gives neither volume nor measurable criteria, so it cannot show whether the change is a real improvement or noise.","D":"Anthropic explicitly recommends a different model as grader. Self-grading is the documented anti-pattern because the generating model shares the blind spots being tested for."},"sources":[{"title":"Define success criteria and build evaluations - Claude Platform Docs","url":"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests","date":"2026-07-24","basis":"verified-live"}],"tags":["evaluation","smart-criteria","llm-as-judge","iteration"]},{"id":"D7-012","domain":"D7","objective":"Adjust approach based on feedback and results","type":"multi","difficulty":"hard","scenario":true,"stem":"A support manager is writing a one-page triage card so first-line staff can distinguish normal Claude behaviour from a genuine fault. Select TWO statements that are accurate and belong on the card.","options":[{"key":"A","text":"'Due to unexpected capacity constraints' is normal load management and will not show on status.claude.com."},{"key":"B","text":"The banner '5-hour limit resets [time] - continuing with usage credits' means work has stopped until reset."},{"key":"C","text":"'Approaching 5-hour limit.' is a warning only; work continues until '5-hour limit reached' appears."},{"key":"D","text":"Any message not listed on status.claude.com should be escalated as a suspected unreported incident."},{"key":"E","text":"Claude Code and claude.ai hold separate allowances, so switching surface restores lost capacity."}],"correct":["A","C"],"explanation":"Anthropic classifies the capacity-constraints message as high system-wide demand rather than an outage, with retry as the remedy and no status-page entry. The usage banners escalate in a documented order: 'Approaching 5-hour limit.' warns that the session ceiling is near, while '5-hour limit reached - resets [time].' is the message that blocks further work until the stated reset time.","rationales":{"B":"This inverts the meaning. The 'continuing with usage credits' variant appears only when usage credits are enabled and signals that work continues on credits rather than stopping.","D":"Most user-visible messages are normal behaviour and are deliberately absent from the status page. Escalating everything not listed there would flood the incident process with expected conditions.","E":"Usage on claude.ai, Claude Desktop and Claude Code all counts against the same limit. They are not separate allowances."},"sources":[{"title":"Troubleshoot Claude error messages","url":"https://support.claude.com/en/articles/12466728-troubleshoot-claude-error-messages","date":"2026-05-18","basis":"published"},{"title":"How do usage and length limits work?","url":"https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work","date":"2026-07-13","basis":"published"}],"tags":["triage","usage-banners","status-page","shared-limits"]},{"id":"D7-013","domain":"D7","objective":"Optimize workflows for efficiency and effectiveness","type":"single","difficulty":"easy","scenario":false,"stem":"Which factors does Anthropic list as determining how quickly you consume your claude.ai usage limit?","options":[{"key":"A","text":"Which surface is used, since Claude Code and claude.ai each meter their own allowance."},{"key":"B","text":"The number of conversations left open, the time of day, and how long the account has existed."},{"key":"C","text":"The number of Projects created and the total volume of files stored inside each Project."},{"key":"D","text":"Conversation length and complexity, the features used, the model selected, and the effort level."}],"correct":["D"],"explanation":"Anthropic lists the usage-consuming factors as the length and complexity of conversations, the features used such as extended thinking, which Claude model is selected, and the effort level selected. It also states that usage on claude.ai, Claude Desktop and Claude Code all counts against the same limit.","rationales":{"A":"This is the documented misconception. All three surfaces draw on the same limit, so surface choice does not change the allowance.","B":"None of these is a documented factor. Usage is driven by what is processed and generated, not by open tabs, clock time or account age.","C":"Content placed in a Project knowledge base is cached for reuse across conversations, so stored Project volume is not itself listed as a consumption driver."},"sources":[{"title":"How do usage and length limits work?","url":"https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work","date":"2026-07-13","basis":"published"},{"title":"Usage limit best practices","url":"https://support.claude.com/en/articles/9797557-usage-limit-best-practices","date":"2026-06-02","basis":"published"}],"tags":["usage-limits","effort","model-selection","shared-limits"]},{"id":"D7-014","domain":"D7","objective":"Optimize workflows for efficiency and effectiveness","type":"single","difficulty":"easy","scenario":false,"stem":"On the Pro plan, when does the weekly usage limit reset?","options":[{"key":"A","text":"At a fixed time each week assigned to the account, which is shown in Settings > Usage."},{"key":"B","text":"Five hours after the session limit was last reached, in step with the session window."},{"key":"C","text":"On the monthly subscription anniversary date, alongside the billing cycle."},{"key":"D","text":"At midnight every Monday, expressed in the local time zone set on the account profile page."}],"correct":["A"],"explanation":"The Pro plan has a session-based limit that resets every five hours plus a separate weekly limit that applies across all models. The weekly limit resets at a fixed time each week assigned to the individual account, and that time is visible in Settings > Usage.","rationales":{"B":"That describes the separate 5-hour session window. The weekly limit is a distinct control that is not driven by session resets.","C":"The weekly reset is deliberately decoupled from billing. Tying it to the subscription anniversary is a common misconception the documentation contradicts.","D":"There is no universal Monday-midnight reset. Reset times are assigned per account so that load is spread, which is why the documentation points users to Settings > Usage."},"sources":[{"title":"What is the Pro plan?","url":"https://support.claude.com/en/articles/8325606-what-is-the-pro-plan","date":"2026-06-10","basis":"published"}],"tags":["weekly-limit","5-hour-session-limit","settings->-usage","pro-plan"]},{"id":"D7-015","domain":"D7","objective":"Optimize workflows for efficiency and effectiveness","type":"single","difficulty":"medium","scenario":true,"stem":"A client-services consultant pastes the same 40-page delivery methodology into every new chat so Claude follows the house approach. She is hitting usage limits by Thursday most weeks. Which change is the MOST effective documented remedy?","options":[{"key":"A","text":"Paste the methodology in smaller pieces spread over several messages in the same chat."},{"key":"B","text":"Upload the methodology once into a Project knowledge base and work inside that Project."},{"key":"C","text":"Buy a usage bundle so that the pasted methodology stops counting against her limits."},{"key":"D","text":"Keep a single very long running conversation so the methodology is only pasted once ever."}],"correct":["B"],"explanation":"Anthropic's usage-limit best practices tell users to use project knowledge bases effectively, uploading documents to projects for caching benefits across multiple uses, and list projects with retrieval-augmented generation as a documented remedy for accounts that repeatedly hit limits. A single upload is cheaper than re-pasting the same material into every conversation.","rationales":{"A":"Splitting the same content across several messages does not reduce what the conversation carries. Anthropic's guidance is to plan the conversation and provide background upfront so fewer messages are needed, not to drip-feed the same material.","C":"Usage bundles supplement the plan after included usage is exhausted; they do not stop content from consuming usage, and they do not address the underlying repeated-content waste.","D":"Anthropic recommends starting fresh conversations rather than extending lengthy ones, because longer conversations that trigger automatic context management consume more of your usage limit."},"sources":[{"title":"Usage limit best practices","url":"https://support.claude.com/en/articles/9797557-usage-limit-best-practices","date":"2026-06-02","basis":"published"},{"title":"How do usage and length limits work?","url":"https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work","date":"2026-07-13","basis":"published"}],"tags":["projects","knowledge-base-caching","repeated-context","usage-limits"]},{"id":"D7-016","domain":"D7","objective":"Optimize workflows for efficiency and effectiveness","type":"multi","difficulty":"medium","scenario":true,"stem":"A team lead's analysts repeatedly reach the 5-hour usage limit by mid-afternoon and lose working time. Select TWO actions Anthropic documents for accounts that repeatedly hit usage limits.","options":[{"key":"A","text":"Keep one long conversation open per analyst rather than starting new ones."},{"key":"B","text":"Turn off tools and connectors that are not needed for the work in hand."},{"key":"C","text":"Raise the maximum response length so fewer follow-up messages are needed."},{"key":"D","text":"Wait for the weekly limit to reset, which also clears the 5-hour session limit."},{"key":"E","text":"Have analysts sign in to Claude Desktop instead, which carries its own allowance."},{"key":"F","text":"Lower the effort level for routine tasks that do not need deep reasoning."}],"correct":["B","F"],"explanation":"Anthropic's documented remedies for repeatedly hitting usage limits are to purchase usage credits, start fresh conversations rather than extending lengthy chats, use projects with retrieval-augmented generation, disable non-essential tools such as web search when they are not needed, and lower effort levels for routine tasks. Options A and B are two of those five.","rationales":{"A":"The documented advice is the opposite: start fresh conversations rather than extending lengthy chats, because longer conversations that trigger automatic context management consume more of your usage limit.","C":"A higher response ceiling does not reduce consumption; longer generated responses consume more, and the documented remedy for repeated follow-ups is to plan the conversation and provide background upfront.","D":"The 5-hour session limit and the weekly limit are separate controls on their own reset cycles; the weekly reset does not clear the session window.","E":"claude.ai, Claude Desktop and Claude Code all count against the same limit, so changing surface gains nothing."},"sources":[{"title":"How do usage and length limits work?","url":"https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work","date":"2026-07-13","basis":"published"},{"title":"Usage limit best practices","url":"https://support.claude.com/en/articles/9797557-usage-limit-best-practices","date":"2026-06-02","basis":"published"}],"tags":["usage-limits","effort","connectors","new-conversations"]},{"id":"D7-017","domain":"D7","objective":"Optimize workflows for efficiency and effectiveness","type":"multi","difficulty":"hard","scenario":true,"stem":"An operations analyst has been running one very long research conversation. It now responds slowly and has started missing details established earlier in the thread. A colleague tells her to 'just turn caching on'. Select TWO actions that would actually reduce the amount of context the work is carrying.","options":[{"key":"A","text":"Start a fresh conversation and re-establish only the material still needed for the remaining work."},{"key":"B","text":"Move the core reference documents into a Project, where retrieval fetches only the relevant excerpts."},{"key":"C","text":"Move to a model with a larger nominal window, which prevents accuracy loss as tokens accumulate."},{"key":"D","text":"Enable prompt caching, which takes the cached material out of the context window."},{"key":"E","text":"Raise the maximum response length so more of the window becomes available to the conversation."}],"correct":["A","B"],"explanation":"The documented context-bloat remedies include starting a new conversation and using Projects, where retrieval-augmented generation activates automatically once knowledge approaches the context limit and Claude fetches only relevant excerpts through the project knowledge search tool. Both genuinely reduce how much material is being carried.","rationales":{"C":"A larger window delays the hard limit but does not prevent context rot, the documented degradation of accuracy and recall as token count grows. Anthropic states that more context is not automatically better.","D":"This is the classic trap. Prompt caching changes what you pay for tokens, not whether they occupy the window; cached prefixes still consume the full context space.","E":"Raising the response ceiling changes how much Claude may generate. It removes nothing from the material the conversation is already carrying, so it does not reduce context at all."},"sources":[{"title":"Context windows - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/context-windows","date":"2026-07-24","basis":"verified-live"},{"title":"Retrieval augmented generation (RAG) for projects","url":"https://support.claude.com/en/articles/11473015-retrieval-augmented-generation-rag-for-projects","date":"2026-03-16","basis":"published"},{"title":"How do usage and length limits work?","url":"https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work","date":"2026-07-13","basis":"published"}],"tags":["context-bloat","context-rot","prompt-caching-myth","projects-rag"]},{"id":"D7-018","domain":"D7","objective":"Optimize workflows for efficiency and effectiveness","type":"multi","difficulty":"medium","scenario":true,"stem":"A marketing manager wants her team to get more out of the same plan without upgrading. Select THREE practices that Anthropic publishes as ways to stretch usage.","options":[{"key":"A","text":"Ask Claude to restate the earlier context at the start of each new message so nothing is lost."},{"key":"B","text":"Batch similar requests into a single message instead of sending them one at a time."},{"key":"C","text":"Raise the effort level on routine drafting so that fewer revision rounds are needed."},{"key":"D","text":"Review and edit a prompt before sending it rather than correcting it over several turns."},{"key":"E","text":"Split every task across several short chats so each one stays well under the length limit."},{"key":"F","text":"Provide the complete material in the first message rather than adding it turn by turn."}],"correct":["B","D","F"],"explanation":"Anthropic's published usage-stretching practices include starting by planning your conversations, being specific and concise, using chat search and memory instead of repeating information, batching similar requests in one message, reviewing and editing your prompt before sending, using project knowledge bases effectively, and monitoring consumption in Usage settings. Planning the conversation explicitly means considering what you need before messaging, combining related questions and providing background upfront, which reduces the number of back-and-forth messages needed.","rationales":{"A":"Restating context deliberately duplicates tokens every turn. Anthropic's guidance is the opposite: lean on chat search and memory rather than repeating information.","C":"Effort level is one of the factors that drives consumption, and Anthropic's documented advice is to lower effort for routine tasks, not raise it.","E":"Fragmenting work forces the same context to be re-supplied in each chat. The documented pattern is to plan the conversation and provide background upfront, not to split tasks by default."},"sources":[{"title":"Usage limit best practices","url":"https://support.claude.com/en/articles/9797557-usage-limit-best-practices","date":"2026-06-02","basis":"published"},{"title":"How do usage and length limits work?","url":"https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work","date":"2026-07-13","basis":"published"}],"tags":["usage-best-practices","batching","planning-conversations","prompt-review"]},{"id":"D7-019","domain":"D7","objective":"Optimize workflows for efficiency and effectiveness","type":"single","difficulty":"medium","scenario":true,"stem":"A team lead cannot tell what is driving her team through its allowance so quickly, and wants the conversation with them to rest on data rather than guesswork. Which documented step gives her that data?","options":[{"key":"A","text":"Ask Claude at the end of each chat to report how much of the allowance that chat used."},{"key":"B","text":"Read the monthly invoice, which itemises consumption by conversation and by feature."},{"key":"C","text":"Open Settings > Usage and review consumption against the session and weekly limits."},{"key":"D","text":"Check status.claude.com, which publishes per-account consumption alongside any incidents."}],"correct":["C"],"explanation":"Anthropic's usage-limit best practices include monitoring your consumption in Usage settings, tracking session and weekly limits through the Settings > Usage dashboard, and the Pro plan documentation points users to the same place for the fixed weekly reset time assigned to their account. Consumption is driven by conversation length and complexity, the features used, the model selected and the effort level, so the dashboard is the documented place to see what is actually being spent.","rationales":{"A":"Claude has no access to the account's usage metering, and a self-reported figure is not a documented source of consumption data.","B":"Billing documents cover the subscription, not per-conversation or per-feature consumption. The documented monitoring surface is Settings > Usage.","D":"status.claude.com publishes service incidents. It carries no account-level information of any kind, so it cannot show what the team is consuming."},"sources":[{"title":"Usage limit best practices","url":"https://support.claude.com/en/articles/9797557-usage-limit-best-practices","date":"2026-06-02","basis":"published"},{"title":"How do usage and length limits work?","url":"https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work","date":"2026-07-13","basis":"published"},{"title":"What is the Pro plan?","url":"https://support.claude.com/en/articles/8325606-what-is-the-pro-plan","date":"2026-06-10","basis":"published"}],"tags":["settings->-usage","usage-monitoring","consumption-drivers","claude.ai"]},{"id":"D7-020","domain":"D7","objective":"Optimize workflows for efficiency and effectiveness","type":"single","difficulty":"easy","scenario":false,"stem":"A team lead runs long working sessions in claude.ai and has code execution enabled. Someone on the team worries that once a conversation approaches the context window limit, earlier turns will be lost. What actually happens?","options":[{"key":"A","text":"It permanently deletes the oldest messages from the chat so that newer turns have room to continue."},{"key":"B","text":"It pauses the conversation until additional usage credits are purchased to extend the context window."},{"key":"C","text":"It locks the conversation, which must then be exported before any further messages can be sent in it."},{"key":"D","text":"Claude summarises earlier messages so the conversation can continue, and the full history stays viewable."}],"correct":["D"],"explanation":"Anthropic's usage and length limits article states that Claude summarises earlier messages to continue the conversation seamlessly, and that code execution must be enabled for this automatic context management. Earlier turns are condensed rather than deleted, and the full history remains viewable. Note that conversations which trigger automatic context management consume more of the usage limit, so starting a fresh conversation can still be the better move.","rationales":{"A":"Nothing is deleted. Earlier messages are summarised for the model's working context while the full history remains accessible to the user.","B":"Usage credits relate to usage limits, which are a separate control from the context window. The conversation is not held pending a purchase; it continues through summarisation.","C":"There is no lock-and-export step. Automatic context management is designed specifically so the conversation can keep going."},"sources":[{"title":"How do usage and length limits work?","url":"https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work","date":"2026-07-13","basis":"published"}],"tags":["automatic-context-management","claude.ai","code-execution","context-window","summarisation"]},{"id":"D7-021","domain":"D7","objective":"Optimize workflows for efficiency and effectiveness","type":"single","difficulty":"easy","scenario":false,"stem":"A Pro subscriber purchases a usage bundle. What does that bundle actually provide?","options":[{"key":"A","text":"Pre-purchased credits that are drawn on only once the plan's included usage is exhausted."},{"key":"B","text":"A separate allowance reserved for Claude Code that leaves claude.ai usage untouched."},{"key":"C","text":"A higher 5-hour and weekly limit for the remainder of the current billing period."},{"key":"D","text":"Removal of the per-chat length limit, so that long conversations run without interruption."}],"correct":["A"],"explanation":"Usage bundles are pre-purchased usage credits, sold at a discount, that activate only after the plan's included usage is exhausted. The balance is shared across Claude, Claude Desktop, Claude Mobile, Claude Code and Cowork rather than being reserved for one surface.","rationales":{"B":"The credit balance is shared across all Claude surfaces. Nothing about a bundle ring-fences capacity for a single product.","C":"Credits supplement the plan rather than raising the 5-hour or weekly limits. The limits themselves are unchanged; credits simply let work continue past them.","D":"The per-chat length limit is a context-length constraint, not a usage constraint, so credits have no effect on it."},"sources":[{"title":"Buy usage bundles","url":"https://support.claude.com/en/articles/14246112-buy-usage-bundles","date":"2026-05-18","basis":"published"},{"title":"Troubleshoot Claude error messages","url":"https://support.claude.com/en/articles/12466728-troubleshoot-claude-error-messages","date":"2026-05-18","basis":"published"}],"tags":["usage-bundles","usage-credits","shared-balance","plan-limits"]}]},{"format":"exam-pack","version":1,"id":"ccao-f-community","name":"CCAO-F Community Signal","vendor":"Anthropic","examCode":"CCAO-F","description":"67 supplementary items targeting the topics the unofficial ecosystem stresses. Keyed answers are still grounded in official Anthropic documentation. Deliberately not blueprint-proportional — weighted towards D4 and D6 where the core bank was thinnest.","config":{"examLength":60,"timeLimitMinutes":120,"passPercent":72,"scaleMin":100,"scaleMax":1000,"scalePass":720,"blueprintWeighted":false},"domains":[{"id":"D1","name":"Prompting & Task Execution","weight":14},{"id":"D2","name":"Output Evaluation & Validation","weight":21},{"id":"D3","name":"Product & Model Selection","weight":12},{"id":"D4","name":"Workflow Integration & Solution Design","weight":16},{"id":"D5","name":"Configuration & Knowledge Management","weight":12},{"id":"D6","name":"Governance, Risk & Responsible Use","weight":15},{"id":"D7","name":"Troubleshooting & Optimization","weight":10}],"items":[{"id":"D1-C001","domain":"D1","objective":"Create effective prompts for business and technical tasks","type":"multi","difficulty":"medium","scenario":true,"stem":"A category manager reuses a prompt for supplier correspondence that opens with the line \"You are our procurement lead.\" A colleague tells her two things: that the role line is what gives Claude procurement knowledge it would not otherwise have, and that a role shorter than a paragraph does nothing at all. Which TWO statements match Anthropic's documented guidance on giving Claude a role? (Select TWO.)","options":[{"key":"A","text":"Setting a role focuses Claude's behaviour and tone for the use case."},{"key":"B","text":"A role line supplies subject knowledge Claude would not otherwise hold."},{"key":"C","text":"Even a single sentence of role setting makes a difference."},{"key":"D","text":"A role has no effect until it runs to a paragraph or more of description."},{"key":"E","text":"A role removes the need to give background on the deal in the prompt."},{"key":"F","text":"A role makes the figures Claude quotes in that field safe to use unchecked."}],"correct":["A","C"],"explanation":"Anthropic's prompting best practices give role setting its own short section, and the effect they claim for it is behavioural rather than factual: setting a role focuses Claude's behaviour and tone for your use case, and even a single sentence makes a difference. Nothing in the guidance presents a role as a source of knowledge, as a replacement for background, or as any kind of accuracy guarantee. Context is handled separately: the same guidance devotes a section to adding context and motivation, and tells you to think of Claude as a brilliant but new employee who lacks context on your norms and workflows. The role line and the background are two different jobs.","rationales":{"B":"The documented claim is about behaviour and tone. A role does not add knowledge, and the manager still has to supply the deal facts herself.","D":"The guidance says the opposite in as many words: even a single sentence makes a difference.","E":"Adding context has its own section in the same guidance, and the new employee framing applies whether or not a role has been set.","F":"No part of the prompting guidance ties a role to the accuracy of anything Claude states, so the checking obligation is unchanged."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-20","basis":"verified-live"}],"tags":["role-prompting","tone","behaviour","misconception","multiple-response"],"notes":{"caveat":"KEYED FACT DROPS THE QUALIFIER THAT SCOPES IT, AND THE SCENARIO PUTS IT WHERE THE SOURCE DOES NOT. The cited page states, verbatim: 'Setting a role in the system prompt focuses Claude's behavior and t","signal":"Unofficial D1 material opens almost every worked prompt with a role line but does not say what Anthropic claims for it, which leaves candidates treating the role as a way of giving Claude expertise. Verified against bank #1: D1-008 keys where instructions live, D1-005 and D1-006 key context and positive specification, and D1-001 keys the golden rule, but no item in bank #1 keys the documented effect of role setting; before this item, role appeared in both banks only inside distractor text."}},{"id":"D1-C002","domain":"D1","objective":"Create effective prompts for business and technical tasks","type":"single","difficulty":"easy","scenario":true,"stem":"A new user has been told by a colleague that Claude works best on clipped keyword strings and that ordinary sentences waste the model's attention. She has been writing prompts such as \"supplier report Q3 summary bullets 200 words\" and keeps getting shapeless answers. What does Anthropic's own getting started guidance tell her to do?","options":[{"key":"A","text":"Keep the keyword style and add further keywords until the answer sharpens."},{"key":"B","text":"Use a fixed field layout such as TASK, INPUT and LIMIT for every request."},{"key":"C","text":"Speak to Claude naturally, as she would to a coworker, and be specific."},{"key":"D","text":"Change nothing, because the wording of a request does not affect the answer."}],"correct":["C"],"explanation":"Anthropic's getting started article tells users to speak to Claude like they would a coworker or friend, naturally and conversationally, and its getting started tips are to start with straightforward questions, be specific in requests, and iterate and refine. The keyword habit strips out precisely the words that carry the request: who the report is for, what the summary has to establish, and what would count as a good one. Writing the request as a sentence a
