explains this?","options":[{"key":"A","text":"Charts inside PDFs are never analysed, because visual analysis is reserved for standalone image files such as JPEG, PNG, GIF and WebP uploads."},{"key":"B","text":"Text and visual analysis applies only to PDFs of 100 pages or fewer; a PDF of 101 to 1000 pages is processed as text only throughout."},{"key":"C","text":"PDFs longer than 100 pages are rejected with an error message and must be split into smaller files before they can be uploaded."},{"key":"D","text":"Visual analysis is suspended for any file added to project knowledge rather than attached directly to a chat conversation."}],"correct":["B"],"explanation":"The rule is stated at document level, not page level: Claude analyses both text and visual elements in PDFs of 100 pages or fewer, and for PDFs from 101 to 1000 pages it processes text only and does not analyse visual elements. A 240-page file therefore receives no visual analysis anywhere in the document, so extracting the relevant pages into a shorter file is the practical workaround.","rationales":{"A":"Claude does analyse visual elements in PDFs, but only in documents of 100 pages or fewer.","C":"The upload ceiling is 1000 pages, not 100; a 240-page file uploads successfully and is processed as text.","D":"The page-count rule is what governs visual analysis here, and it applies wherever the PDF is attached."},"sources":[{"title":"Upload files to Claude | Anthropic Help Center","url":"https://support.claude.com/en/articles/8241126-upload-files-to-claude","date":"2026-07-22","basis":"published"}],"tags":["file-upload","pdf-limits","multimodal"]},{"id":"D5-008","domain":"D5","objective":"Configure Claude Projects with instructions and knowledge sources","type":"single","difficulty":"medium","scenario":true,"stem":"A support manager notices a new indicator on her project showing that it is now using retrieval augmented generation. She preferred the previous behaviour and asks how to switch retrieval off so that all documents are loaded at once. What should she be told?","options":[{"key":"A","text":"Retrieval can be switched off from the project settings menu next to the project instructions, after which the project loads every document at once again."},{"key":"B","text":"Only an organization Owner can disable retrieval, and the setting then applies across every project in the organization rather than to one project."},{"key":"C","text":"There is no user toggle; activation is automatic based on knowledge size, and the project converts back if its knowledge drops below the threshold."},{"key":"D","text":"She must delete the project and rebuild it from scratch, because retrieval cannot be reversed once it has been enabled for a project."}],"correct":["C"],"explanation":"Retrieval activates automatically when a project approaches or exceeds the context window limits, with no setup or configuration required, and if project knowledge later drops below that threshold Claude can automatically convert back to context-based processing. The only lever available to her is the volume of knowledge in the project.","rationales":{"A":"No such toggle exists; the project only shows a visual indicator that retrieval is active.","B":"Retrieval mode is not an organization-level administrative control.","D":"Reversal happens automatically when knowledge shrinks, so recreating the project is unnecessary."},"sources":[{"title":"Retrieval augmented generation (RAG) for projects | Anthropic Help Center","url":"https://support.claude.com/en/articles/11473015-retrieval-augmented-generation-rag-for-projects","date":"2026-03-16","basis":"published"}],"tags":["rag","projects","context-window"]},{"id":"D5-009","domain":"D5","objective":"Configure Claude Projects with instructions and knowledge sources","type":"single","difficulty":"hard","scenario":true,"stem":"A knowledge manager runs a large policy project that is operating in retrieval mode. Answers are accurate, but Claude often misses clauses he knows are present in documents already uploaded. Which action is most likely to improve what Claude retrieves?","options":[{"key":"A","text":"Give the files clear, descriptive filenames, keep related documents grouped in the same project, and reference specific documents by name when asking."},{"key":"B","text":"Upload a second copy of every document, so that retrieval has two opportunities to index each passage in the policy set."},{"key":"C","text":"Turn off web search and extended thinking for the project, on the basis that those features compete with retrieval for the same context."},{"key":"D","text":"Split the material across ten smaller projects so that each one stays below the knowledge threshold at which retrieval takes over from in-context processing."}],"correct":["A"],"explanation":"The four documented best practices for retrieval-enabled projects are to upload comprehensive content by adding all relevant documents upfront, use clear and descriptive filenames because well-named files help Claude retrieve the right information, organize related content together in the same project so Claude can draw connections between sources, and reference specific documents by name to focus the search. The material is already uploaded, so the three practices that bear on retrieval accuracy are naming, grouping and referencing.","rationales":{"B":"The documented practice is to add all relevant documents upfront, which means supplying what Claude needs rather than duplicating what is already there; duplicate copies are not a documented remedy.","C":"Retrieval is documented as working with all Claude features, including web search, extended thinking and Research, so disabling them addresses nothing.","D":"Organizing related content together in one project is what allows Claude to draw connections between sources; fragmenting one body of knowledge works against that."},"sources":[{"title":"Retrieval augmented generation (RAG) for projects | Anthropic Help Center","url":"https://support.claude.com/en/articles/11473015-retrieval-augmented-generation-rag-for-projects","date":"2026-03-16","basis":"published"}],"tags":["rag","knowledge-quality","best-practice"]},{"id":"D5-010","domain":"D5","objective":"Manage uploaded knowledge and connectors (e.g., Google Drive, Gmail)","type":"single","difficulty":"easy","scenario":true,"stem":"An HR partner is worried that enabling the Google Drive connector across her department will expose a restricted HR folder to colleagues who cannot normally open it. What is the documented behaviour of connectors regarding access?","options":[{"key":"A","text":"The connector authenticates once with a shared organization account that is able to read all content held in the service."},{"key":"B","text":"The connector copies all reachable files into project knowledge, where anyone with access to the project can then read them."},{"key":"C","text":"An administrator must map each user's folder permissions into Claude by hand before the connector will return anything."},{"key":"D","text":"Each user authenticates individually and the connector cannot reach content that user is not already permitted to view."}],"correct":["D"],"explanation":"Access permissions are enforced at the user level: each person authenticates with the connected service the first time they use the connector, even after an Owner has enabled it, so the connector cannot reach content that user is not already permitted to view. Existing source-system permissions therefore remain the control point.","rationales":{"A":"There is no shared all-access identity; authentication happens per user.","B":"Connectors retrieve data and take actions on request; they do not bulk-copy a drive into project knowledge.","C":"No manual permission mapping is required, although Owners must enable connectors at the organization level on Team and Enterprise."},"sources":[{"title":"Use connectors to extend Claude's capabilities | Anthropic Help Center","url":"https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities","date":"2026-08-01","basis":"published"}],"tags":["connectors","permissions","governance"]},{"id":"D5-011","domain":"D5","objective":"Manage uploaded knowledge and connectors (e.g., Google Drive, Gmail)","type":"multi","difficulty":"hard","scenario":true,"stem":"A delivery manager on a Team plan wants the team to use a supplier's custom connector, which is provided as a remote MCP server URL. Which TWO statements should inform the decision? (Select TWO.)","options":[{"key":"A","text":"Anthropic security-scans every custom connector before an organization is permitted to add it, in the same way that uploaded skills are scanned on Enterprise plans."},{"key":"B","text":"Custom connectors run from each user's own device, so every team member must install and keep local server software running."},{"key":"C","text":"Custom connectors are not verified by Anthropic, and a malicious server may include hidden instructions, so only trusted servers should be connected."},{"key":"D","text":"Once added, a custom connector automatically gains write access to every other app connected to the same account."},{"key":"E","text":"Custom connectors are available only in Claude Desktop and cannot be used on claude.ai, in Cowork or on a mobile device."},{"key":"F","text":"On a Team plan only an Owner can add the custom connector, after which members authenticate individually."}],"correct":["C","F"],"explanation":"Custom connectors let Claude connect to arbitrary services that have not been verified by Anthropic, and malicious MCP servers may include hidden instructions that try to make Claude perform unintended actions, which is prompt injection. On Team and Enterprise plans an Owner adds the connector at the organization level and members then authenticate individually.","rationales":{"A":"Directory connectors may be Anthropic-verified, but custom connectors explicitly are not; the separate skill and plugin scanning beta covers skills and plugins, not connectors.","B":"Claude connects to the remote MCP server from Anthropic's cloud infrastructure rather than from the local device, so no local install is involved.","D":"A connector's actions are scoped to its own service and to the authenticating user's permissions, and each action can be set to Always allow, Needs approval or Blocked.","E":"Because the connection is made from Anthropic's infrastructure, the same custom connector is available across claude.ai, Claude Desktop, Cowork and mobile."},"sources":[{"title":"Get started with custom connectors using remote MCP | Anthropic Help Center","url":"https://support.claude.com/en/articles/11175166-get-started-with-custom-connectors-using-remote-mcp","date":"2026-08-01","basis":"published"},{"title":"Use connectors to extend Claude's capabilities | Anthropic Help Center","url":"https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities","date":"2026-08-01","basis":"published"}],"tags":["connectors","mcp","prompt-injection","governance"]},{"id":"D5-012","domain":"D5","objective":"Manage uploaded knowledge and connectors (e.g., Google Drive, Gmail)","type":"single","difficulty":"medium","scenario":true,"stem":"A programme coordinator in a local authority routinely pulls documents from Google Drive into the Files section of her own projects, and the connector is working normally. When she opens a workspace that two colleagues have been added to, that upload source is greyed out. What is the reason?","options":[{"key":"A","text":"The upload source is hidden once a project passes the knowledge threshold and switches into retrieval mode, because retrieval indexes only uploaded copies."},{"key":"B","text":"It is offered for projects that have not been shared, and it is switched off as soon as a project is shared."},{"key":"C","text":"Documents from that service can be added to shared projects, but only by an organization Owner or Primary Owner."},{"key":"D","text":"Every member of a shared project must reconnect the service before the upload source becomes visible to anyone."}],"correct":["B"],"explanation":"The Google Drive connector is only available when adding to Files in private projects, and the option is disabled for shared projects. Her experience in private projects therefore does not carry over once a project is shared. Documents added through the picker in a private project sync directly from Drive, so the project keeps referencing the latest version.","rationales":{"A":"Retrieval mode changes how knowledge is searched, not which upload sources are offered.","C":"Owner status does not unlock the picker in shared projects; the restriction is not role-based.","D":"Reconnecting the service does not restore the picker in a shared project; the restriction attaches to shared projects themselves."},"sources":[{"title":"Use Google Workspace connectors | Anthropic Help Center","url":"https://support.claude.com/en/articles/10166901-use-google-workspace-connectors","date":"2026-08-18","basis":"published"}],"tags":["connectors","google-drive","projects","sharing"]},{"id":"D5-013","domain":"D5","objective":"Manage uploaded knowledge and connectors (e.g., Google Drive, Gmail)","type":"single","difficulty":"easy","scenario":true,"stem":"A finance officer wants Claude to work from her department's budget workbook, which is an XLSX file, together with several CSV extracts drawn from it. What does she need to check before uploading them?","options":[{"key":"A","text":"That the workbook has been converted to PDF beforehand, because spreadsheet data can only be read from a PDF or plain text export of the original."},{"key":"B","text":"That each sheet holds fewer than 20 rows, because spreadsheet uploads are truncated to the first 20 rows when they are read into a conversation."},{"key":"C","text":"That code execution is enabled for her account, since XLSX uploads depend on it, while CSV files are handled as ordinary documents."},{"key":"D","text":"That the files are added to a project rather than a chat, because spreadsheets and CSV files cannot be attached to an ordinary conversation."}],"correct":["C"],"explanation":"The documented list of supported file types covers documents such as PDF, DOCX, CSV, TXT, HTML, ODT, RTF, EPUB and JSON, plus images and spreadsheets, and XLSX carries the additional condition that code execution must be enabled. CSV is treated as a document type and does not depend on that setting.","rationales":{"A":"CSV and XLSX are both supported directly, so converting to PDF would discard structure for no benefit.","B":"No row limit of that kind is documented; the published constraints are file size, file count and PDF page count.","D":"Both file types can be attached to a chat as well as added to project knowledge, subject to the usual size and count limits."},"sources":[{"title":"Upload files to Claude | Anthropic Help Center","url":"https://support.claude.com/en/articles/8241126-upload-files-to-claude","date":"2026-07-22","basis":"published"}],"tags":["file-upload","file-types","spreadsheets","code-execution"]},{"id":"D5-014","domain":"D5","objective":"Create effective system-level instructions","type":"single","difficulty":"easy","scenario":true,"stem":"An executive assistant wants Claude to follow a fixed set of working rules in every conversation she has, across all of her projects and her standalone chats, without her having to select or paste anything each time. Where should the rules be configured?","options":[{"key":"A","text":"In Instructions for Claude, the account-wide setting in her profile settings."},{"key":"B","text":"In the project instructions of each project she uses, with the same wording repeated in every one of them."},{"key":"C","text":"In a style that she chooses from the style menu at the start of each conversation she opens."},{"key":"D","text":"In a short text file uploaded to the knowledge base of each project she works in."}],"correct":["A"],"explanation":"The personalization layers differ by scope: Instructions for Claude are account-wide settings that apply across all conversations, project instructions apply only to chats within that project, skills add capabilities on demand, and styles adjust tone and format. Standing rules that should never need reselecting belong in the account-wide layer.","rationales":{"B":"This achieves the effect only inside projects, misses standalone chats, and creates duplicate copies to maintain.","C":"Styles adjust tone and format of delivery and, in this scenario, would still require selection each time.","D":"Knowledge files are reference material scoped to one project, not account-wide behavioural instructions."},"sources":[{"title":"Understanding Claude's personalization features | Anthropic Help Center","url":"https://support.claude.com/en/articles/10185728-understanding-claude-s-personalization-features","date":"2026-08-19","basis":"published"}],"tags":["personalization-layers","profile-instructions","scope"]},{"id":"D5-015","domain":"D5","objective":"Create effective system-level instructions","type":"single","difficulty":"medium","scenario":true,"stem":"A business analyst uploads a custom skill for producing weekly variance commentary. It installs successfully and is enabled, but Claude never reaches for it, even on obviously relevant requests. Its one-line summary reads: Internal helper. What is the MOST appropriate fix?","options":[{"key":"A","text":"Add a line to the project instructions saying CRITICAL: you MUST always use this skill for any variance work."},{"key":"B","text":"Re-upload the package with additional reference files bundled into the folder, so Claude has more material to draw on when the task comes up."},{"key":"C","text":"Install several more skills so that Claude has a broader set of capabilities to match the incoming request against."},{"key":"D","text":"Replace that summary with wording that states both what it does and the situations in which Claude should use it."}],"correct":["D"],"explanation":"The description in a skill's frontmatter is the trigger-matching text loaded into the system prompt at startup, and it must say both what the skill does and when to use it, within a 1024-character maximum. Weak descriptions are the documented cause of trigger failures, and updating the description or instructions is the documented response to declining triggering accuracy.","rationales":{"A":"Aggressive directive language is what recent guidance warns against, because on newer models it causes overtriggering rather than reliable triggering.","B":"Bundled resources are level three content that is not read until the skill has already triggered, so they cannot improve triggering.","C":"Each skill's metadata competes for attention in the system prompt, so adding more skills degrades recall rather than improving it."},"sources":[{"title":"Agent Skills - Claude Platform Docs","url":"https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview","date":"2026-08-19","basis":"verified-live"},{"title":"Skills for enterprise - Claude Platform Docs","url":"https://platform.claude.com/docs/en/agents-and-tools/agent-skills/enterprise","date":"2026-08-19","basis":"verified-live"}],"tags":["skills","skill-description","triggering"]},{"id":"D5-016","domain":"D5","objective":"Create effective system-level instructions","type":"single","difficulty":"easy","scenario":true,"stem":"A team member tries to upload a custom skill as a ZIP file at Customize > Skills and the upload fails. Which pair of documented causes concerns the layout and contents of the package itself, rather than its file size or the characters used in its name and description?","options":[{"key":"A","text":"The ZIP is larger than 30MB, or it holds more than eight files inside the skill folder."},{"key":"B","text":"The account has reached its skill limit, or code execution has not been used recently on the account."},{"key":"C","text":"The skill folder name does not match the skill name, or the required SKILL.md file is missing."},{"key":"D","text":"The skill was not published to the marketplace first, or it carries no version number."}],"correct":["C"],"explanation":"The documented causes of a failed custom skill upload are the ZIP exceeding size limits, the skill folder name not matching the skill name, a missing required SKILL.md file, and invalid characters in the skill name or description. Of those, the folder-name mismatch and the missing SKILL.md are the packaging faults: the ZIP must contain the skill folder itself rather than loose files, and that folder must hold a SKILL.md.","rationales":{"A":"An oversized ZIP is a documented cause, but neither 30MB nor a count of eight files is the documented threshold; 30MB is the project knowledge per-file limit, and no file-count rule is published.","B":"Code execution and file creation must be enabled to use skills, but recent usage and a skill count limit are not documented upload failures.","D":"Custom skills are uploaded directly and do not require marketplace publication or a version number to install."},"sources":[{"title":"Use skills in Claude | Anthropic Help Center","url":"https://support.claude.com/en/articles/12512180-use-skills-in-claude","date":"2026-08-12","basis":"published"}],"tags":["skills","custom-skills","troubleshooting","skill-md"]},{"id":"D5-017","domain":"D5","objective":"Create effective system-level instructions","type":"multi","difficulty":"medium","scenario":false,"stem":"Anthropic describes skills as using three-level progressive disclosure to control how much context they consume. Which TWO statements about what this means in practice are accurate? (Select TWO.)","options":[{"key":"A","text":"Installing many skills carries only a small standing cost, because until a skill triggers only its name and description occupy context."},{"key":"B","text":"The full instruction body of every installed skill is loaded at startup so that Claude can compare them before choosing one."},{"key":"C","text":"Bundled reference files consume context as soon as the skill is installed, whether or not Claude ever reads them."},{"key":"D","text":"Bundled scripts contribute only their results to the conversation, never their code."},{"key":"E","text":"Skills are processed outside the context window, so an installed skill has no effect at all on the context available for a conversation."},{"key":"F","text":"Bundled files must be deleted after each use to release the context that they occupy in the conversation."}],"correct":["A","D"],"explanation":"Level one metadata is loaded at startup at roughly 100 tokens per skill, which is why you can install many skills without a context penalty: until a skill is triggered, only its name and description occupy context. Bundled scripts are run rather than read, so the script code itself never enters the context window and only its output consumes tokens.","rationales":{"B":"The SKILL.md body is level two content and loads only when the skill is triggered, not at startup.","C":"Level three bundled resources cost nothing until they are actually accessed.","E":"Skills do occupy context, which is exactly why progressive disclosure exists; the standing cost is small rather than zero.","F":"Bundled files sit on the filesystem and are read only when needed; there is no cleanup step to reclaim context."},"sources":[{"title":"Agent Skills - Claude Platform Docs","url":"https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview","date":"2026-08-19","basis":"verified-live"}],"tags":["skills","progressive-disclosure","context-window"]},{"id":"D5-018","domain":"D5","objective":"Create effective system-level instructions","type":"single","difficulty":"medium","scenario":true,"stem":"On a Team plan, a member follows a colleague's instructions to add a skill but cannot find the Skills area at all. Nothing has been configured for skills in the organization yet. What has to happen first?","options":[{"key":"A","text":"The organization must install a plugin first, because on a Team plan skills are only ever delivered inside plugins."},{"key":"B","text":"An Owner must enable both Code execution and file creation and Skills in Organization settings > Skills."},{"key":"C","text":"The organization must upgrade to Enterprise, because skills are not offered to Team plan members."},{"key":"D","text":"Each member must enable Code execution and file creation in their own Settings > Capabilities."}],"correct":["B"],"explanation":"Skills depend on code execution and file creation, and on Team and Enterprise plans an Owner must first enable both Code execution and file creation and Skills in Organization settings > Skills. Only then can members manage skills through Customize > Skills.","rationales":{"A":"Plugins bundle skills, connectors and sub-agents, but skills can be installed and uploaded independently.","C":"Skills are available on Team; only certain governance features such as skill and plugin scanning are Enterprise.","D":"Self-service enablement in a member's own settings is the Free, Pro and Max path, not the Team path."},"sources":[{"title":"Use skills in Claude | Anthropic Help Center","url":"https://support.claude.com/en/articles/12512180-use-skills-in-claude","date":"2026-08-12","basis":"published"}],"tags":["skills","prerequisites","organization-settings","team-plan"]},{"id":"D5-019","domain":"D5","objective":"Create effective system-level instructions","type":"single","difficulty":"easy","scenario":false,"stem":"In the unified Customize directory, how does a plugin differ from a skill or a connector?","options":[{"key":"A","text":"A plugin is a skill that an Owner has shared with the rest of the organization."},{"key":"B","text":"A plugin is an authenticated integration to an external service such as Gmail, Google Drive or Slack."},{"key":"C","text":"A plugin is a folder of instructions and resources that Claude loads only when relevant."},{"key":"D","text":"A plugin is a saved set of tone and formatting preferences applied to responses."},{"key":"E","text":"A plugin is a package that bundles skills, connectors and sub-agents into one installable item."}],"correct":["E"],"explanation":"The unified directory lists three object types: skills, which are individual capabilities, connectors, which are authenticated integrations to external services, and plugins, which bundle skills, connectors and sub-agents into a single package. Plugins are available to all paid plans, and hooks and sub-agents inside a plugin run only in Cowork, so they appear greyed out in chat.","rationales":{"A":"Org-shared skills are still skills; sharing does not turn a skill into a plugin.","B":"That is the definition of a connector.","C":"That is the definition of a skill.","D":"That describes a style, which is not one of the Customize directory's three object types."},"sources":[{"title":"Browse skills, connectors, and plugins in one directory | Anthropic Help Center","url":"https://support.claude.com/en/articles/14328846-browse-skills-connectors-and-plugins-in-one-directory","date":"2026-05-29","basis":"published"},{"title":"Use plugins in Claude | Anthropic Help Center","url":"https://support.claude.com/en/articles/13837440-use-plugins-in-claude","date":"2026-08-01","basis":"published"}],"tags":["plugins","skills","connectors","customize-directory"]},{"id":"D5-020","domain":"D5","objective":"Inform, maintain, and update Claude configurations, knowledge sources, and instructions","type":"single","difficulty":"medium","scenario":true,"stem":"A freelance researcher on a Pro plan has built a carefully configured project and wants two collaborators to read its instructions and knowledge and chat inside it, without changing anything. What should she be told?","options":[{"key":"A","text":"Project sharing, including the Can view permission she wants, is available only on Team and Enterprise plans."},{"key":"B","text":"She can share the project on Pro by adding the two collaborators with Can view permission from the project menu."},{"key":"C","text":"She can share on Pro, but only with Can edit permission, because Can view is reserved for Enterprise organizations."},{"key":"D","text":"Sharing is available on all plans once the project has at least one knowledge file attached to it."}],"correct":["A"],"explanation":"Project sharing is documented as a Team and Enterprise capability with two permission levels, Can view, which allows access to project contents, knowledge and instructions plus chatting but no editing, and Can edit. A Pro account cannot share a project, so the collaborators would need to be in a Team or Enterprise organization.","rationales":{"B":"Can view exists as a permission level, but the sharing feature itself is not offered on Pro.","C":"Both permission levels sit with Team and Enterprise; neither is available on Pro, and Can view is not Enterprise-only.","D":"Knowledge files have no bearing on sharing availability, which is determined by plan."},"sources":[{"title":"What are projects? | Anthropic Help Center","url":"https://support.claude.com/en/articles/9517075-what-are-projects","date":"2026-07-22","basis":"published"}],"tags":["projects","sharing","permissions","plan-limits"]},{"id":"D5-021","domain":"D5","objective":"Inform, maintain, and update Claude configurations, knowledge sources, and instructions","type":"single","difficulty":"medium","scenario":true,"stem":"A team lead on a Team plan has built a custom skill and wants to publish it to the organization's skills directory so that every colleague can find it. Members already create and use skills day to day, but no Share button appears anywhere on the skill. What has to happen first?","options":[{"key":"A","text":"The skill must pass skill and plugin security scanning before a Share button is offered to the person who created it."},{"key":"B","text":"Each colleague must upload their own copy of the skill, after which the sharing controls become available."},{"key":"C","text":"An Owner must enable the sharing toggles in Organization settings > Skills, because skill sharing is off by default."},{"key":"D","text":"The skill must be published to the public Claude directory first, because organization sharing builds on that listing."}],"correct":["C"],"explanation":"On Team and Enterprise plans a member can share a skill with specific people, with a group, or with the entire organization, in which case it is published to the organization's directory. Sharing is off by default: an Owner goes to Organization settings > Skills and enables the skill sharing, share with groups or share with organization toggles, or a combination of them, before the Share button appears. Shared skills are view-only for recipients, and updates propagate to them automatically.","rationales":{"A":"Skill and plugin security scanning is a separate Enterprise beta that blocks unsafe skills from use; it does not gate the sharing controls.","B":"Recipients of a shared skill enable and use it without uploading their own copy, so extra uploads would not produce a Share button.","D":"There is no requirement to publish a skill publicly before it can be shared inside an organization."},"sources":[{"title":"Use skills in Claude | Anthropic Help Center","url":"https://support.claude.com/en/articles/12512180-use-skills-in-claude","date":"2026-08-12","basis":"published"}],"tags":["skills","sharing","organization-settings","governance"]},{"id":"D5-022","domain":"D5","objective":"Inform, maintain, and update Claude configurations, knowledge sources, and instructions","type":"multi","difficulty":"hard","scenario":false,"stem":"Which TWO statements about skill and plugin scanning on Claude Enterprise are accurate? (Select TWO.)","options":[{"key":"A","text":"Scanning also covers skills that are uploaded through the Skills API or from the Claude Console."},{"key":"B","text":"Skills that already existed in the organization before scanning was turned on are scanned retroactively the next time they are used."},{"key":"C","text":"A scan returns Pass, Warn or Fail; a skill that passes with a warning stays usable behind a caution notice, and a failed skill is blocked."},{"key":"D","text":"Scanning replaces the manual review checklist for third-party skills, so an organization that turns it on no longer needs a separate audit step."},{"key":"E","text":"Scanning applies to skills uploaded or edited in claude.ai and Cowork, and a skill whose scan has not finished is also blocked."},{"key":"F","text":"Scanning is turned on by default for every Team and Enterprise organization as soon as skills are enabled."}],"correct":["C","E"],"explanation":"A skill that fails the scan, or whose scan has not finished, is blocked from use, while a skill that passes with a warning stays usable behind a caution notice. Scanning covers skills that members upload or edit in claude.ai and Claude Cowork after an Owner or Primary Owner turns the beta on.","rationales":{"A":"Skills uploaded through the Skills API, including from the Claude Console, are an explicit exclusion.","B":"Skills already present when scanning was turned on are excluded, as are Claude-created and MCP-server skills.","D":"Scanning complements the review checklist rather than replacing it, and it will not catch a skill that behaves unintentionally without being malicious.","F":"It is a beta that an Owner or Primary Owner turns on for a Claude Enterprise organization, and organizations using customer-managed encryption keys, zero data retention or HIPAA-ready configurations are excluded."},"sources":[{"title":"Get started with skill and plugin scanning | Anthropic Help Center","url":"https://support.claude.com/en/articles/15927065-get-started-with-skill-and-plugin-scanning","date":"2026-08-06","basis":"published"},{"title":"Skills for enterprise - Claude Platform Docs","url":"https://platform.claude.com/docs/en/agents-and-tools/agent-skills/enterprise","date":"2026-08-19","basis":"verified-live"}],"tags":["skills","security-scanning","enterprise","governance"]},{"id":"D5-023","domain":"D5","objective":"Inform, maintain, and update Claude configurations, knowledge sources, and instructions","type":"single","difficulty":"easy","scenario":true,"stem":"A finance manager is starting a sensitive reorganisation workstream. She wants Claude to stop adding new memories for now, while keeping the memory entries it has already built about her existing routine work. Which setting should she use?","options":[{"key":"A","text":"Reset memory, which clears the account and starts a fresh memory record."},{"key":"B","text":"Ask an Owner to disable memory for the whole organization."},{"key":"C","text":"Delete the project summary held for each of her projects."},{"key":"D","text":"Pause memory."}],"correct":["D"],"explanation":"The memory settings offer two distinct disable actions: Pause memory retains existing memories but stops new ones being created, while Reset memory irreversibly deletes all memories including project data. Pausing matches her requirement exactly.","rationales":{"A":"Reset irreversibly deletes everything, including the entries she wants to keep, and cannot be undone.","B":"An Owner disabling memory organization-wide immediately deletes all existing memory data for every user, which is far broader and permanent.","C":"Project summaries are per-project artefacts, and deleting them does not stop new memories being written."},"sources":[{"title":"Use Claude's chat search and memory to build on previous context | Anthropic Help Center","url":"https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context","date":"2026-08-19","basis":"published"}],"tags":["memory","pause-vs-reset","settings"]},{"id":"D5-024","domain":"D5","objective":"Inform, maintain, and update Claude configurations, knowledge sources, and instructions","type":"multi","difficulty":"medium","scenario":true,"stem":"A team lead has built one custom skill and wants to understand what maintaining it will involve as other Claude surfaces come into play, and how its content is handled. Which TWO statements are accurate? (Select TWO.)","options":[{"key":"A","text":"A custom skill uploaded on claude.ai is not available through the Claude API, and an API skill is not available on claude.ai; each surface needs its own upload."},{"key":"B","text":"Uploading the skill once on claude.ai makes it available automatically in Claude Code project folders and in the Claude API workspace for the same organization, with nothing further to do."},{"key":"C","text":"Custom skills are not covered by zero data retention arrangements; skill definitions and execution data are retained under Anthropic's standard data retention policy."},{"key":"D","text":"Pre-built document skills such as PowerPoint and Excel must be uploaded manually before Claude can use them on claude.ai."},{"key":"E","text":"On the Claude API a custom skill is scoped to the individual uploader rather than being shared with the workspace."},{"key":"F","text":"Custom skills synchronise automatically between surfaces within about an hour of upload, so a skill added on claude.ai appears in Claude Code shortly afterwards."}],"correct":["A","C"],"explanation":"Custom skills do not sync across surfaces: skills uploaded to claude.ai must be separately uploaded to the API, skills uploaded through the API are not available on claude.ai, and Claude Code skills are filesystem-based and separate from both. Agent Skills is also outside zero data retention arrangements, with skill definitions and execution data retained according to Anthropic's standard data retention policy.","rationales":{"B":"Claude Code skills live in personal or project folders on the filesystem and are separate from claude.ai uploads and from the API.","D":"Pre-built Agent Skills are active on claude.ai when documents are created and require no setup or upload.","E":"On the Claude API custom skills are shared workspace-wide, so all workspace members can access them, which is the opposite of per-user.","F":"No cross-surface synchronisation exists at any interval; each surface requires separate upload and management."},"sources":[{"title":"Agent Skills - Claude Platform Docs","url":"https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview","date":"2026-08-19","basis":"verified-live"},{"title":"Use skills in Claude | Anthropic Help Center","url":"https://support.claude.com/en/articles/12512180-use-skills-in-claude","date":"2026-08-12","basis":"published"}],"tags":["skills","cross-surface","data-retention"]},{"id":"D5-025","domain":"D5","objective":"Inform, maintain, and update Claude configurations, knowledge sources, and instructions","type":"single","difficulty":"hard","scenario":true,"stem":"Months ago a configuration owner wrote emphatic wording into a shared set of system-level instructions, such as CRITICAL: You MUST use this tool when handling any request, because the tool was being underused at the time. After a model update the same tool now fires on requests where it is plainly irrelevant. What should he change first?","options":[{"key":"A","text":"Move the instruction to the very end of the configuration, after all of the reference material."},{"key":"B","text":"Dial back the aggressive language to normal phrasing such as Use this tool when."},{"key":"C","text":"Remove the tool from the shared configuration and reintroduce it only for specific conversations that need it."},{"key":"D","text":"Add matching emphatic wording to the other tools so that they all compete on equal terms."}],"correct":["B"],"explanation":"Anthropic's prompting guidance records that Claude Opus 4.5 and Claude Opus 4.6 are more responsive to the system prompt than previous models, so prompts written to reduce undertriggering on tools or skills may now overtrigger. The published fix is to dial back any aggressive language: where you might have said CRITICAL: You MUST use this tool when, use more normal prompting such as Use this tool when. The same point appears in the migration guidance for that generation, which advises tuning down anti-laziness prompting.","rationales":{"A":"The documented ordering guidance concerns placing long documents near the top and the query at the end; it does not address emphasis-driven overtriggering.","C":"Removing a useful tool sacrifices the capability instead of correcting the wording that causes the misfires.","D":"Escalating emphasis everywhere multiplies the overtriggering problem rather than resolving it."},"sources":[{"title":"Prompting best practices - Claude Platform Docs","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","date":"2026-08-19","basis":"verified-live"}],"tags":["system-instructions","overtriggering","model-updates","maintenance"]},{"id":"D6-001","domain":"D6","objective":"Identify appropriate and inappropriate use cases","type":"single","difficulty":"medium","scenario":true,"stem":"A retail chain uses Claude to draft the rejection letters sent to unsuccessful external job applicants. A qualified HR professional reads and signs off every letter before it goes out, but the letters say nothing about how they were produced. What still needs to change before the letters are sent?","options":[{"key":"A","text":"Nothing needs to change, because a qualified professional already reviews every letter before it is sent."},{"key":"B","text":"A second independent reviewer must countersign each letter before it can be disseminated."},{"key":"C","text":"Applicants must be told that AI was used to help produce the decision they receive."},{"key":"D","text":"The use case must be registered with Anthropic as high risk before any letter is sent."}],"correct":["C"],"explanation":"Employment and housing is one of Anthropic's named high-risk use case categories. Two requirements attach: a qualified professional must review the content or decision prior to dissemination, and where model outputs are presented directly to individuals or consumers the organisation must disclose that AI was used to help produce the advice, decision or recommendation. The scenario satisfies the review requirement but not the disclosure requirement, so the gap is disclosure to the applicant.","rationales":{"A":"Qualified review is only one of the two requirements; the disclosure duty is separate and is not met by an internal sign-off.","B":"The policy calls for review by a qualified professional in the field, not for a second countersignature.","D":"There is no pre-launch registration or notification step with Anthropic for high-risk use cases."},"sources":[{"title":"Updates to our Acceptable Use Policy (now Usage Policy), Consumer Terms of Service, and Privacy Policy - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/9301722-updates-to-our-acceptable-use-policy-now-usage-policy-consumer-terms-of-service-and-privacy-policy","date":"2026-03-16","basis":"published"}],"tags":["usage-policy","high-risk-use-cases","employment","disclosure"]},{"id":"D6-002","domain":"D6","objective":"Identify appropriate and inappropriate use cases","type":"multi","difficulty":"medium","scenario":true,"stem":"A consultant is reviewing five proposed client deployments of Claude, all of which produce output that reaches members of the public. Which TWO require both review by a qualified professional before dissemination and disclosure to the affected individual that AI was used? (Select TWO.)","options":[{"key":"A","text":"A tool that generates subject lines for a retailer's promotional email campaigns."},{"key":"B","text":"A tool that drafts tenancy application outcomes sent to prospective renters."},{"key":"C","text":"A tool that summarises publicly available product manuals into shorter customer help articles."},{"key":"D","text":"A tool that suggests wording for a company's public social media replies about opening hours."},{"key":"E","text":"A tool that produces first-draft news stories published on a client's public news site."}],"correct":["B","E"],"explanation":"The named high-risk categories in Anthropic's Usage Policy are legal, healthcare, insurance, finance, employment and housing (treated as one combined category), academic testing, accreditation and admissions, and media or professional journalistic content. Tenancy outcomes fall in the employment and housing category and published news drafts fall in media or professional journalistic content. Each requires review by a qualified professional before dissemination and disclosure to the affected individual that AI was used.","rationales":{"A":"Promotional marketing copy is not a named high-risk category; it remains subject to the Universal Usage Standards only.","C":"Summarising public product documentation carries no elevated harm profile and is not in any named high-risk category.","D":"Routine replies about opening hours are ordinary commercial use; if this became a consumer-facing chatbot, the separate chatbot disclosure guideline would apply instead."},"sources":[{"title":"Updates to our Acceptable Use Policy (now Usage Policy), Consumer Terms of Service, and Privacy Policy - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/9301722-updates-to-our-acceptable-use-policy-now-usage-policy-consumer-terms-of-service-and-privacy-policy","date":"2026-03-16","basis":"published"}],"tags":["usage-policy","high-risk-use-cases","housing","journalism"]},{"id":"D6-003","domain":"D6","objective":"Identify appropriate and inappropriate use cases","type":"single","difficulty":"hard","scenario":true,"stem":"A hospital's clinical coding team uses Claude entirely internally: qualified coders paste de-identified case summaries, review every output themselves, and no Claude-derived text ever reaches a patient. The compliance lead asks whether the Usage Policy's high-risk requirements are engaged. What is the MOST accurate response?","options":[{"key":"A","text":"Disclosure is triggered by the healthcare category itself, regardless of whether any output ever reaches a patient."},{"key":"B","text":"Both high-risk requirements are scoped to outputs presented directly to individuals or consumers, so neither is triggered here."},{"key":"C","text":"De-identifying the inputs removes the use case from the high-risk healthcare category entirely, so no requirement can attach."},{"key":"D","text":"Disclosure applies immediately, while qualified professional review becomes mandatory only once identifiable patient data enters the workflow."}],"correct":["B"],"explanation":"The Usage Policy scopes both high-risk requirements the same way. Qualified human review is required when the products or services are used to provide advice, recommendations or subjective decision-making directly affecting individuals or consumers, and disclosure is required if model outputs are presented directly to individuals or consumers. Purely internal coding work reviewed by qualified staff engages neither requirement on its own, although the qualified review the team already performs remains the prudent control and both duties would attach the moment output is disseminated.","rationales":{"A":"The category alone is not the test; both requirements attach only where output affects or is presented to individuals or consumers.","C":"De-identification reduces privacy risk, but it is dissemination to individuals or consumers, not identifiability, that governs whether the requirements attach.","D":"This invents an asymmetry the policy does not contain: both requirements share the same individual- or consumer-facing scoping."},"sources":[{"title":"Updates to our Acceptable Use Policy (now Usage Policy), Consumer Terms of Service, and Privacy Policy - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/9301722-updates-to-our-acceptable-use-policy-now-usage-policy-consumer-terms-of-service-and-privacy-policy","date":"2026-03-16","basis":"published"}],"tags":["usage-policy","consumer-facing","healthcare","human-in-the-loop"]},{"id":"D6-004","domain":"D6","objective":"Identify appropriate and inappropriate use cases","type":"single","difficulty":"medium","scenario":true,"stem":"A marketing manager asks Claude for competitor market-share percentages, receives a confident set of figures, and is about to paste them straight into a board pack. Using Anthropic's AI Fluency framework, which of the four competencies is she about to skip?","options":[{"key":"A","text":"Delegation: deciding to hand the whole market-sizing exercise to Claude rather than keeping parts of it in human hands."},{"key":"B","text":"Diligence: adding a line to the board pack saying Claude produced the figures, which settles the risk."},{"key":"C","text":"Description: rephrasing the request with far more context so that the figures come out accurate."},{"key":"D","text":"Discernment: critically evaluating the output and verifying the figures before a consequential decision."}],"correct":["D"],"explanation":"Anthropic's AI Fluency framework sets out four competencies, the 4Ds: Delegation, Description, Discernment and Diligence. Discernment is the competency covering critical evaluation of outputs and keeping human judgement at consequential decision points. A board pack is exactly such a point, so the figures must be checked against a real source before they are used.","rationales":{"A":"Delegation concerns what goes to AI and what stays human; delegating more of the task would increase the unverified content rather than address it.","B":"Noting that Claude produced a number does not make the number correct; verification is still required before it informs a decision.","C":"A better-specified prompt may improve relevance, but no amount of rephrasing makes unverified figures trustworthy."},"sources":[{"title":"AI Fluency Framework: Foundations - Anthropic","url":"https://www.anthropic.com/ai-fluency","date":"2026-08-19","basis":"verified-live"},{"title":"Is Your Organization AI-Fluent? 4 Competencies Every Leader Needs Now - Forbes","url":"https://www.forbes.com/sites/anjalichaudhry/2026/05/19/is-your-organization-ai-fluent-4-competencies-every-leader-needs-now/","date":"2026-05-19","basis":"published"}],"tags":["ai-fluency","4ds","discernment","verification"]},{"id":"D6-005","domain":"D6","objective":"Identify appropriate and inappropriate use cases","type":"single","difficulty":"easy","scenario":true,"stem":"A learning and development lead proposes giving sixth-form students aged 16 and 17 their own Claude accounts as part of a work-experience programme. What is the correct governance position?","options":[{"key":"A","text":"Students aged 16 and above may hold accounts if a supervising adult accepts the terms."},{"key":"B","text":"Under-18 access is permitted on Team and Enterprise plans because an admin controls the account."},{"key":"C","text":"Claude has an 18+ minimum age, so the students cannot hold their own accounts."},{"key":"D","text":"A student tier exists for under-18 users with reduced capabilities and stricter filters."}],"correct":["C"],"explanation":"Claude requires users to be at least 18. Age assurance is run by a third-party provider using facial age estimation, identity document upload, or a verified over-18 attribute, and accounts flagged as under-18 can be disabled. There is no minor-accessible tier.","rationales":{"A":"Supervision by an adult is not a documented exception to the 18+ minimum age for holding a Claude account.","B":"Administrative control of a managed plan does not lower the minimum age requirement for individual users.","D":"No teen or student tier exists; assuming one is a common misconception."},"sources":[{"title":"Age assurance on Claude - Anthropic Help Center","url":"https://support.claude.com/en/articles/15171100-age-assurance-on-claude","date":"2026-05-18","basis":"published"}],"tags":["age-assurance","eligibility","inappropriate-use"]},{"id":"D6-006","domain":"D6","objective":"Apply data sensitivity, regulatory, and privacy considerations","type":"single","difficulty":"easy","scenario":false,"stem":"On Claude consumer plans (Free, Pro and Max), what determines whether a user's conversations are used to improve Anthropic's models?","options":[{"key":"A","text":"The plan tier, with Free conversations always used for training and Pro and Max conversations always excluded from it."},{"key":"B","text":"A per-user Model Improvement control in Privacy Settings at claude.ai/settings/data-privacy-controls."},{"key":"C","text":"Anthropic uses all consumer conversations by default, and users may request removal afterwards."},{"key":"D","text":"A central organisation administrator policy applied across all consumer accounts in the region."}],"correct":["B"],"explanation":"For consumer plans, chats are used to improve Claude only where the user has enabled Model Improvement in Privacy Settings, reached from Settings and Privacy at claude.ai/settings/data-privacy-controls. It is a per-user control rather than an attribute of the plan.","rationales":{"A":"Plan tier does not decide training use on consumer plans; the same user-set control applies across Free, Pro and Max.","C":"Consumer training use follows the user enabling the control, not a blanket default with retrospective removal.","D":"Consumer accounts are not governed by an organisation administrator; central controls belong to Team and Enterprise plans."},"sources":[{"title":"Is my data used for model training? - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/10023580-is-my-data-used-for-model-training","date":"2026-03-16","basis":"published"}],"tags":["training-data","consumer-plans","privacy-settings"]},{"id":"D6-007","domain":"D6","objective":"Apply data sensitivity, regulatory, and privacy considerations","type":"single","difficulty":"easy","scenario":true,"stem":"An employee realises she pasted a confidential supplier quote into a Claude conversation and deletes the conversation straight away. She asks how quickly the content is actually gone. Which statement is accurate?","options":[{"key":"A","text":"It is purged from every Anthropic system at the moment she presses delete."},{"key":"B","text":"It stays visible in chat history for 30 days and is then removed from storage."},{"key":"C","text":"It is kept for 5 years, because deleted conversations are preserved for later safety review."},{"key":"D","text":"It leaves chat history immediately and is removed from back-end storage within 30 days."}],"correct":["D"],"explanation":"Deleting a conversation removes it from chat history immediately, but back-end deletion completes within 30 days. Deletion is therefore not instantaneous at the storage layer, which matters when advising on incident response after a data spill.","rationales":{"A":"Immediate removal applies to the visible chat history only; back-end storage takes up to 30 days.","B":"This reverses the two behaviours: the visible history is cleared at once, and storage lags.","C":"The 5-year figure relates to de-identified data in training pipelines when model improvement is enabled, not to ordinary deleted conversations."},"sources":[{"title":"How long do you store my data? - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/10023548-how-long-do-you-store-my-data","date":"2026-07-01","basis":"published"}],"tags":["data-retention","deletion","incident-response"]},{"id":"D6-008","domain":"D6","objective":"Understand the ethical implications of AI usage","type":"single","difficulty":"medium","scenario":true,"stem":"A recruitment team drafts job adverts with Claude. A reviewer notices that the drafts keep reaching for language associated with one demographic profile, although the role is open to everyone. The team lead argues that published model evaluations already cover bias, so the wording can be trusted. What is the sound response?","options":[{"key":"A","text":"Model-level evaluations describe the model, not this deployment, so the drafts need a human check for skewed wording before publication."},{"key":"B","text":"The published evaluations settle the question for this deployment as well, so individual drafts need no further reading before they go out."},{"key":"C","text":"Asking Claude in a follow-up turn to make the wording neutral removes the skew reliably, so no human check of the final text is needed."},{"key":"D","text":"Adding a note that the adverts were drafted with AI assistance removes the risk, because readers can then discount the wording for themselves."}],"correct":["A"],"explanation":"Published model reports describe how a model behaved on a fixed evaluation set; they characterise the model in aggregate and say nothing about the wording of a particular advert produced in a particular deployment. Critically evaluating the output before it is used is the Discernment competency in Anthropic's AI Fluency framework, and employment content that reaches candidates sits in a category the Usage Policy singles out for extra care, including disclosure to the people who receive it.","rationales":{"B":"An aggregate result on a test set is not evidence about the drafts this team is about to publish.","C":"A follow-up instruction can change the wording, but it is still unverified output; something has to read the result.","D":"Disclosure and bias are separate duties, and telling readers AI was involved does not make skewed wording acceptable."},"sources":[{"title":"Anthropic's Transparency Hub - Model Report","url":"https://www.anthropic.com/transparency","date":"2026-08-17","basis":"published"},{"title":"AI Fluency Framework: Foundations - Anthropic","url":"https://www.anthropic.com/ai-fluency","date":"2026-08-19","basis":"verified-live"},{"title":"Updates to our Acceptable Use Policy (now Usage Policy), Consumer Terms of Service, and Privacy Policy - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/9301722-updates-to-our-acceptable-use-policy-now-usage-policy-consumer-terms-of-service-and-privacy-policy","date":"2026-03-16","basis":"published"}],"tags":["bias","ethics","employment","human-review"]},{"id":"D6-009","domain":"D6","objective":"Apply data sensitivity, regulatory, and privacy considerations","type":"single","difficulty":"medium","scenario":true,"stem":"A product manager has turned the Model Improvement control off on her personal Claude Pro account and tells colleagues that none of her inputs or outputs can now be used for model improvement in any circumstance. In which circumstance may they still be used?","options":[{"key":"A","text":"Whenever she works in a Claude Code session rather than the claude.ai web interface."},{"key":"B","text":"Whenever an organisation administrator has enabled model improvement at the tenant level for all accounts."},{"key":"C","text":"When a conversation is flagged for safety review, or she explicitly reports material to Anthropic."},{"key":"D","text":"When a conversation is older than the standard 30-day back-end deletion window."}],"correct":["C"],"explanation":"Anthropic's Privacy Policy states that it may use inputs and outputs to train and improve its models unless the user opts out through account settings, and it names two carve-outs that survive the opt-out: where conversations are flagged for safety review, and where the user has explicitly reported the materials to Anthropic. Opting out is therefore not absolute, and this is the practical governance point for anyone relying on the control.","rationales":{"A":"The control is account-level and is not bypassed by choosing a different Claude surface.","B":"Consumer accounts are not governed by an organisation administrator; tenant-level controls belong to Team and Enterprise plans.","D":"The 30-day figure is the back-end deletion window for conversations and has nothing to do with the opt-out carve-outs."},"sources":[{"title":"Anthropic Privacy Policy","url":"https://www.anthropic.com/legal/privacy","date":"2026-07-08","basis":"published"}],"tags":["training-data","opt-out","privacy-policy","exam-trap"]},{"id":"D6-010","domain":"D6","objective":"Follow organizational AI policies and governance standards","type":"single","difficulty":"hard","scenario":true,"stem":"A risk officer is signing off a Claude Cowork rollout. One team wants Cowork to work through a shared folder of documents received from external parties, with connector tools allowed to run without per-task approval. What is the strongest reason to refuse that configuration as it stands?","options":[{"key":"A","text":"Cowork is unable to open documents that originated outside the organisation, so the proposed workflow would fail at the very first externally supplied file."},{"key":"B","text":"Connector tools remain unavailable inside Cowork until an owner signs a zero data retention agreement covering the whole workspace and everyone in it."},{"key":"C","text":"Cowork sessions are excluded from the Compliance API altogether, so the organisation would hold no record at all of what the team did with the files."},{"key":"D","text":"Cowork pairs agentic autonomy with internet access, so injected instructions in external content are a live risk and write-capable tools belong behind approval."}],"correct":["D"],"explanation":"Anthropic states that Cowork carries unique risks because of its agentic nature and internet access, and that despite the safety measures in place the risk of prompt injection attacks is non-zero. The published advice is to avoid granting access to sensitive files and to watch Claude for suspicious actions. The organisation setting that lets members save an always-allow preference for connector tools is off by default, so members approve write-capable tools per task; turning that protection off for a folder of untrusted external documents removes the check at exactly the point it matters.","rationales":{"A":"Cowork can work with externally supplied files; the problem is that their content is untrusted, not that it cannot be read.","B":"Zero data retention governs what Anthropic stores and is not a precondition for using connector tools at all.","C":"Cloud Cowork sessions are captured in the Compliance API, and Enterprise admins can retrieve local session content through it in beta."},"sources":[{"title":"Use Claude Cowork on Team and Enterprise plans - Anthropic Help Center","url":"https://support.claude.com/en/articles/13455879-use-claude-cowork-on-team-and-enterprise-plans","date":"2026-08-18","basis":"published"}],"tags":["cowork","prompt-injection","connectors","risk-assessment"]},{"id":"D6-011","domain":"D6","objective":"Apply data sensitivity, regulatory, and privacy considerations","type":"single","difficulty":"hard","scenario":true,"stem":"An organisation on a standard Claude for Work commercial plan learns that a user submitted content which Anthropic's automated trust and safety systems flagged as a Usage Policy violation. The security lead assumes it will be discarded on the ordinary retention cycle. What is the accurate position?","options":[{"key":"A","text":"The flagged content is deleted on the ordinary cycle and only the classifier score is kept, for 2 years from the flag."},{"key":"B","text":"Flagged inputs and outputs may be kept for up to 2 years, and classification scores for up to 7 years."},{"key":"C","text":"Flagged content is retained for 5 years, matching the retention period applied to submitted feedback."},{"key":"D","text":"The organisation's own retention setting takes precedence, so the content is removed within 30 days."}],"correct":["B"],"explanation":"Content flagged as violating the Usage Policy is retained far longer than ordinary data: inputs and outputs for up to 2 years and trust and safety classification scores for up to 7 years. Anthropic states that in all cases it may retain chats or sessions as required by law or as necessary to combat violations of the Usage Policy, so enforcement retention is not switched off by the organisation's ordinary retention configuration.","rationales":{"A":"This reverses the two figures and drops the separate 7-year retention of classification scores.","C":"Five years relates to de-identified data in consumer training pipelines and to feedback submissions, not to violation-flagged content.","D":"Retention settings govern ordinary data; the stated exception for combating Usage Policy violations sits above them."},"sources":[{"title":"How long do you store my organization's data? - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/7996866-how-long-do-you-store-my-organization-s-data","date":"2026-07-01","basis":"published"},{"title":"How long do you store my data? - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/10023548-how-long-do-you-store-my-data","date":"2026-07-01","basis":"published"}],"tags":["trust-and-safety","data-retention","exam-trap"]},{"id":"D6-012","domain":"D6","objective":"Apply data sensitivity, regulatory, and privacy considerations","type":"single","difficulty":"medium","scenario":true,"stem":"A Claude for Work Enterprise administrator is asked by the works council whether staff conversations are used to train Anthropic's models. Which answer is correct?","options":[{"key":"A","text":"They are used by default, and the administrator must opt the organisation out to stop it."},{"key":"B","text":"They are never used in any circumstance once a commercial agreement is in place."},{"key":"C","text":"By default they are not, but content sent through feedback mechanisms is a named exception."},{"key":"D","text":"They are used whenever an individual user leaves the consumer model-improvement control turned on."}],"correct":["C"],"explanation":"Anthropic does not by default use inputs or outputs from commercial products such as Claude for Work Team and Enterprise, the API, or Claude Gov to train models. Explicitly submitting feedback through built-in mechanisms such as thumbs up or down is a named exception permitting training use, and that feedback is retained for 5 years.","rationales":{"A":"This describes the opposite of the commercial default; commercial content is excluded unless a named exception applies.","B":"Absolute wording is wrong because named exceptions, such as explicit feedback submission and opt-in programmes, do exist.","D":"The consumer model-improvement control governs consumer plans and does not apply to a managed commercial organisation."},"sources":[{"title":"Is my data used for model training? (commercial) - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/7996868-is-my-data-used-for-model-training","date":"2026-08-19","basis":"published"}],"tags":["commercial-plans","training-data","feedback","exam-trap"]},{"id":"D6-013","domain":"D6","objective":"Apply data sensitivity, regulatory, and privacy considerations","type":"multi","difficulty":"medium","scenario":true,"stem":"A procurement team has an approved Zero Data Retention (ZDR) agreement with Anthropic and is checking which of the firm's Claude usage it actually covers. Which TWO of the following are in scope? (Select TWO.)","options":[{"key":"A","text":"Claude Pro accounts that individual staff pay for themselves."},{"key":"B","text":"Claude Free accounts used by contractors for prototyping."},{"key":"C","text":"Eligible Anthropic APIs accessed with the organisation's commercial API key."},{"key":"D","text":"Claude Code signed in with a personal consumer account."},{"key":"E","text":"Claude Max accounts used by two senior staff for the same work."},{"key":"F","text":"Claude Code used under the organisation's Enterprise plan."}],"correct":["C","F"],"explanation":"Zero Data Retention is approval-gated and applies only to eligible Anthropic APIs, Anthropic products used with a commercial organisation API key including Claude Code accessed via the API, and Claude Code on Enterprise plans. It never extends to consumer plans.","rationales":{"A":"Claude Pro is a consumer plan and is explicitly outside ZDR coverage.","B":"Claude Free is a consumer plan and cannot be covered by a ZDR agreement.","D":"Claude Code is only in scope when accessed through a commercial organisation API key or an Enterprise plan, not on a consumer account.","E":"Claude Max is likewise a consumer plan, so paying more does not bring it into scope."},"sources":[{"title":"I have a zero data retention agreement with Anthropic. What products does it apply to? - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/8956058-i-have-a-zero-data-retention-agreement-with-anthropic-what-products-does-it-apply-to","date":"2026-06-09","basis":"published"}],"tags":["zero-data-retention","plan-scope","procurement"]},{"id":"D6-014","domain":"D6","objective":"Apply data sensitivity, regulatory, and privacy considerations","type":"single","difficulty":"hard","scenario":true,"stem":"An enterprise consuming Claude through Amazon Bedrock has workspaces set up with zero data retention and now wants to adopt a Covered Model. What applies from 9 June 2026?","options":[{"key":"A","text":"The existing zero data retention arrangement continues to take precedence on Bedrock, so nothing at all is retained there."},{"key":"B","text":"Retention of 30 days applies only to those prompts and outputs that a classifier has already flagged."},{"key":"C","text":"The practice reaches Anthropic first-party API customers only, not cloud deployments such as Bedrock."},{"key":"D","text":"ZDR organisations must set up data retention to use Covered Models, whose prompts and outputs are kept 30 days."}],"correct":["D"],"explanation":"Effective 9 June 2026, prompts submitted to and outputs generated by Covered Models are retained for 30 days to support Anthropic's safety work, and the change applies to organisations that have set up workspaces with zero data retention, which need to set up data retention in order to use these models. It reaches customers accessing Claude through Amazon Bedrock, Google Cloud's Agent Platform and Microsoft Azure Foundry; consumer plans are unaffected.","rationales":{"A":"The Covered Model retention practice overrides the pre-existing zero data retention position rather than deferring to it.","B":"Retention applies to all Covered Model prompts and outputs for 30 days; after 30 days unflagged data is deleted automatically, while flagged data, or data Anthropic is legally required to keep, may be kept longer.","C":"The practice is stated to reach cloud deployments including Amazon Bedrock, Google Cloud's Agent Platform and Microsoft Azure Foundry."},"sources":[{"title":"Data retention practices for Covered Models - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/15425996-data-retention-practices-for-covered-models","date":"2026-07-09","basis":"published"}],"tags":["covered-models","zero-data-retention","cloud-marketplace","exam-trap"]},{"id":"D6-015","domain":"D6","objective":"Follow organizational AI policies and governance standards","type":"multi","difficulty":"easy","scenario":false,"stem":"Which THREE of the following does Anthropic hold for its commercial products such as Claude for Work and the Anthropic API? (Select THREE.)","options":[{"key":"A","text":"FedRAMP High authorisation covering Claude Enterprise"},{"key":"B","text":"SOC 2 Type II"},{"key":"C","text":"PCI DSS Level 1 certification covering Claude for Work"},{"key":"D","text":"ISO/IEC 27001:2022 for information security"},{"key":"E","text":"An EU AI Act conformity certificate issued by the European Commission"},{"key":"F","text":"ISO/IEC 42001:2023 for AI management systems"}],"correct":["B","D","F"],"explanation":"Anthropic's published compliance credentials for commercial products are SOC 2 Type I and Type II, ISO/IEC 27001:2022, ISO/IEC 42001:2023, and a HIPAA-ready configuration with a BAA available. Compliance artefacts are requested through the Trust Portal at trust.anthropic.com.","rationales":{"A":"Claude Enterprise is not FedRAMP authorised; the authorised routes are Claude for Government, Bedrock in AWS GovCloud, and Vertex with Assured Workloads.","C":"PCI DSS certification is not among Anthropic's published credentials for these products.","E":"The European Commission does not issue an AI Act conformity certificate of this kind; Anthropic signed a voluntary Code of Practice instead."},"sources":[{"title":"What Certifications has Anthropic obtained? - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/10015870-what-certifications-has-anthropic-obtained","date":"2026-03-16","basis":"published"},{"title":"Public Sector FAQs - Anthropic Help Center","url":"https://support.claude.com/en/articles/13756069-public-sector-faqs","date":"2026-03-25","basis":"published"}],"tags":["certifications","soc2","iso-27001","iso-42001"]},{"id":"D6-016","domain":"D6","objective":"Apply data sensitivity, regulatory, and privacy considerations","type":"single","difficulty":"medium","scenario":true,"stem":"A healthcare provider on Claude Enterprise has executed a HIPAA Business Associate Agreement and wants clinical staff to begin processing protected health information. What must the provider understand?","options":[{"key":"A","text":"Once the BAA is signed, every Anthropic product the organisation uses is covered, including Cowork and the beta surfaces."},{"key":"B","text":"The Primary Owner must activate HIPAA compliance in organisation settings, and several surfaces stay outside coverage."},{"key":"C","text":"SOC 2 Type II and ISO 27001 already authorise PHI processing, so the BAA mainly restates existing controls."},{"key":"D","text":"The BAA automatically extends to any affiliate in the same corporate group using the same Claude tenant."}],"correct":["B"],"explanation":"For Claude Enterprise the Primary Owner must activate HIPAA compliance in the HIPAA-ready organisation settings under Data and privacy and accept Anthropic's BAA; a standard Claude Enterprise plan does not include BAA coverage. Coverage is bounded: Claude Cowork, the Claude in Office and Claude Design betas and several Claude Code modes are not covered, and data flowing to third parties through MCP connectors, Enterprise Search or Claude in Chrome is not covered even where the feature remains usable. A BAA also covers only the organisation that accepted it.","rationales":{"A":"Coverage is explicitly bounded; Cowork and several other surfaces sit outside the BAA even after signature.","C":"SOC 2 and ISO certifications are voluntary attestations about management systems and do not by themselves permit PHI processing.","D":"A BAA covers only the organisation that accepted it, so affiliates need their own arrangement."},"sources":[{"title":"Business Associate Agreements (BAA) for Commercial Customers - Anthropic Privacy Center","url":"https://privacy.claude.com/en/articles/8114513-business-associate-agreements-baa-for-commercial-customers","date":"2026-08-19","basis":"published"}],"tags":["hipaa","baa","phi","exam-trap"]},{"id":"D6-017","domain":"D6","objective":"Understand the ethical implications of AI usage","type":"single","difficulty":"hard","scenario":false,"stem":"Anthropic publishes political even-handedness results for its models, measured across paired requests that present opposing viewpoints on a fixed set of topics. What may a deploying organisation legitimately conclude from a strong result?","options":[{"key":"A","text":"That the model engaged with both requests in each pair to a comparable standard on that test set, which is not a statement about any single output."},{"key":"B","text":"That outputs on contested topics are balanced in practice, so a reviewer no longer needs to read individual drafts on those topics before they are circulated."},{"key":"C","text":"That the organisation inherits the published result as evidence of its own compliance with a regulator's fairness expectations for automated content."},{"key":"D","text":"That the result carries across every model in the current Claude line-up, because the evaluation is run once for each model generation."}],"correct":["A"],"explanation":"The published evaluation spans paired requests presenting opposing political viewpoints across a fixed set of topics and task types, and scores whether the model engages with both requests in a pair with comparable depth and quality, whether it acknowledges opposing viewpoints, and how often it declines to answer. That is an aggregate measurement of one model on one test set. It does not certify a particular output, it is not a compliance artefact belonging to the deploying organisation, and results are reported per model rather than inherited across a line-up.","rationales":{"B":"An aggregate score on a test set says nothing about the specific draft in front of a reviewer, so the review step stays.","C":"The evaluation is Anthropic's account of its own model; a deployer's regulatory position rests on its own controls.","D":"Results are published per model report, and one model's score does not transfer to the others in the line-up."},"sources":[{"title":"Anthropic's Transparency Hub - Model Report detail","url":"https://www.anthropic.com/transparency/model-report","date":"2026-08-19","basis":"verified-live"},{"title":"Anthropic's Transparency Hub - Model Report","url":"https://www.anthropic.com/transparency","date":"2026-08-17","basis":"published"}],"tags":["bias","model-reports","transparency-hub","evaluation-limits"]},{"id":"D6-018","domain":"D6","objective":"Apply data sensitivity, regulatory, and privacy considerations","type":"single","difficulty":"medium","scenario":true,"stem":"In a briefing to a public sector client, a colleague states that Claude Enterprise is FedRAMP High certified. Which correction is accurate?","options":[{"key":"A","text":"Claude models themselves hold FedRAMP High certification, which any Claude Enterprise tenant inherits automatically."},{"key":"B","text":"Claude Enterprise holds FedRAMP Moderate, and FedRAMP High is available as a paid add-on for public sector tenants."},{"key":"C","text":"FedRAMP authorises cloud services rather than models, and Claude Enterprise is not one of the authorised offerings."},{"key":"D","text":"FedRAMP High status follows automatically from Anthropic's SOC 2 Type II and ISO/IEC 42001 certifications."}],"correct":["C"],"explanation":"Anthropic states that FedRAMP is a certification for cloud services rather than for AI models. Three offerings hold FedRAMP High authorisation: Claude for Government as a standalone application, Claude via Amazon Bedrock in AWS GovCloud, and Claude via Google Vertex with Assured Workloads. Claude Enterprise is not FedRAMP authorised.","rationales":{"A":"Models are software components deployed inside an authorised environment; they are not themselves FedRAMP certified.","B":"No FedRAMP Moderate authorisation for Claude Enterprise is documented, and FedRAMP is not sold as an add-on.","D":"SOC 2 and ISO 42001 are voluntary attestations and certifications; they do not produce a FedRAMP authorisation."},"sources":[{"title":"Public Sector FAQs - Anthropic Help Center","url":"https://support.claude.com/en/articles/13756069-public-sector-faqs","date":"2026-03-25","basis":"published"}],"tags":["fedramp","public-sector","claude-for-government","exam-trap"]},{"id":"D6-019","domain":"D6","objective":"Apply data sensitivity, regulatory, and privacy considerations","type":"single","difficulty":"easy","scenario":false,"stem":"For users located in the EEA, the UK or Switzerland, which entity is the data controller and contracting party, and how are data subject requests submitted?","options":[{"key":"A","text":"Anthropic, PBC in the United States, with requests sent through the in-product support chat only."},{"key":"B","text":"Anthropic Ireland, Limited, wi
