<title>Proctor</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#12141A">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap">
<style>
/* Proctor -----------------------------------------------------------------
   Committed dark instrument bench. One palette, painted explicitly, so the
   page holds on either host ground.
   Chivo = chrome (operating) / Literata = stems (reading) / Plex Mono = data
   ------------------------------------------------------------------------ */
:root{
  --ground:#12141A; --panel:#191C24; --raised:#20242E; --sunken:#0E1015;
  --line:#2B303B; --line-2:#3A4152;
  --ink:#E9EAEE; --ink-2:#B7BDC9; --muted:#8B929F; --faint:#646B79;
  --brass:#E3A94F; --brass-2:#F0C079; --brass-dim:#7E5C22; --brass-wash:#241D10;
  --jade:#5DBE96; --jade-wash:#122A20; --jade-line:#255744;
  --clay:#E0706A; --clay-wash:#2B1716; --clay-line:#5C2C29;
  --flag:#84AADB; --flag-wash:#151F2C; --flag-line:#2C425E;
  --r:4px; --r-lg:8px;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 28px rgba(0,0,0,.38);
  --ui:"Chivo","Helvetica Neue",Arial,sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif;
  --data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--ui); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:600; text-wrap:balance; letter-spacing:-.01em}
p{margin:0}
a{color:var(--brass); text-decoration:none; border-bottom:1px solid var(--brass-dim)}
a:hover{color:var(--brass-2); border-bottom-color:var(--brass)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px; border-radius:2px}
::selection{background:var(--brass-dim); color:#fff}
[hidden]{display:none !important}

/* typographic roles */
.mono{font-family:var(--data); font-variant-numeric:tabular-nums}
.read{font-family:var(--read); line-height:1.62}
.eyebrow{font-family:var(--data); font-size:10.5px; font-weight:500;
  letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}
.muted{color:var(--muted)}
.dim{color:var(--faint)}
.nowrap{white-space:nowrap}

/* shell */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:20px;
  padding:0 22px; height:56px;
  background:rgba(18,20,26,.93); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; flex:none}
.brand .mark{
  width:22px; height:22px; border-radius:3px; flex:none; position:relative;
  background:linear-gradient(150deg,var(--brass-2),var(--brass-dim));
  box-shadow:0 0 0 1px rgba(227,169,79,.35), 0 0 14px rgba(227,169,79,.22);
}
.brand .mark::after{
  content:""; position:absolute; inset:6px 6px auto 6px; height:2px;
  background:var(--sunken); box-shadow:0 5px 0 var(--sunken);
}
.brand b{font-size:16px; font-weight:700; letter-spacing:.02em}
.nav{display:flex; gap:2px; flex:1 1 auto; min-width:0; overflow-x:auto; scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  background:none; border:0; padding:7px 12px; border-radius:var(--r);
  color:var(--muted); font-size:13.5px; font-weight:500; cursor:pointer; white-space:nowrap;
}
.nav button:hover{color:var(--ink); background:var(--raised)}
.nav button[aria-current="true"]{color:var(--brass); background:var(--brass-wash)}
.topbar .right{display:flex; align-items:center; gap:10px; flex:none}

.wrap{max-width:1180px; margin:0 auto; padding:30px 22px 90px}
.wrap.narrow{max-width:940px}
.stack{display:flex; flex-direction:column; gap:26px}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{flex:1 1 auto}

.pagehead{display:flex; flex-direction:column; gap:7px}
.pagehead h1{font-size:27px}
.pagehead p{max-width:66ch; color:var(--ink-2); font-size:14.5px}

/* surfaces */
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px}
.card.flush{padding:0; overflow:hidden}
.sect{display:flex; flex-direction:column; gap:14px}
.sect > h2{font-size:15px; display:flex; align-items:center; gap:10px}
.sect > h2::after{content:""; flex:1 1 auto; height:1px; background:var(--line)}
hr.rule{border:0; border-top:1px solid var(--line); margin:0}

/* controls */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:9px 16px; border-radius:var(--r); cursor:pointer;
  background:var(--raised); border:1px solid var(--line-2); color:var(--ink);
  font-size:13.5px; font-weight:500; white-space:nowrap;
  transition:background .12s ease, border-color .12s ease, color .12s ease;
}
.btn:hover:not(:disabled){background:#2A2F3B; border-color:#4A5265}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.primary{
  background:linear-gradient(180deg,var(--brass-2),var(--brass));
  border-color:var(--brass-dim); color:#20180A; font-weight:600;
}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#F6CE8E,var(--brass-2))}
.btn.ghost{background:transparent; border-color:var(--line)}
.btn.ghost:hover:not(:disabled){background:var(--raised)}
.btn.danger{color:var(--clay); border-color:var(--clay-line)}
.btn.danger:hover:not(:disabled){background:var(--clay-wash); border-color:var(--clay)}
.btn.sm{padding:5px 10px; font-size:12.5px}
.btn.lg{padding:12px 24px; font-size:15px}

.field{display:flex; flex-direction:column; gap:7px}
.field > label{font-family:var(--data); font-size:10.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--faint)}
input[type=text],input[type=number],select,textarea{
  background:var(--sunken); border:1px solid var(--line-2); border-radius:var(--r);
  padding:9px 11px; width:100%; font-size:14px;
}
input[type=number]{font-family:var(--data)}
input[type=range]{width:100%; accent-color:var(--brass)}
select{cursor:pointer}

.seg{display:inline-flex; background:var(--sunken); border:1px solid var(--line-2);
  border-radius:var(--r); padding:2px; gap:2px; max-width:100%; overflow-x:auto; scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto}
.seg button{background:none; border:0; padding:7px 14px; border-radius:3px; cursor:pointer;
  color:var(--muted); font-size:13px; font-weight:500}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--brass-wash); color:var(--brass);
  box-shadow:inset 0 0 0 1px var(--brass-dim)}

.check{
  display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
  padding:6px 11px; border:1px solid var(--line-2); border-radius:var(--r);
  background:var(--sunken); font-size:13px; color:var(--ink-2);
}
.check:hover{border-color:#4A5265; color:var(--ink)}
.check input{accent-color:var(--brass); margin:0; width:14px; height:14px}
.check.on{border-color:var(--brass-dim); background:var(--brass-wash); color:var(--brass-2)}
.check .n{font-family:var(--data); font-size:11px; color:var(--faint)}
.check.on .n{color:var(--brass-dim)}

/* chips */
.chip{
  font-family:var(--data); font-size:10.5px; font-weight:500; letter-spacing:.06em;
  padding:3px 7px; border-radius:3px; background:var(--raised);
  border:1px solid var(--line-2); color:var(--ink-2); white-space:nowrap;
}
.chip.brass{background:var(--brass-wash); border-color:var(--brass-dim); color:var(--brass)}
.chip.jade{background:var(--jade-wash); border-color:var(--jade-line); color:var(--jade)}
.chip.clay{background:var(--clay-wash); border-color:var(--clay-line); color:var(--clay)}
.chip.flagc{background:var(--flag-wash); border-color:var(--flag-line); color:var(--flag)}
.diff{display:inline-flex; align-items:center; gap:5px; font-family:var(--data);
  font-size:10.5px; color:var(--muted)}
.diff i{display:block; width:4px; height:10px; background:var(--line-2); border-radius:1px}
.diff i.on{background:var(--brass)}

/* library */
.packs{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr)); gap:16px}
.pack{display:flex; flex-direction:column; gap:13px; padding:18px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg)}
.pack[data-on="0"]{opacity:.5}
.pack h3{font-size:16px}
.pack .desc{font-size:13px; color:var(--muted); line-height:1.55}
.pack .nums{display:flex; gap:18px; padding-top:2px; flex-wrap:wrap}
.pack .nums div{display:flex; flex-direction:column; gap:1px}
.pack .nums b{font-family:var(--data); font-size:19px; font-weight:600; color:var(--ink)}
.pack .nums span{font-family:var(--data); font-size:9.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint)}
.note{
  font-size:12.5px; line-height:1.5; color:var(--brass-2);
  background:var(--brass-wash); border-left:2px solid var(--brass-dim);
  padding:9px 11px; border-radius:0 var(--r) var(--r) 0;
}
.dz{border:1px dashed var(--line-2); border-radius:var(--r-lg); padding:26px;
  text-align:center; background:var(--panel); transition:border-color .15s, background .15s}
.dz.hot{border-color:var(--brass); background:var(--brass-wash)}
.dz h3{font-size:15px; margin-bottom:6px}

/* setup */
.grid2{display:grid; grid-template-columns:1fr 336px; gap:22px; align-items:start}
.sticky{position:sticky; top:80px}
.mixline{display:flex; height:8px; border-radius:99px; overflow:hidden;
  background:var(--sunken); border:1px solid var(--line)}
.mixline i{display:block; height:100%}

/* exam runner */
.runner{display:grid; grid-template-columns:236px 1fr; gap:26px; align-items:start}
.rail{position:sticky; top:78px; display:flex; flex-direction:column; gap:16px}
.clock{display:flex; flex-direction:column; gap:3px; padding:13px 15px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg)}
.clock b{font-family:var(--data); font-size:29px; font-weight:600; line-height:1.1}
.clock.warn b{color:var(--brass)}
.clock.crit b{color:var(--clay)}
.meter{height:3px; background:var(--sunken); border-radius:99px; overflow:hidden; margin-top:8px}
.meter i{display:block; height:100%; background:var(--brass); transition:width .4s ease}
.sheet{display:grid; grid-template-columns:repeat(6,1fr); gap:5px}
.sheet button{
  aspect-ratio:1; border-radius:3px; cursor:pointer; position:relative;
  background:var(--sunken); border:1px solid var(--line);
  color:var(--faint); font-family:var(--data); font-size:11px; font-weight:500;
}
.sheet button:hover{border-color:var(--line-2); color:var(--ink-2)}
.sheet button[data-s="answered"]{background:var(--raised); border-color:var(--line-2); color:var(--ink)}
.sheet button[data-s="correct"]{background:var(--jade-wash); border-color:var(--jade-line); color:var(--jade)}
.sheet button[data-s="wrong"]{background:var(--clay-wash); border-color:var(--clay-line); color:var(--clay)}
.sheet button[data-f="1"]::after{
  content:""; position:absolute; top:-1px; right:-1px; width:0; height:0;
  border-top:7px solid var(--flag); border-left:7px solid transparent; border-radius:0 3px 0 0;
}
.sheet button[aria-current="true"]{box-shadow:0 0 0 2px var(--brass); border-color:var(--brass)}
.legend{display:flex; flex-direction:column; gap:5px}
.legend span{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--faint)}
.legend i{width:9px; height:9px; border-radius:2px; border:1px solid var(--line-2);
  background:var(--sunken); flex:none}

.qcard{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden}
.qhead{display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  padding:13px 20px; background:var(--raised); border-bottom:1px solid var(--line)}
.qhead .idx{font-family:var(--data); font-size:12px; font-weight:600; color:var(--brass)}
.qbody{padding:22px 24px; display:flex; flex-direction:column; gap:18px}
.stem{font-family:var(--read); font-size:16.5px; line-height:1.62; max-width:70ch; color:var(--ink)}
.instr{font-family:var(--data); font-size:11px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--brass); margin-top:-8px}
.opts{display:flex; flex-direction:column; gap:9px}
.opt{
  display:flex; gap:13px; align-items:flex-start; width:100%; text-align:left;
  padding:13px 15px; border-radius:var(--r); cursor:pointer;
  background:var(--sunken); border:1px solid var(--line);
  transition:border-color .12s ease, background .12s ease;
}
.opt:hover:not(:disabled){border-color:var(--line-2); background:#171A21}
.opt .k{flex:none; width:23px; height:23px; border-radius:3px; display:grid; place-items:center;
  border:1px solid var(--line-2); background:var(--panel);
  font-family:var(--data); font-size:11.5px; font-weight:600; color:var(--muted)}
.opt .t{font-family:var(--read); font-size:14.5px; line-height:1.55; color:var(--ink-2); padding-top:1px}
.opt[data-sel="1"]{border-color:var(--brass-dim); background:var(--brass-wash)}
.opt[data-sel="1"] .k{background:var(--brass); border-color:var(--brass); color:#20180A}
.opt[data-sel="1"] .t{color:var(--ink)}
.opt[data-v="key"]{border-color:var(--jade-line); background:var(--jade-wash)}
.opt[data-v="key"] .k{background:var(--jade); border-color:var(--jade); color:#0C1F17}
.opt[data-v="key"] .t{color:var(--ink)}
.opt[data-v="miss"]{border-color:var(--clay-line); background:var(--clay-wash)}
.opt[data-v="miss"] .k{background:var(--clay); border-color:var(--clay); color:#2B0F0E}
.opt[data-v="miss"] .t{color:var(--ink)}
.opt:disabled{cursor:default}
.opt .why{font-family:var(--read); font-size:13px; line-height:1.55; color:var(--muted);
  margin-top:7px; padding-left:11px; border-left:1px solid var(--line-2)}

/* feedback */
.fb{display:flex; flex-direction:column; gap:14px; padding:18px 20px;
  border-radius:var(--r); border:1px solid var(--line); background:var(--sunken)}
.fb.ok{border-color:var(--jade-line)}
.fb.no{border-color:var(--clay-line)}
.fb .verdict{display:flex; align-items:center; gap:9px; font-size:14px; font-weight:600}
.fb.ok .verdict{color:var(--jade)}
.fb.no .verdict{color:var(--clay)}
.fb .body{font-family:var(--read); font-size:14px; line-height:1.65; color:var(--ink-2); max-width:72ch}
.srcs{display:flex; flex-direction:column; gap:6px}
.srcs a{font-size:12.5px; border:0; color:var(--ink-2); display:flex; gap:8px; align-items:baseline}
.srcs a:hover{color:var(--brass)}
.srcs a .d{font-family:var(--data); font-size:10.5px; color:var(--faint); flex:none}

.qfoot{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:14px 20px; background:var(--raised); border-top:1px solid var(--line)}

/* results */
.scorewrap{display:grid; grid-template-columns:308px 1fr; gap:34px; align-items:center}
.dial{width:308px; height:196px; display:block}
.dial .track{fill:none; stroke:var(--sunken); stroke-width:15; stroke-linecap:round}
.dial .fill{fill:none; stroke-width:15; stroke-linecap:round;
  transition:stroke-dashoffset 1.1s cubic-bezier(.22,.7,.25,1)}
.dial .notch{stroke:var(--ink); stroke-width:2}
.dial .tick{stroke:var(--line-2); stroke-width:1}
.dial text{font-family:var(--data); fill:var(--faint); font-size:9px; letter-spacing:.08em}
.verdictbox{display:flex; flex-direction:column; gap:13px}
.verdictbox .big{font-family:var(--data); font-size:50px; font-weight:600; line-height:1; letter-spacing:-.02em}
.verdictbox .stamp{align-self:flex-start; font-family:var(--data); font-size:12px; font-weight:600;
  letter-spacing:.18em; text-transform:uppercase; padding:6px 14px; border-radius:3px}
.stamp.pass{color:var(--jade); border:1px solid var(--jade-line); background:var(--jade-wash)}
.stamp.fail{color:var(--clay); border:1px solid var(--clay-line); background:var(--clay-wash)}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(126px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden}
.kpi{background:var(--panel); padding:14px 16px; display:flex; flex-direction:column; gap:3px}
.kpi b{font-family:var(--data); font-size:22px; font-weight:600}
.kpi span{font-family:var(--data); font-size:9.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint)}

.bars{display:flex; flex-direction:column; gap:12px}
.bar{display:grid; grid-template-columns:1fr 66px; gap:13px; align-items:center}
.bar .lab{display:flex; flex-direction:column; gap:6px; min-width:0}
.bar .lab .t{display:flex; align-items:center; gap:8px; font-size:13px; min-width:0}
.bar .lab .t em{font-style:normal; color:var(--ink-2); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.bar .track{height:7px; background:var(--sunken); border-radius:99px; overflow:hidden;
  position:relative; border:1px solid var(--line)}
.bar .track i{display:block; height:100%; border-radius:99px;
  transition:width .8s cubic-bezier(.22,.7,.25,1)}
.bar .cut{position:absolute; top:0; bottom:0; width:1px; background:var(--line-2)}
.bar .val{font-family:var(--data); font-size:13px; text-align:right; color:var(--ink-2)}

.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
.tbl th{text-align:left; padding:9px 14px; font-family:var(--data); font-size:10px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--faint);
  border-bottom:1px solid var(--line); font-weight:500; white-space:nowrap}
.tbl td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--raised)}
.tbl td.num{font-family:var(--data); text-align:right; white-space:nowrap}
.scroll{overflow-x:auto}

.trend{width:100%; height:136px; display:block}
.trend .gl{stroke:var(--line); stroke-width:1}
.trend .cutline{stroke:var(--brass-dim); stroke-width:1; stroke-dasharray:3 3}
.trend .ln{fill:none; stroke:var(--brass); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.trend .ar{fill:url(#tg); stroke:none}
.trend .dot{fill:var(--ground); stroke:var(--brass); stroke-width:2}
.trend .dot.last{fill:var(--brass)}
.trend text{font-family:var(--data); fill:var(--faint); font-size:9px}

.empty{padding:46px 22px; text-align:center; color:var(--muted);
  display:flex; flex-direction:column; gap:9px; align-items:center}
.empty b{color:var(--ink-2); font-size:15px}

.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  background:var(--raised); border:1px solid var(--line-2); border-radius:var(--r);
  padding:11px 18px; font-size:13.5px; box-shadow:var(--shadow); z-index:80;
  max-width:min(560px,90vw)}
.toast.bad{border-color:var(--clay-line); color:var(--clay)}
.toast.good{border-color:var(--jade-line); color:var(--jade)}

.modal{position:fixed; inset:0; z-index:70; display:grid; place-items:center;
  background:rgba(8,9,12,.74); padding:22px}
.modal .box{background:var(--panel); border:1px solid var(--line-2); border-radius:var(--r-lg);
  padding:24px; max-width:470px; width:100%; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:15px;
  max-height:86dvh; max-height:86vh; overflow-y:auto; overscroll-behavior:contain}

kbd{font-family:var(--data); font-size:10.5px; padding:1px 5px; border-radius:3px;
  background:var(--sunken); border:1px solid var(--line-2); border-bottom-width:2px; color:var(--muted)}

.revitem{border:1px solid var(--line); border-radius:var(--r-lg); background:var(--panel); overflow:hidden}
.revitem > summary{
  display:flex; align-items:center; gap:10px; padding:12px 16px; cursor:pointer;
  list-style:none; background:var(--raised); flex-wrap:wrap;
}
.revitem > summary::-webkit-details-marker{display:none}
.revitem > summary:hover{background:#252A35}
.revitem[open] > summary{border-bottom:1px solid var(--line)}
.revitem .stemline{font-family:var(--read); font-size:13.5px; color:var(--ink-2);

/* ── touch shell ──────────────────────────────────────────────────────────
   On a phone the answer sheet, the clock and the controls cannot all sit in
   a side rail, and stacking the rail above the question buries the question.
   So the rail is retired below 900px: the clock rides a sticky strip under
   the header, the controls become a thumb-reachable fixed bar, and the sheet
   moves into a drawer opened from the question counter.
   ------------------------------------------------------------------------ */
.mobilebar, .mobilebottom{display:none}

.mobilebar{
  position:sticky; top:56px; z-index:30;
  align-items:center; gap:11px; padding:9px 14px;
  background:rgba(18,20,26,.96); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);

}
.mobilebar .count{font-family:var(--data); font-size:12px; font-weight:600; color:var(--brass)}
.mobilebar .mprog{flex:1 1 auto; height:4px; background:var(--sunken); border-radius:99px; overflow:hidden}

.mobilebar .mclock{font-family:var(--data); font-size:15px; font-weight:600; font-variant-numeric:tabular-nums}
.mobilebar[data-t="warn"] .mclock{color:var(--brass)}
.mobilebar[data-t="crit"] .mclock{color:var(--clay)}

.mobilebottom{
  position:fixed; left:0; right:0; bottom:0; z-index:35; gap:8px;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  background:rgba(18,20,26,.97); backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
}
.mobilebottom .btn{min-height:46px; flex:1 1 auto}
.mobilebottom .btn.narrow{flex:0 0 54px; padding:9px 0}

.drawer .sheet{grid-template-columns:repeat(6,1fr); gap:6px}
.drawer .sheet button{font-size:12.5px}

@media (max-width:900px){
  .runner{display:block}
  .grid2,.scorewrap{grid-template-columns:1fr}
  .rail{display:none}
  .qfoot{display:none}
  .mobilebar{display:flex}

<script>
"use strict";
/* ===================================================================== *
 *  Proctor - a practice-exam bench
 *  Bundled datasets are inlined at build time; further datasets are
 *  imported by the user and kept in localStorage.
 * ===================================================================== */

var BUNDLED = __BUNDLED_PACKS__;

/* ---------- tiny helpers ---------- */
var $ = function (sel, root) { return (root || document).querySelector(sel); };
var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function pct(n, d) { return d ? Math.round((n / d) * 1000) / 10 : 0; }
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }

function fmtClock(ms) {
  var t = Math.max(0, Math.round(ms / 1000));
  var h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  var p = function (x) { return (x < 10 ? '0' : '') + x; };
  return (h ? h + ':' : '') + p(m) + ':' + p(s);
}
function fmtDur(ms) {
  var t = Math.round(ms / 1000);
  if (t < 60) return t + 's';
  var m = Math.floor(t / 60), s = t % 60;
  if (m < 60) return m + 'm ' + s + 's';
  return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
}
function fmtDate(ts) {
  var d = new Date(ts);
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) +
    ', ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}
function shuffle(a) {
  var arr = a.slice();
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function sameSet(a, b) {
  if (a.length !== b.length) return false;
  var s = {}; a.forEach(function (x) { s[x] = 1; });
  return b.every(function (x) { return s[x]; });
}

/* ---------- storage (degrades to memory if localStorage is walled off) ---------- */
var MEM = {};
var STORE = {
  ok: (function () {
    try { localStorage.setItem('__p', '1'); localStorage.removeItem('__p'); return true; }
    catch (e) { return false; }
  })(),
  get: function (k, dflt) {
    try {
      var raw = this.ok ? localStorage.getItem(k) : MEM[k];
      return raw ? JSON.parse(raw) : dflt;
    } catch (e) { return dflt; }
  },
  set: function (k, v) {
    var raw = JSON.stringify(v);
    try { if (this.ok) localStorage.setItem(k, raw); else MEM[k] = raw; return true; }
    catch (e) { toast('Browser storage is full. Remove an imported dataset or clear history.', 'bad'); return false; }
  },
  del: function (k) {
    try { if (this.ok) localStorage.removeItem(k); else delete MEM[k]; } catch (e) { }
  }
};
var K = { packs: 'proctor.packs', hist: 'proctor.history', sess: 'proctor.session', prefs: 'proctor.prefs' };

/* ---------- dataset normalisation ------------------------------------- *
 * Accepts: native exam-pack JSON, a bank object with an `items` array,
 * a bare array of items, JSONL, or CSV. Field names are sniffed, so most
 * question banks import without being reshaped first.
 * ---------------------------------------------------------------------- */
var KEYS = 'ABCDEFGHIJ'.split('');

function firstOf(o) {
  for (var i = 1; i < arguments.length; i++) {
    var k = arguments[i];
    if (o[k] !== undefined && o[k] !== null && o[k] !== '') return o[k];
  }
  return undefined;
}

function normOptions(raw) {
  var out = [], i;
  var opts = firstOf(raw, 'options', 'choices', 'answers', 'opts');
  if (Array.isArray(opts)) {
    for (i = 0; i < opts.length; i++) {
      var o = opts[i];
      if (o == null) continue;
      if (typeof o === 'string') out.push({ key: KEYS[i], text: o });
      else out.push({ key: String(firstOf(o, 'key', 'label', 'id') || KEYS[i]).trim().toUpperCase(), text: String(firstOf(o, 'text', 'value', 'option', 'body') || '') });
    }
  } else if (opts && typeof opts === 'object') {
    Object.keys(opts).forEach(function (k) { out.push({ key: k.trim().toUpperCase(), text: String(opts[k]) }); });
  } else {
    for (i = 0; i < KEYS.length; i++) {
      var L = KEYS[i], v = firstOf(raw, 'option_' + L.toLowerCase(), 'option_' + L, 'opt_' + L.toLowerCase(), L, L.toLowerCase(), 'choice_' + L.toLowerCase(), 'answer_' + L.toLowerCase());
      if (v !== undefined) out.push({ key: L, text: String(v) });
    }
  }
  return out.filter(function (o) { return o.text && String(o.text).trim(); });
}

function normCorrect(raw, options) {
  var c = firstOf(raw, 'correct', 'answer', 'correct_answer', 'correctAnswers', 'key', 'solution');
  if (c === undefined) return [];
  var list = Array.isArray(c) ? c : String(c).split(/[,;|\s]+/);
  var valid = {}; options.forEach(function (o) { valid[o.key] = 1; });
  var out = [];
  list.forEach(function (v) {
    if (v === null || v === '') return;
    var s = String(v).trim().toUpperCase();
    if (valid[s]) { out.push(s); return; }
    if (/^\d+$/.test(s)) {                       // 0- or 1-based index
      var n = parseInt(s, 10);
      if (options[n]) { out.push(options[n].key); return; }
      if (options[n - 1]) { out.push(options[n - 1].key); return; }
    }
    var m = options.filter(function (o) { return o.text.trim().toUpperCase() === s; })[0];
    if (m) out.push(m.key);
  });
  return out.filter(function (v, i, a) { return a.indexOf(v) === i; });
}

function normItem(raw, i) {
  if (!raw || typeof raw !== 'object') return null;
  var options = normOptions(raw);
  var stem = firstOf(raw, 'stem', 'question', 'prompt', 'q', 'text', 'body');
  if (!stem || options.length < 2) return null;
  var correct = normCorrect(raw, options);
  if (!correct.length) return null;

  var t = String(firstOf(raw, 'type', 'question_type') || '').toLowerCase();
  var multi = /multi(ple)?[_ -]?(response|select|answer)|checkbox|msq/.test(t) || (!t && correct.length > 1) || t === 'multi';
  var diff = String(firstOf(raw, 'difficulty', 'level') || 'medium').toLowerCase();
  if (['easy', 'medium', 'hard'].indexOf(diff) < 0) diff = /1|beginner|basic/.test(diff) ? 'easy' : (/3|advanced|expert/.test(diff) ? 'hard' : 'medium');

  var tags = firstOf(raw, 'tags', 'topics', 'keywords') || [];
  if (typeof tags === 'string') tags = tags.split(/[,;|]/).map(function (s) { return s.trim(); }).filter(Boolean);

  var srcs = firstOf(raw, 'sources', 'references', 'citations') || [];
  if (!Array.isArray(srcs)) srcs = [];
  srcs = srcs.map(function (s) {
    if (typeof s === 'string') return { title: s, url: /^https?:/.test(s) ? s : '', date: '', basis: '' };
    return { title: firstOf(s, 'title', 'name', 'source') || '', url: firstOf(s, 'url', 'link', 'href') || '',
             date: firstOf(s, 'date', 'published') || '', basis: firstOf(s, 'basis', 'date_basis') || '' };
  });

  var notes = raw.notes && typeof raw.notes === 'object' ? raw.notes : {};
  if (raw.known_issue) notes.caveat = raw.known_issue;
  if (raw.community_signal) notes.signal = raw.community_signal;

  return {
    id: String(firstOf(raw, 'id', 'qid', 'ref') || ('Q' + (i + 1))),
    domain: String(firstOf(raw, 'domain', 'domain_id', 'category', 'section', 'topic') || ''),
    domainName: String(firstOf(raw, 'domainName', 'domain_name') || ''),
    objective: String(firstOf(raw, 'objective', 'skill', 'learning_objective') || ''),
    type: multi ? 'multi' : 'single',
    difficulty: diff,
    scenario: !!firstOf(raw, 'scenario', 'scenario_based'),
    stem: String(stem),
    options: options,
    correct: correct,
    explanation: String(firstOf(raw, 'explanation', 'rationale', 'why', 'feedback') || ''),
    rationales: firstOf(raw, 'rationales', 'distractor_rationales', 'option_rationales') || {},
    sources: srcs,
    tags: tags,
    notes: notes
  };
}

function parseCSV(text) {
  var rows = [], row = [], cur = '', q = false, i, c;
  text = text.replace(/^﻿/, '');
  for (i = 0; i < text.length; i++) {
    c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c === '\r') { /* skip */ }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  if (!rows.length) return [];
  var head = rows.shift().map(function (h) { return h.trim(); });
  return rows.filter(function (r) { return r.some(function (v) { return v !== ''; }); })
    .map(function (r) {
      var o = {};
      head.forEach(function (h, n) {
        var v = r[n] === undefined ? '' : r[n];
        if (v === 'True') v = true; else if (v === 'False') v = false;
        o[h] = v;
      });
      return o;
    });
}

function parseText(text, filename) {
  var trimmed = text.trim();
  if (!trimmed) throw new Error('The file is empty.');
  if (trimmed[0] === '{' || trimmed[0] === '[') {
    try { return JSON.parse(trimmed); } catch (e) { /* fall through to JSONL */ }
  }
  if (/\.jsonl$|\.ndjson$/i.test(filename) || /^\s*\{/.test(trimmed)) {
    var rows = [], bad = 0;
    trimmed.split(/\r?\n/).forEach(function (l) {
      l = l.trim(); if (!l) return;
      try { rows.push(JSON.parse(l)); } catch (e) { bad++; }
    });
    if (rows.length) return rows;
    if (bad) throw new Error('Could not read this as JSON or JSONL.');
  }
  return parseCSV(text);
}

function packFromRaw(raw, filename) {
  var base = filename.replace(/\.[a-z0-9]+$/i, '').replace(/[-_]+/g, ' ').trim();
  var meta = {}, rawItems;
  if (Array.isArray(raw)) rawItems = raw;
  else if (raw && Array.isArray(raw.items)) { meta = raw; rawItems = raw.items; }
  else if (raw && Array.isArray(raw.questions)) { meta = raw; rawItems = raw.questions; }
  else throw new Error('No question list found. Expected an array of questions, or an object with an "items" array.');

  var items = [], skipped = 0;
  rawItems.forEach(function (r, i) {
    var it = normItem(r, i);
    if (it) items.push(it); else skipped++;
  });
  if (!items.length) throw new Error('No usable questions found. Each needs a question, at least two options, and a correct answer.');

  var m = meta.metadata || meta;
  var domains = Array.isArray(meta.domains) ? meta.domains.map(function (d) {
    return { id: String(d.id || d.code || ''), name: String(d.name || d.title || d.id || ''), weight: Number(d.weight) || 0 };
  }) : [];
  if (!domains.length) {
    var seen = {};
    items.forEach(function (it) {
      if (!it.domain) return;
      if (!seen[it.domain]) seen[it.domain] = { id: it.domain, name: it.domainName || it.domain, weight: 0 };
    });
    domains = Object.keys(seen).map(function (k) { return seen[k]; }).sort(function (a, b) { return a.id < b.id ? -1 : 1; });
  }
  var cfg = meta.config || {};
  return {
    format: 'exam-pack', version: 1,
    id: String(meta.id || ('pack-' + uid())),
    name: String(meta.name || m.exam_name || m.dataset || base || 'Imported dataset'),
    vendor: String(meta.vendor || m.vendor || ''),
    examCode: String(meta.examCode || m.exam_code || ''),
    description: String(meta.description || m.provenance || ''),
    caution: meta.caution || '',
    config: {
      examLength: Number(cfg.examLength) || Math.min(60, items.length),
      timeLimitMinutes: Number(cfg.timeLimitMinutes) || Math.max(10, Math.round(Math.min(60, items.length) * 2)),
      passPercent: Number(cfg.passPercent) || 70,
      scaleMin: Number(cfg.scaleMin) || 0,
      scaleMax: Number(cfg.scaleMax) || 100,
      scalePass: cfg.scalePass !== undefined ? Number(cfg.scalePass) : (Number(cfg.passPercent) || 70),
      blueprintWeighted: cfg.blueprintWeighted !== false && domains.some(function (d) { return d.weight > 0; })
    },
    domains: domains,
    items: items,
    _skipped: skipped
  };
}
</script>
<script>
"use strict";

/* ===================== application state ===================== */
var APP = {
  view: 'library',
  packs: [],
  session: null,
  result: null,
  history: [],
  prefs: { disabled: {}, setup: null }
};

function allDomains() {
  var out = [], seen = {};
  enabledPacks().forEach(function (p) {
    p.domains.forEach(function (d) {
      if (!d.id) return;
      if (!seen[d.id]) { seen[d.id] = { id: d.id, name: d.name, weight: d.weight }; out.push(seen[d.id]); }
      else if (d.weight > seen[d.id].weight) seen[d.id].weight = d.weight;
    });
  });
  out.sort(function (a, b) { return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; });
  return out;
}
function domainName(id) {
  var d = allDomains().filter(function (x) { return x.id === id; })[0];
  return d ? d.name : (id || 'Unclassified');
}
function enabledPacks() {
  return APP.packs.filter(function (p) { return !APP.prefs.disabled[p.id]; });
}
function packById(id) { return APP.packs.filter(function (p) { return p.id === id; })[0]; }
function findItem(id) {
  for (var i = 0; i < APP.packs.length; i++) {
    var m = APP.packs[i].items.filter(function (x) { return x.id === id; })[0];
    if (m) return m;
  }
  return null;
}
function activeConfig() {
  var p = enabledPacks()[0];
  return p ? p.config : { examLength: 20, timeLimitMinutes: 40, passPercent: 70, scaleMin: 0, scaleMax: 100, scalePass: 70 };
}

/* attempt history -> per-item record */
function itemRecord() {
  var rec = {};
  APP.history.forEach(function (a) {
    (a.results || []).forEach(function (r) {
      var e = rec[r.i] || (rec[r.i] = { seen: 0, wrong: 0, lastOk: null, lastTs: 0 });
      e.seen++; if (!r.ok) e.wrong++;
      if (a.ts > e.lastTs) { e.lastTs = a.ts; e.lastOk = !!r.ok; }
    });
  });
  return rec;
}

/* ===================== load / persist ===================== */
function loadAll() {
  var imported = STORE.get(K.packs, []);
  APP.prefs = Object.assign({ disabled: {}, setup: null }, STORE.get(K.prefs, {}));
  APP.history = STORE.get(K.hist, []);
  APP.packs = BUNDLED.map(function (p) { return Object.assign({}, p, { _src: 'bundled' }); })
    .concat(imported.map(function (p) { return Object.assign({}, p, { _src: 'imported' }); }));
  APP.session = STORE.get(K.sess, null);
}
function saveImported() {
  STORE.set(K.packs, APP.packs.filter(function (p) { return p._src === 'imported'; })
    .map(function (p) { var c = Object.assign({}, p); delete c._src; return c; }));
}
function savePrefs() { STORE.set(K.prefs, APP.prefs); }
function saveHistory() { STORE.set(K.hist, APP.history.slice(-80)); }
function saveSession() { if (APP.session) STORE.set(K.sess, APP.session); else STORE.del(K.sess); }

/* ===================== chrome ===================== */
function toast(msg, kind) {
  var host = $('#toast-host');
  host.innerHTML = '<div class="toast ' + (kind || '') + '">' + esc(msg) + '</div>';
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { host.innerHTML = ''; }, 4200);
}
function modal(html) {
  $('#modal-host').innerHTML = '<div class="modal" data-act="modal-bg"><div class="box">' + html + '</div></div>';
}
function closeModal() { $('#modal-host').innerHTML = ''; }

var NAV = [
  { id: 'library', label: 'Library' },
  { id: 'setup', label: 'New exam' },
  { id: 'exam', label: 'In progress' },
  { id: 'results', label: 'Results' },
  { id: 'history', label: 'History' }
];
function renderNav() {
  $('#nav').innerHTML = NAV.filter(function (n) {
    if (n.id === 'exam') return !!APP.session && !APP.session.finishedAt;
    if (n.id === 'results') return !!APP.result;
    return true;
  }).map(function (n) {
    return '<button data-act="go" data-view="' + n.id + '" aria-current="' + (APP.view === n.id) + '">' + esc(n.label) + '</button>';
  }).join('');

  var right = '';
  if (APP.session && !APP.session.finishedAt && APP.view !== 'exam') {
    right = '<button class="btn sm primary" data-act="go" data-view="exam">Resume exam</button>';
  } else if (APP.view === 'library' || APP.view === 'history') {
    var n = enabledPacks().reduce(function (a, p) { return a + p.items.length; }, 0);
    right = '<span class="eyebrow">' + n + ' questions active</span>';
  }
  $('#topright').innerHTML = right;
}

function go(view) {
  if (view === 'exam' && (!APP.session || APP.session.finishedAt)) view = 'setup';
  if (view === 'results' && !APP.result) view = 'history';
  APP.view = view;
  render();
  window.scrollTo(0, 0);
}
function render() {
  stopTimer();
  var v = { library: viewLibrary, setup: viewSetup, exam: viewExam, results: viewResults, history: viewHistory }[APP.view];
  $('#main').innerHTML = v ? v() : '';
  renderNav();
  if (APP.view === 'exam') afterExam();
  if (APP.view === 'results') afterResults();
  if (APP.view === 'history') afterHistory();
  if (APP.view === 'library') afterLibrary();
  if (APP.view === 'setup') afterSetup();
}

/* ===================== view: library ===================== */
function viewLibrary() {
  var packs = APP.packs.map(function (p) {
    var on = !APP.prefs.disabled[p.id];
    var mc = p.items.filter(function (i) { return i.type === 'single'; }).length;
    var doms = {}; p.items.forEach(function (i) { if (i.domain) doms[i.domain] = 1; });
    return '' +
      '<article class="pack" data-on="' + (on ? 1 : 0) + '">' +
        '<div class="row between" style="align-items:flex-start">' +
          '<div style="display:flex;flex-direction:column;gap:6px;min-width:0">' +
            '<h3>' + esc(p.name) + '</h3>' +
            '<div class="row" style="gap:6px">' +
              (p.examCode ? '<span class="chip brass">' + esc(p.examCode) + '</span>' : '') +
              (p.vendor ? '<span class="chip">' + esc(p.vendor) + '</span>' : '') +
              '<span class="chip">' + (p._src === 'bundled' ? 'Built in' : 'Imported') + '</span>' +
            '</div>' +
          '</div>' +
          '<label class="check' + (on ? ' on' : '') + '" title="Include in exams">' +
            '<input type="checkbox" data-act="toggle-pack" data-id="' + esc(p.id) + '"' + (on ? ' checked' : '') + '>' +
            (on ? 'Active' : 'Off') +
          '</label>' +
        '</div>' +
        (p.description ? '<p class="desc">' + esc(p.description) + '</p>' : '') +
        '<div class="nums">' +
          '<div><b>' + p.items.length + '</b><span>Questions</span></div>' +
          '<div><b>' + Object.keys(doms).length + '</b><span>Domains</span></div>' +
          '<div><b>' + mc + '<span style="font-size:13px;color:var(--faint)"> / </span>' + (p.items.length - mc) + '</b><span>Single / Multi</span></div>' +
        '</div>' +
        (p.caution ? '<p class="note">' + esc(p.caution) + '</p>' : '') +
        '<div class="row" style="gap:8px;margin-top:auto;padding-top:4px">' +
          '<button class="btn sm ghost" data-act="pack-detail" data-id="' + esc(p.id) + '">Breakdown</button>' +
          '<button class="btn sm ghost" data-act="pack-copy" data-id="' + esc(p.id) + '">Copy as JSON</button>' +
          (p._src === 'imported' ? '<button class="btn sm danger" data-act="pack-remove" data-id="' + esc(p.id) + '">Remove</button>' : '') +
        '</div>' +
      '</article>';
  }).join('');

  var total = enabledPacks().reduce(function (a, p) { return a + p.items.length; }, 0);

  return '<div class="wrap stack">' +
    '<div class="row between" style="align-items:flex-end;gap:20px">' +
      '<div class="pagehead">' +
        '<span class="eyebrow">Question library</span>' +
        '<h1>Datasets</h1>' +
        '<p>Every active dataset feeds the question pool. Turn one off to sit an exam drawn only from the others, or add your own bank in JSON, JSONL or CSV.</p>' +
      '</div>' +
      '<button class="btn primary lg" data-act="go" data-view="setup"' + (total ? '' : ' disabled') + '>Build an exam</button>' +
    '</div>' +
    '<div class="packs">' + packs + '</div>' +
    '<div class="sect">' +
      '<h2>Add a dataset</h2>' +
      '<div class="dz" id="dz">' +
        '<h3>Drop a question bank here</h3>' +
        '<p class="muted" style="font-size:13px;max-width:56ch;margin:0 auto 14px">' +
          'JSON, JSONL or CSV. Field names are sniffed on the way in, so most banks import unchanged. ' +
          'Questions missing a stem, two options or an answer key are skipped and counted.</p>' +
        '<div class="row" style="justify-content:center">' +
          '<button class="btn" data-act="pick-file">Choose a file</button>' +
          '<button class="btn ghost" data-act="paste-json">Paste JSON</button>' +
          '<button class="btn ghost" data-act="format-help">Expected format</button>' +
        '</div>' +
        '<input type="file" id="file" accept=".json,.jsonl,.ndjson,.csv,.txt" multiple hidden>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function afterLibrary() {
  var dz = $('#dz'), fi = $('#file');
  if (!dz) return;
  fi.addEventListener('change', function () {
    Array.prototype.forEach.call(fi.files, readFile);
    fi.value = '';
  });
  ['dragenter', 'dragover'].forEach(function (e) {
    dz.addEventListener(e, function (ev) { ev.preventDefault(); dz.classList.add('hot'); });
  });
  ['dragleave', 'drop'].forEach(function (e) {
    dz.addEventListener(e, function (ev) { ev.preventDefault(); dz.classList.remove('hot'); });
  });
  dz.addEventListener('drop', function (ev) {
    if (ev.dataTransfer && ev.dataTransfer.files) Array.prototype.forEach.call(ev.dataTransfer.files, readFile);
  });
}

function readFile(file) {
  var r = new FileReader();
  r.onload = function () { importText(String(r.result), file.name); };
  r.onerror = function () { toast('Could not read ' + file.name + '.', 'bad'); };
  r.readAsText(file);
}

function importText(text, filename) {
  var pack;
  try { pack = packFromRaw(parseText(text, filename), filename || 'pasted.json'); }
  catch (e) { toast(e.message || 'Import failed.', 'bad'); return; }
  if (packById(pack.id)) pack.id = pack.id + '-' + uid().slice(0, 4);
  pack._src = 'imported';
  APP.packs.push(pack);
  saveImported();
  APP.setup = null;                    /* new domains need a fresh filter map */
  toast('Added ' + pack.name + ' - ' + plural(pack.items.length, 'question') +
    (pack._skipped ? ', ' + pack._skipped + ' skipped' : ''), 'good');
  render();
}

function packDetail(id) {
  var p = packById(id); if (!p) return;
  var byDom = {}, byDiff = { easy: 0, medium: 0, hard: 0 };
  p.items.forEach(function (i) {
    byDom[i.domain || '-'] = (byDom[i.domain || '-'] || 0) + 1;
    byDiff[i.difficulty] = (byDiff[i.difficulty] || 0) + 1;
  });
  var rows = Object.keys(byDom).sort().map(function (d) {
    var dm = p.domains.filter(function (x) { return x.id === d; })[0];
    return '<tr><td class="mono">' + esc(d) + '</td><td>' + esc(dm ? dm.name : '') + '</td>' +
      '<td class="num">' + byDom[d] + '</td>' +
      '<td class="num dim">' + (dm && dm.weight ? dm.weight + '%' : '-') + '</td></tr>';
  }).join('');
  modal('<h2 style="font-size:17px">' + esc(p.name) + '</h2>' +
    '<div class="scroll"><table class="tbl"><thead><tr><th>Code</th><th>Domain</th><th style="text-align:right">Items</th><th style="text-align:right">Blueprint</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<p class="muted" style="font-size:13px">Difficulty mix: ' + byDiff.easy + ' easy, ' + byDiff.medium + ' medium, ' + byDiff.hard + ' hard. ' +
    'Pass mark ' + p.config.passPercent + '%.</p>' +
    '<div class="row" style="justify-content:flex-end"><button class="btn" data-act="close-modal">Close</button></div>');
}

function formatHelp() {
  var sample = '{\n' +
    '  "name": "My exam",\n' +
    '  "config": { "examLength": 60, "timeLimitMinutes": 120, "passPercent": 72 },\n' +
    '  "domains": [{ "id": "D1", "name": "Fundamentals", "weight": 40 }],\n' +
    '  "items": [{\n' +
    '    "id": "D1-001",\n' +
    '    "domain": "D1",\n' +
    '    "objective": "State the golden rule",\n' +
    '    "type": "single",\n' +
    '    "difficulty": "easy",\n' +
    '    "stem": "Which statement is correct?",\n' +
    '    "options": [{ "key": "A", "text": "..." }, { "key": "B", "text": "..." }],\n' +
    '    "correct": ["B"],\n' +
    '    "explanation": "Shown after the answer.",\n' +
    '    "rationales": { "A": "Why A is wrong." },\n' +
    '    "sources": [{ "title": "Docs", "url": "https://...", "date": "2026-08-01" }],\n' +
    '    "tags": ["clarity"]\n' +
    '  }]\n}';
  modal('<h2 style="font-size:17px">Expected format</h2>' +
    '<p class="muted" style="font-size:13.5px;line-height:1.6">This is the native shape. Anything close to it works: ' +
    '<code class="mono">question</code>/<code class="mono">prompt</code> stand in for <code class="mono">stem</code>, ' +
    '<code class="mono">answer</code> for <code class="mono">correct</code>, and CSV columns ' +
    '<code class="mono">option_a</code>&hellip;<code class="mono">option_f</code> become options. ' +
    'A bare array of questions is fine too - the file name becomes the dataset name.</p>' +
    '<pre class="mono" style="background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:14px;overflow:auto;font-size:11.5px;line-height:1.6;max-height:46vh">' + esc(sample) + '</pre>' +
    '<div class="row" style="justify-content:flex-end"><button class="btn" data-act="close-modal">Close</button></div>');
}

function pasteJson() {
  modal('<h2 style="font-size:17px">Paste a question bank</h2>' +
    '<textarea id="paste" rows="10" placeholder="Paste JSON, JSONL or CSV" style="font-family:var(--data);font-size:12px;resize:vertical"></textarea>' +
    '<div class="row" style="justify-content:flex-end">' +
      '<button class="btn ghost" data-act="close-modal">Cancel</button>' +
      '<button class="btn primary" data-act="paste-go">Import</button>' +
    '</div>');
  setTimeout(function () { var t = $('#paste'); if (t) t.focus(); }, 30);
}

function copyText(text, label) {
  var done = function () { toast((label || 'Copied') + ' to the clipboard.', 'good'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { fallback(); });
  } else fallback();
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); }
    catch (e) { toast('Copying is blocked here.', 'bad'); }
    document.body.removeChild(ta);
  }
}
</script>
<script>
"use strict";

/* ===================== exam setup ===================== */
var DIFFS = ['easy', 'medium', 'hard'];

function defaultSetup() {
  var cfg = activeConfig(), doms = {};
  allDomains().forEach(function (d) { doms[d.id] = true; });
  return {
    mode: 'exam', source: 'all',
    count: cfg.examLength, timed: true, minutes: cfg.timeLimitMinutes,
    domains: doms, diffs: { easy: true, medium: true, hard: true },
    weighted: !!cfg.blueprintWeighted, shuffleOpts: true, shuffleOrder: true
  };
}
function setupCfg() {
  if (!APP.setup) {
    var saved = APP.prefs.setup;
    APP.setup = defaultSetup();
    if (saved) {
      ['mode', 'source', 'count', 'timed', 'minutes', 'weighted', 'shuffleOpts', 'shuffleOrder'].forEach(function (k) {
        if (saved[k] !== undefined) APP.setup[k] = saved[k];
      });
      if (saved.diffs) APP.setup.diffs = saved.diffs;
    }
    var live = allDomains();
    var doms = {};
    live.forEach(function (d) { doms[d.id] = saved && saved.domains && saved.domains[d.id] !== undefined ? saved.domains[d.id] : true; });
    if (!Object.keys(doms).some(function (k) { return doms[k]; })) live.forEach(function (d) { doms[d.id] = true; });
    APP.setup.domains = doms;
  }
  return APP.setup;
}

function pool(c) {
  var rec = itemRecord(), out = [];
  var anyDom = Object.keys(c.domains).length > 0;
  enabledPacks().forEach(function (p) {
    p.items.forEach(function (it) {
      var d = it.domain || '';
      if (anyDom && d && !c.domains[d]) return;
      if (!c.diffs[it.difficulty]) return;
      var r = rec[it.id];
      if (c.source === 'missed' && !(r && r.lastOk === false)) return;
      if (c.source === 'unseen' && r) return;
      out.push(it);
    });
  });
  return out;
}

function sampleItems(items, count, weighted) {
  count = Math.min(count, items.length);
  if (!weighted) return shuffle(items).slice(0, count);

  var groups = {}, weights = {}, dm = allDomains();
  items.forEach(function (it) { (groups[it.domain || ''] = groups[it.domain || ''] || []).push(it); });
  var keys = Object.keys(groups);
  keys.forEach(function (k) {
    var d = dm.filter(function (x) { return x.id === k; })[0];
    weights[k] = d && d.weight > 0 ? d.weight : 0;
  });
  var wsum = keys.reduce(function (a, k) { return a + weights[k]; }, 0);
  if (!wsum) return shuffle(items).slice(0, count);

  var exact = {}, base = {}, taken = 0;
  keys.forEach(function (k) {
    exact[k] = count * (weights[k] / wsum);
    base[k] = Math.min(groups[k].length, Math.floor(exact[k]));
    taken += base[k];
  });
  keys.sort(function (a, b) { return (exact[b] - base[b]) - (exact[a] - base[a]); })
    .forEach(function (k) {
      if (taken >= count) return;
      if (base[k] < groups[k].length) { base[k]++; taken++; }
    });

  var picked = [];
  keys.forEach(function (k) { picked = picked.concat(shuffle(groups[k]).slice(0, base[k])); });
  if (picked.length < count) {                      // top up if a domain ran dry
    var have = {}; picked.forEach(function (i) { have[i.id] = 1; });
    picked = picked.concat(shuffle(items.filter(function (i) { return !have[i.id]; })).slice(0, count - picked.length));
  }
  return picked;
}

function materialise(it, shuffleOpts) {
  var copy = JSON.parse(JSON.stringify(it));
  copy._orig = {};
  copy.options.forEach(function (o) { copy._orig[o.key] = o.key; });
  if (!shuffleOpts || copy.options.length < 2) return copy;
  var order = shuffle(copy.options), map = {}, rats = {};
  order.forEach(function (o, i) { map[o.key] = KEYS[i]; });
  copy.options = order.map(function (o, i) { return { key: KEYS[i], text: o.text }; });
  copy.correct = copy.correct.map(function (k) { return map[k] || k; }).sort();
  Object.keys(copy.rationales || {}).forEach(function (k) { rats[map[k] || k] = copy.rationales[k]; });
  copy.rationales = rats;
  copy._orig = {};
  Object.keys(map).forEach(function (oldK) { copy._orig[map[oldK]] = oldK; });
  return copy;
}

/* ===================== view: setup ===================== */
function viewSetup() {
  var c = setupCfg(), dm = allDomains(), avail = pool(c);
  if (!enabledPacks().length) {
    return '<div class="wrap narrow"><div class="card empty"><b>No active dataset</b>' +
      '<p>Turn a dataset on, or import one, before building an exam.</p>' +
      '<button class="btn primary" data-act="go" data-view="library">Open the library</button></div></div>';
  }
  var rec = itemRecord();
  var missed = 0, unseen = 0;
  enabledPacks().forEach(function (p) {
    p.items.forEach(function (i) {
      var r = rec[i.id];
      if (r && r.lastOk === false) missed++;
      if (!r) unseen++;
    });
  });

  var domRows = dm.map(function (d) {
    var n = 0;
    enabledPacks().forEach(function (p) { p.items.forEach(function (i) { if (i.domain === d.id) n++; }); });
    var on = c.domains[d.id];
    return '<label class="check' + (on ? ' on' : '') + '">' +
      '<input type="checkbox" data-act="set-domain" data-id="' + esc(d.id) + '"' + (on ? ' checked' : '') + '>' +
      '<span class="mono" style="font-size:11px">' + esc(d.id) + '</span> ' + esc(d.name) +
      '<span class="n">' + n + '</span></label>';
  }).join('');

  var diffRows = DIFFS.map(function (d) {
    var n = 0;
    enabledPacks().forEach(function (p) { p.items.forEach(function (i) { if (i.difficulty === d) n++; }); });
    return '<label class="check' + (c.diffs[d] ? ' on' : '') + '">' +
      '<input type="checkbox" data-act="set-diff" data-id="' + d + '"' + (c.diffs[d] ? ' checked' : '') + '>' +
      d.charAt(0).toUpperCase() + d.slice(1) + '<span class="n">' + n + '</span></label>';
  }).join('');

  var cfg = activeConfig();
  var presets = [10, 20, 30, cfg.examLength, avail.length].filter(function (v, i, a) {
    return v > 0 && a.indexOf(v) === i && v <= avail.length;
  }).sort(function (a, b) { return a - b; });

  return '<div class="wrap stack">' +
    '<div class="pagehead"><span class="eyebrow">New exam</span><h1>Build a sitting</h1>' +
      '<p>Exam mode holds all feedback back until you submit, the way the real thing does. Practice mode marks each question as you go.</p></div>' +
    '<div class="grid2">' +
      '<div class="stack">' +

        '<div class="card sect">' +
          '<h2>Mode</h2>' +
          '<div class="row" style="gap:14px">' +
            '<div class="seg">' +
              '<button data-act="set-mode" data-v="exam" aria-pressed="' + (c.mode === 'exam') + '">Exam</button>' +
              '<button data-act="set-mode" data-v="practice" aria-pressed="' + (c.mode === 'practice') + '">Practice</button>' +
            '</div>' +
            '<p class="muted" style="font-size:13px;flex:1 1 220px">' +
              (c.mode === 'exam'
                ? 'One shot, timed, no marking until the end. Flag anything you want to revisit.'
                : 'Check each answer as you go and read the reasoning before moving on. Untimed by default.') +
            '</p>' +
          '</div>' +
        '</div>' +

        '<div class="card sect">' +
          '<h2>Draw from</h2>' +
          '<div class="seg">' +
            '<button data-act="set-source" data-v="all" aria-pressed="' + (c.source === 'all') + '">Everything</button>' +
            '<button data-act="set-source" data-v="missed" aria-pressed="' + (c.source === 'missed') + '">My misses<span class="n mono" style="margin-left:6px;font-size:11px;color:var(--faint)">' + missed + '</span></button>' +
            '<button data-act="set-source" data-v="unseen" aria-pressed="' + (c.source === 'unseen') + '">Not yet seen<span class="n mono" style="margin-left:6px;font-size:11px;color:var(--faint)">' + unseen + '</span></button>' +
          '</div>' +
          '<hr class="rule">' +
          '<div class="field"><label>Domains</label><div class="row" style="gap:7px">' + domRows +
            '<button class="btn sm ghost" data-act="domains-all">All</button>' +
            '<button class="btn sm ghost" data-act="domains-none">None</button></div></div>' +
          '<div class="field"><label>Difficulty</label><div class="row" style="gap:7px">' + diffRows + '</div></div>' +
        '</div>' +

        '<div class="card sect">' +
          '<h2>Length and timing</h2>' +
          '<div class="row" style="gap:18px;align-items:flex-end">' +
            '<div class="field" style="width:120px"><label>Questions</label>' +
              '<input type="number" id="count" min="1" max="' + Math.max(1, avail.length) + '" value="' + Math.min(c.count, Math.max(1, avail.length)) + '" data-act="set-count"></div>' +
            '<div class="row" style="gap:6px">' + presets.map(function (n) {
              return '<button class="btn sm ghost" data-act="preset" data-v="' + n + '">' + n + '</button>';
            }).join('') + '</div>' +
          '</div>' +
          '<hr class="rule">' +
          '<div class="row" style="gap:18px;align-items:flex-end">' +
            '<label class="check' + (c.timed ? ' on' : '') + '"><input type="checkbox" data-act="set-timed"' + (c.timed ? ' checked' : '') + '>Timed</label>' +
            '<div class="field" style="width:120px"><label>Minutes</label>' +
              '<input type="number" id="minutes" min="1" max="600" value="' + c.minutes + '" data-act="set-minutes"' + (c.timed ? '' : ' disabled') + '></div>' +
          '</div>' +
          '<hr class="rule">' +
          '<div class="row" style="gap:7px">' +
            '<label class="check' + (c.weighted ? ' on' : '') + '"><input type="checkbox" data-act="set-weighted"' + (c.weighted ? ' checked' : '') + '>Blueprint-weighted draw</label>' +
            '<label class="check' + (c.shuffleOpts ? ' on' : '') + '"><input type="checkbox" data-act="set-shuffleopts"' + (c.shuffleOpts ? ' checked' : '') + '>Shuffle options</label>' +
          '</div>' +
          '<p class="muted" style="font-size:12.5px">A blueprint-weighted draw allocates questions across domains by their published exam weight rather than sampling the pool evenly.</p>' +
        '</div>' +
      '</div>' +

      '<div class="sticky" id="summary">' + setupSummary() + '</div>' +
    '</div>' +
  '</div>';
}

function setupSummary() {
  var c = setupCfg(), avail = pool(c), cfg = activeConfig();
  var n = Math.min(c.count, avail.length);
  var draw = n ? sampleItems(avail, n, c.weighted) : [];
  var byDom = {};
  draw.forEach(function (i) { byDom[i.domain || ''] = (byDom[i.domain || ''] || 0) + 1; });
  var keys = Object.keys(byDom).sort();
  var hues = ['#E3A94F', '#84AADB', '#5DBE96', '#C98BD9', '#E0706A', '#6FC7C0', '#D9A97F'];
  var mix = keys.map(function (k, i) {
    return '<i style="width:' + (byDom[k] / (draw.length || 1) * 100) + '%;background:' + hues[i % hues.length] + '" title="' + esc(k) + ': ' + byDom[k] + '"></i>';
  }).join('');
  var legend = keys.map(function (k, i) {
    return '<span style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)">' +
      '<i style="width:8px;height:8px;border-radius:2px;background:' + hues[i % hues.length] + '"></i>' +
      '<span class="mono" style="font-size:10.5px">' + esc(k || 'n/a') + '</span> ' + byDom[k] + '</span>';
  }).join('');

  var mr = draw.filter(function (i) { return i.type === 'multi'; }).length;
  var warn = '';
  if (!avail.length) warn = 'No questions match these filters.';
  else if (c.count > avail.length) warn = 'Only ' + avail.length + ' questions match, so that is what you will get.';

  return '<div class="card sect">' +
    '<h2>This sitting</h2>' +
    '<div class="kpis">' +
      '<div class="kpi"><b>' + n + '</b><span>Questions</span></div>' +
      '<div class="kpi"><b>' + (c.timed ? c.minutes + 'm' : '&#8734;') + '</b><span>Time</span></div>' +
      '<div class="kpi"><b>' + cfg.passPercent + '%</b><span>Pass mark</span></div>' +
    '</div>' +
    (keys.length ? '<div class="field"><label>Domain mix</label><div class="mixline">' + mix + '</div>' +
      '<div class="row" style="gap:11px;margin-top:8px">' + legend + '</div></div>' : '') +
    '<p class="muted" style="font-size:12.5px">' +
      (mr ? plural(mr, 'question') + ' of ' + n + ' ' + (mr === 1 ? 'is' : 'are') + ' multiple-response - pick every correct option. ' : '') +
      'Drawn from ' + plural(enabledPacks().length, 'dataset') + ', pool of ' + avail.length + '.' +
    '</p>' +
    (warn ? '<p class="note">' + esc(warn) + '</p>' : '') +
    '<button class="btn primary lg" data-act="start" ' + (n ? '' : 'disabled') + '>Start ' + (c.mode === 'exam' ? 'exam' : 'practice') + '</button>' +
  '</div>';
}

function refreshSummary() {
  var el = $('#summary');
  if (el) el.innerHTML = setupSummary();
  APP.prefs.setup = APP.setup;
  savePrefs();
}
function afterSetup() { }

/* ===================== start an exam ===================== */
function startExam() {
  var c = setupCfg(), avail = pool(c);
  var n = Math.min(c.count, avail.length);
  if (!n) { toast('No questions match these filters.', 'bad'); return; }
  var chosen = sampleItems(avail, n, c.weighted);
  var items = shuffle(chosen).map(function (it) { return materialise(it, c.shuffleOpts); });
  var cfg = activeConfig();

  APP.session = {
    id: uid(), startedAt: Date.now(), elapsed: 0,
    mode: c.mode,
    timed: c.mode === 'exam' ? c.timed : false,
    limitMs: c.minutes * 60000,
    packIds: enabledPacks().map(function (p) { return p.id; }),
    scoring: { passPercent: cfg.passPercent, scaleMin: cfg.scaleMin, scaleMax: cfg.scaleMax, scalePass: cfg.scalePass },
    items: items, answers: {}, flags: {}, checked: {}, times: {},
    cur: 0, finishedAt: null
  };
  APP.result = null;
  saveSession();
  go('exam');
}
</script>
<script>
"use strict";

/* ===================== the clock ===================== */
var TICK = null, LAST = 0, SAVE_AT = 0;
function startTimer() {
  stopTimer(); LAST = Date.now();
  TICK = setInterval(tick, 500);
}
function stopTimer() { if (TICK) clearInterval(TICK); TICK = null; }
function tick() {
  var s = APP.session;
  if (!s || s.finishedAt || APP.view !== 'exam') { stopTimer(); return; }
  var now = Date.now(), d = now - LAST; LAST = now;
  s.elapsed += d;
  s.times[s.cur] = (s.times[s.cur] || 0) + d;
  paintClock();
  if (now - SAVE_AT > 8000) { SAVE_AT = now; saveSession(); }
  if (s.timed && s.elapsed >= s.limitMs) { toast('Time is up. The paper was submitted automatically.', 'bad'); finishExam(); }
}
/* the clock is shown twice - in the desktop rail and in the mobile strip -
   so every readout is addressed by attribute rather than by id */
function paintClock() {
  var s = APP.session; if (!s) return;
  var left = s.limitMs - s.elapsed;
  var tone = s.timed ? (left < 60000 ? 'crit' : left < 300000 ? 'warn' : '') : '';
  var text = s.timed ? fmtClock(left) : fmtClock(s.elapsed);
  var done = Object.keys(s.answers).length, w = (done / s.items.length * 100) + '%';

  $$('[data-clockbox]').forEach(function (el) {
    if (el.classList.contains('clock')) el.className = 'clock ' + tone;
    else el.setAttribute('data-t', tone);
  });
  $$('[data-clockval]').forEach(function (el) { el.textContent = text; });
  $$('[data-prog]').forEach(function (el) { el.style.width = w; });
  $$('[data-proglab]').forEach(function (el) { el.textContent = done + ' of ' + s.items.length + ' answered'; });
}

/* ===================== view: exam ===================== */
function viewExam() {
  var s = APP.session;
  if (!s) return '<div class="wrap"><div class="card empty"><b>Nothing in progress</b><button class="btn primary" data-act="go" data-view="setup">Build an exam</button></div></div>';
  var it = s.items[s.cur], practice = s.mode === 'practice', revealed = practice && s.checked[s.cur];
  var chosen = s.answers[s.cur] || [];
  var done = Object.keys(s.answers).length;

  var sheet = sheetGrid();

  var opts = it.options.map(function (o) {
    var sel = chosen.indexOf(o.key) >= 0;
    var v = '';
    if (revealed) v = it.correct.indexOf(o.key) >= 0 ? 'key' : (sel ? 'miss' : '');
    var why = (revealed && v !== 'key' && it.rationales && it.rationales[o.key])
      ? '<div class="why">' + esc(it.rationales[o.key]) + '</div>' : '';
    return '<button class="opt" data-act="pick" data-k="' + esc(o.key) + '" data-sel="' + (sel ? 1 : 0) + '"' +
      (v ? ' data-v="' + v + '"' : '') + (revealed ? ' disabled' : '') + '>' +
      '<span class="k">' + esc(o.key) + '</span>' +
      '<span class="t">' + esc(o.text) + why + '</span></button>';
  }).join('');

  var fb = revealed ? feedbackBlock(it, chosen) : '';

  var clockText = s.timed ? fmtClock(s.limitMs - s.elapsed) : fmtClock(s.elapsed);
  var progW = (done / s.items.length * 100) + '%';

  return '<div class="wrap examwrap">' +
    '<div class="mobilebar" data-clockbox data-t="">' +
      '<button class="btn sm" data-act="open-sheet" aria-label="Open the answer sheet">' +
        '<span class="count">Q' + (s.cur + 1) + '<span class="dim">/' + s.items.length + '</span></span></button>' +
      '<div class="mprog"><i data-prog style="width:' + progW + '"></i></div>' +
      '<b class="mclock" data-clockval>' + clockText + '</b>' +
    '</div>' +
    '<div class="runner">' +
    '<aside class="rail">' +
      '<div class="clock" data-clockbox>' +
        '<span class="eyebrow">' + (s.timed ? 'Time remaining' : 'Elapsed') + '</span>' +
        '<b data-clockval>' + clockText + '</b>' +
        '<div class="meter"><i data-prog style="width:' + progW + '"></i></div>' +
        '<span class="eyebrow" data-proglab style="margin-top:6px">' + done + ' of ' + s.items.length + ' answered</span>' +
      '</div>' +
      '<div class="sheet">' + sheet + '</div>' +
      sheetLegend(practice) +
      '<button class="btn' + (done === s.items.length ? ' primary' : '') + '" data-act="finish">Submit paper</button>' +
      '<button class="btn ghost sm" data-act="abandon">Abandon</button>' +
    '</aside>' +

    '<section class="qcard">' +
      '<div class="qhead">' +
        '<span class="idx">Q' + (s.cur + 1) + ' / ' + s.items.length + '</span>' +
        (it.domain ? '<span class="chip">' + esc(it.domain) + ' &middot; ' + esc(domainName(it.domain)) + '</span>' : '') +
        '<span class="diff" title="' + esc(it.difficulty) + '">' +
          [1, 2, 3].map(function (n) {
            var lvl = it.difficulty === 'easy' ? 1 : it.difficulty === 'medium' ? 2 : 3;
            return '<i class="' + (n <= lvl ? 'on' : '') + '"></i>';
          }).join('') + esc(it.difficulty) + '</span>' +
        '<span class="spacer"></span>' +
        '<button class="btn sm ' + (s.flags[s.cur] ? '' : 'ghost') + '" data-act="flag" ' +
          'style="' + (s.flags[s.cur] ? 'color:var(--flag);border-color:var(--flag-line);background:var(--flag-wash)' : '') + '">' +
          (s.flags[s.cur] ? 'Flagged' : 'Flag') + '</button>' +
      '</div>' +
      '<div class="qbody">' +
        '<p class="stem">' + esc(it.stem) + '</p>' +
        (it.type === 'multi' ? '<p class="instr">Choose all that apply' +
          (it.correct.length ? ' &middot; ' + it.correct.length + ' correct' : '') + '</p>' : '') +
        '<div class="opts">' + opts + '</div>' +
        fb +
      '</div>' +
      '<div class="qfoot">' +
        '<button class="btn ghost" data-act="prev"' + (s.cur === 0 ? ' disabled' : '') + '>Back</button>' +
        (practice && !revealed
          ? '<button class="btn primary" data-act="check"' + (chosen.length ? '' : ' disabled') + '>Check answer</button>' : '') +
        '<button class="btn' + (practice && revealed ? ' primary' : '') + '" data-act="next"' +
          (s.cur === s.items.length - 1 ? ' disabled' : '') + '>Next</button>' +
        '<span class="spacer"></span>' +
        '<span class="dim mono" style="font-size:10.5px">' + esc(it.id) + '</span>' +
        '<span class="dim nowrap kbdhint" style="font-size:11.5px"><kbd>A</kbd>&ndash;<kbd>' +
          esc(it.options[it.options.length - 1].key) + '</kbd> pick &nbsp; <kbd>&#8594;</kbd> next &nbsp; <kbd>F</kbd> flag</span>' +
      '</div>' +
    '</section>' +
    '</div>' +
    mobileBar(s, practice, revealed, chosen) +
  '</div>';
}

/* the thumb bar: back, flag, and one clear forward action */
function mobileBar(s, practice, revealed, chosen) {
  var last = s.cur === s.items.length - 1, main;
  if (practice && !revealed) main = { act: 'check', label: 'Check answer', cls: 'primary', off: !chosen.length };
  else if (!last) main = { act: 'next', label: 'Next', cls: '', off: false };
  else main = { act: 'finish', label: 'Submit paper', cls: 'primary', off: false };

  return '<div class="mobilebottom">' +
    '<button class="btn narrow" data-act="prev"' + (s.cur === 0 ? ' disabled' : '') +
      ' aria-label="Previous question">&#8592;</button>' +
    '<button class="btn narrow" data-act="flag" aria-label="' + (s.flags[s.cur] ? 'Unflag' : 'Flag for review') + '"' +
      (s.flags[s.cur] ? ' style="color:var(--flag);border-color:var(--flag-line);background:var(--flag-wash)"' : '') +
      '>&#9873;</button>' +
    '<button class="btn ' + main.cls + '" data-act="' + main.act + '"' + (main.off ? ' disabled' : '') + '>' +
      esc(main.label) + '</button>' +
  '</div>';
}

function sheetGrid() {
  var s = APP.session, practice = s.mode === 'practice';
  return s.items.map(function (q, i) {
    var st = '';
    if (s.answers[i] && s.answers[i].length) st = 'answered';
    if (practice && s.checked[i]) st = sameSet(s.answers[i] || [], q.correct) ? 'correct' : 'wrong';
    return '<button data-act="jump" data-i="' + i + '" data-s="' + st + '" data-f="' + (s.flags[i] ? 1 : 0) +
      '" aria-current="' + (i === s.cur) + '" title="Question ' + (i + 1) + '">' + (i + 1) + '</button>';
  }).join('');
}
function sheetLegend(practice) {
  return '<div class="legend">' +
    '<span><i style="background:var(--raised);border-color:var(--line-2)"></i>Answered</span>' +
    '<span><i style="background:var(--flag)"></i>Flagged for review</span>' +
    (practice ? '<span><i style="background:var(--jade-wash);border-color:var(--jade-line)"></i>Marked correct</span>' : '') +
  '</div>';
}

/* on a phone the sheet lives here rather than in a rail there is no room for */
function openSheet() {
  var s = APP.session; if (!s) return;
  var done = Object.keys(s.answers).length, flagged = Object.keys(s.flags).length;
  modal('<div class="drawer" style="display:flex;flex-direction:column;gap:15px">' +
    '<div class="row between"><h2 style="font-size:16px">Answer sheet</h2>' +
      '<span class="eyebrow">' + done + ' of ' + s.items.length + ' answered</span></div>' +
    (flagged ? '<p class="eyebrow" style="color:var(--flag)">' + plural(flagged, 'question') + ' flagged</p>' : '') +
    '<div class="sheet">' + sheetGrid() + '</div>' +
    sheetLegend(s.mode === 'practice') +
    '<hr class="rule">' +
    '<button class="btn' + (done === s.items.length ? ' primary' : '') + '" data-act="finish">Submit paper</button>' +
    '<div class="row" style="gap:8px">' +
      '<button class="btn ghost" data-act="close-modal" style="flex:1">Keep going</button>' +
      '<button class="btn danger" data-act="abandon">Abandon</button>' +
    '</div>' +
  '</div>');
}

function feedbackBlock(it, chosen) {
  var ok = sameSet(chosen, it.correct);
  var srcs = (it.sources || []).filter(function (s) { return s.title || s.url; }).map(function (s) {
    var label = esc(s.title || s.url);
    var d = s.date ? '<span class="d">' + esc(s.date) + (s.basis === 'verified-live' ? ' &middot; verified live' : '') + '</span>' : '';
    return s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + d + '<span>' + label + '</span></a>'
      : '<span style="font-size:12.5px;color:var(--ink-2);display:flex;gap:8px">' + d + label + '</span>';
  }).join('');

  return '<div class="fb ' + (ok ? 'ok' : 'no') + '">' +
    '<div class="verdict">' + (ok ? 'Correct' : 'Not the key') +
